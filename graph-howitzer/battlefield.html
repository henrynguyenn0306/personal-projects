<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Graph Howitzer - Battlefield (debug)</title>
  <style>
    body { margin: 0; overflow: hidden; background: #14141e; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #reset {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 2;
      font: 14px sans-serif;
      color: #f2f2f7;
      background: #2a2a36;
      border: 1px solid #5c5c6c;
      border-radius: 4px;
      padding: 6px 10px;
      cursor: pointer;
    }
    #reset:hover { background: #3a3a4a; }
    #message {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font: bold 24px sans-serif;
      pointer-events: none;
    }
    #message[hidden] { display: none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <button id="reset" type="button">Reset view</button>
  <div id="message">Open the game first</div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    // Same field as the game. 1 unit = 1 meter. Game y is up on the old flat map.
    const FIELD_X_MAX = 120;
    const FIELD_Y_MAX = 100;
    const PLAYER_SIZE = 6;
    const STORAGE_KEY = "graphHowitzerBattlefield";
    const CHANNEL_NAME = "graph-howitzer";
    const COLOR_GROUND = 0x3a3a4a;
    const COLOR_GRID = 0x6e6e80;
    const COLOR_AXIS = 0xff5555;
    const COLOR_P1 = 0x3d8bfd;
    const COLOR_P2 = 0xff8a3d;
    const COLOR_BUILDING = 0x8a8a96;
    const COLOR_TOWER = 0xc8c8d2;
    const Z_AXIS_HEIGHT = 46;
    const Z_TICKS = [10, 20, 30, 40];

    // Default camera looks from the near-right, so game +y is toward the top of the view
    // and the far-left corner (min x, max game y) sits at the top-left of the field.
    const DEFAULT_TARGET = new THREE.Vector3(0, 6, 0);
    const DEFAULT_CAMERA = new THREE.Vector3(150, 150, 190);

    const resetButton = document.getElementById("reset");
    const message = document.getElementById("message");

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setClearColor(0x14141e, 1);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 2000);
    camera.position.copy(DEFAULT_CAMERA);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(DEFAULT_TARGET);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
    controls.mouseButtons.MIDDLE = THREE.MOUSE.DOLLY;
    controls.mouseButtons.RIGHT = THREE.MOUSE.PAN;
    controls.minDistance = 30;
    controls.maxDistance = 700;
    controls.minPolarAngle = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.04;
    controls.update();

    controls.addEventListener("change", function () {
      if (controls.target.y < 0) controls.target.y = 0;
      if (camera.position.y < 2) camera.position.y = 2;
    });

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const sun = new THREE.DirectionalLight(0xffffff, 1.15);
    sun.position.set(90, 180, 70);
    scene.add(sun);

    const labels = [];
    const obstaclesGroup = new THREE.Group();
    const machinesGroup = new THREE.Group();
    scene.add(obstaclesGroup);
    scene.add(machinesGroup);

    let battlefield = null;
    let fieldReady = false;
    let obstacleSignature = "";
    const machineLabels = [];

    function showMessage(text) {
      message.textContent = text;
      message.hidden = false;
    }

    function hideMessage() {
      message.hidden = true;
    }

    // Game x stays three.js x. Game y points toward the top of the default view (-Z).
    function worldX(gameX) {
      return gameX;
    }

    function worldZ(gameY) {
      return -gameY;
    }

    function makeTextSprite(text) {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      const fontSize = 64;
      ctx.font = "bold " + fontSize + "px sans-serif";
      const textWidth = Math.ceil(ctx.measureText(text).width);
      canvas.width = textWidth + 24;
      canvas.height = 80;
      ctx.font = "bold " + fontSize + "px sans-serif";
      ctx.textBaseline = "middle";
      ctx.lineWidth = 10;
      ctx.strokeStyle = "rgba(0, 0, 0, 0.8)";
      ctx.strokeText(text, 12, 40);
      ctx.fillStyle = "#ffffff";
      ctx.fillText(text, 12, 40);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      const material = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });
      const sprite = new THREE.Sprite(material);
      sprite.userData.aspect = canvas.width / canvas.height;
      sprite.userData.text = text;
      labels.push(sprite);
      return sprite;
    }

    function setSpriteText(sprite, text) {
      if (sprite.userData.text === text) return;
      const previous = sprite.material.map;
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      const fontSize = 64;
      ctx.font = "bold " + fontSize + "px sans-serif";
      const textWidth = Math.ceil(ctx.measureText(text).width);
      canvas.width = textWidth + 24;
      canvas.height = 80;
      ctx.font = "bold " + fontSize + "px sans-serif";
      ctx.textBaseline = "middle";
      ctx.lineWidth = 10;
      ctx.strokeStyle = "rgba(0, 0, 0, 0.8)";
      ctx.strokeText(text, 12, 40);
      ctx.fillStyle = "#ffffff";
      ctx.fillText(text, 12, 40);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      sprite.material.map = texture;
      sprite.userData.aspect = canvas.width / canvas.height;
      sprite.userData.text = text;
      if (previous) previous.dispose();
    }

    function updateLabelScale() {
      const distance = Math.max(40, camera.position.distanceTo(controls.target));
      const height = distance * 0.04;
      for (let i = 0; i < labels.length; i++) {
        const sprite = labels[i];
        sprite.scale.set(height * sprite.userData.aspect, height, 1);
      }
    }

    function addSolid(geometry, material, x, y, z, parent) {
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(x, y, z);
      parent.add(mesh);
      return mesh;
    }

    function buildGround(halfW, halfH) {
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(halfW * 2, halfH * 2),
        new THREE.MeshLambertMaterial({ color: COLOR_GROUND })
      );
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      const positions = [];
      for (let x = -halfW; x <= halfW + 0.01; x += 10) {
        positions.push(x, 0.04, -halfH, x, 0.04, halfH);
      }
      for (let z = -halfH; z <= halfH + 0.01; z += 10) {
        positions.push(-halfW, 0.04, z, halfW, 0.04, z);
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      const grid = new THREE.LineSegments(
        geometry,
        new THREE.LineBasicMaterial({ color: COLOR_GRID, transparent: true, opacity: 0.45 })
      );
      scene.add(grid);
    }

    // Axes meet at the far-left corner, which is the top-left of the field in the default view.
    // Numbers are meters from that corner: x to the right, y toward the camera, z straight up.
    function buildAxes(halfW, halfH) {
      const originX = -halfW;
      const originZ = -halfH;
      const width = halfW * 2;
      const depth = halfH * 2;
      const axis = new THREE.MeshBasicMaterial({ color: COLOR_AXIS });
      const lift = 0.12;

      addSolid(new THREE.BoxGeometry(width, 0.45, 0.45), axis, originX + width / 2, lift, originZ, scene);
      addSolid(new THREE.BoxGeometry(0.45, 0.45, depth), axis, originX, lift, originZ + depth / 2, scene);
      addSolid(new THREE.BoxGeometry(0.45, Z_AXIS_HEIGHT, 0.45), axis, originX, Z_AXIS_HEIGHT / 2, originZ, scene);

      const arrow = new THREE.Mesh(new THREE.ConeGeometry(2.2, 7, 16), axis);
      arrow.position.set(originX, Z_AXIS_HEIGHT + 3.2, originZ);
      scene.add(arrow);

      const xStep = 30;
      for (let meters = xStep; meters < width - 0.1; meters += xStep) {
        addSolid(new THREE.BoxGeometry(0.35, 0.35, 2.4), axis, originX + meters, lift, originZ - 1.4, scene);
        const label = makeTextSprite(String(meters));
        label.position.set(originX + meters, 2.2, originZ - 6);
        scene.add(label);
      }
      const xEnd = makeTextSprite(String(width));
      xEnd.position.set(originX + width, 2.2, originZ - 6);
      scene.add(xEnd);
      const xName = makeTextSprite("x");
      xName.position.set(originX + width + 6, 3, originZ - 2);
      scene.add(xName);

      const yStep = 25;
      for (let meters = yStep; meters < depth - 0.1; meters += yStep) {
        addSolid(new THREE.BoxGeometry(2.4, 0.35, 0.35), axis, originX - 1.4, lift, originZ + meters, scene);
        const label = makeTextSprite(String(meters));
        label.position.set(originX - 7, 2.2, originZ + meters);
        scene.add(label);
      }
      const yEnd = makeTextSprite(String(depth));
      yEnd.position.set(originX - 7, 2.2, originZ + depth);
      scene.add(yEnd);
      const yName = makeTextSprite("y");
      yName.position.set(originX - 3, 3, originZ + depth + 6);
      scene.add(yName);

      for (let i = 0; i < Z_TICKS.length; i++) {
        const meters = Z_TICKS[i];
        addSolid(new THREE.BoxGeometry(2.6, 0.35, 0.35), axis, originX - 1.6, meters, originZ, scene);
        const label = makeTextSprite(String(meters));
        label.position.set(originX - 8, meters, originZ);
        scene.add(label);
      }
      const zName = makeTextSprite("z (height)");
      zName.position.set(originX - 20, Z_AXIS_HEIGHT + 8, originZ);
      scene.add(zName);

      const zero = makeTextSprite("0");
      zero.position.set(originX - 6, 2.2, originZ - 5);
      scene.add(zero);
    }

    function disposeObject(object) {
      object.traverse(function (child) {
        if (child.geometry) child.geometry.dispose();
        if (child.material) {
          if (child.material.map) child.material.map.dispose();
          child.material.dispose();
        }
      });
    }

    function clearGroup(group) {
      while (group.children.length > 0) {
        const child = group.children[group.children.length - 1];
        group.remove(child);
        disposeObject(child);
      }
    }

    function signatureOf(obstacles) {
      if (!obstacles) return "";
      let text = String(obstacles.length);
      for (let i = 0; i < obstacles.length; i++) {
        const obstacle = obstacles[i];
        text += "|" + obstacle.type + "," + obstacle.x + "," + obstacle.y;
        text += "," + (obstacle.w || 0) + "," + (obstacle.h || 0) + "," + (obstacle.r || 0);
      }
      return text;
    }

    function buildField() {
      const halfW = battlefield.width / 2;
      const halfH = battlefield.height / 2;
      buildGround(halfW, halfH);
      buildAxes(halfW, halfH);
      fieldReady = true;
    }

    function syncObstacles() {
      const obstacles = battlefield.obstacles || [];
      const signature = signatureOf(obstacles);
      if (signature === obstacleSignature) return;
      obstacleSignature = signature;
      clearGroup(obstaclesGroup);
      for (let i = 0; i < obstacles.length; i++) {
        const obstacle = obstacles[i];
        let mesh;
        if (obstacle.type === "tower") {
          const radius = obstacle.r || 2;
          const height = Math.max(8, radius * 5);
          mesh = new THREE.Mesh(
            new THREE.CylinderGeometry(radius, radius, height, 20),
            new THREE.MeshLambertMaterial({ color: COLOR_TOWER })
          );
          mesh.position.set(worldX(obstacle.x), height / 2, worldZ(obstacle.y));
        } else {
          const wide = obstacle.w || 6;
          const deep = obstacle.h || 6;
          const height = Math.max(4, Math.min(wide, deep) * 0.9);
          mesh = new THREE.Mesh(
            new THREE.BoxGeometry(wide, height, deep),
            new THREE.MeshLambertMaterial({ color: COLOR_BUILDING })
          );
          mesh.position.set(worldX(obstacle.x), height / 2, worldZ(obstacle.y));
        }
        obstaclesGroup.add(mesh);
      }
    }

    function playerMaterial(color) {
      return new THREE.MeshLambertMaterial({ color: color, emissive: color, emissiveIntensity: 0.55 });
    }

    function makeMachine(color) {
      const group = new THREE.Group();
      const bodyHeight = 4;
      const material = playerMaterial(color);
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(PLAYER_SIZE, bodyHeight, PLAYER_SIZE),
        material
      );
      body.position.y = bodyHeight / 2;
      const turret = new THREE.Mesh(
        new THREE.CylinderGeometry(1.5, 1.7, 1.6, 16),
        playerMaterial(color)
      );
      turret.position.y = bodyHeight + 0.8;
      group.add(body);
      group.add(turret);
      return group;
    }

    function playerCaption(index, player) {
      const name = index === 0 ? "P1" : "P2";
      if (player.fuel === undefined || player.fuel === null) return name;
      return name + " " + Math.round(player.fuel) + "%";
    }

    function syncPlayers() {
      const players = battlefield.players;
      const colors = [COLOR_P1, COLOR_P2];
      while (machinesGroup.children.length < players.length) {
        const index = machinesGroup.children.length;
        const machine = makeMachine(colors[index] || COLOR_P1);
        machinesGroup.add(machine);
        const label = makeTextSprite(playerCaption(index, players[index]));
        scene.add(label);
        machineLabels.push(label);
      }
      for (let i = 0; i < players.length; i++) {
        const player = players[i];
        const machine = machinesGroup.children[i];
        machine.position.set(worldX(player.x), 0, worldZ(player.y));
        const label = machineLabels[i];
        setSpriteText(label, playerCaption(i, player));
        label.position.set(worldX(player.x), 9, worldZ(player.y));
      }
    }

    function applyState(next) {
      if (!next || !next.players) {
        showMessage("Open the game first");
        return;
      }
      battlefield = next;
      hideMessage();
      if (!fieldReady) buildField();
      syncObstacles();
      syncPlayers();
    }

    function loadSavedBattlefield() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return;
        applyState(JSON.parse(saved));
      } catch (error) {
        battlefield = null;
      }
    }

    function resetView() {
      if (controls._sphericalDelta) controls._sphericalDelta.set(0, 0, 0);
      if (controls._panOffset) controls._panOffset.set(0, 0, 0);
      if (typeof controls._scale === "number") controls._scale = 1;
      camera.zoom = 1;
      camera.updateProjectionMatrix();
      camera.position.copy(DEFAULT_CAMERA);
      controls.target.copy(DEFAULT_TARGET);
      controls.update();
    }

    function resize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function frame() {
      requestAnimationFrame(frame);
      if (document.hidden) return;
      controls.update();
      updateLabelScale();
      renderer.render(scene, camera);
    }

    resetButton.addEventListener("click", resetView);
    window.addEventListener("resize", resize);

    const channel = new BroadcastChannel(CHANNEL_NAME);
    channel.onmessage = function (event) {
      if (!event.data || event.data.type !== "state") return;
      applyState(event.data.battlefield);
    };

    loadSavedBattlefield();
    channel.postMessage({ type: "request-state" });
    resize();
    frame();
  </script>
</body>
</html>
