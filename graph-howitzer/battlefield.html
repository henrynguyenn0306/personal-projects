<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Graph Howitzer - Battlefield (debug)</title>
  <style>
    body { margin: 0; overflow: hidden; background: #14141e; }
    canvas { display: block; width: 100vw; height: 100vh; }
    #reset {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 2;
      font: 14px sans-serif;
      color: #f2f2f7;
      background: #2a2a36;
      border: 1px solid #5c5c6c;
      border-radius: 4px;
      padding: 6px 10px;
      cursor: pointer;
    }
    #reset:hover { background: #3a3a4a; }
    #message {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font: bold 24px sans-serif;
      pointer-events: none;
    }
    #message[hidden] { display: none; }
    #tip {
      position: fixed;
      z-index: 3;
      pointer-events: none;
      background: rgba(20, 20, 30, 0.92);
      color: #f2f2f7;
      border: 1px solid #5c5c6c;
      border-radius: 4px;
      padding: 6px 8px;
      font: 13px sans-serif;
      line-height: 1.35;
      white-space: pre;
    }
    #tip[hidden] { display: none; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <button id="reset" type="button">Reset view</button>
  <div id="message">Open the game first</div>
  <div id="tip" hidden></div>

  <script src="fire-curve.js"></script>
  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    // Same field as the game. 1 unit = 1 meter. Game y is up on the old flat map.
    const FIELD_X_MAX = 120;
    const FIELD_Y_MAX = 100;
    const PLAYER_SIZE = 6;
    const STORAGE_KEY = "graphHowitzerBattlefield";
    const CHANNEL_NAME = "graph-howitzer";
    const COLOR_GROUND = 0x3a3a4a;
    const COLOR_GRID = 0x6e6e80;
    const COLOR_AXIS = 0xff5555;
    const COLOR_P1 = 0x3d8bfd;
    const COLOR_P2 = 0xff8a3d;
    const COLOR_BUILDING = 0x8a8a96;
    const COLOR_TOWER = 0xc8c8d2;
    const GRID_METERS = 20;
    const OUTLINE_Y = 0.08;
    const SHAPE_Y = 0.14;
    const OUTLINE_PAD = 0.45;

    // Default camera looks from the near-right, so game +y is toward the top of the view
    // and the far-left corner (min x, max game y) sits at the top-left of the field.
    const DEFAULT_TARGET = new THREE.Vector3(0, 6, 0);
    const DEFAULT_CAMERA = new THREE.Vector3(150, 150, 190);

    const resetButton = document.getElementById("reset");
    const message = document.getElementById("message");

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setClearColor(0x14141e, 1);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 2000);
    camera.position.copy(DEFAULT_CAMERA);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.copy(DEFAULT_TARGET);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.mouseButtons.LEFT = THREE.MOUSE.ROTATE;
    controls.mouseButtons.MIDDLE = THREE.MOUSE.DOLLY;
    controls.mouseButtons.RIGHT = THREE.MOUSE.PAN;
    controls.minDistance = 30;
    controls.maxDistance = 700;
    controls.minPolarAngle = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.04;
    controls.update();

    controls.addEventListener("change", function () {
      if (controls.target.y < 0) controls.target.y = 0;
      if (camera.position.y < 2) camera.position.y = 2;
    });

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const sun = new THREE.DirectionalLight(0xffffff, 1.15);
    sun.position.set(90, 180, 70);
    scene.add(sun);

    const labels = [];
    const obstaclesGroup = new THREE.Group();
    const machinesGroup = new THREE.Group();
    const arcsGroup = new THREE.Group();
    scene.add(obstaclesGroup);
    scene.add(machinesGroup);
    scene.add(arcsGroup);

    let battlefield = null;
    let fieldReady = false;
    let obstacleSignature = "";
    const arcKeys = ["", ""];
    const arcObjects = [null, null];
    const tip = document.getElementById("tip");
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let pointerInside = false;

    function showMessage(text) {
      message.textContent = text;
      message.hidden = false;
    }

    function hideMessage() {
      message.hidden = true;
    }

    // Game x stays three.js x. Game y points toward the top of the default view (-Z).
    function worldX(gameX) {
      return gameX;
    }

    function worldZ(gameY) {
      return -gameY;
    }

    function makeTextSprite(text) {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      const fontSize = 64;
      ctx.font = "bold " + fontSize + "px sans-serif";
      const textWidth = Math.ceil(ctx.measureText(text).width);
      canvas.width = textWidth + 24;
      canvas.height = 80;
      ctx.font = "bold " + fontSize + "px sans-serif";
      ctx.textBaseline = "middle";
      ctx.lineWidth = 10;
      ctx.strokeStyle = "rgba(0, 0, 0, 0.8)";
      ctx.strokeText(text, 12, 40);
      ctx.fillStyle = "#ffffff";
      ctx.fillText(text, 12, 40);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      const material = new THREE.SpriteMaterial({ map: texture, transparent: true, depthTest: false });
      const sprite = new THREE.Sprite(material);
      sprite.userData.aspect = canvas.width / canvas.height;
      sprite.userData.text = text;
      labels.push(sprite);
      return sprite;
    }

    function updateLabelScale() {
      const distance = Math.max(40, camera.position.distanceTo(controls.target));
      const height = distance * 0.04;
      for (let i = 0; i < labels.length; i++) {
        const sprite = labels[i];
        sprite.scale.set(height * sprite.userData.aspect, height, 1);
      }
    }

    function addSolid(geometry, material, x, y, z, parent) {
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(x, y, z);
      parent.add(mesh);
      return mesh;
    }

    function buildGround(halfW, halfH) {
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(halfW * 2, halfH * 2),
        new THREE.MeshLambertMaterial({
          color: COLOR_GROUND,
          transparent: true,
          opacity: 0.62,
          depthWrite: false
        })
      );
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      const positions = [];
      for (let x = -halfW; x <= halfW + 0.01; x += GRID_METERS) {
        positions.push(x, 0.04, -halfH, x, 0.04, halfH);
      }
      for (let z = -halfH; z <= halfH + 0.01; z += GRID_METERS) {
        positions.push(-halfW, 0.04, z, halfW, 0.04, z);
      }
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      const grid = new THREE.LineSegments(
        geometry,
        new THREE.LineBasicMaterial({ color: COLOR_GRID, transparent: true, opacity: 0.45 })
      );
      scene.add(grid);
    }

    // Axes meet at the far-left corner, which is the top-left of the field in the default view.
    // Numbers are meters from that corner: x to the right, y toward the camera, z straight up.
    function buildAxes(halfW, halfH) {
      const originX = -halfW;
      const originZ = -halfH;
      const width = halfW * 2;
      const depth = halfH * 2;
      const axis = new THREE.MeshBasicMaterial({ color: COLOR_AXIS });
      const lift = 0.12;

      addSolid(new THREE.BoxGeometry(width, 0.45, 0.45), axis, originX + width / 2, lift, originZ, scene);
      addSolid(new THREE.BoxGeometry(0.45, 0.45, depth), axis, originX, lift, originZ + depth / 2, scene);

      for (let meters = GRID_METERS; meters <= width + 0.01; meters += GRID_METERS) {
        addSolid(new THREE.BoxGeometry(0.35, 0.35, 2.4), axis, originX + meters, lift, originZ - 1.4, scene);
        const label = makeTextSprite(String(meters));
        label.position.set(originX + meters, 2.2, originZ - 6);
        scene.add(label);
      }
      const xName = makeTextSprite("x");
      xName.position.set(originX + width + 6, 3, originZ - 2);
      scene.add(xName);

      for (let meters = GRID_METERS; meters <= depth + 0.01; meters += GRID_METERS) {
        addSolid(new THREE.BoxGeometry(2.4, 0.35, 0.35), axis, originX - 1.4, lift, originZ + meters, scene);
        const label = makeTextSprite(String(meters));
        label.position.set(originX - 7, 2.2, originZ + meters);
        scene.add(label);
      }
      const yName = makeTextSprite("y");
      yName.position.set(originX - 3, 3, originZ + depth + 6);
      scene.add(yName);

      const zero = makeTextSprite("0");
      zero.position.set(originX - 6, 2.2, originZ - 5);
      scene.add(zero);
    }

    let zAxisGroup = null;
    let zAxisHeight = 0;

    // Pole reaches the next 20 m tick above the tallest arc, with a little headroom.
    function snappedAxisHeight(peak) {
      const top = Math.max(0, peak) + Math.max(4, peak * 0.15);
      const snapped = Math.ceil(top / GRID_METERS) * GRID_METERS;
      return Math.max(GRID_METERS, snapped);
    }

    function forgetLabels(group) {
      const keep = [];
      for (let i = 0; i < labels.length; i++) {
        let node = labels[i];
        let inside = false;
        while (node) {
          if (node === group) inside = true;
          node = node.parent;
        }
        if (!inside) keep.push(labels[i]);
      }
      labels.length = 0;
      for (let i = 0; i < keep.length; i++) labels.push(keep[i]);
    }

    function disposeShared(object) {
      const materials = [];
      object.traverse(function (child) {
        if (child.geometry) child.geometry.dispose();
        if (child.material && materials.indexOf(child.material) < 0) {
          if (child.material.map) child.material.map.dispose();
          materials.push(child.material);
        }
      });
      for (let i = 0; i < materials.length; i++) materials[i].dispose();
    }

    function buildZAxis(height) {
      const originX = -battlefield.width / 2;
      const originZ = -battlefield.height / 2;
      const group = new THREE.Group();
      const material = new THREE.MeshBasicMaterial({ color: COLOR_AXIS });
      addSolid(new THREE.BoxGeometry(0.45, height, 0.45), material, originX, height / 2, originZ, group);
      const arrow = new THREE.Mesh(new THREE.ConeGeometry(2.2, 7, 16), material);
      arrow.position.set(originX, height + 5.5, originZ);
      group.add(arrow);
      for (let meters = GRID_METERS; meters <= height + 0.01; meters += GRID_METERS) {
        addSolid(new THREE.BoxGeometry(2.6, 0.35, 0.35), material, originX - 1.6, meters, originZ, group);
        const label = makeTextSprite(String(meters));
        label.position.set(originX - 8, meters, originZ);
        group.add(label);
      }
      return group;
    }

    function syncZAxis(peak) {
      const next = snappedAxisHeight(peak);
      if (zAxisGroup && next === zAxisHeight) return;
      if (zAxisGroup) {
        forgetLabels(zAxisGroup);
        scene.remove(zAxisGroup);
        disposeShared(zAxisGroup);
      }
      zAxisHeight = next;
      zAxisGroup = buildZAxis(next);
      scene.add(zAxisGroup);
    }

    function disposeObject(object) {
      object.traverse(function (child) {
        if (child.geometry) child.geometry.dispose();
        if (child.material) {
          if (child.material.map) child.material.map.dispose();
          child.material.dispose();
        }
      });
    }

    function clearGroup(group) {
      while (group.children.length > 0) {
        const child = group.children[group.children.length - 1];
        group.remove(child);
        disposeObject(child);
      }
    }

    function signatureOf(obstacles) {
      if (!obstacles) return "";
      let text = String(obstacles.length);
      for (let i = 0; i < obstacles.length; i++) {
        const obstacle = obstacles[i];
        text += "|" + obstacle.type + "," + obstacle.x + "," + obstacle.y;
        text += "," + (obstacle.w || 0) + "," + (obstacle.h || 0) + "," + (obstacle.r || 0);
      }
      return text;
    }

    function buildField() {
      const halfW = battlefield.width / 2;
      const halfH = battlefield.height / 2;
      buildGround(halfW, halfH);
      buildAxes(halfW, halfH);
      fieldReady = true;
    }

    // A filled footprint with a dark rim. Both sit just above the grid.
    function flatFootprint(kind, wide, deep, color) {
      const group = new THREE.Group();
      const outlineMaterial = new THREE.MeshBasicMaterial({ color: 0x14141e, side: THREE.DoubleSide });
      const fillMaterial = new THREE.MeshBasicMaterial({ color: color, side: THREE.DoubleSide });
      let outlineGeometry;
      let fillGeometry;
      if (kind === "circle") {
        outlineGeometry = new THREE.CircleGeometry(wide + OUTLINE_PAD, 40);
        fillGeometry = new THREE.CircleGeometry(wide, 40);
      } else {
        outlineGeometry = new THREE.PlaneGeometry(wide + OUTLINE_PAD * 2, deep + OUTLINE_PAD * 2);
        fillGeometry = new THREE.PlaneGeometry(wide, deep);
      }
      const outline = new THREE.Mesh(outlineGeometry, outlineMaterial);
      outline.rotation.x = -Math.PI / 2;
      outline.position.y = OUTLINE_Y;
      const fill = new THREE.Mesh(fillGeometry, fillMaterial);
      fill.rotation.x = -Math.PI / 2;
      fill.position.y = SHAPE_Y;
      group.add(outline);
      group.add(fill);
      return group;
    }

    // A footprint that lies completely outside the field is not drawn. Hit testing stays in the game.
    function obstacleOutsideField(obstacle) {
      let left;
      let right;
      let top;
      let bottom;
      if (obstacle.type === "tower") {
        const r = obstacle.r || 2;
        left = obstacle.x - r;
        right = obstacle.x + r;
        top = obstacle.y - r;
        bottom = obstacle.y + r;
      } else {
        const halfW = (obstacle.w || 6) / 2;
        const halfH = (obstacle.h || 6) / 2;
        left = obstacle.x - halfW;
        right = obstacle.x + halfW;
        top = obstacle.y - halfH;
        bottom = obstacle.y + halfH;
      }
      return right < -FIELD_X_MAX || left > FIELD_X_MAX || bottom < -FIELD_Y_MAX || top > FIELD_Y_MAX;
    }

    function syncObstacles() {
      const obstacles = battlefield.obstacles || [];
      const signature = signatureOf(obstacles);
      if (signature === obstacleSignature) return;
      obstacleSignature = signature;
      clearGroup(obstaclesGroup);
      for (let i = 0; i < obstacles.length; i++) {
        const obstacle = obstacles[i];
        if (obstacleOutsideField(obstacle)) continue;
        let shape;
        if (obstacle.type === "tower") {
          shape = flatFootprint("circle", obstacle.r || 2, 0, COLOR_TOWER);
        } else {
          shape = flatFootprint("rect", obstacle.w || 6, obstacle.h || 6, COLOR_BUILDING);
        }
        shape.position.set(worldX(obstacle.x), 0, worldZ(obstacle.y));
        obstaclesGroup.add(shape);
      }
    }

    function makeMachine(color, index) {
      const shape = flatFootprint("rect", PLAYER_SIZE, PLAYER_SIZE, color);
      shape.userData.playerIndex = index;
      return shape;
    }

    function syncPlayers() {
      const players = battlefield.players;
      const colors = [COLOR_P1, COLOR_P2];
      while (machinesGroup.children.length < players.length) {
        const index = machinesGroup.children.length;
        machinesGroup.add(makeMachine(colors[index] || COLOR_P1, index));
      }
      for (let i = 0; i < players.length; i++) {
        const player = players[i];
        const machine = machinesGroup.children[i];
        machine.position.set(worldX(player.x), 0, worldZ(player.y));
      }
    }

    // Same safe parser as the fire station. No eval or Function is used.
    function tokenizeEquation(input) {
      const tokens = [];
      let i = 0;
      const text = String(input || "");
      while (i < text.length) {
        const c = text.charAt(i);
        if (c === " " || c === "\t") {
          i += 1;
          continue;
        }
        if ("+-*/^()".indexOf(c) >= 0) {
          tokens.push({ type: c });
          i += 1;
          continue;
        }
        if (c === "π") {
          tokens.push({ type: "name", value: "pi" });
          i += 1;
          continue;
        }
        if (c === "√") {
          tokens.push({ type: "name", value: "sqrt" });
          i += 1;
          continue;
        }
        if ((c >= "0" && c <= "9") || c === ".") {
          const start = i;
          let dots = 0;
          while (i < text.length) {
            const d = text.charAt(i);
            if (d >= "0" && d <= "9") {
              i += 1;
              continue;
            }
            if (d === ".") {
              dots += 1;
              i += 1;
              continue;
            }
            break;
          }
          const numberText = text.slice(start, i);
          if (dots > 1 || numberText === ".") return null;
          const value = Number(numberText);
          if (!isFinite(value)) return null;
          tokens.push({ type: "num", value: value });
          continue;
        }
        if ((c >= "a" && c <= "z") || (c >= "A" && c <= "Z")) {
          const start = i;
          while (i < text.length) {
            const d = text.charAt(i);
            if ((d >= "a" && d <= "z") || (d >= "A" && d <= "Z")) i += 1;
            else break;
          }
          const name = text.slice(start, i).toLowerCase();
          if (name !== "x" && name !== "e" && name !== "pi" && name !== "sin" && name !== "cos" && name !== "tan" && name !== "sqrt" && name !== "log" && name !== "ln" && name !== "abs") return null;
          tokens.push({ type: "name", value: name });
          continue;
        }
        return null;
      }
      return tokens;
    }

    function parseExpression(input) {
      const tokens = tokenizeEquation(input);
      if (!tokens || tokens.length === 0) return null;
      let pos = 0;

      function peek() {
        if (pos >= tokens.length) return null;
        return tokens[pos];
      }

      function startsValue(token) {
        if (!token) return false;
        return token.type === "num" || token.type === "name" || token.type === "(";
      }

      function parseExpr() {
        let left = parseTerm();
        if (!left) return null;
        while (peek() && (peek().type === "+" || peek().type === "-")) {
          const op = peek().type;
          pos += 1;
          const right = parseTerm();
          if (!right) return null;
          left = { op: op, left: left, right: right };
        }
        return left;
      }

      function parseTerm() {
        let left = parseUnary();
        if (!left) return null;
        while (peek()) {
          const token = peek();
          if (token.type === "*" || token.type === "/") {
            pos += 1;
            const right = parseUnary();
            if (!right) return null;
            left = { op: token.type, left: left, right: right };
            continue;
          }
          if (startsValue(token)) {
            const right = parseUnary();
            if (!right) return null;
            left = { op: "*", left: left, right: right };
            continue;
          }
          break;
        }
        return left;
      }

      function parseUnary() {
        if (peek() && peek().type === "+") {
          pos += 1;
          return parseUnary();
        }
        if (peek() && peek().type === "-") {
          pos += 1;
          const value = parseUnary();
          if (!value) return null;
          return { op: "neg", value: value };
        }
        return parsePower();
      }

      function parsePower() {
        const base = parsePrimary();
        if (!base) return null;
        if (peek() && peek().type === "^") {
          pos += 1;
          const exp = parseUnary();
          if (!exp) return null;
          return { op: "^", left: base, right: exp };
        }
        return base;
      }

      function parsePrimary() {
        const token = peek();
        if (!token) return null;
        if (token.type === "num") {
          pos += 1;
          return { op: "num", value: token.value };
        }
        if (token.type === "name" && token.value === "x") {
          pos += 1;
          return { op: "x" };
        }
        if (token.type === "name" && (token.value === "e" || token.value === "pi")) {
          pos += 1;
          return { op: "num", value: token.value === "e" ? Math.E : Math.PI };
        }
        if (token.type === "name") {
          pos += 1;
          if (peek() && peek().type === "(") {
            pos += 1;
          } else {
            return null;
          }
          const arg = parseExpr();
          if (!arg || !peek() || peek().type !== ")") return null;
          pos += 1;
          return { op: token.value, value: arg };
        }
        if (token.type === "(") {
          pos += 1;
          const inner = parseExpr();
          if (!inner || !peek() || peek().type !== ")") return null;
          pos += 1;
          return inner;
        }
        return null;
      }

      const tree = parseExpr();
      if (!tree || pos !== tokens.length) return null;
      return tree;
    }

    function evalExpr(node, x) {
      if (!node) return NaN;
      if (node.op === "num") return node.value;
      if (node.op === "x") return x;
      if (node.op === "neg") return -evalExpr(node.value, x);
      if (node.op === "sin") return Math.sin(evalExpr(node.value, x));
      if (node.op === "cos") return Math.cos(evalExpr(node.value, x));
      if (node.op === "tan") return Math.tan(evalExpr(node.value, x));
      if (node.op === "sqrt") return Math.sqrt(evalExpr(node.value, x));
      if (node.op === "log") return Math.log(evalExpr(node.value, x)) / Math.LN10;
      if (node.op === "ln") return Math.log(evalExpr(node.value, x));
      if (node.op === "abs") return Math.abs(evalExpr(node.value, x));
      const a = evalExpr(node.left, x);
      const b = evalExpr(node.right, x);
      if (node.op === "+") return a + b;
      if (node.op === "-") return a - b;
      if (node.op === "*") return a * b;
      if (node.op === "/") return a / b;
      if (node.op === "^") return Math.pow(a, b);
      return NaN;
    }

    // Same trace as the fire station. drawPoints drops a final underground run
    // that never climbs back above the ground.
    function firingCurve(tree) {
      return GraphHowitzerFire.traceShell(function (x) {
        return evalExpr(tree, x);
      }, { shellSpeed: 20 });
    }

    // The fire-station turret dial writes this direction. Otherwise aim at the field center.
    function aimOf(player) {
      const ax = Number(player.aimX) || 0;
      const ay = Number(player.aimY) || 0;
      const len = Math.hypot(ax, ay);
      if (len > 0.001) return { x: ax / len, y: ay / len };
      const dx = -player.x;
      const dy = -player.y;
      const d = Math.hypot(dx, dy);
      if (d < 0.001) return { x: 1, y: 0 };
      return { x: dx / d, y: dy / d };
    }

    // Equation x is distance along the facing. Equation y is height on the vertical axis.
    function arcWorld(player, aim, distance, height) {
      return new THREE.Vector3(
        worldX(player.x + aim.x * distance),
        height,
        worldZ(player.y + aim.y * distance)
      );
    }

    function clearArc(index) {
      const current = arcObjects[index];
      if (!current) return;
      arcsGroup.remove(current);
      disposeObject(current);
      arcObjects[index] = null;
    }

    function makeGroundX(color, at) {
      const size = 1.4;
      const lift = 0.22;
      const material = new THREE.LineBasicMaterial({ color: color });
      const first = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(at.x - size, lift, at.z - size),
        new THREE.Vector3(at.x + size, lift, at.z + size)
      ]);
      const second = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(at.x - size, lift, at.z + size),
        new THREE.Vector3(at.x + size, lift, at.z - size)
      ]);
      const group = new THREE.Group();
      group.add(new THREE.Line(first, material));
      group.add(new THREE.Line(second, material.clone()));
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(size * 1.25, size * 1.75, 28),
        new THREE.MeshBasicMaterial({ color: color, side: THREE.DoubleSide })
      );
      ring.rotation.x = -Math.PI / 2;
      ring.position.set(at.x, lift - 0.06, at.z);
      group.add(ring);
      return group;
    }

    function addWorldRuns(group, player, aim, runs, material, dashed) {
      for (let r = 0; r < runs.length; r++) {
        const run = runs[r];
        if (run.length < 2) continue;
        const vectors = [];
        for (let i = 0; i < run.length; i++) {
          vectors.push(arcWorld(player, aim, run[i].x, run[i].y));
        }
        const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(vectors), material);
        if (dashed) line.computeLineDistances();
        group.add(line);
      }
    }

    function buildArc(player, color) {
      const tree = parseExpression(player.equation);
      if (!tree) return null;
      const curve = firingCurve(tree);
      if (!curve || !curve.points || curve.points.length < 2) return null;
      const drawn = curve.drawPoints || [];
      const showImpact = !!(curve.impact && curve.distance !== null && isFinite(curve.distance));
      if (drawn.length < 2 && !showImpact) return null;
      const aim = aimOf(player);
      const group = new THREE.Group();
      const runs = drawn.length > 1 ? GraphHowitzerFire.splitGround(drawn) : { above: [], below: [] };
      const solid = new THREE.LineBasicMaterial({
        color: color,
        polygonOffset: true,
        polygonOffsetFactor: -4,
        polygonOffsetUnits: -4
      });
      const dashed = new THREE.LineDashedMaterial({
        color: color,
        transparent: true,
        opacity: 0.5,
        dashSize: 1.8,
        gapSize: 1.1,
        polygonOffset: true,
        polygonOffsetFactor: -4,
        polygonOffsetUnits: -4
      });
      addWorldRuns(group, player, aim, runs.above, solid, false);
      addWorldRuns(group, player, aim, runs.below, dashed, true);
      group.userData.peak = curve.high || 0;
      if (showImpact) {
        const impactAt = arcWorld(player, aim, curve.distance, 0);
        group.add(makeGroundX(color, impactAt));
      }
      return group;
    }

    function arcKey(player) {
      return [
        player.x,
        player.y,
        player.aimX || 0,
        player.aimY || 0,
        player.equation || ""
      ].join("|");
    }

    function syncArcs() {
      const players = battlefield.players || [];
      const colors = [COLOR_P1, COLOR_P2];
      for (let i = 0; i < 2; i++) {
        const player = players[i];
        if (!player) {
          clearArc(i);
          arcKeys[i] = "";
          continue;
        }
        const key = arcKey(player);
        if (key === arcKeys[i]) continue;
        arcKeys[i] = key;
        clearArc(i);
        const group = buildArc(player, colors[i] || COLOR_P1);
        if (!group) continue;
        arcObjects[i] = group;
        arcsGroup.add(group);
      }
      let maxPeak = 0;
      for (let i = 0; i < arcObjects.length; i++) {
        const arc = arcObjects[i];
        if (arc && arc.userData.peak > maxPeak) maxPeak = arc.userData.peak;
      }
      syncZAxis(maxPeak);
    }

    function playerIndexOf(object) {
      let current = object;
      while (current) {
        if (typeof current.userData.playerIndex === "number") return current.userData.playerIndex;
        current = current.parent;
      }
      return -1;
    }

    function axisMeters(player) {
      const halfW = battlefield.width / 2;
      const halfH = battlefield.height / 2;
      return {
        x: player.x + halfW,
        y: halfH - player.y
      };
    }

    function percentText(value) {
      if (value === undefined || value === null || !isFinite(Number(value))) return "—";
      return Math.round(Number(value)) + "%";
    }

    function updateHover() {
      if (!pointerInside || !battlefield || !battlefield.players) {
        tip.hidden = true;
        return;
      }
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(machinesGroup.children, true);
      let index = -1;
      for (let i = 0; i < hits.length; i++) {
        index = playerIndexOf(hits[i].object);
        if (index >= 0) break;
      }
      const player = index >= 0 ? battlefield.players[index] : null;
      const machine = index >= 0 ? machinesGroup.children[index] : null;
      if (!player || !machine) {
        tip.hidden = true;
        return;
      }
      const name = index === 0 ? "P1" : "P2";
      const spot = axisMeters(player);
      tip.textContent = name
        + "\nHP: " + percentText(player.health)
        + "\nFuel: " + percentText(player.fuel)
        + "\nPosition: " + spot.x.toFixed(1) + " m, " + spot.y.toFixed(1) + " m";
      const world = new THREE.Vector3();
      machine.getWorldPosition(world);
      world.y += 3;
      world.project(camera);
      if (world.z > 1) {
        tip.hidden = true;
        return;
      }
      const canvas = renderer.domElement;
      const sx = (world.x * 0.5 + 0.5) * canvas.clientWidth;
      const sy = (-world.y * 0.5 + 0.5) * canvas.clientHeight;
      tip.style.left = Math.round(sx + 16) + "px";
      tip.style.top = Math.round(sy - 10) + "px";
      tip.hidden = false;
    }

    function applyState(next) {
      if (!next || !next.players) {
        showMessage("Open the game first");
        return;
      }
      battlefield = next;
      hideMessage();
      if (!fieldReady) buildField();
      syncObstacles();
      syncPlayers();
      syncArcs();
    }

    function loadSavedBattlefield() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return;
        applyState(JSON.parse(saved));
      } catch (error) {
        battlefield = null;
      }
    }

    function resetView() {
      if (controls._sphericalDelta) controls._sphericalDelta.set(0, 0, 0);
      if (controls._panOffset) controls._panOffset.set(0, 0, 0);
      if (typeof controls._scale === "number") controls._scale = 1;
      camera.zoom = 1;
      camera.updateProjectionMatrix();
      camera.position.copy(DEFAULT_CAMERA);
      controls.target.copy(DEFAULT_TARGET);
      controls.update();
    }

    function resize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function frame() {
      requestAnimationFrame(frame);
      if (document.hidden) return;
      controls.update();
      updateLabelScale();
      updateHover();
      renderer.render(scene, camera);
    }

    renderer.domElement.addEventListener("pointermove", function (event) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      pointerInside = true;
    });

    renderer.domElement.addEventListener("pointerleave", function () {
      pointerInside = false;
      tip.hidden = true;
    });

    resetButton.addEventListener("click", resetView);
    window.addEventListener("resize", resize);

    const channel = new BroadcastChannel(CHANNEL_NAME);
    channel.onmessage = function (event) {
      if (!event.data || event.data.type !== "state") return;
      applyState(event.data.battlefield);
    };

    loadSavedBattlefield();
    channel.postMessage({ type: "request-state" });
    resize();
    frame();
  </script>
</body>
</html>
