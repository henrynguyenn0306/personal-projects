      if (swept < targetTurns) return 0;
      const age = (swept - targetTurns) % 1;
      return 1 - age;
    }

    function drawRadarSweep(centerX, centerY, radius) {
      // Canvas y grows downward, so a y-up angle is negated.
      const tip = -sweepTurns() * Math.PI * 2;
      for (let i = RADAR_TRAIL_STEPS; i >= 1; i--) {
        const from = tip + ((i - 1) / RADAR_TRAIL_STEPS) * RADAR_TRAIL_ANGLE;
        const to = tip + (i / RADAR_TRAIL_STEPS) * RADAR_TRAIL_ANGLE;
        const fade = 1 - i / RADAR_TRAIL_STEPS;
        ctx.fillStyle = "rgba(57, 255, 106, " + (0.16 * fade).toFixed(3) + ")";
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, from, to);
        ctx.closePath();
        ctx.fill();
      }
      ctx.strokeStyle = COLOR_RADAR_SWEEP;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.lineTo(centerX + Math.cos(tip) * radius, centerY + Math.sin(tip) * radius);
      ctx.stroke();
    }

    // Rings at 5, 10, 15, and 20 m. The outer ring is the radar's range circle.
    function drawRadarRangeRings(centerX, centerY, rangePx) {
      const marks = [5, 10, 15, 20];
      const fontSize = rangePx > 90 ? 11 : 8;
      ctx.font = fontSize + "px monospace";
      ctx.textBaseline = "bottom";
      ctx.lineWidth = 1;
      for (let i = 0; i < marks.length; i++) {
        const meters = marks[i];
        const radius = rangePx * (meters / RADAR_RANGE);
        ctx.strokeStyle = meters === RADAR_RANGE ? COLOR_RADAR_CROSS : "rgba(57, 255, 106, 0.18)";
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.fillStyle = COLOR_RADAR_YOU;
        ctx.textAlign = meters === RADAR_RANGE ? "right" : "center";
        const labelX = meters === RADAR_RANGE ? centerX + radius - 2 : centerX + radius;
        ctx.fillText(meters + " m", labelX, centerY - 1);
      }
    }

    function drawRadarCrosshair(screenX, screenY, screenW, screenH, centerX, centerY) {
      ctx.strokeStyle = COLOR_RADAR_CROSS;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(screenX, centerY);
      ctx.lineTo(screenX + screenW, centerY);
      ctx.moveTo(centerX, screenY);
      ctx.lineTo(centerX, screenY + screenH);
      ctx.stroke();
    }

    // True when any part of the obstacle is inside this player's radar range.
    function obstacleInRange(obstacle, you) {
      if (obstacle.type === "tower") {
        return Math.hypot(obstacle.x - you.x, obstacle.y - you.y) <= RADAR_RANGE + obstacle.r;
      }
      const nearestX = Math.max(obstacle.x - obstacle.w / 2, Math.min(you.x, obstacle.x + obstacle.w / 2));
      const nearestY = Math.max(obstacle.y - obstacle.h / 2, Math.min(you.y, obstacle.y + obstacle.h / 2));
      return Math.hypot(nearestX - you.x, nearestY - you.y) <= RADAR_RANGE;
    }

    function drawRadarBlips(centerX, centerY, rangePx, ownerIndex) {
      const you = battlefield.players[ownerIndex];
      const enemy = battlefield.players[1 - ownerIndex];
      const scale = rangePx / RADAR_RANGE;
      // The circle clip keeps only the part of each shape inside RADAR_RANGE.
      ctx.save();
      ctx.beginPath();
      ctx.arc(centerX, centerY, rangePx, 0, Math.PI * 2);
      ctx.clip();

      const obstacles = battlefield.obstacles || [];
      for (let i = 0; i < obstacles.length; i++) {
        const obstacle = obstacles[i];
        if (!obstacleInRange(obstacle, you)) continue;
        const dx = obstacle.x - you.x;
        const dy = obstacle.y - you.y;
        const alpha = pingAlpha(dx, dy);
        if (alpha <= 0) continue;
        const spotX = centerX + dx * scale;
        const spotY = centerY - dy * scale;
        ctx.fillStyle = "rgba(" + COLOR_RADAR_OBSTACLE + ", " + alpha.toFixed(3) + ")";
        if (obstacle.type === "tower") {
          ctx.beginPath();
          ctx.arc(spotX, spotY, obstacle.r * scale, 0, Math.PI * 2);
          ctx.fill();
        } else {
          const w = obstacle.w * scale;
          const h = obstacle.h * scale;
          ctx.fillRect(spotX - w / 2, spotY - h / 2, w, h);
        }
      }

      const enemyDx = enemy.x - you.x;
      const enemyDy = enemy.y - you.y;
      if (Math.hypot(enemyDx, enemyDy) <= RADAR_RANGE) {
        const alpha = pingAlpha(enemyDx, enemyDy);
        if (alpha > 0) {
          ctx.fillStyle = "rgba(" + COLOR_RADAR_ENEMY + ", " + alpha.toFixed(3) + ")";
          ctx.beginPath();
          ctx.arc(
            centerX + enemyDx * scale,
            centerY - enemyDy * scale,
            Math.max(4, rangePx * RADAR_ENEMY_DOT_RATIO),
            0,
            Math.PI * 2
          );
          ctx.fill();
        }
      }
      ctx.restore();
    }

    // Both players read the battlefield the same way: x to the right, y up.
    // Player 2 is not flipped. Kept simple on purpose.
    function drawRadarPicture(screenX, screenY, screenW, screenH, ownerIndex, showBlips) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(screenX, screenY, screenW, screenH);
      ctx.clip();

      ctx.fillStyle = machineStarted ? COLOR_RADAR_SCREEN : COLOR_MONITOR_SCREEN;
      ctx.fillRect(screenX, screenY, screenW, screenH);
      if (!machineStarted) {
        ctx.restore();
        return;
      }

      const centerX = screenX + screenW / 2;
      const centerY = screenY + screenH / 2;
      // Half of the shorter side is RADAR_RANGE. The ring and the sweep both use that.
      const rangePx = Math.min(screenW, screenH) / 2;
      if (!showBlips) drawRadarCrosshair(screenX, screenY, screenW, screenH, centerX, centerY);
      if (showBlips) drawRadarBlips(centerX, centerY, rangePx, ownerIndex);
      drawRadarSweep(centerX, centerY, rangePx);
      drawRadarRangeRings(centerX, centerY, rangePx);

      ctx.fillStyle = COLOR_RADAR_YOU;
      ctx.beginPath();
      ctx.arc(centerX, centerY, showBlips ? 5 : 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Distance from this machine's center to the closest point on an obstacle's edge.
    function distanceToObstacleEdge(obstacle, you) {
      if (obstacle.type === "tower") {
        const gap = Math.hypot(obstacle.x - you.x, obstacle.y - you.y) - obstacle.r;
        return gap < 0 ? 0 : gap;
      }
      const left = obstacle.x - obstacle.w / 2;
      const right = obstacle.x + obstacle.w / 2;
      const top = obstacle.y - obstacle.h / 2;
      const bottom = obstacle.y + obstacle.h / 2;
      const nearestX = Math.max(left, Math.min(you.x, right));
      const nearestY = Math.max(top, Math.min(you.y, bottom));
      const outside = Math.hypot(nearestX - you.x, nearestY - you.y);
      if (outside > 0) return outside;
      return Math.min(you.x - left, right - you.x, you.y - top, bottom - you.y);
    }

    // -1 when nothing is inside RADAR_RANGE. Otherwise the nearest edge distance.
    function nearestObstacleDistance(you) {
      const obstacles = battlefield.obstacles || [];
      let best = -1;
      for (let i = 0; i < obstacles.length; i++) {
        const obstacle = obstacles[i];
        if (!obstacleInRange(obstacle, you)) continue;
        const dist = distanceToObstacleEdge(obstacle, you);
        if (best < 0 || dist < best) best = dist;
      }
      return best;
    }

    function metersText(distance) {
      return distance.toFixed(1) + " m";
    }

    function radarInfoLines(ownerIndex) {
      const you = battlefield.players[ownerIndex];
      const enemy = battlefield.players[1 - ownerIndex];
      const enemyDist = Math.hypot(enemy.x - you.x, enemy.y - you.y);
      const lines = [];
      if (enemyDist <= RADAR_RANGE) {
        lines.push([{ text: "Enemy distance: " + metersText(enemyDist), color: COLOR_MONITOR_TEXT }]);
      } else {
        lines.push([{ text: "Enemy: no contact", color: COLOR_MONITOR_TEXT }]);
      }
      const obstacleDist = nearestObstacleDistance(you);
      if (obstacleDist >= 0) {
        const parts = [{ text: "Nearest obstacle: " + metersText(obstacleDist), color: COLOR_MONITOR_TEXT }];
        if (selfTooCloseToObstacle(ownerIndex)) {
          parts.push({ text: "  TOO CLOSE", color: COLOR_MONITOR_WARNING });
        }
        lines.push(parts);
      } else {
        lines.push([{ text: "Obstacles: none in range", color: COLOR_MONITOR_TEXT }]);
      }
      return lines;
    }

    function lineWidthOf(parts) {
      let width = 0;
      for (let i = 0; i < parts.length; i++) width += ctx.measureText(parts[i].text).width;
      return width;
    }

    function drawRadarReadout(ownerIndex, x, y, maxWidth) {
      const lines = radarInfoLines(ownerIndex);
      let fontSize = 22;
      ctx.font = fontSize + "px monospace";
      let widest = 0;
      for (let i = 0; i < lines.length; i++) widest = Math.max(widest, lineWidthOf(lines[i]));
      if (widest > maxWidth && maxWidth > 40) {
        fontSize = Math.max(14, Math.floor(fontSize * (maxWidth / widest)));
        ctx.font = fontSize + "px monospace";
      }
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      const lineHeight = fontSize + 10;
      for (let i = 0; i < lines.length; i++) {
        let cursor = x;
        const parts = lines[i];
        for (let p = 0; p < parts.length; p++) {
          ctx.fillStyle = parts[p].color;
          ctx.fillText(parts[p].text, cursor, y + i * lineHeight);
          cursor += ctx.measureText(parts[p].text).width;
        }
      }
    }

    // Big square at the top center. The readout sits underneath it.
    function drawBigRadar(player, screenX, screenY, screenW, screenH) {
      const gap = 16;
      const readoutBand = 80;
      let size = Math.min(screenW - 8, screenH - readoutBand - gap);
      if (size < 48) size = Math.min(screenW - 4, screenH - 4);
      const squareX = screenX + (screenW - size) / 2;
      const squareY = screenY;
      const ownerIndex = player === player1 ? 0 : 1;
      drawRadarPicture(squareX, squareY, size, size, ownerIndex, true);
      const textX = squareX;
      const textW = Math.max(40, screenX + screenW - textX - 4);
      drawRadarReadout(ownerIndex, textX, squareY + size + gap, textW);
    }

    function messageText(entry) {
      // A countdown line is an object so we can change its text without adding a new row.
      if (typeof entry === "string") return entry;
      return entry.text;
    }

    function messageColor(entry) {
      if (typeof entry === "string" || !entry.color) return COLOR_MONITOR_TEXT;
      return entry.color;
    }

    // "Status: Intact (100%) | Idle" — condition and health, then what the machine is doing.
    // Font size is the same 16px the monitor used before the log lines went to capitals.
    function drawStatusLine(player, x, y, fontSize) {
      const parts = [
        { text: "Status: ", color: COLOR_MONITOR_TEXT },
        { text: player.condition + " (" + healthPercent(player) + "%)", color: conditionColor(player.condition) },
        { text: " | ", color: COLOR_MONITOR_TEXT },
        { text: player.activity, color: activityColor(player.activity) }
      ];
      ctx.font = fontSize + "px monospace";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      let cursor = x;
      for (let i = 0; i < parts.length; i++) {
        ctx.fillStyle = parts[i].color;
        ctx.fillText(parts[i].text, cursor, y);
        cursor += ctx.measureText(parts[i].text).width;
      }
    }

    function drawMessageList(player, screenX, screenY, screenW, screenH, fontSize, lineHeight) {
      // The pinned status keeps a strip at the bottom. Log lines stop above it.
      const barH = machineStarted ? lineHeight + 8 : 0;
      const logH = Math.max(8, screenH - barH);

      ctx.save();
      ctx.beginPath();
      ctx.rect(screenX, screenY, screenW, logH);
      ctx.clip();
      ctx.font = fontSize + "px monospace";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      const maxLines = Math.max(1, Math.floor((logH - 8) / lineHeight));
      const start = Math.max(0, player.messages.length - maxLines);
      for (let i = start; i < player.messages.length; i++) {
        const entry = player.messages[i];
        ctx.fillStyle = messageColor(entry);
        const line = i - start;
        ctx.fillText(messageText(entry), screenX + 8, screenY + 6 + line * lineHeight);
      }
      ctx.restore();

      if (!machineStarted) return;

      const barY = screenY + screenH - barH;
      ctx.strokeStyle = "rgba(242, 242, 247, 0.4)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(screenX + 6, barY + 1);
      ctx.lineTo(screenX + screenW - 6, barY + 1);
      ctx.stroke();
      ctx.save();
      ctx.beginPath();
      ctx.rect(screenX, barY, screenW, barH);
      ctx.clip();
      drawStatusLine(player, screenX + 8, barY + 6, fontSize);
      ctx.restore();
    }

    function getZoomRect(room) {
      const roomWidth = room.right - room.left;
      const width = roomWidth * ZOOM_WIDTH_RATIO;
      const height = canvas.height * ZOOM_HEIGHT_RATIO;
      return {
        x: room.left + (roomWidth - width) / 2,
        y: (canvas.height - height) / 2,
        width: width,
        height: height
      };
    }

    function closeButtonRect(panel) {
      return {
        x: panel.x + panel.width - CLOSE_BUTTON_SIZE - 8,
        y: panel.y + 8,
        width: CLOSE_BUTTON_SIZE,
        height: CLOSE_BUTTON_SIZE
      };
    }

    function pointInRect(x, y, rect) {
      return x >= rect.x && x < rect.x + rect.width && y >= rect.y && y < rect.y + rect.height;
    }

    // Only one station per player. If the hand is near more than one, the closer center wins.
    function stationNearHand(player, room) {
      const stations = [
        { kind: "monitor", rect: getMonitorRect(room) },
        { kind: "radar", rect: getRadarRect(room) },
        { kind: "joystick", rect: getJoystickRect(room) },
        { kind: "refuel", rect: getRefuelRect(room) },
        { kind: "fire", rect: getFireRect(room) }
      ];
      let bestKind = "";
      let bestDist = 0;
      for (let i = 0; i < stations.length; i++) {
        const station = stations[i];
        if (!handIsNearMonitor(player, station.rect)) continue;
        const dist = distanceFromHandCenter(player, station.rect);
        if (bestKind === "" || dist < bestDist) {
          bestKind = station.kind;
          bestDist = dist;
        }
      }
      // A full tank keeps the button in the way, but the press does nothing.
      if (bestKind === "refuel" && !refuelUsable(player)) return "";
      return bestKind;
    }

    // Monitor and radar open a zoom panel. The joystick snaps the hand onto its knob.
    // Press the same key again to let go. The hand stays where the knob is.
    function tryInteract(player, room) {
      // Stations stay shut until H.O.W.L.E.R has finished starting.
      // The start button watches the held key itself, so this press is ignored.
      if (!machineStarted) return;
      if (player.fireOpen) {
        pressFireKey(player);
        return;
      }
      if (player.refueling) {
        player.refueling = false;
        setRefuelLine(player, false);
        return;
      }
      if (player.gripping) {
        player.gripping = false;
        player.tiltX = 0;
        player.tiltY = 0;
        return;
      }
      if (player.panelOpen) {
        player.panelOpen = false;
        player.panelKind = "";
        return;
      }
      const kind = stationNearHand(player, room);
      if (!kind) return;
      if (kind === "joystick") {
        player.gripping = true;
        player.tiltX = 0;
        player.tiltY = 0;
        placeHandOnKnob(player, room);
        return;
      }
      if (kind === "refuel") {
        if (!refuelUsable(player)) return;
        player.refueling = true;
        return;
      }
      if (kind === "fire") {
        player.fireOpen = true;
        player.fireIndex = 0;
        player.panelOpen = true;
        player.panelKind = "fire";
        placeHandOnFire(player, room);
        return;
      }
      player.panelOpen = true;
      player.panelKind = kind;
    }

    function drawZoomPanel(room, player) {
      if (!machineStarted || !player.panelOpen) return;

      ctx.fillStyle = COLOR_ROOM_DIM;
      ctx.fillRect(room.left, 0, room.right - room.left, canvas.height);

      const panel = getZoomRect(room);
      const bezel = Math.min(MONITOR_BEZEL, panel.width / 6, panel.height / 6);
      // The close button owns the top-right corner, so that screw is left off.
      let frameLabel = "STATUS";
      if (player.panelKind === "radar") frameLabel = "RADAR";
      if (player.panelKind === "fire") frameLabel = "FIRE";
      drawConsoleFrame(panel, {
        label: frameLabel,
        powerOn: machineStarted,
        skipCorners: ["tr"]
      });

      const screenX = panel.x + bezel;
      const screenY = panel.y + bezel + 8;
      const screenW = panel.width - bezel * 2;
      const screenH = panel.height - bezel * 2 - 8;
      ctx.fillStyle = COLOR_MONITOR_SCREEN;
      ctx.fillRect(screenX, screenY, screenW, screenH);
      if (player.panelKind === "radar") {
        drawBigRadar(player, screenX, screenY, screenW, screenH);
      } else if (player.panelKind === "fire") {
        drawFireZoom(player, screenX, screenY, screenW, screenH);
      } else {
        drawMessageList(player, screenX, screenY, screenW, screenH, ZOOM_FONT_SIZE, ZOOM_LINE_HEIGHT);
      }

      const button = closeButtonRect(panel);
      ctx.fillStyle = "#222228";
      ctx.fillRect(button.x, button.y, button.width, button.height);
      ctx.strokeStyle = COLOR_LABEL;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(button.x + 7, button.y + 7);
      ctx.lineTo(button.x + button.width - 7, button.y + button.height - 7);
      ctx.moveTo(button.x + button.width - 7, button.y + 7);
      ctx.lineTo(button.x + 7, button.y + button.height - 7);
      ctx.stroke();
    }

    // CSS can scale the canvas, so a click is converted into canvas pixels.
    function canvasPointFromClick(event) {
      const bounds = canvas.getBoundingClientRect();
      const scaleX = canvas.width / bounds.width;
      const scaleY = canvas.height / bounds.height;
      return {
        x: (event.clientX - bounds.left) * scaleX,
        y: (event.clientY - bounds.top) * scaleY
      };
    }

    function handleClick(x, y) {
      const rooms = getRooms();
      let player = null;
      let room = null;
      if (x >= rooms.left.left && x < rooms.left.right) {
        player = player1;
        room = rooms.left;
      } else if (x >= rooms.right.left && x < rooms.right.right) {
        player = player2;
        room = rooms.right;
      }
      // A click in the other half, or on the wall, leaves this panel alone.
      if (!player || !player.panelOpen) return;

      const panel = getZoomRect(room);
      const onClose = pointInRect(x, y, closeButtonRect(panel));
      const insidePanel = pointInRect(x, y, panel);
      if (onClose || !insidePanel) {
        player.panelOpen = false;
        if (player.panelKind === "fire") {
          player.fireOpen = false;
          player.panelKind = "";
        }
      }
    }

    canvas.addEventListener("click", function (event) {
      const point = canvasPointFromClick(event);
      handleClick(point.x, point.y);
    });

    setCondition(player1, "Intact");
    setCondition(player2, "Intact");
    setActivity(player1, "Idle");
    setActivity(player2, "Idle");

    // One shared countdown, but each monitor keeps its own line so we can edit it in place.
    function countdownText(secondsLeft) {
      if (secondsLeft <= 0) return "> Boot complete. All units nominal.";
      return "> Boot sequence: " + MACHINE_NAME + " online in " + secondsLeft + "s";
    }

    const openingLine = ENABLE_HOLD_TO_START ? WAITING_TEXT : countdownText(COUNTDOWN_SECONDS);
    const countdownLines = [
      { text: openingLine },
      { text: openingLine }
    ];
    player1.messages.push(countdownLines[0]);
    player2.messages.push(countdownLines[1]);

    let countdownStartTime = -1;
    let countdownSecondsLeft = COUNTDOWN_SECONDS;
    let machineStarted = false;
    let machineStartedAt = -1;
    let startupBegun = !ENABLE_HOLD_TO_START;
    let startProgress = 0;
    let startFade = 1;

    // Circle centered on the wall. Each half sticks into one player's room.
    function getStartButton() {
      const rooms = getRooms();
      return {
        cx: rooms.wallX + WALL_WIDTH / 2,
        cy: canvas.height / 2,
        r: START_BUTTON_RADIUS
      };
    }

    // The palm box has to meet that player's half of the circle.
    function handTouchesOwnStartHalf(player) {
      const button = getStartButton();
      const box = handBox(player);
      const nearestX = Math.max(box.left, Math.min(button.cx, box.right));
      const nearestY = Math.max(box.top, Math.min(button.cy, box.bottom));
      if (Math.hypot(button.cx - nearestX, button.cy - nearestY) > button.r) return false;
      if (player === player1) return nearestX <= button.cx;
      return nearestX >= button.cx;
    }

    function isHoldingStart(player) {
      if (!ENABLE_HOLD_TO_START) return false;
      if (startupBegun) return false;
      const key = player === player1 ? INTERACT_KEY_P1 : INTERACT_KEY_P2;
      if (!keys[key]) return false;
      return handTouchesOwnStartHalf(player);
    }

    function beginStartup(time) {
      startupBegun = true;
      countdownStartTime = time;
      const text = countdownText(COUNTDOWN_SECONDS);
      countdownLines[0].text = text;
      countdownLines[1].text = text;
      player1.holdingStart = false;
      player2.holdingStart = false;
    }

    // Both hands and both interact keys have to stay down together.
    function updateStartHold(dt, time) {
      if (!ENABLE_HOLD_TO_START) return;
      if (startupBegun) {
        player1.holdingStart = false;
        player2.holdingStart = false;
        if (startFade > 0) {
          startFade -= dt / START_FADE_SECONDS;
          if (startFade < 0) startFade = 0;
        }
        return;
      }
      const hold1 = isHoldingStart(player1);
      const hold2 = isHoldingStart(player2);
      player1.holdingStart = hold1;
      player2.holdingStart = hold2;
      if (hold1 && hold2) {
        startProgress += dt / HOLD_TO_START_SECONDS;
        if (startProgress >= 1) {
          startProgress = 1;
          beginStartup(time);
        }
      } else if (startProgress > 0) {
        startProgress -= dt / START_DRAIN_SECONDS;
        if (startProgress < 0) startProgress = 0;
      }
    }

    function drawStartHalf(cx, cy, radius, fromWest) {
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      if (fromWest) ctx.arc(cx, cy, radius, -Math.PI / 2, Math.PI / 2, true);
      else ctx.arc(cx, cy, radius, -Math.PI / 2, Math.PI / 2, false);
      ctx.closePath();
      ctx.fill();
    }

    function drawStartButton() {
      if (!ENABLE_HOLD_TO_START) return;
      if (startupBegun && startFade <= 0) return;
      const button = getStartButton();
      const inner = button.r - START_RING_WIDTH;
      ctx.save();
      ctx.globalAlpha = startupBegun ? Math.max(0, startFade) : 1;
      if (startupBegun) {
        const sink = 0.82 + 0.18 * startFade;
        ctx.translate(button.cx, button.cy);
        ctx.scale(sink, sink);
        ctx.translate(-button.cx, -button.cy);
      }

      ctx.fillStyle = COLOR_JOYSTICK_EDGE_LIGHT;
      ctx.beginPath();
      ctx.arc(button.cx, button.cy, button.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = COLOR_JOYSTICK_EDGE_DARK;
      ctx.beginPath();
      ctx.arc(button.cx, button.cy, button.r - 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = player1.holdingStart ? COLOR_JOYSTICK_LED_ON : COLOR_JOYSTICK_KNOB_CAP;
      drawStartHalf(button.cx, button.cy, inner, true);
      ctx.fillStyle = player2.holdingStart ? COLOR_JOYSTICK_LED_ON : COLOR_JOYSTICK_KNOB_CAP;
      drawStartHalf(button.cx, button.cy, inner, false);

      ctx.strokeStyle = COLOR_JOYSTICK_EDGE_DARK;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(button.cx, button.cy - inner);
      ctx.lineTo(button.cx, button.cy + inner);
      ctx.stroke();

      if (startProgress > 0) {
        // Drawn on the metal ring so it does not cover the joystick beside the wall.
        ctx.strokeStyle = COLOR_RADAR_SWEEP;
        ctx.lineWidth = 5;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.arc(
          button.cx,
          button.cy,
          button.r - 4,
          -Math.PI / 2,
          -Math.PI / 2 + Math.PI * 2 * startProgress
        );
        ctx.stroke();
      }

      // Two short lines so the plate stays in the gap beside player 2's joystick.
      const labelLines = ["HOLD TO", "START"];
      ctx.font = "bold 12px sans-serif";
      let plateW = 0;
      for (let i = 0; i < labelLines.length; i++) {
        plateW = Math.max(plateW, ctx.measureText(labelLines[i]).width);
      }
      plateW += 14;
      const rooms = getRooms();
      const roomGap = (rooms.left.right - rooms.left.left) * STATION_GAP_RATIO;
      const maxPlate = WALL_WIDTH + roomGap * 2 - 10;
      if (plateW > maxPlate) plateW = maxPlate;
      const plateH = 28;
      const plateX = button.cx - plateW / 2;
      let plateY = button.cy + button.r + 10;
      if (plateY + plateH > canvas.height - 4) plateY = canvas.height - plateH - 4;
      ctx.fillStyle = COLOR_JOYSTICK_LABEL;
      ctx.fillRect(plateX, plateY, plateW, plateH);
      ctx.strokeStyle = COLOR_JOYSTICK_EDGE_LIGHT;
      ctx.lineWidth = 1;
      ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
      ctx.fillStyle = COLOR_JOYSTICK_LABEL_TEXT;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(labelLines[0], button.cx, plateY + 9);
      ctx.fillText(labelLines[1], button.cx, plateY + 20);
      ctx.restore();
    }

    // Uses the animation timestamp so the ticks stay one second apart.
    // With the hold button off, the countdown starts on the first frame.
    function updateCountdown(time) {
      if (!startupBegun) return;
      if (countdownSecondsLeft === 0) return;
      if (countdownStartTime < 0) countdownStartTime = time;
      const elapsed = (time - countdownStartTime) / 1000;
      let secondsLeft = COUNTDOWN_SECONDS - Math.floor(elapsed);
      if (secondsLeft < 0) secondsLeft = 0;
      if (secondsLeft === countdownSecondsLeft) return;
      countdownSecondsLeft = secondsLeft;
      if (secondsLeft === 0) {
        machineStarted = true;
        machineStartedAt = time;
      }
      const text = countdownText(secondsLeft);
      for (let i = 0; i < countdownLines.length; i++) {
        countdownLines[i].text = text;
      }
    }

    function randomRange(min, max) {
      return min + Math.random() * (max - min);
    }

    // How far the shape sticks out from its center. Used to keep obstacles apart.
    function obstacleReach(obstacle) {
      if (obstacle.type === "tower") return obstacle.r;
      return Math.hypot(obstacle.w / 2, obstacle.h / 2);
    }

    function randomObstacle(index, big) {
      // Even numbers are buildings and odd numbers are towers, so the map has both.
      // A big shape is about three player-diameters across.
      if (index % 2 === 0) {
        return {
          type: "building",
          x: 0,
          y: 0,
          w: big ? BIG_OBSTACLE_SIZE : randomRange(BUILDING_MIN_SIZE, BUILDING_MAX_SIZE),
          h: big ? BIG_OBSTACLE_SIZE : randomRange(BUILDING_MIN_SIZE, BUILDING_MAX_SIZE)
        };
      }
      return {
        type: "tower",
        x: 0,
        y: 0,
        r: big ? BIG_OBSTACLE_SIZE / 2 : randomRange(TOWER_MIN_RADIUS, TOWER_MAX_RADIUS)
      };
    }

    function pickBigIndexes() {
      const count = BIG_OBSTACLE_MIN + Math.floor(Math.random() * (BIG_OBSTACLE_MAX - BIG_OBSTACLE_MIN + 1));
      const picked = [];
      while (picked.length < count) {
        const index = Math.floor(Math.random() * OBSTACLE_COUNT);
        let already = false;
        for (let i = 0; i < picked.length; i++) {
          if (picked[i] === index) already = true;
        }
        if (!already) picked.push(index);
      }
      return picked;
    }

    function obstacleHitsPlayers(obstacle, players) {
      const reach = obstacleReach(obstacle);
      for (let i = 0; i < players.length; i++) {
        const distance = Math.hypot(obstacle.x - players[i].x, obstacle.y - players[i].y);
        if (distance < OBSTACLE_CLEARANCE + reach) return true;
      }
      return false;
    }

    function obstacleHitsAnother(obstacle, others) {
      const reach = obstacleReach(obstacle);
      for (let i = 0; i < others.length; i++) {
        const distance = Math.hypot(obstacle.x - others[i].x, obstacle.y - others[i].y);
        if (distance < reach + obstacleReach(others[i])) return true;
      }
      return false;
    }

    function makeObstacles(players) {
      const bigIndexes = pickBigIndexes();
      const obstacles = [];
      for (let n = 0; n < OBSTACLE_COUNT; n++) {
        let isBig = false;
        for (let i = 0; i < bigIndexes.length; i++) {
          if (bigIndexes[i] === n) isBig = true;
        }
        let fallback = null;
        for (let attempt = 0; attempt < OBSTACLE_PLACE_TRIES; attempt++) {
          const obstacle = randomObstacle(n, isBig);
          const reach = obstacleReach(obstacle);
          obstacle.x = randomRange(-FIELD_X_MAX + reach, FIELD_X_MAX - reach);
          obstacle.y = randomRange(-FIELD_Y_MAX + reach, FIELD_Y_MAX - reach);
          if (obstacleHitsPlayers(obstacle, players)) continue;
          fallback = obstacle;
          if (!obstacleHitsAnother(obstacle, obstacles)) break;
        }
        if (fallback) obstacles.push(fallback);
      }
      return obstacles;
    }

    // Hidden map. It is not drawn in the rooms. The viewer tab reads this object.
    function makeBattlefield() {
      const players = [
        { x: -60, y: 0, health: MAX_HEALTH, vx: 0, vy: 0, fuel: MAX_FUEL },
        { x: 60, y: 0, health: MAX_HEALTH, vx: 0, vy: 0, fuel: MAX_FUEL }
      ];
      return {
        width: FIELD_X_MAX * 2,
        height: FIELD_Y_MAX * 2,
        players: players,
        obstacles: makeObstacles(players)
      };
    }

    // Hitbox for future shots: the circle itself, radius PLAYER_SIZE / 2.
    function isPointInPlayer(player, x, y) {
      const radius = PLAYER_SIZE / 2;
      const distance = Math.hypot(x - player.x, y - player.y);
      return distance <= radius;
    }

    // Circle vs rectangle (building) and circle vs circle (tower).
    // Joystick movement uses this so a player cannot walk through an obstacle.
    function collidesWithObstacle(x, y, radius) {
      const obstacles = battlefield.obstacles || [];
      for (let i = 0; i < obstacles.length; i++) {
        const obstacle = obstacles[i];
        if (obstacle.type === "tower") {
          if (Math.hypot(x - obstacle.x, y - obstacle.y) <= radius + obstacle.r) return true;
          continue;
        }
        const nearestX = Math.max(obstacle.x - obstacle.w / 2, Math.min(x, obstacle.x + obstacle.w / 2));
        const nearestY = Math.max(obstacle.y - obstacle.h / 2, Math.min(y, obstacle.y + obstacle.h / 2));
        if (Math.hypot(x - nearestX, y - nearestY) <= radius) return true;
      }
      return false;
    }

    const battlefield = makeBattlefield();
    const battlefieldChannel = new BroadcastChannel(BATTLEFIELD_CHANNEL_NAME);
    let battlefieldDirty = false;
    let lastBattlefieldPublish = 0;
    let player1WasMoving = false;
    let player2WasMoving = false;

    // Save the map and tell any open viewer tab. Call this again if the map changes.
    function publishBattlefield() {
      try {
        localStorage.setItem(BATTLEFIELD_STORAGE_KEY, JSON.stringify(battlefield));
      } catch (error) {
        // The room still works if the browser blocks storage.
      }
      battlefieldChannel.postMessage({ type: "state", battlefield: battlefield });
    }

    // Positions change every frame while driving. Send them about 10 times a second.
    function flushBattlefield(time, force) {
      if (!battlefieldDirty) return;
      if (!force && time - lastBattlefieldPublish < STATE_PUBLISH_SECONDS * 1000) return;
      publishBattlefield();
      battlefieldDirty = false;
      lastBattlefieldPublish = time;
    }

    battlefieldChannel.onmessage = function (event) {
      if (event.data && event.data.type === "request-state") publishBattlefield();
    };

    publishBattlefield();

    window.addEventListener("resize", resize);
    resize();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
