    const PLAYER_SIZE = 6; // diameter 6 meters, so the radius is 3

    const ACTIVITY_COLORS = {

    };
    const MAX_HEALTH = 100;

    const PING_WARNING_OBSTACLE = "> Warning: Hostile near obstacle.";
    const PING_WARNING_SELF = "> Warning: Obstacle proximity < 4 m.";
    // The square shows everything within 20 meters around this player.

    const RADAR_TRAIL_ANGLE = Math.PI / 3; // how much of the circle the fading trail covers
    const RADAR_ENEMY_DOT_RATIO = 0.035; // enemy dot size compared with the radar half-size

    const OBSTACLE_COUNT_MIN = 26;
    const OBSTACLE_COUNT_MAX = 34;
    // Open ground around each spawn, measured from the machine center to the obstacle's reach.

    const OBSTACLE_PLACE_TRIES = 48;
    // How close an opponent must be to an obstacle edge to light the red ping.

    // Meters from your own machine's edge to an obstacle's edge.

    const RED_PING_SIZE = 12; // capped at the bezel thickness so it sits in the frame corner
    const RED_PING_BLINK_SECONDS = 0.4;
    const COLOR_RED_PING_OFF = "#3a1518";
    const COLOR_RED_PING_ON = "#ff2a2a";
    // The hand grips the joystick in place. Its plate is sized with the fire station

    const JOYSTICK_REST_LEAN = 0.7; // the idle picture points up; a gripped stick rests at the center
    const JOYSTICK_STICK_RATIO = 0.28; // how far the knob can lean, compared with the plate
    const JOYSTICK_KNOB_RATIO = 0.16;
    // Held keys push the knob out at a steady speed. Letting go springs it back faster.
    const STICK_FULL_SECONDS = 0.8; // center to full tilt
    const STICK_RETURN_SECONDS = 0.5; // full tilt back to center
    const MAX_MOVE_SPEED = 8; // m/s at full tilt
    const ACCELERATION = 3; // m/s squared; about 2.5 seconds from a stop to full speed
    const DECELERATION = 5; // m/s squared; slows down a bit faster than it speeds up
    const MOVE_STATUS_SPEED = 0.2; // m/s; slower than this, the activity returns to Idle
    const TURRET_TURN_SPEED = 30; // degrees per second toward the dial target, shortest way
    // Fuel is a percent. It falls only while the machine actually drives. It never refills by itself.

    const FUEL_DRAIN_PER_METER = MAX_FUEL / 70; // a full tank lasts about 70 meters
    const LOW_FUEL_PERCENT = 20;
    const REFUEL_SECONDS_FULL = 90; // seconds to go from empty to full
    const REFUEL_BLINK_SECONDS = 0.4;
    const FUEL_GAUGE_WIDTH = 58; // bar snapped to the joystick, toward the middle of the room
    // Gauge and button share the joystick's height. The button is the bottom slice.
    const REFUEL_HEIGHT_RATIO = 0.28;
    const COLOR_REFUEL_DISABLED = "#7a7a84";
    // Adjacent still counts, so a machine pressed against a surface keeps the report.
    const CONTACT_EPSILON = 0.05;
    const COLLISION_TEXT = "> Alert: Collision detected.";
    const COLOR_FUEL_HIGH = "#39ff6a";
    const COLOR_FUEL_MID = "#ffe14a";
    const COLOR_FUEL_LOW = "#ff4040";
    const COLOR_REFUEL_LED = "#ffb020";

    // Fire control is the equation station. FIRE launches a shell along the curve.

    const FIRE_GRAPH_Y_MAX = 100; // fixed graph: meters of height above the ground
    const FIRE_GRAPH_BELOW = 12; // fixed graph: meters of strip under the ground line
    const FIRE_EQUATION_MAX = 64;
    const FIRE_DEFAULT_EQUATION = "-0.05x^2 + 2x";
    const EQUATION_PREFIX = "y = ";
    const SHELL_SPEED = 20; // m/s along the path, not along the ground. Used for the flight-time readout.
    const SHELL_MUZZLE_SPEED = 18; // m/s as the shell leaves the bore
    const SHELL_GRAVITY = 6; // m/s^2. Climbing spends speed. Falling, and leaving the ground, add it.
    const SHELL_MIN_SPEED = 4;
    const SHELL_MAX_SPEED = 80;
    const SHELL_DAMAGE_PER_MPS = 2; // stored damage, applied when the blast overlaps the opponent
    const SHELL_BODY_RADIUS = 0.08; // the shell dot. In-air contact uses this, not the blast.
    const SHELL_BLAST_RADIUS = 1.4 * 1.75; // outer radius of the X target circle on the battlefield
    const SHELL_OBSTACLE_HEIGHT = 8; // meters. Higher arcs pass over a footprint.
    const SHELL_OBSTACLE_HITS = 3; // a third blast removes the obstacle
    const SHELL_EXPLOSION_SECONDS = 0.8;
    const SHELL_STORAGE_COUNT = 8;
    const SHELL_CARRIED_LENGTH = 62; // carried and falling shell, in pixels
    const LOADER_SLOT_COUNT = 3;
    const LOADER_LOAD_SECONDS = 2;
    const LOADER_RECOVER_SECONDS = 3;
    const SHELL_CARRY_RATIO = 0.5; // a carried shell slows the room hand to half speed
    const SHELL_RESTOCK_SECONDS = 60;
    const SHELL_FALL_GRAVITY = 1600; // px/s squared; a dropped shell leaves the bottom quickly
    const FIRE_KEY_COLS = 12;
    // Three short rows across the zoom window. CLR and DONE are wider.
    // √( and the other calls insert the opening parenthesis.
    const FIRE_KEYS = [
      { label: "7", insert: "7" },
      { label: "8", insert: "8" },
      { label: "9", insert: "9" },
      { label: "+", insert: "+" },
      { label: "-", insert: "-" },
      { label: "⌫", backspace: true },
      { label: "4", insert: "4" },
      { label: "5", insert: "5" },
      { label: "6", insert: "6" },
      { label: "*", insert: "*" },
      { label: "/", insert: "/" },
      { label: "^", insert: "^" },
      { label: "1", insert: "1" },
      { label: "2", insert: "2" },
      { label: "3", insert: "3" },
      { label: "(", insert: "(" },
      { label: ")", insert: ")" },
      { label: "x²", insert: "^2" },
      { label: "0", insert: "0" },
      { label: ".", insert: "." },
      { label: "x", insert: "x" },
      { label: "π", insert: "π" },
      { label: "e", insert: "e" },
      { label: "√", insert: "√(" },
      { label: "sin", insert: "sin(" },
      { label: "cos", insert: "cos(" },
      { label: "tan", insert: "tan(" },
      { label: "log", insert: "log(" },
      { label: "ln", insert: "ln(" },
      { label: "abs", insert: "abs(" },
      { label: "◀", move: -1 },
      { label: "▶", move: 1 },
      { label: "CLR", clear: true, span: 2 },
      { label: "DONE", done: true, span: 2 }
    ];
    // A call, including its opening parenthesis, is one caret step.
    const FIRE_CARET_ATOMS = ["sqrt(", "sin(", "cos(", "tan(", "log(", "abs(", "ln(", "√("];
    const FIRE_FUNCTIONS = { sin: true, cos: true, tan: true, sqrt: true, log: true, ln: true, abs: true };
    const STATE_PUBLISH_SECONDS = 1 / 30; // stream the viewer about 30 times a second
    // Gray and dark metal, like the rest of the console. Sizes below are fractions of the plate.
    const COLOR_JOYSTICK_PLATE = "#3a3a42";
    const COLOR_JOYSTICK_EDGE_LIGHT = "#6c6c78"; // top-left bevel
    const COLOR_JOYSTICK_EDGE_DARK = "#17171c"; // bottom-right bevel and the recessed well
    const COLOR_JOYSTICK_BOLT = "#8b8b96";
    const COLOR_JOYSTICK_WELL = "#141418";
    const COLOR_JOYSTICK_BOOT = "#32323a"; // rubber ring around the stick
    const COLOR_JOYSTICK_TICK = "rgba(176, 176, 186, 0.55)";
    const COLOR_JOYSTICK_STICK = "#8a8a96";
    const COLOR_JOYSTICK_STICK_GROOVE = "#4e4e58";
    const COLOR_JOYSTICK_KNOB = "#7a3034"; // metal under the red top
    const COLOR_JOYSTICK_KNOB_CAP = "#d24545";
    const COLOR_JOYSTICK_LABEL = "#24242c";
    const COLOR_JOYSTICK_LABEL_TEXT = "#b7c4b0";
    const COLOR_JOYSTICK_LED_OFF = "#243028";
    const COLOR_JOYSTICK_LED_ON = "#3ddc6a"; // lit only while the hand is gripping

    const canvas = document.getElementById("room");
    const ctx = canvas.getContext("2d");

    // Which keys are held down right now. Both players can hold keys at once.
    const keys = {};

    // Hands start at 0. The first resize places them in the middle of each room.
    const player1 = { x: 0, y: 0, placed: false, messages: [], panelOpen: false, panelKind: "", gripping: false, holdingStart: false, refueling: false, tiltX: 0, tiltY: 0, condition: "Intact", activity: "Idle", equation: FIRE_DEFAULT_EQUATION, equationParsedFor: null, equationTree: null, equationError: "", equationErrorAt: -1, caret: FIRE_DEFAULT_EQUATION.length, canFire: true, fireOpen: false, fireIndex: 0, targetAngle: 0, actualAngle: 0, turretBusy: false, turretLogLine: null, dialDrag: false, dialHover: "", shells: SHELL_STORAGE_COUNT, storageSlots: [true, true, true, true, true, true, true, true], carryingShell: false, storageClosedAt: null, hatch: 0, loaderSlots: [null, null, null], loaderLocked: false, loaderCover: 0, loaderLever: 0, loaderRecoverUntil: 0, statusNotice: "" };
    const player2 = { x: 0, y: 0, placed: false, messages: [], panelOpen: false, panelKind: "", gripping: false, holdingStart: false, refueling: false, tiltX: 0, tiltY: 0, condition: "Intact", activity: "Idle", equation: FIRE_DEFAULT_EQUATION, equationParsedFor: null, equationTree: null, equationError: "", equationErrorAt: -1, caret: FIRE_DEFAULT_EQUATION.length, canFire: true, fireOpen: false, fireIndex: 0, targetAngle: 0, actualAngle: 0, turretBusy: false, turretLogLine: null, dialDrag: false, dialHover: "", shells: SHELL_STORAGE_COUNT, storageSlots: [true, true, true, true, true, true, true, true], carryingShell: false, storageClosedAt: null, hatch: 0, loaderSlots: [null, null, null], loaderLocked: false, loaderCover: 0, loaderLever: 0, loaderRecoverUntil: 0, statusNotice: "" };
    const fallingShells = [];
    const liveShells = [];

    // The wall sits in the middle. Each player owns one side of it.
    function getRooms() {
      const wallX = (canvas.width - WALL_WIDTH) / 2;
      return {
        wallX: wallX,
        left: { left: 0, right: wallX },
        right: { left: wallX + WALL_WIDTH, right: canvas.width }
      };
    }

    // Keep the palm square inside one room, including the screen edges.
    function clampHand(hand, room) {
      let minX = room.left + HAND_HITBOX_HALF;
      let maxX = room.right - HAND_HITBOX_HALF;
      let minY = HAND_HITBOX_HALF;
      let maxY = canvas.height - HAND_HITBOX_HALF;

      // A tiny window can be smaller than the hand. Sit in the middle then.
      if (minX > maxX) {
        hand.x = (room.left + room.right) / 2;
      } else {
        if (hand.x < minX) hand.x = minX;
        if (hand.x > maxX) hand.x = maxX;
      }
      if (minY > maxY) {
        hand.y = canvas.height / 2;
      } else {
        if (hand.y < minY) hand.y = minY;
        if (hand.y > maxY) hand.y = maxY;
      }
    }

    function centerHand(hand, room) {
      hand.x = (room.left + room.right) / 2;
      hand.y = canvas.height / 2;
      hand.placed = true;
      clampHand(hand, room);
    }

    // Match the canvas to the browser window, then keep the hands inside.
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const rooms = getRooms();
      if (!player1.placed) {
        centerHand(player1, rooms.left);
        centerHand(player2, rooms.right);
      } else {
        clampHand(player1, rooms.left);
        clampHand(player2, rooms.right);
      }
    }

    // Letters ignore Shift. Arrow names stay as "ArrowUp" and so on.
    function keyName(event) {
      if (event.key === INTERACT_KEY_P2 || event.key.indexOf("Arrow") === 0) return event.key;
      return event.key.toLowerCase();
    }

    window.addEventListener("keydown", function (event) {
      // This is not a movement key. Leave before we record it as a held key.
      if (event.shiftKey && event.code === SECRET_VIEW_KEY) {
        if (!event.repeat) window.open("battlefield.html", "_blank");
        return;
      }
      // Arrow keys scroll the page. Enter would activate a focused control.
      if (event.key.indexOf("Arrow") === 0 || event.key === INTERACT_KEY_P2) event.preventDefault();
      const name = keyName(event);
      const alreadyDown = keys[name] === true;
      keys[name] = true;
      // Key repeat would open and close a station over and over.
      if (alreadyDown) return;
      // Holding the start button uses the same keys, but it is not a station press.
      if (name === INTERACT_KEY_P1) tryInteract(player1, getRooms().left);
      if (name === INTERACT_KEY_P2) tryInteract(player2, getRooms().right);
    });

    window.addEventListener("keyup", function (event) {
      const name = keyName(event);
      keys[name] = false;
      if (name === INTERACT_KEY_P1) {
        player1.dialDrag = false;
        player1.idleGrab = false;
      }
      if (name === INTERACT_KEY_P2) {
        player2.dialDrag = false;
        player2.idleGrab = false;
      }
    });

    // Turn held keys into a direction. Diagonal moves stay at the same speed.
    function direction(up, down, left, right) {
      let dx = 0;
      let dy = 0;
      if (keys[left]) dx -= 1;
      if (keys[right]) dx += 1;
      if (keys[up]) dy -= 1;
      if (keys[down]) dy += 1;
      const length = Math.hypot(dx, dy);
      if (length === 0) return { x: 0, y: 0 };
      return { x: dx / length, y: dy / length };
    }

    function handMoveSpeed(hand) {
      if (hand.carryingShell) return HAND_SPEED * SHELL_CARRY_RATIO;
      return HAND_SPEED;
    }

    function moveHand(hand, dir, dt, room) {
      const speed = handMoveSpeed(hand);
      hand.x += dir.x * speed * dt;
      hand.y += dir.y * speed * dt;
      // Stations don't block the hand; only the middle wall does.
      clampHand(hand, room);
    }

    // Screen up is negative. Battlefield up is positive, for both players.
    function battlefieldStick(player) {
      const screen = player === player1
        ? direction("w", "s", "a", "d")
        : direction("ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight");
      return { x: screen.x, y: -screen.y };
    }

    function clampNumber(value, min, max) {
      if (value < min) return min;
      if (value > max) return max;
      return value;
    }

    // Move the tilt toward a point at a steady speed. Magnitude stays inside the unit circle.
    function moveTiltToward(player, desiredX, desiredY, speed, dt) {
      const dx = desiredX - player.tiltX;
      const dy = desiredY - player.tiltY;
      const dist = Math.hypot(dx, dy);
      const step = speed * dt;
      if (dist <= step) {
        player.tiltX = desiredX;
        player.tiltY = desiredY;
      } else if (dist > 0) {
        player.tiltX += (dx / dist) * step;
        player.tiltY += (dy / dist) * step;
      }
      const mag = Math.hypot(player.tiltX, player.tiltY);
      if (mag > 1) {
        player.tiltX /= mag;
        player.tiltY /= mag;
      }
    }

    // Held keys lean the knob out. No keys: it springs back to the center.
    function updateStick(player, dt) {
      if (!player.gripping) return;
      const desired = battlefieldStick(player);
      const returning = desired.x === 0 && desired.y === 0;
      const speed = returning ? 1 / STICK_RETURN_SECONDS : 1 / STICK_FULL_SECONDS;
      moveTiltToward(player, desired.x, desired.y, speed, dt);
    }

    // Slide the velocity vector toward the target. Slowing uses the faster rate.
    function approachVelocity(vx, vy, targetX, targetY, dt) {
      const dx = targetX - vx;
      const dy = targetY - vy;
      const dist = Math.hypot(dx, dy);
      if (dist === 0) return { x: vx, y: vy };
      const currentSpeed = Math.hypot(vx, vy);
      const targetSpeed = Math.hypot(targetX, targetY);
      let slowing = targetSpeed < currentSpeed;
      if (vx * dx + vy * dy < 0) slowing = true;
      const rate = slowing ? DECELERATION : ACCELERATION;
      const step = rate * dt;
      if (dist <= step) return { x: targetX, y: targetY };
      return { x: vx + dx * (step / dist), y: vy + dy * (step / dist) };
    }

    // Two machines are squares of side PLAYER_SIZE. Overlap blocks; edges count as a touch.
    function playerSquaresOverlap(x, y, other) {
      return Math.abs(x - other.x) < PLAYER_SIZE && Math.abs(y - other.y) < PLAYER_SIZE;
    }

    function playersTouch(a, b) {
      return Math.abs(a.x - b.x) <= PLAYER_SIZE + CONTACT_EPSILON
        && Math.abs(a.y - b.y) <= PLAYER_SIZE + CONTACT_EPSILON;
    }

    // True when this point is clear of obstacles and the other machine.
    function positionClear(x, y, index) {
      const other = battlefield.players[1 - index];
      if (collidesWithObstacle(x, y, PLAYER_SIZE / 2)) return false;
      if (playerSquaresOverlap(x, y, other)) return false;
      return true;
    }

    // Walk toward the target on one axis. A block slides up to the surface and stops that axis.
    function slideTo(unit, index, x, y) {
      if (positionClear(x, y, index)) {
        const moved = x !== unit.x || y !== unit.y;
        unit.x = x;
        unit.y = y;
        return moved;
      }
      let lo = 0;
      let hi = 1;
      const x0 = unit.x;
      const y0 = unit.y;
      for (let i = 0; i < 14; i++) {
        const t = (lo + hi) / 2;
        if (positionClear(x0 + (x - x0) * t, y0 + (y - y0) * t, index)) lo = t;
        else hi = t;
      }
      unit.x = x0 + (x - x0) * lo;
      unit.y = y0 + (y - y0) * lo;
      return lo > 0;
    }

    // Move on x, then on y. A blocked axis loses its velocity so the other axis can still slide.
    // Obstacles and the other machine both stop that axis. The field edge does not count as a collision.
    function stepMachine(unit, index, dt) {
      const radius = PLAYER_SIZE / 2;
      let moved = false;
      const rawX = unit.x + unit.vx * dt;
      const tryX = clampNumber(rawX, -FIELD_X_MAX + radius, FIELD_X_MAX - radius);
      if (slideTo(unit, index, tryX, unit.y)) moved = true;
      if (unit.x !== tryX || tryX !== rawX) unit.vx = 0;
      const rawY = unit.y + unit.vy * dt;
      const tryY = clampNumber(rawY, -FIELD_Y_MAX + radius, FIELD_Y_MAX - radius);
      if (slideTo(unit, index, unit.x, tryY)) moved = true;
      if (unit.y !== tryY || tryY !== rawY) unit.vy = 0;
      return moved;
    }

    function clampFuel(fuel) {
      if (fuel < 0) return 0;
      if (fuel > MAX_FUEL) return MAX_FUEL;
      return fuel;
    }

    // One line whose text changes while the tank is filling. Removed when refueling stops.
    function setRefuelLine(player, active, percent) {
      const index = warningIndex(player, "refuel");
      if (!active) {
        if (index !== -1) player.messages.splice(index, 1);
        return;
      }
      const text = "> Refuel: In progress... " + percent + "%";
      if (index === -1) player.messages.push({ text: text, color: COLOR_MONITOR_TEXT, kind: "refuel" });
      else player.messages[index].text = text;
    }

    // The stick sets a target speed. The machine eases toward it, and coasts after the hand lets go.
    // An empty tank cannot speed up. Refueling locks the machine until the player cancels or the tank is full.
    // Nothing moves until H.O.W.L.E.R has started.
    function updateMachine(player, index, dt) {
      updateStick(player, dt);
      const unit = battlefield.players[index];
      const x0 = unit.x;
      const y0 = unit.y;
      let moved = false;
      if (machineStarted) {
        if (player.refueling) {
          unit.vx = 0;
          unit.vy = 0;
        } else {
          let targetX = 0;
          let targetY = 0;
          if (player.gripping && unit.fuel > 0) {
            targetX = player.tiltX * MAX_MOVE_SPEED;
            targetY = player.tiltY * MAX_MOVE_SPEED;
          }
          const next = approachVelocity(unit.vx, unit.vy, targetX, targetY, dt);
          unit.vx = next.x;
          unit.vy = next.y;
          moved = stepMachine(unit, index, dt);
        }
      }
      if (player.refueling && machineStarted) {
        unit.fuel = clampFuel(unit.fuel + dt * MAX_FUEL / REFUEL_SECONDS_FULL);
        if (unit.fuel >= MAX_FUEL) {
          unit.fuel = MAX_FUEL;
          player.refueling = false;
          setRefuelLine(player, false);
          addStatusMessage(player, "> Refuel: Complete. Tank 100%.");
        } else {
          setRefuelLine(player, true, Math.round(unit.fuel));
        }
        battlefieldDirty = true;
      } else {
        const distance = Math.hypot(unit.x - x0, unit.y - y0);
        if (distance > 0 && unit.fuel > 0) {
          unit.fuel = clampFuel(unit.fuel - distance * FUEL_DRAIN_PER_METER);
          battlefieldDirty = true;
        }
      }
      updateTurret(player, dt);
      const speed = Math.hypot(unit.vx, unit.vy);
      const turning = player.turretBusy;
      if (player.refueling) setActivity(player, "Refueling");
      else if (speed > MOVE_STATUS_SPEED && turning) setActivity(player, "Moving + Turning");
      else if (turning) setActivity(player, "Turning");
      else if (speed > MOVE_STATUS_SPEED) setActivity(player, "Moving");
      else if (player.activity === "Moving" || player.activity === "Refueling" || player.activity === "Turning" || player.activity === "Moving + Turning") setActivity(player, "Idle");
      publishFireState(player, unit);
      return moved;
    }

    // A gripped stick uses its tilt. The idle station still points up.
    function joystickTilt(player) {
      if (player.gripping) return { x: player.tiltX, y: player.tiltY };
      return { x: 0, y: JOYSTICK_REST_LEAN };
    }

    function joystickKnob(room, player) {
      const rect = getJoystickRect(room);
      const reach = rect.width * JOYSTICK_STICK_RATIO;
      const tilt = joystickTilt(player);
      return {
        x: rect.x + rect.width / 2 + tilt.x * reach,
        y: rect.y + rect.height / 2 - tilt.y * reach
      };
    }

    // The gripped hand sits on the knob, including while the knob leans.
    function placeHandOnKnob(player, room) {
      const knob = joystickKnob(room, player);
      player.x = knob.x;
      player.y = knob.y;
      clampHand(player, room);
    }

    function releaseLockedStations() {
      if (machineStarted) return;
      player1.panelOpen = false;
      player1.panelKind = "";
      player1.gripping = false;
      player1.refueling = false;
      player1.fireOpen = false;
      player1.dialDrag = false;
      setRefuelLine(player1, false);
      player2.panelOpen = false;
      player2.panelKind = "";
      player2.gripping = false;
      player2.refueling = false;
      player2.fireOpen = false;
      player2.dialDrag = false;
      setRefuelLine(player2, false);
    }

    function update(dt) {
      releaseLockedStations();
      const rooms = getRooms();
      // An open window lets that hand roam. A gripped joystick pins it to the knob.
      if (player1.panelOpen) updatePointingHand(player1, rooms.left, direction("w", "s", "a", "d"), dt);
      else if (!player1.gripping) moveHand(player1, direction("w", "s", "a", "d"), dt, rooms.left);
      if (player2.panelOpen) updatePointingHand(player2, rooms.right, direction("ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"), dt);
      else if (!player2.gripping) moveHand(player2, direction("ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"), dt, rooms.right);

      const moved1 = updateMachine(player1, 0, dt);
      const moved2 = updateMachine(player2, 1, dt);
      if (player1.gripping) placeHandOnKnob(player1, rooms.left);
      if (player2.gripping) placeHandOnKnob(player2, rooms.right);
      updateShellStorage(player1, dt);
      updateShellStorage(player2, dt);
      updateLoader(player1, dt);
      updateLoader(player2, dt);
      updateLiveShells(dt);
      syncHealthState(player1);
      syncHealthState(player2);
      updateFallingShells(dt);
      if (moved1 || moved2) battlefieldDirty = true;
      // The last small step must be saved even if the throttle window has not ended.
      if ((player1WasMoving && !moved1) || (player2WasMoving && !moved2)) flushBattlefield(frameTime, true);
      player1WasMoving = moved1;
      player2WasMoving = moved2;
    }

    // Where one digit sits for this pose. "hold" curls every digit. "point" curls all but the index.
    function placedFinger(index, pose) {
      const spot = FINGER_SPOTS[index];
      if (pose === "hold" || (pose === "point" && index !== INDEX_FINGER)) {
        return {
          x: spot.x * HOLD_FINGER_PULL,
          y: spot.y * HOLD_FINGER_PULL,
          r: spot.r * HOLD_FINGER_RADIUS_RATIO
        };
      }
      return { x: spot.x, y: spot.y, r: spot.r };
    }

    // Index finger while pointing: same radius as the open finger, stretched straight up.
    // The root stays inside the palm. The tip clears the other fingers.
    function pointingIndex() {
      const spot = FINGER_SPOTS[INDEX_FINGER];
      const r = spot.r;
      const reach = Math.sqrt(PALM_RADIUS * PALM_RADIUS - spot.x * spot.x);
      const openTop = PALM_RADIUS * -1.12 - FINGER_RADIUS;
      return {
        x: spot.x,
        r: r,
        top: openTop - r,
        bottom: -reach + r
      };
    }

    function drawPointingIndex(palmX, palmY) {
      const finger = pointingIndex();
      const x = palmX + finger.x;
      const r = finger.r;
      const yTop = palmY + finger.top + r;
      const yBot = palmY + finger.bottom - r;
      ctx.beginPath();
      ctx.arc(x, yTop, r, Math.PI, 0, false);
      ctx.arc(x, yBot, r, 0, Math.PI, false);
      ctx.closePath();
      ctx.fill();
    }

    // Fingers first, then the palm, so a curled digit only peeks past the edge.
    function drawHandShape(palmX, palmY, color, pose) {
      ctx.fillStyle = color;
      for (let i = 0; i < FINGER_SPOTS.length; i++) {
        if (pose === "point" && i === INDEX_FINGER) {
          drawPointingIndex(palmX, palmY);
          continue;
        }
        const finger = placedFinger(i, pose);
        ctx.beginPath();
        ctx.arc(palmX + finger.x, palmY + finger.y, finger.r, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.beginPath();
      ctx.arc(palmX, palmY, PALM_RADIUS, 0, Math.PI * 2);
      ctx.fill();
    }

    function interactKeyHeld(hand) {
      const key = hand === player1 ? INTERACT_KEY_P1 : INTERACT_KEY_P2;
      return keys[key] === true;
    }

    // Open while the hand is free. Curled for the whole time the interact key is held.
    function drawHand(hand, color) {
      const pose = (hand.gripping || hand.holdingStart || hand.carryingShell || interactKeyHeld(hand)) ? "hold" : "open";
      if (hand.carryingShell) drawShellGlyph(hand.x, hand.y, SHELL_CARRIED_LENGTH, 0);
      drawHandShape(hand.x, hand.y, color, pose);
    }

    // 0 at rest, 1 at the bottom of the press, then back to 0.
    function pointPressAmount(hand) {
      if (typeof hand.pointPressFrom !== "number" || hand.pointPressFrom < 0) return 0;
      const age = (frameTime - hand.pointPressFrom) / 1000;
      const down = POINT_PRESS_DOWN_SECONDS;
      const up = POINT_PRESS_UP_SECONDS;
      if (age < 0 || age >= down + up) return 0;
      const linear = age < down ? age / down : 1 - (age - down) / up;
      return linear * linear * (3 - 2 * linear);
    }

    // From the palm center to the top of the raised index finger.
    function pointingTipOffset() {
      const finger = pointingIndex();
      return { x: finger.x, y: finger.top };
    }

    // How far the pointing hand sticks out from its fingertip.
    function pointingExtents() {
      const tip = pointingTipOffset();
      let left = -tip.x - PALM_RADIUS;
      let right = -tip.x + PALM_RADIUS;
      let up = -tip.y - PALM_RADIUS;
      let down = -tip.y + PALM_RADIUS;
      const index = pointingIndex();
      const indexLeft = index.x - tip.x - index.r;
      const indexRight = index.x - tip.x + index.r;
      if (indexLeft < left) left = indexLeft;
      if (indexRight > right) right = indexRight;
      if (index.top - tip.y < up) up = index.top - tip.y;
      if (index.bottom - tip.y > down) down = index.bottom - tip.y;
      for (let i = 0; i < FINGER_SPOTS.length; i++) {
        if (i === INDEX_FINGER) continue;
        const finger = placedFinger(i, "point");
        const x = finger.x - tip.x;
        const y = finger.y - tip.y;
        if (x - finger.r < left) left = x - finger.r;
        if (x + finger.r > right) right = x + finger.r;
        if (y - finger.r < up) up = y - finger.r;
        if (y + finger.r > down) down = y + finger.r;
      }
      return { left: left, right: right, up: up, down: down };
    }

    // Keep the whole pointer inside this player's half. The hotspot is the fingertip.
    function clampPointingHand(player, room) {
      const box = pointingExtents();
      let minX = room.left - box.left;
      let maxX = room.right - box.right;
      let minY = -box.up;
      let maxY = canvas.height - box.down;
      if (minX > maxX) player.pointX = (room.left + room.right) / 2;
      else player.pointX = clampNumber(player.pointX, minX, maxX);
      if (minY > maxY) player.pointY = canvas.height / 2;
      else player.pointY = clampNumber(player.pointY, minY, maxY);
    }

    // Put the palm back where it was under the pointing fingertip.
    function parkHandUnderTip(player, room) {
      const tip = pointingTipOffset();
      player.x = player.pointX - tip.x;
      player.y = player.pointY - tip.y;
      clampHand(player, room);
    }

    // The fingertip moves with the direction keys, at the same speed as the room hand.
    function updatePointingHand(player, room, dir, dt) {
      if (!player.panelOpen) {
        if (player.pointReady) parkHandUnderTip(player, room);
        player.pointReady = false;
        player.pointPressFrom = -1;
        return;
      }
      if (!player.pointReady) {
        // The palm stays put. Only the index finger lifts, so the hand does not jump.
        const tip = pointingTipOffset();
        player.pointX = player.x + tip.x;
        player.pointY = player.y + tip.y;
        player.pointReady = true;
      }
      const pointSpeed = handMoveSpeed(player);
      player.pointX += dir.x * pointSpeed * dt;
      player.pointY += dir.y * pointSpeed * dt;
      clampPointingHand(player, room);
      if (player.panelKind === "turret") {
        const hit = dialUnderPoint(player, room);
        player.dialHover = hit;
        const dial = zoomContent(room, "turret").dial;
        const parts = dial ? turretDialParts(dial, true) : null;
        const overFace = parts && Math.hypot(player.pointX - parts.cx, player.pointY - parts.cy) <= parts.r + 6;
        player.dialAim = overFace ? angleFromPointer(parts.cx, parts.cy, player.pointX, player.pointY) : null;
        if (player.dialDrag) {
          const key = player === player1 ? INTERACT_KEY_P1 : INTERACT_KEY_P2;
          if (keys[key]) applyDialDrag(player, room);
          else player.dialDrag = false;
        }
      } else if (player.panelKind === "fire") {
        player.dialHover = "";
        player.dialAim = null;
        player.fireIndex = keyUnderPoint(player, room);
      } else {
        player.dialHover = "";
        player.dialAim = null;
      }
    }

    // Pointing pose while a zoom window is open. A tap shrinks it around the fingertip.
    function drawPointingHand(hand, color) {
      if (!hand.pointReady) return;
      const press = pointPressAmount(hand);
      const scale = 1 - (1 - POINT_PRESS_SCALE) * press;
      const tipX = hand.pointX;
      const tipY = hand.pointY + POINT_PRESS_SHIFT * press;
      const tip = pointingTipOffset();
      ctx.save();
      ctx.translate(tipX, tipY);
      ctx.scale(scale, scale);
      ctx.translate(-tipX, -tipY);
      drawHandShape(tipX - tip.x, tipY - tip.y, color, "point");
      ctx.restore();
    }

    function drawLabel(text, room) {
      ctx.fillStyle = COLOR_LABEL;
      ctx.font = "bold 20px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      const middle = (room.left + room.right) / 2;
      ctx.fillText(text, middle, 16);
    }

    function draw() {
      const rooms = getRooms();

      ctx.fillStyle = COLOR_ROOM_1;
      ctx.fillRect(rooms.left.left, 0, rooms.left.right - rooms.left.left, canvas.height);

      ctx.fillStyle = COLOR_ROOM_2;
      ctx.fillRect(rooms.right.left, 0, rooms.right.right - rooms.right.left, canvas.height);

      ctx.fillStyle = COLOR_WALL;
      ctx.fillRect(rooms.wallX, 0, WALL_WIDTH, canvas.height);

      drawLabel("Player 1 (WASD, E to interact)", rooms.left);
      drawLabel("Player 2 (Arrow keys, Enter to interact)", rooms.right);

      drawMonitor(rooms.left, player1);
      drawMonitor(rooms.right, player2);
      drawRadar(rooms.left, player1);
      drawRadar(rooms.right, player2);
      drawJoystick(rooms.left, player1);
      drawJoystick(rooms.right, player2);
      drawFuelGauge(rooms.left, player1);
      drawFuelGauge(rooms.right, player2);
      drawRefuelStation(rooms.left, player1);
      drawRefuelStation(rooms.right, player2);
      drawFireStation(rooms.left, player1);
      drawFireStation(rooms.right, player2);
      drawShellStorage(rooms.left, player1);
      drawShellStorage(rooms.right, player2);
      drawLoader(rooms.left, player1);
      drawLoader(rooms.right, player2);
      drawStartButton();

      // Room hands sit on the stations. An open window gets its hand afterwards, on top.
      if (!player1.panelOpen) drawHand(player1, COLOR_P1);
      if (!player2.panelOpen) drawHand(player2, COLOR_P2);
      drawFallingShells();

      // Zoom panels sit above the room, one per player.
      drawZoomPanel(rooms.left, player1);
      drawZoomPanel(rooms.right, player2);

      if (player1.panelOpen) drawPointingHand(player1, COLOR_P1);
      if (player2.panelOpen) drawPointingHand(player2, COLOR_P2);
    }

    let lastTime = 0;
    let frameTime = 0;
    function frame(time) {
      frameTime = time;
      // time is in milliseconds. dt is seconds since the previous frame.
      let dt = lastTime === 0 ? 0 : (time - lastTime) / 1000;
      lastTime = time;
      // After a tab switch the gap can be huge. Cap it so the hands don't jump.
      if (dt > 0.05) dt = 0.05;

      update(dt);
      updateStartHold(dt, time);
      updateCountdown(time);
      updatePingWarnings();
      updateFuelWarnings();
      updateCollisionWarnings();
      flushBattlefield(time, false);
      draw();
      requestAnimationFrame(frame);
    }

    // Add a line to one player's status monitor. Later code can call this too.
    // text can be a string, or { text, color } when the line is not green.
    function addStatusMessage(player, text) {
      player.messages.push(text);
    }

    // Set the health condition. Unknown names are ignored.
    function setCondition(player, condition) {
      for (let i = 0; i < CONDITION_NAMES.length; i++) {
        if (CONDITION_NAMES[i] === condition) {
          player.condition = condition;
          return;
        }
      }
    }

    // Set what the machine is doing. Unknown names are ignored.
    function setActivity(player, activity) {
      for (let i = 0; i < ACTIVITY_NAMES.length; i++) {
        if (ACTIVITY_NAMES[i] === activity) {
          player.activity = activity;
          return;
        }
      }
    }

    function conditionColor(condition) {
      if (CONDITION_COLORS[condition]) return CONDITION_COLORS[condition];
      return CONDITION_COLORS.Intact;
    }

    function activityColor(activity) {
      if (ACTIVITY_COLORS[activity]) return ACTIVITY_COLORS[activity];
      return ACTIVITY_COLORS.Idle;
    }

    // Health is stored from 0 to MAX_HEALTH. The monitor shows a named band.
    function healthPercent(player) {
      const index = player === player1 ? 0 : 1;
      let health = battlefield.players[index].health;
      if (health < 0) health = 0;
      if (health > MAX_HEALTH) health = MAX_HEALTH;
      return Math.round((health / MAX_HEALTH) * 100);
    }

    // Five bands. The number on the line is the band, and 0 loses the round.
    function healthStatusOf(percent) {
      if (percent <= 0) return { name: "Broken", percent: 0, color: "#ff4040" };
      if (percent <= 25) return { name: "Heavily Damaged", percent: 25, color: "#ff4040" };
      if (percent <= 50) return { name: "Damaged", percent: 50, color: "#ff8a3d" };
      if (percent <= 75) return { name: "Lightly Damaged", percent: 75, color: "#ffb020" };
      return { name: "Stable", percent: 100, color: "#39ff6a" };
    }

    // Later damage sets health to 0. This only marks the loss. There is no replay.
    function onPlayerLost(player) {
      player.lost = true;
    }

    function syncHealthState(player) {
      if (player.lost) return;
      if (healthPercent(player) > 0) return;
      onPlayerLost(player);
    }

    function loaderIsLoading(player) {
      for (let i = 0; i < player.loaderSlots.length; i++) {
        const slot = player.loaderSlots[i];
        if (slot && !slot.ready) return true;
      }
      return false;
    }

    // One activity for the line under health. Renewing shells lives here.
    function machineStateOf(player) {
      if (playerHasLiveShell(player)) return { text: "Shooting", color: "#ff8a3d" };
      if (player.shootingUntil && frameTime < player.shootingUntil) {
        return { text: "Shooting", color: "#ff8a3d" };
      }
      if (loaderRecovering(player)) return { text: "Recovering", color: "#ffb020" };
      if (loaderIsLoading(player)) return { text: "Loading", color: "#ffe14a" };
      if (machineStarted && player.storageClosedAt != null) {
        return { text: "Reloading storage (Renewing shells in 1 minute)", color: COLOR_REFUEL_LED };
      }
      if (player.refueling) return { text: "Refueling", color: ACTIVITY_COLORS.Refueling };
      if (player.turretBusy) return { text: "Turning turret", color: ACTIVITY_COLORS.Turning };
      const index = player === player1 ? 0 : 1;
      const unit = battlefield.players[index];
      if (Math.hypot(unit.vx, unit.vy) > MOVE_STATUS_SPEED) return { text: "Moving", color: ACTIVITY_COLORS.Moving };
      return { text: "Idle", color: ACTIVITY_COLORS.Idle };
    }

    // Monitor and radar in one horizontal band. Three equal gaps inside that band.
    function stationRow(leftEdge, rightEdge, radarSize, monitorHeight, gap) {
      const width = Math.max(1, rightEdge - leftEdge);
      let radar = radarSize;
      let rowGap = gap;
      let monitorWidth = width - radar - rowGap * 3;

      // A tiny band cannot fit a full-height square. Shrink the radar and keep the gaps equal.
      const minMonitor = Math.max(36, width * 0.38);
      if (monitorWidth < minMonitor) {
        monitorWidth = Math.min(minMonitor, width * 0.5);
        radar = Math.max(16, (width - monitorWidth) * 0.42);
        rowGap = (width - monitorWidth - radar) / 3;
        if (rowGap < 2) {
          rowGap = 2;
          const inner = Math.max(8, width - rowGap * 3);
          radar = Math.max(12, inner * 0.34);
          monitorWidth = inner - radar;
          rowGap = (width - monitorWidth - radar) / 3;
        }
      }

      const monitor = {
        x: leftEdge + rowGap,
        y: MONITOR_TOP,
        width: Math.max(1, monitorWidth),
        height: monitorHeight
      };
      return {
        monitor: monitor,
        radar: {
          x: monitor.x + monitor.width + rowGap,
          y: monitor.y,
          width: radar,
          height: radar
        }
      };
    }

    // Joystick group (stick plus fuel column) and fire control use the monitor row's gaps:
    // the same inset from each side, the same gap between the two, and that same gap again
    // under the monitor row. Both plates share one height so the row stays even.
    function lowerControls(room, row) {
      const roomWidth = room.right - room.left;
      const rowBottom = row.monitor.y + Math.max(row.monitor.height, row.radar.height);
      const rowGap = Math.max(4, row.radar.x - (row.monitor.x + row.monitor.width));
      const top = rowBottom + rowGap;
      const inner = Math.max(90, roomWidth - rowGap * 3);
      const maxH = Math.max(72, canvas.height - top - rowGap);
      const fuelW = Math.max(46, Math.min(68, inner * 0.105));
      let joy = Math.min(maxH, (inner - fuelW) * 0.46);
      if (joy < 72) joy = Math.min(maxH, 72);
      let fireW = inner - joy - fuelW;
      if (fireW < 120) {
        joy = Math.max(64, Math.min(maxH, inner - fuelW - 120));
        fireW = inner - joy - fuelW;
      }
      const storageY = top + joy + rowGap;
      const groupW = joy + fuelW;
      let bottomH = canvas.height - storageY - rowGap;
      if (bottomH < 72) bottomH = Math.max(48, canvas.height - storageY - 4);
      return {
        joystick: {
          x: room.left + rowGap,
          y: top,
          width: joy,
          height: joy
        },
        fuelWidth: fuelW,
        fire: {
          x: room.left + rowGap + joy + fuelW + rowGap,
          y: top,
          width: fireW,
          height: joy
        },
        // Storage fills the column under the stick and fuel. The loader fills the
        // column under fire control. The gap between them matches the row above.
        storage: {
          x: room.left + rowGap,
          y: storageY,
          width: groupW,
          height: bottomH
        },
        loader: {
          x: room.left + rowGap + groupW + rowGap,
          y: storageY,
          width: fireW,
          height: bottomH
        }
      };
    }

    // The monitor and radar stay on their own row. The lower plates are placed separately.
    function getStationLayout(room) {
      const roomWidth = room.right - room.left;
      let height = canvas.height * MONITOR_HEIGHT_RATIO;
      const maxHeight = canvas.height - MONITOR_TOP - 24;
      if (height > maxHeight) height = maxHeight;
      if (height < 48 && maxHeight >= 48) height = 48;
      if (height < 1) height = 1;

      const radarSize = height;
      const gap = roomWidth * STATION_GAP_RATIO;
      const row = stationRow(room.left, room.right, radarSize, height, gap);
      const lower = lowerControls(room, row);
      return {
        monitor: row.monitor,
        radar: row.radar,
        joystick: lower.joystick,
        fuelWidth: lower.fuelWidth,
        fire: lower.fire,
        storage: lower.storage,
        loader: lower.loader
      };
    }

    function getMonitorRect(room) {
      return getStationLayout(room).monitor;
    }

    function monitorScreen(room) {
      const rect = getMonitorRect(room);
      const bezel = Math.min(MONITOR_BEZEL, rect.width / 4, rect.height / 4);
      return {
        x: rect.x + bezel,
        y: rect.y + bezel,
        width: Math.max(1, rect.width - bezel * 2),
        height: Math.max(1, rect.height - bezel * 2)
      };
    }

    function getRadarRect(room) {
      return getStationLayout(room).radar;
    }

    function getJoystickRect(room) {
      return getStationLayout(room).joystick;
    }

    // Gauge stacked on the refuel button. Together they match the joystick and sit against it.
    function fuelColumnRect(room) {
      const layout = getStationLayout(room);
      const joy = layout.joystick;
      return {
        x: joy.x + joy.width,
        y: joy.y,
        width: layout.fuelWidth,
        height: joy.height
      };
    }

    function getRefuelRect(room) {
      const column = fuelColumnRect(room);
      let height = column.height * REFUEL_HEIGHT_RATIO;
      if (height < 1) height = 1;
      if (height > column.height - 1) height = column.height - 1;
      return {
        x: column.x,
        y: column.y + column.height - height,
        width: column.width,
        height: height
      };
    }

    function getFuelRect(room) {
      const column = fuelColumnRect(room);
      const button = getRefuelRect(room);
      return {
        x: column.x,
        y: column.y,
        width: column.width,
        height: column.height - button.height
      };
    }

    function getFireRect(room) {
      return getStationLayout(room).fire;
    }

    function getStorageRect(room) {
      return getStationLayout(room).storage;
    }

    function getLoaderRect(room) {
      return getStationLayout(room).loader;
    }

    // Square around the palm. Fingers are outside this box on purpose.
    function handBox(hand) {
      return {
        left: hand.x - HAND_HITBOX_HALF,
        right: hand.x + HAND_HITBOX_HALF,
        top: hand.y - HAND_HITBOX_HALF,
        bottom: hand.y + HAND_HITBOX_HALF
      };
    }

    // Distance from the hand's center to a station rectangle. 0 means the center is inside.
    function distanceFromHandCenter(hand, rect) {
      const nearestX = Math.max(rect.x, Math.min(hand.x, rect.x + rect.width));
      const nearestY = Math.max(rect.y, Math.min(hand.y, rect.y + rect.height));
      return Math.hypot(hand.x - nearestX, hand.y - nearestY);
    }

    // Gap between the hand's box and the monitor. 0 means they touch or overlap.
    function gapBetweenHandAndMonitor(hand, rect) {
      const box = handBox(hand);
      const gapX = Math.max(box.left - (rect.x + rect.width), rect.x - box.right, 0);
      const gapY = Math.max(box.top - (rect.y + rect.height), rect.y - box.bottom, 0);
      return Math.hypot(gapX, gapY);
    }

    // True when this room's hand is near or over its own monitor.
    function handIsNearMonitor(hand, rect) {
      return gapBetweenHandAndMonitor(hand, rect) <= MONITOR_GLOW_DISTANCE;
    }

    function drawMonitor(room, player) {
      const rect = getMonitorRect(room);
      const near = stationNearHand(player, room) === "monitor";
      const bezel = Math.min(MONITOR_BEZEL, rect.width / 4, rect.height / 4);
      drawConsoleFrame(rect, { label: "STATUS", powerOn: machineStarted });

      const screenX = rect.x + bezel;
      const screenY = rect.y + bezel;
      const screenW = rect.width - bezel * 2;
      const screenH = rect.height - bezel * 2;
      ctx.fillStyle = COLOR_MONITOR_SCREEN;
      ctx.fillRect(screenX, screenY, screenW, screenH);

      // Clear exists only on the opened status window, never on this room screen.
      drawMessageList(player, screenX, screenY, screenW, screenH, MONITOR_FONT_SIZE, MONITOR_LINE_HEIGHT, false, 0);
      if (near && machineStarted) drawInteractOutline(rect);
    }

    // Radar sits beside the monitor. Half of the square is RADAR_RANGE units.
    // The frame matches the monitor. Nearness is only the pulsing outline.
    // The screen stays black until H.O.W.L.E.R starts.
    // The small radar shows the sweep and the center player dot. Blips stay hidden here.
    // The hand passes over it; only the middle wall blocks movement.
    function drawRadar(room, player) {
      const rect = getRadarRect(room);
      const bezel = Math.min(MONITOR_BEZEL, rect.width / 4, rect.height / 4);
      const near = stationNearHand(player, room) === "radar";
      drawConsoleFrame(rect, {
        label: "",
        powerOn: machineStarted
      });

      const screenX = rect.x + bezel;
      const screenY = rect.y + bezel;
      const screenW = rect.width - bezel * 2;
      const screenH = rect.height - bezel * 2;
      const ownerIndex = player === player1 ? 0 : 1;
      drawRadarPicture(screenX, screenY, screenW, screenH, ownerIndex, false);
      drawRedPing(rect, ownerIndex);
      if (near && machineStarted) drawInteractOutline(rect);
    }

    // Metal plate. The light edge is the top and left; the dark edge is the bottom and right.
    function drawBeveledRect(rect) {
      const x = rect.x;
      const y = rect.y;
      const w = rect.width;
      const h = rect.height;
      const bevel = Math.max(3, Math.min(w, h) * 0.04);
      ctx.fillStyle = COLOR_JOYSTICK_EDGE_LIGHT;
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = COLOR_JOYSTICK_EDGE_DARK;
      ctx.beginPath();
      ctx.moveTo(x + w, y);
      ctx.lineTo(x + w, y + h);
      ctx.lineTo(x, y + h);
      ctx.lineTo(x + bevel, y + h - bevel);
      ctx.lineTo(x + w - bevel, y + h - bevel);
      ctx.lineTo(x + w - bevel, y + bevel);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = COLOR_JOYSTICK_PLATE;
      ctx.fillRect(x + bevel, y + bevel, w - bevel * 2, h - bevel * 2);
    }

    function drawBeveledPlate(rect) {
      drawBeveledRect(rect);
    }

    function drawFrameVents(rect, bezel) {
      const x = rect.x + bezel * 0.2;
      const w = bezel * 0.48;
      const top = rect.y + bezel * 1.8;
      const bottom = rect.y + rect.height - bezel * 1.8;
      if (bottom - top < 10 || w < 2) return;
      ctx.strokeStyle = COLOR_JOYSTICK_EDGE_DARK;
      ctx.lineWidth = 1;
      const count = 4;
      for (let i = 0; i < count; i++) {
        const y = top + (bottom - top) * (i + 0.5) / count;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + w, y);
        ctx.stroke();
      }
    }

    function drawFrameKnob(rect, bezel) {
      const r = Math.max(2, bezel * 0.26);
      const x = rect.x + rect.width - bezel * 0.5;
      const y = rect.y + rect.height * 0.42;
      ctx.fillStyle = COLOR_JOYSTICK_EDGE_DARK;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = COLOR_JOYSTICK_BOLT;
      ctx.beginPath();
      ctx.arc(x, y, r * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // Small name plate in the bottom bezel. Returns its box, or null if it will not fit.
    function drawFramePlate(rect, text, bezel, reserveRight) {
      const h = Math.min(10, bezel - 2);
      if (h < 7) return null;
      const fontSize = Math.max(8, Math.floor(h - 1));
      ctx.font = fontSize + "px sans-serif";
      const w = ctx.measureText(text).width + 10;
      const rightLimit = rect.x + rect.width - reserveRight - 4;
      const leftLimit = rect.x + bezel;
      const x = rect.x + (rect.width - reserveRight - w) / 2;
      if (x < leftLimit || x + w > rightLimit) return null;
      const y = rect.y + rect.height - bezel + (bezel - h) / 2;
      ctx.fillStyle = COLOR_JOYSTICK_LABEL;
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = COLOR_JOYSTICK_EDGE_LIGHT;
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
      ctx.fillStyle = COLOR_JOYSTICK_LABEL_TEXT;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, x + w / 2, y + h / 2);
      return { x: x, y: y, w: w, h: h };
    }

    function drawPowerLed(label, rect, reserveRight, powerOn) {
      const r = Math.max(2, label.h * 0.26);
      const x = label.x + label.w + r + 3;
      const y = label.y + label.h / 2;
      if (x + r > rect.x + rect.width - reserveRight - 2) return;
      ctx.fillStyle = powerOn ? COLOR_JOYSTICK_LED_ON : COLOR_JOYSTICK_LED_OFF;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    // Bezel details only. The screen is drawn later, at the same size as before.
    function drawConsoleFrame(rect, spec) {
      const bezel = Math.min(MONITOR_BEZEL, rect.width / 4, rect.height / 4);
      const skip = spec.skipCorners || [];
      const reserveRight = spec.reserveRight || 0;
      ctx.save();
      drawBeveledRect(rect);
      const boltR = Math.max(2, Math.min(3.5, bezel * 0.28));
      const inset = Math.max(boltR + 1, bezel * 0.48);
      const corners = [
        ["tl", rect.x + inset, rect.y + inset],
        ["tr", rect.x + rect.width - inset, rect.y + inset],
        ["bl", rect.x + inset, rect.y + rect.height - inset],
        ["br", rect.x + rect.width - inset, rect.y + rect.height - inset]
      ];
      for (let i = 0; i < corners.length; i++) {
        if (skip.indexOf(corners[i][0]) !== -1) continue;
        drawBolt(corners[i][1], corners[i][2], boltR);
      }
      drawFrameVents(rect, bezel);
      drawFrameKnob(rect, bezel);
      ctx.restore();
    }

    function drawBolt(x, y, r) {
      ctx.fillStyle = COLOR_JOYSTICK_EDGE_DARK;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = COLOR_JOYSTICK_BOLT;
      ctx.beginPath();
      ctx.arc(x, y, r * 0.7, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = COLOR_JOYSTICK_EDGE_DARK;
      ctx.lineWidth = Math.max(1, r * 0.28);
      ctx.beginPath();
      ctx.moveTo(x - r * 0.38, y);
      ctx.lineTo(x + r * 0.38, y);
      ctx.stroke();
    }

    // Four short arrows outside the well: up, right, down, left.
    function drawDirectionMarks(cx, cy, s) {
      const wellR = s * JOYSTICK_WELL_RATIO / 2;
      const radius = wellR + s * 0.05;
      const dirs = [
        { x: 0, y: -1 },
        { x: 1, y: 0 },
        { x: 0, y: 1 },
        { x: -1, y: 0 }
      ];
      ctx.fillStyle = COLOR_JOYSTICK_TICK;
      ctx.strokeStyle = COLOR_JOYSTICK_TICK;
      ctx.lineWidth = Math.max(1, s * 0.012);
      for (let i = 0; i < dirs.length; i++) {
        const d = dirs[i];
        const baseX = cx + d.x * radius;
        const baseY = cy + d.y * radius;
        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        ctx.lineTo(baseX + d.x * s * 0.03, baseY + d.y * s * 0.03);
        ctx.stroke();
        const tipX = baseX + d.x * s * 0.046;
        const tipY = baseY + d.y * s * 0.046;
        const wing = s * 0.016;
        ctx.beginPath();
        ctx.moveTo(tipX, tipY);
        ctx.lineTo(tipX - d.x * wing - d.y * wing, tipY - d.y * wing + d.x * wing);
        ctx.lineTo(tipX - d.x * wing + d.y * wing, tipY - d.y * wing - d.x * wing);
        ctx.closePath();
        ctx.fill();
      }
    }

    // Dark hole, then the rubber boot the stick comes out of.
    function drawJoystickWell(cx, cy, s) {
      const wellR = s * JOYSTICK_WELL_RATIO / 2;
      ctx.fillStyle = COLOR_JOYSTICK_EDGE_DARK;
      ctx.beginPath();
      ctx.arc(cx, cy, wellR, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#2a2a32";
      ctx.beginPath();
      ctx.arc(cx, cy, wellR * 0.9, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = COLOR_JOYSTICK_WELL;
      ctx.beginPath();
      ctx.arc(cx, cy, wellR * 0.76, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = COLOR_JOYSTICK_BOOT;
      ctx.lineWidth = Math.max(2, s * 0.028);
      ctx.beginPath();
      ctx.arc(cx, cy, wellR * 0.4, 0, Math.PI * 2);
      ctx.stroke();
      ctx.lineWidth = Math.max(1, s * 0.012);
      ctx.beginPath();
      ctx.arc(cx, cy, wellR * 0.52, 0, Math.PI * 2);
      ctx.stroke();
    }

    function drawDrivePlate(rect, gripping) {
      const s = rect.width;
      const w = s * 0.24;
      let h = s * 0.065;
      if (h > s * 0.12) h = s * 0.12;
      const x = rect.x + (s - w) / 2;
      const y = rect.y + s - h - Math.max(4, s * 0.04);
      ctx.fillStyle = COLOR_JOYSTICK_LABEL;
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = COLOR_JOYSTICK_EDGE_LIGHT;
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
      ctx.fillStyle = COLOR_JOYSTICK_LABEL_TEXT;
      ctx.font = Math.max(9, Math.floor(s * 0.042)) + "px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("DRIVE", x + w / 2, y + h / 2);

      const ledR = Math.max(2.5, s * 0.016);
      const ledX = x + w + s * 0.04;
      const ledY = y + h / 2;
      ctx.fillStyle = gripping ? COLOR_JOYSTICK_LED_ON : COLOR_JOYSTICK_LED_OFF;
      ctx.beginPath();
      ctx.arc(ledX, ledY, ledR, 0, Math.PI * 2);
      ctx.fill();
    }

    // Plate, stick, and knob. tiltX is right. tiltY is battlefield up. Each is about -1 to 1.
    function drawStick(cx, cy, reach, knobR, tiltX, tiltY, stickWidth) {
      const knobX = cx + tiltX * reach;
      const knobY = cy - tiltY * reach;
      const dx = knobX - cx;
      const dy = knobY - cy;
      const length = Math.hypot(dx, dy);
      ctx.save();
      ctx.lineCap = "round";
      ctx.strokeStyle = COLOR_JOYSTICK_STICK;
      ctx.lineWidth = stickWidth;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(knobX, knobY);
      ctx.stroke();
      if (length > stickWidth) {
        const ux = dx / length;
        const uy = dy / length;
        const px = -uy;
        const py = ux;
        ctx.strokeStyle = COLOR_JOYSTICK_STICK_GROOVE;
        ctx.lineWidth = Math.max(1, stickWidth * 0.16);
        for (let i = 1; i <= 4; i++) {
          const t = 0.28 + (i / 5) * 0.42;
          const rx = cx + dx * t;
          const ry = cy + dy * t;
          const rib = stickWidth * 0.46;
          ctx.beginPath();
          ctx.moveTo(rx - px * rib, ry - py * rib);
          ctx.lineTo(rx + px * rib, ry + py * rib);
          ctx.stroke();
        }
      }
      ctx.fillStyle = COLOR_JOYSTICK_KNOB;
      ctx.beginPath();
      ctx.arc(knobX, knobY, knobR, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = COLOR_JOYSTICK_KNOB_CAP;
      ctx.beginPath();
      ctx.arc(knobX, knobY, knobR * 0.58, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // The pivot stays at the middle of the plate, so the hand still lands on the knob.
    function drawJoystickPlate(rect) {
      const s = rect.width;
      const cx = rect.x + s / 2;
      const cy = rect.y + s / 2;
      drawBeveledPlate(rect);
      const inset = s * 0.1;
      const boltR = Math.max(3, s * 0.026);
      drawBolt(rect.x + inset, rect.y + inset, boltR);
      drawBolt(rect.x + s - inset, rect.y + inset, boltR);
      drawBolt(rect.x + inset, rect.y + s - inset, boltR);
      drawBolt(rect.x + s - inset, rect.y + s - inset, boltR);
      drawDirectionMarks(cx, cy, s);
      drawJoystickWell(cx, cy, s);
      return { cx: cx, cy: cy };
    }

    // The stick stands in the room. While the hand grips it, the knob leans with the keys.
    function drawJoystick(room, player) {
      const rect = getJoystickRect(room);
      const near = stationNearHand(player, room) === "joystick";
      ctx.save();
      const spot = drawJoystickPlate(rect);
      const tilt = joystickTilt(player);
      drawStick(
        spot.cx,
        spot.cy,
        rect.width * JOYSTICK_STICK_RATIO,
        rect.width * JOYSTICK_KNOB_RATIO,
        tilt.x,
        tilt.y,
        Math.max(5, rect.width * 0.08)
      );
      ctx.restore();
      if (near && machineStarted) drawJoystickInteractOutline(rect);
    }

    function fuelOf(player) {
      const index = player === player1 ? 0 : 1;
      return clampFuel(battlefield.players[index].fuel);
    }

    // Empty tank, or a fill that is already running (so the player can cancel it).
    function refuelUsable(player) {
      if (player.refueling) return true;
      return fuelOf(player) <= 0;
    }

    function fuelFillColor(fuel) {
      if (fuel < LOW_FUEL_PERCENT) return COLOR_FUEL_LOW;
      if (fuel <= 50) return COLOR_FUEL_MID;
      return COLOR_FUEL_HIGH;
    }

    // Vertical tank. Green, yellow, or red shows how much is left.
    function drawFuelGauge(room, player) {
      const rect = getFuelRect(room);
      const fuel = fuelOf(player);
      ctx.save();
      drawBeveledRect(rect);
      const boltR = Math.max(2, Math.min(3, rect.width * 0.07));
      const inset = boltR + 3;
      drawBolt(rect.x + inset, rect.y + inset, boltR);
      drawBolt(rect.x + rect.width - inset, rect.y + inset, boltR);
      drawBolt(rect.x + inset, rect.y + rect.height - inset, boltR);
      drawBolt(rect.x + rect.width - inset, rect.y + rect.height - inset, boltR);

      const tankX = rect.x + 12;
      const tankY = rect.y + 42;
      const tankW = Math.max(8, rect.width - 24);
      const tankH = Math.max(8, rect.height - 76);
      ctx.fillStyle = COLOR_JOYSTICK_WELL;
      ctx.fillRect(tankX, tankY, tankW, tankH);
      const fillH = tankH * (fuel / MAX_FUEL);
      ctx.fillStyle = fuelFillColor(fuel);
      ctx.fillRect(tankX, tankY + tankH - fillH, tankW, fillH);

      ctx.strokeStyle = COLOR_JOYSTICK_TICK;
      ctx.lineWidth = 1;
      const marks = [0.25, 0.5, 0.75];
      for (let i = 0; i < marks.length; i++) {
        const y = tankY + tankH * (1 - marks[i]);
        ctx.beginPath();
        ctx.moveTo(tankX, y);
        ctx.lineTo(tankX + tankW, y);
        ctx.stroke();
      }

      ctx.fillStyle = COLOR_JOYSTICK_LABEL_TEXT;
      ctx.font = "bold 12px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(Math.round(fuel) + "%", rect.x + rect.width / 2, rect.y + rect.height - 16);
      ctx.restore();
    }

    function drawRefuelStation(room, player) {
      const rect = getRefuelRect(room);
      const usable = refuelUsable(player);
      const near = stationNearHand(player, room) === "refuel";
      ctx.save();
      drawBeveledRect(rect);
      const boltR = Math.max(2, Math.min(3, rect.width * 0.07));
      const inset = boltR + 2;
      if (rect.width > inset * 2 + 8 && rect.height > inset * 2 + 8) {
        drawBolt(rect.x + inset, rect.y + inset, boltR);
        drawBolt(rect.x + rect.width - inset, rect.y + inset, boltR);
        drawBolt(rect.x + inset, rect.y + rect.height - inset, boltR);
        drawBolt(rect.x + rect.width - inset, rect.y + rect.height - inset, boltR);
      }
      if (!usable) {
        ctx.fillStyle = "rgba(8, 8, 12, 0.45)";
        ctx.fillRect(rect.x, rect.y, rect.width, rect.height);
      }
      ctx.fillStyle = usable ? COLOR_JOYSTICK_LABEL_TEXT : COLOR_REFUEL_DISABLED;
      ctx.font = "bold 10px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("REFUEL", rect.x + rect.width / 2, rect.y + rect.height * 0.36);
      let led = COLOR_JOYSTICK_LED_OFF;
      if (player.refueling) {
        const step = Math.floor((frameTime / 1000) / REFUEL_BLINK_SECONDS);
        led = step % 2 === 0 ? COLOR_REFUEL_LED : "#5a3a10";
      } else if (machineStarted && fuelOf(player) <= 0) {
        led = COLOR_REFUEL_LED;
      }
      ctx.fillStyle = led;
      ctx.beginPath();
      ctx.arc(rect.x + rect.width / 2, rect.y + rect.height * 0.68, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      if (near && machineStarted && usable) drawInteractOutline(rect);
    }

    // Side view of one shell. angle 0 points the nose to the right.
    function drawShellGlyph(x, y, length, angle) {
      const h = Math.max(6, length * 0.28);
      const nose = length * 0.3;
      const body = Math.max(8, length - nose);
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.translate(-nose / 2, 0);
      ctx.fillStyle = "#d2b36a";
      ctx.beginPath();
      ctx.moveTo(-body / 2 + h / 2, -h / 2);
      ctx.lineTo(body / 2 - 1, -h / 2);
      ctx.lineTo(body / 2 - 1, h / 2);
      ctx.lineTo(-body / 2 + h / 2, h / 2);
      ctx.arc(-body / 2 + h / 2, 0, h / 2, Math.PI / 2, -Math.PI / 2, false);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = "#6e4e28";
      const band = Math.max(3, h * 0.28);
      ctx.fillRect(body / 2 - band * 2.1, -h / 2, band, h);
      ctx.fillStyle = "#8d7044";
      ctx.beginPath();
      ctx.moveTo(body / 2 - 1, -h * 0.46);
      ctx.lineTo(body / 2 + nose, 0);
      ctx.lineTo(body / 2 - 1, h * 0.46);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function storageWell(rect) {
      const pad = 10;
      const footer = Math.min(64, Math.max(40, rect.height * 0.32));
      return {
        x: rect.x + pad,
        y: rect.y + pad,
        w: Math.max(8, rect.width - pad * 2),
        h: Math.max(8, rect.height - pad - footer),
        footer: footer
      };
    }

    function drawStorageHatches(well, amount) {
      const lip = Math.max(3, well.w * 0.04);
      const doorW = lip + (well.w / 2 - lip) * amount;
      ctx.fillStyle = "#4e4e58";
      ctx.fillRect(well.x, well.y, doorW, well.h);
      ctx.fillRect(well.x + well.w - doorW, well.y, doorW, well.h);
      ctx.fillStyle = COLOR_JOYSTICK_EDGE_LIGHT;
      ctx.fillRect(well.x, well.y, doorW, 2);
      ctx.fillRect(well.x + well.w - doorW, well.y, doorW, 2);
      ctx.fillStyle = COLOR_JOYSTICK_EDGE_DARK;
      ctx.fillRect(well.x, well.y + well.h - 2, doorW, 2);
      ctx.fillRect(well.x + well.w - doorW, well.y + well.h - 2, doorW, 2);
      if (amount > 0.85) {
        ctx.fillStyle = "#121216";
        ctx.fillRect(well.x + well.w / 2 - 1, well.y + 3, 2, well.h - 6);
      }
    }

    function drawCautionStripes(x, y, w, h) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(x, y, w, h);
      ctx.clip();
      ctx.fillStyle = "#c9a227";
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = "#1c1c22";
      const stripe = Math.max(5, h * 0.85);
      for (let i = -h; i < w + h; i += stripe * 2) {
        ctx.beginPath();
        ctx.moveTo(x + i, y + h);
        ctx.lineTo(x + i + h, y);
        ctx.lineTo(x + i + h + stripe, y);
        ctx.lineTo(x + i + stripe, y + h);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    // Stripes, vents, and a name plate under the shell bay. Nothing here is a control.
    function drawStorageBase(rect, well) {
      const x = well.x;
      const w = well.w;
      const y = well.y + well.h + 6;
      const bottom = rect.y + rect.height - 8;
      const h = bottom - y;
      if (h < 18 || w < 20) return;
      const stripeH = Math.min(9, h * 0.22);
      drawCautionStripes(x, y, w, stripeH);
      const ventY = y + stripeH + 5;
      const ventH = 4;
      const vents = 4;
      const gap = 6;
      const ventW = (w - gap * (vents + 1)) / vents;
      if (ventW > 4 && ventY + ventH < bottom - 16) {
        ctx.fillStyle = COLOR_JOYSTICK_EDGE_DARK;
        for (let i = 0; i < vents; i++) {
          ctx.fillRect(x + gap + i * (ventW + gap), ventY, ventW, ventH);
        }
      }
    }

    function storageFilled(player) {
      let count = 0;
      for (let i = 0; i < player.storageSlots.length; i++) {
        if (player.storageSlots[i]) count += 1;
      }
      return count;
    }

    // Four columns by two rows, centered in the bay with even margins.
    function storageRack(well) {
      const cols = 4;
      const rows = 2;
      const gap = Math.max(5, Math.min(well.w, well.h) * 0.04);
      const radius = Math.max(6, Math.min(
        (well.w - gap * (cols + 1)) / cols / 2,
        (well.h - gap * (rows + 1)) / rows / 2
      ));
      const gridW = radius * 2 * cols + gap * (cols - 1);
      const gridH = radius * 2 * rows + gap * (rows - 1);
      const originX = well.x + (well.w - gridW) / 2;
      const originY = well.y + (well.h - gridH) / 2;
      const slots = [];
      for (let i = 0; i < cols * rows; i++) {
        const col = i % cols;
        const row = Math.floor(i / cols);
        slots.push({
          index: i,
          cx: originX + radius + col * (radius * 2 + gap),
          cy: originY + radius + row * (radius * 2 + gap),
          r: radius
        });
      }
      return slots;
    }

    function storageSlotUnderHand(player, well) {
      const slots = storageRack(well);
      let best = -1;
      let bestDist = 0;
      for (let i = 0; i < slots.length; i++) {
        const slot = slots[i];
        const dx = player.x - slot.cx;
        const dy = player.y - slot.cy;
        const dist = dx * dx + dy * dy;
        const reach = (slot.r + 3) * (slot.r + 3);
        if (dist <= reach && (best === -1 || dist < bestDist)) {
          best = slot.index;
          bestDist = dist;
        }
      }
      return best;
    }

    // Same brass base the loader shows at the mouth of the bore.
    function drawShellButt(cx, cy, radius) {
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.fillStyle = "rgb(196,154,78)";
      ctx.fill();
      ctx.lineWidth = Math.max(1.5, radius * 0.07);
      ctx.strokeStyle = "rgb(110,78,40)";
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, cy, radius * 0.22, 0, Math.PI * 2);
      ctx.fillStyle = "rgb(74,52,28)";
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx, cy, radius * 0.08, 0, Math.PI * 2);
      ctx.fillStyle = "rgb(36,24,14)";
      ctx.fill();
    }

    function drawStorageRack(well, player, hover) {
      const slots = storageRack(well);
      for (let i = 0; i < slots.length; i++) {
        const slot = slots[i];
        ctx.beginPath();
        ctx.arc(slot.cx, slot.cy, slot.r, 0, Math.PI * 2);
        ctx.fillStyle = "#070807";
        ctx.fill();
        ctx.lineWidth = 1;
        ctx.strokeStyle = "#2a2e2c";
        ctx.stroke();
        if (player.storageSlots[slot.index]) drawShellButt(slot.cx, slot.cy, slot.r * 0.96);
      }
      if (hover < 0 || !player.storageSlots[hover]) return;
      const slot = slots[hover];
      ctx.save();
      interactOutlineStyle();
      ctx.beginPath();
      ctx.arc(slot.cx, slot.cy, slot.r + 3, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function drawShellStorage(room, player) {
      const rect = getStorageRect(room);
      const open = player.storageClosedAt == null;
      const hover = machineStarted && open && !player.carryingShell ? storageSlotUnderHand(player, storageWell(rect)) : -1;
      ctx.save();
      drawBeveledRect(rect);
      const boltR = Math.max(2, Math.min(3, rect.width * 0.03));
      const inset = boltR + 4;
      if (rect.width > inset * 2 + 8 && rect.height > inset * 2 + 8) {
        drawBolt(rect.x + inset, rect.y + inset, boltR);
        drawBolt(rect.x + rect.width - inset, rect.y + inset, boltR);
        drawBolt(rect.x + inset, rect.y + rect.height - inset, boltR);
        drawBolt(rect.x + rect.width - inset, rect.y + rect.height - inset, boltR);
      }
      const well = storageWell(rect);
      ctx.fillStyle = machineStarted ? "#10140f" : "#000000";
      ctx.fillRect(well.x, well.y, well.w, well.h);
      if (machineStarted && player.hatch < 0.98) drawStorageRack(well, player, hover);
      drawStorageHatches(well, machineStarted ? player.hatch : 0);
      drawStorageBase(rect, well);
      ctx.restore();
    }

    function drawFallingShells() {
      for (let i = 0; i < fallingShells.length; i++) {
        const shell = fallingShells[i];
        drawShellGlyph(shell.x, shell.y, SHELL_CARRIED_LENGTH, shell.rot);
      }
    }

    // Hatches shut at empty and open again with a full stack. No countdown is drawn.
    function updateShellStorage(player, dt) {
      const want = player.storageClosedAt != null ? 1 : 0;
      const step = dt / 0.35;
      if (player.hatch < want) player.hatch = Math.min(1, player.hatch + step);
      else if (player.hatch > want) player.hatch = Math.max(0, player.hatch - step);
      if (!machineStarted || player.storageClosedAt == null) return;
      if (frameTime - player.storageClosedAt < SHELL_RESTOCK_SECONDS * 1000) return;
      for (let i = 0; i < player.storageSlots.length; i++) player.storageSlots[i] = true;
      player.shells = SHELL_STORAGE_COUNT;
      player.storageClosedAt = null;
      const closed = warningIndex(player, "storage-closed");
      if (closed !== -1) player.messages.splice(closed, 1);
      addStatusMessage(player, "> Storage: Restocked.");
    }

    function updateFallingShells(dt) {
      for (let i = fallingShells.length - 1; i >= 0; i--) {
        const shell = fallingShells[i];
        shell.vy += SHELL_FALL_GRAVITY * dt;
        shell.y += shell.vy * dt;
        shell.rot += dt * 1.6;
        if (shell.y > canvas.height + 40) fallingShells.splice(i, 1);
      }
    }

    function takeShell(player, index) {
      if (player.carryingShell) return;
      if (player.storageClosedAt != null || storageFilled(player) <= 0) {
        if (warningIndex(player, "storage-closed") === -1) {
          addStatusMessage(player, { text: "> Storage: Hatches closed.", color: COLOR_MONITOR_TEXT, kind: "storage-closed" });
        }
        return;
      }
      if (index < 0 || !player.storageSlots[index]) return;
      player.storageSlots[index] = false;
      player.shells = storageFilled(player);
      player.carryingShell = true;
      addStatusMessage(player, "> Storage: Shell taken.");
      if (player.shells <= 0) {
        player.shells = 0;
        player.storageClosedAt = frameTime;
        addStatusMessage(player, "> Storage: Empty. Hatches closed. Renewing shells in 1 minute.");
      }
    }

    function dropCarriedShell(player) {
      if (!player.carryingShell) return;
      player.carryingShell = false;
      fallingShells.push({ x: player.x, y: player.y, vy: 80, rot: 0 });
      addStatusMessage(player, "> Storage: Shell dropped. Lost.");
    }

    function loaderFreeSlot(player) {
      for (let i = 0; i < player.loaderSlots.length; i++) {
        if (!player.loaderSlots[i]) return i;
      }
      return -1;
    }

    function loaderReadySlot(player) {
      for (let i = 0; i < player.loaderSlots.length; i++) {
        const slot = player.loaderSlots[i];
        if (slot && slot.ready) return i;
      }
      return -1;
    }

    function loaderCount(player) {
      let count = 0;
      for (let i = 0; i < player.loaderSlots.length; i++) {
        if (player.loaderSlots[i]) count += 1;
      }
      return count;
    }

    function fireBlockReason(player) {
      if (player.turretBusy) return "Cannot fire: turret turning";
      if (!player.equationTree) return "Cannot fire: syntax error";
      if (!player.canFire) return "Cannot fire: no curve";
      return "";
    }

    // False means this was not the insert port, so the hand drops the shell.
    // True means the port handled the press. A full or locked loader keeps the shell.
    function tryDepositShell(player, target) {
      if (target !== "loader-port") return false;
      if (player.loaderLocked) return true;
      const index = loaderFreeSlot(player);
      if (index < 0) {
        player.statusNotice = "Max capacity";
        addStatusMessage(player, "> Loader: Max capacity.");
        return true;
      }
      player.carryingShell = false;
      player.loaderSlots[index] = { t: 0, ready: false };
      if (player.statusNotice === "Max capacity") player.statusNotice = "";
      addStatusMessage(player, "> Loader: Shell inserted.");
      return true;
    }

    function updateLoader(player, dt) {
      if (!machineStarted) return;
      const coverWant = player.loaderLocked ? 1 : 0;
      const coverStep = dt / 0.35;
      if (player.loaderCover < coverWant) player.loaderCover = Math.min(1, player.loaderCover + coverStep);
      else if (player.loaderCover > coverWant) player.loaderCover = Math.max(0, player.loaderCover - coverStep);
      const leverWant = player.loaderLocked ? 1 : 0;
      const leverStep = dt / 0.42;
      if (player.loaderLever < leverWant) player.loaderLever = Math.min(1, player.loaderLever + leverStep);
      else if (player.loaderLever > leverWant) player.loaderLever = Math.max(0, player.loaderLever - leverStep);
      for (let i = 0; i < player.loaderSlots.length; i++) {
        const slot = player.loaderSlots[i];
        if (!slot || slot.ready) continue;
        slot.t += dt / LOADER_LOAD_SECONDS;
        if (slot.t >= 1) {
          slot.t = 1;
          slot.ready = true;
          addStatusMessage(player, "> Loader: Shell ready.");
        }
      }
      if (player.statusNotice === "Max capacity" && loaderFreeSlot(player) >= 0) player.statusNotice = "";
      if (player.statusNotice.indexOf("Cannot fire:") === 0 && !fireBlockReason(player)) player.statusNotice = "";
    }

    function toggleLoaderLock(player) {
      if (player.loaderLocked) {
        player.loaderLocked = false;
        addStatusMessage(player, "> Loader: Unlocked.");
        return;
      }
      if (loaderReadySlot(player) < 0) return;
      player.loaderLocked = true;
      addStatusMessage(player, "> Loader: Locked.");
    }

    // The shell leaves the loader and follows y = f(x): x is meters forward, y is height.
    function fireShell(player) {
      syncEquation(player);
      const flight = player.flight;
      const source = flight && flight.drawPoints && flight.drawPoints.length > 1
        ? flight.drawPoints
        : (flight && flight.points && flight.points.length > 1 ? flight.points : null);
      if (!source) return;
      const index = player === player1 ? 0 : 1;
      const unit = battlefield.players[index];
      const aim = aimFromDegrees(player.actualAngle);
      const path = [];
      for (let i = 0; i < source.length; i++) path.push({ x: source[i].x, y: source[i].y });
      liveShells.push({
        owner: index,
        path: path,
        seg: 0,
        into: 0,
        speed: SHELL_MUZZLE_SPEED,
        distance: path[0].x,
        height: path[0].y,
        aimX: aim.x,
        aimY: aim.y,
        originX: unit.x,
        originY: unit.y,
        alive: true,
        damage: Math.max(1, Math.round(SHELL_MUZZLE_SPEED * SHELL_DAMAGE_PER_MPS)),
        blast: null
      });
    }

    function playerHasLiveShell(player) {
      const index = player === player1 ? 0 : 1;
      for (let i = 0; i < liveShells.length; i++) {
        if (liveShells[i].owner === index && liveShells[i].alive) return true;
      }
      return false;
    }

    function shellWorld(shell) {
      return {
        x: shell.originX + shell.aimX * shell.distance,
        y: shell.originY + shell.aimY * shell.distance,
        z: shell.height
      };
    }

    // Climbing in the air spends speed. Falling adds it. Climbing back out of the ground adds it too.
    function adjustShellSpeed(speed, y0, y1) {
      if ((y0 < -1e-4 && y1 > 1e-4) || (y0 > 1e-4 && y1 < -1e-4)) {
        speed = adjustShellSpeed(speed, y0, 0);
        return adjustShellSpeed(speed, 0, y1);
      }
      const dy = y1 - y0;
      const emerging = y0 < -1e-4 && dy > 0;
      const delta = emerging ? 2 * SHELL_GRAVITY * dy : -2 * SHELL_GRAVITY * dy;
      let next = speed * speed + delta;
      const floor = SHELL_MIN_SPEED * SHELL_MIN_SPEED;
      if (next < floor) next = floor;
      let result = Math.sqrt(next);
      if (result > SHELL_MAX_SPEED) result = SHELL_MAX_SPEED;
      return result;
    }

    // True when a ground crossing has an opponent or an obstacle inside the blast circle.
    // Bare ground is not a hit, so the shell keeps following the curve.
    function groundContact(shell) {
      const world = shellWorld(shell);
      const enemy = battlefield.players[1 - shell.owner];
      if (enemy && circleOverlapsMachine(world.x, world.y, SHELL_BLAST_RADIUS, enemy)) return true;
      const obstacles = battlefield.obstacles || [];
      for (let i = 0; i < obstacles.length; i++) {
        if (circleOverlapsSolid(world.x, world.y, SHELL_BLAST_RADIUS, obstacles[i])) return true;
      }
      return false;
    }

    function formatImpactCoord(value) {
      return (Math.round(value * 10) / 10).toFixed(1);
    }

    function shellImpactLine(reason, shell, outcome) {
      const speed = Math.round(shell.speed);
      const place = "(" + formatImpactCoord(shell.blast.x) + ", " + formatImpactCoord(shell.blast.y) + ") m, " + speed + " m/s";
      let line = reason === "ground"
        ? "> Shell: Ground impact at " + place + "."
        : "> Shell: Impact (" + reason + ") at " + place + ".";
      if (outcome.opponent) line += " Opponent hit (-" + shell.damage + ").";
      for (let i = 0; i < outcome.obstacles.length; i++) {
        const note = outcome.obstacles[i];
        if (note.destroyed) line += " Obstacle destroyed.";
        else line += " Obstacle damaged (" + note.hits + "/" + SHELL_OBSTACLE_HITS + ").";
      }
      return line;
    }

    // The blast circle is the X marker's radius. It hurts the opponent and carves obstacles.
    function applyBlast(shell) {
      const blast = shell.blast;
      const outcome = { opponent: false, obstacles: [] };
      const enemy = battlefield.players[1 - shell.owner];
      if (enemy && circleOverlapsMachine(blast.x, blast.y, blast.radius, enemy)) {
        enemy.health = Math.max(0, enemy.health - shell.damage);
        outcome.opponent = true;
      }
      const obstacles = battlefield.obstacles || [];
      const doomed = [];
      for (let i = 0; i < obstacles.length; i++) {
        const obstacle = obstacles[i];
        if (!circleOverlapsSolid(blast.x, blast.y, blast.radius, obstacle)) continue;
        if (!obstacle.holes) obstacle.holes = [];
        obstacle.holes.push({ x: blast.x, y: blast.y, r: blast.radius });
        obstacle.hits = (obstacle.hits || 0) + 1;
        const destroyed = obstacle.hits >= SHELL_OBSTACLE_HITS;
        outcome.obstacles.push({ hits: obstacle.hits, destroyed: destroyed });
