<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Graph Howitzer</title>
  <style>
    /* Fill the window with no scrollbars, same idea as the grid game */
    body { margin: 0; overflow: hidden; background: #14141e; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="room"></canvas>

  <script>
    // Sizes and colors live here so they are easy to change later
    const WALL_WIDTH = 20;
    const HAND_SPEED = 250; // pixels per second
    const COUNTDOWN_SECONDS = 10;
    // Both players hold the shared button this long before the countdown can start.
    const HOLD_TO_START_SECONDS = 2;
    // The shared start button is kept, but turned off until it is needed again.
    const ENABLE_HOLD_TO_START = false;
    const START_DRAIN_SECONDS = 0.5; // the ring empties this fast if either player lets go
    const START_FADE_SECONDS = 0.45; // the button fades away once the hold is finished
    const START_BUTTON_RADIUS = 36; // reaches into both rooms; the wall still blocks the hands
    const START_RING_WIDTH = 9;
    const WAITING_TEXT = "> Sys: Awaiting operators...";
    // H.O.W.L.E.R = Heavy Ordnance Weapon, Launch-Equation Ranged (said "Howler")
    const MACHINE_NAME = "H.O.W.L.E.R";
    // Drawn hand. The hitbox is a square around the palm. Fingers may stick out.
    const PALM_RADIUS = 13;
    const HAND_HITBOX_HALF = PALM_RADIUS;
    // Four fingers across the top and a thicker thumb on the side. Offsets are fractions of the palm.
    const FINGER_RADIUS = PALM_RADIUS * 0.36;
    const THUMB_RADIUS = PALM_RADIUS * 0.44;
    const FINGER_SPOTS = [
      { x: PALM_RADIUS * -0.78, y: PALM_RADIUS * -0.95, r: FINGER_RADIUS },
      { x: PALM_RADIUS * -0.28, y: PALM_RADIUS * -1.12, r: FINGER_RADIUS },
      { x: PALM_RADIUS * 0.28, y: PALM_RADIUS * -1.12, r: FINGER_RADIUS },
      { x: PALM_RADIUS * 0.78, y: PALM_RADIUS * -0.95, r: FINGER_RADIUS },
      { x: PALM_RADIUS * -1.05, y: PALM_RADIUS * 0.22, r: THUMB_RADIUS }
    ];
    // Holding pose: fingers curl in and shrink, but still peek past the palm edge.
    const HOLD_FINGER_RADIUS_RATIO = 0.7;
    const HOLD_FINGER_PULL = 0.8;
    const INTERACT_KEY_P1 = "e";
    const INTERACT_KEY_P2 = "Enter";
    // Shift+B opens the hidden battlefield viewer. Nothing in the room mentions it.
    const SECRET_VIEW_KEY = "KeyB";
    // 1 battlefield unit = 1 meter.
    const FIELD_X_MAX = 120; // x runs from -120 to 120
    const FIELD_Y_MAX = 100; // y runs from -100 to 100, and up is positive
    const PLAYER_SIZE = 6; // diameter 6 meters, so the radius is 3
    const BATTLEFIELD_STORAGE_KEY = "graphHowitzerBattlefield";
    const BATTLEFIELD_CHANNEL_NAME = "graph-howitzer";
    const ZOOM_WIDTH_RATIO = 0.85;
    const ZOOM_HEIGHT_RATIO = 0.7;
    const ZOOM_FONT_SIZE = 28;
    const ZOOM_LINE_HEIGHT = 36;
    const CLOSE_BUTTON_SIZE = 28;
    const COLOR_ROOM_DIM = "rgba(0, 0, 0, 0.55)";
    const COLOR_ROOM_1 = "#1a2230";
    const COLOR_ROOM_2 = "#2a1c24";
    const COLOR_WALL = "#8d8d99";
    const COLOR_P1 = "#3d8bfd";
    const COLOR_P2 = "#ff8a3d";
    const COLOR_LABEL = "#f2f2f7";
    // Radar stays a square. Three equal gaps: before the monitor, between the stations, and after the radar.
    const MONITOR_HEIGHT_RATIO = 0.16;
    const MONITOR_TOP = 56; // sits below the player name
    const STATION_GAP_RATIO = 0.04; // each of those three gaps, as a fraction of the room width
    const MONITOR_BEZEL = 12;
    const MONITOR_GLOW_DISTANCE = 40; // how close a hand must be for the outline to show
    const MONITOR_LINE_HEIGHT = 20;
    const COLOR_MONITOR_FRAME = "#3a3a42";
    const COLOR_MONITOR_SCREEN = "#000000";
    const COLOR_MONITOR_TEXT = "#39ff6a";
    const COLOR_MONITOR_WARNING = "#ff4040";
    // A second outline a few pixels outside the station the hand can use.
    const INTERACT_OUTLINE_GAP = 6;
    const INTERACT_OUTLINE_WIDTH = 4;
    const INTERACT_PULSE_SECONDS = 1.1; // one soft brighten and dim
    // Health of the machine. Damaged is for later, when health drops.
    const CONDITION_NAMES = ["Intact", "Damaged"];
    const CONDITION_COLORS = {
      Intact: "#39ff6a",
      Damaged: "#ff4040"
    };
    // What the machine is doing. Idle means it is sitting still.
    const ACTIVITY_NAMES = ["Idle", "Moving", "Redirecting", "Attacking", "Refueling"];
    const ACTIVITY_COLORS = {
      Idle: "#39ff6a",
      Moving: "#3ee0ff",
      Redirecting: "#ffe14a",
      Attacking: "#ff8a3d",
      Refueling: "#ffb020"
    };
    const MAX_HEALTH = 100;
    const PING_WARNING_ENEMY = "> Alert: Hostile signal detected.";
    const PING_WARNING_OBSTACLE = "> Warning: Hostile near obstacle.";
    const PING_WARNING_SELF = "> Warning: Obstacle proximity < 4 m.";
    // The square shows everything within 20 meters around this player.
    // The square's half-size maps to 20 meters.
    const RADAR_RANGE = 20;
    const RADAR_SWEEP_SECONDS = 3; // one full turn of the sweep line
    const RADAR_TRAIL_STEPS = 8;
    const RADAR_TRAIL_ANGLE = Math.PI / 3; // how much of the circle the fading trail covers
    const RADAR_ENEMY_DOT_RATIO = 0.035; // enemy dot size compared with the radar half-size
    const COLOR_RADAR_SCREEN = "#04140a";
    const COLOR_RADAR_CROSS = "rgba(57, 255, 106, 0.28)";
    const COLOR_RADAR_YOU = "#d8ffe4";
    const COLOR_RADAR_SWEEP = "#d8ffe4";
    const COLOR_RADAR_ENEMY = "255, 64, 64";
    const COLOR_RADAR_OBSTACLE = "150, 186, 160";
    const OBSTACLE_COUNT = 12;
    const BUILDING_MIN_SIZE = 4;
    const BUILDING_MAX_SIZE = 14;
    const TOWER_MIN_RADIUS = 2;
    const TOWER_MAX_RADIUS = 5;
    const BIG_OBSTACLE_SIZE = PLAYER_SIZE * 3; // building side, or tower diameter
    const BIG_OBSTACLE_MIN = 1;
    const BIG_OBSTACLE_MAX = 3;
    const OBSTACLE_CLEARANCE = 8; // empty units around each player's center
    const OBSTACLE_PLACE_TRIES = 8;
    // How close an opponent must be to an obstacle edge to light the red ping.
    const OBSTACLE_NEAR_DISTANCE = 3;
    // Meters from your own machine's edge to an obstacle's edge.
    const SELF_OBSTACLE_WARN_DISTANCE = 4;
    const RED_PING_SIZE = 12; // capped at the bezel thickness so it sits in the frame corner
    const RED_PING_BLINK_SECONDS = 0.4;
    const COLOR_RED_PING_OFF = "#3a1518";
    const COLOR_RED_PING_ON = "#ff2a2a";
    // Big joystick on the left side of the room. The hand grips it in place.
    const JOYSTICK_SIZE_RATIO = 1.8; // plate side is about 1.8 times the radar side
    const JOYSTICK_WELL_RATIO = 0.56; // dark circle in the middle of the plate
    const JOYSTICK_REST_LEAN = 0.7; // the idle picture points up; a gripped stick rests at the center
    const JOYSTICK_STICK_RATIO = 0.28; // how far the knob can lean, compared with the plate
    const JOYSTICK_KNOB_RATIO = 0.16;
    // Held keys push the knob out at a steady speed. Letting go springs it back faster.
    const STICK_FULL_SECONDS = 0.8; // center to full tilt
    const STICK_RETURN_SECONDS = 0.5; // full tilt back to center
    const MAX_MOVE_SPEED = 8; // m/s at full tilt
    const ACCELERATION = 3; // m/s squared; about 2.5 seconds from a stop to full speed
    const DECELERATION = 5; // m/s squared; slows down a bit faster than it speeds up
    const MOVE_STATUS_SPEED = 0.2; // m/s; slower than this, the activity returns to Idle
    // Fuel is a percent. It falls only while the machine actually drives. It never refills by itself.
    const MAX_FUEL = 100;
    const FUEL_DRAIN_PER_METER = MAX_FUEL / 70; // a full tank lasts about 70 meters
    const LOW_FUEL_PERCENT = 20;
    const REFUEL_SECONDS_FULL = 90; // seconds to go from empty to full
    const REFUEL_BLINK_SECONDS = 0.4;
    const FUEL_GAUGE_WIDTH = 58; // bar snapped to the joystick, toward the middle of the room
    // Gauge and button share the joystick's height. The button is the bottom slice.
    const REFUEL_HEIGHT_RATIO = 0.28;
    const COLOR_REFUEL_DISABLED = "#7a7a84";
    // Adjacent still counts, so a machine pressed against a surface keeps the report.
    const CONTACT_EPSILON = 0.05;
    const COLLISION_TEXT = "> Alert: Collision detected.";
    const COLOR_FUEL_HIGH = "#39ff6a";
    const COLOR_FUEL_MID = "#ffe14a";
    const COLOR_FUEL_LOW = "#ff4040";
    const COLOR_REFUEL_LED = "#ffb020";
    const LOW_FUEL_TEXT = "> Warning: Fuel low (<20%).";
    const OUT_OF_FUEL_TEXT = "> Alert: Fuel depleted. Propulsion offline.";
    // Fire control is the equation station. No shell is launched from it yet.
    const FIRE_STATION_WIDTH = 250;
    const FIRE_STATION_HEIGHT = 230;
    const FIRE_GRAPH_X_MAX = 100; // meters along the firing direction
    const FIRE_SAMPLE_STEP = 0.5;
    const FIRE_EQUATION_MAX = 48;
    const FIRE_DEFAULT_EQUATION = "-0.05x^2 + 2x";
    const SHELL_SPEED = 20; // m/s along the path, not along the ground
    const SHELL_INTEGRATION_STEP = 0.05; // horizontal step used to measure the arc
    const FIRE_KEY_COLS = 5;
    const FIRE_KEYS = [
      "7", "8", "9", "+", "sin",
      "4", "5", "6", "-", "cos",
      "1", "2", "3", "*", "sqrt",
      "0", ".", "x", "/", "^",
      "(", ")", "⌫", "CLR", "DONE"
    ];
    const STATE_PUBLISH_SECONDS = 0.1; // tell the viewer about 10 times a second
    // Gray and dark metal, like the rest of the console. Sizes below are fractions of the plate.
    const COLOR_JOYSTICK_PLATE = "#3a3a42";
    const COLOR_JOYSTICK_EDGE_LIGHT = "#6c6c78"; // top-left bevel
    const COLOR_JOYSTICK_EDGE_DARK = "#17171c"; // bottom-right bevel and the recessed well
    const COLOR_JOYSTICK_BOLT = "#8b8b96";
    const COLOR_JOYSTICK_WELL = "#141418";
    const COLOR_JOYSTICK_BOOT = "#32323a"; // rubber ring around the stick
    const COLOR_JOYSTICK_TICK = "rgba(176, 176, 186, 0.55)";
    const COLOR_JOYSTICK_STICK = "#8a8a96";
    const COLOR_JOYSTICK_STICK_GROOVE = "#4e4e58";
    const COLOR_JOYSTICK_KNOB = "#7a3034"; // metal under the red top
    const COLOR_JOYSTICK_KNOB_CAP = "#d24545";
    const COLOR_JOYSTICK_LABEL = "#24242c";
    const COLOR_JOYSTICK_LABEL_TEXT = "#b7c4b0";
    const COLOR_JOYSTICK_LED_OFF = "#243028";
    const COLOR_JOYSTICK_LED_ON = "#3ddc6a"; // lit only while the hand is gripping

    const canvas = document.getElementById("room");
    const ctx = canvas.getContext("2d");

    // Which keys are held down right now. Both players can hold keys at once.
    const keys = {};

    // Hands start at 0. The first resize places them in the middle of each room.
    const player1 = { x: 0, y: 0, placed: false, messages: [], panelOpen: false, panelKind: "", gripping: false, holdingStart: false, refueling: false, tiltX: 0, tiltY: 0, condition: "Intact", activity: "Idle", equation: FIRE_DEFAULT_EQUATION, equationParsedFor: null, equationTree: null, fireOpen: false, fireIndex: 0 };
    const player2 = { x: 0, y: 0, placed: false, messages: [], panelOpen: false, panelKind: "", gripping: false, holdingStart: false, refueling: false, tiltX: 0, tiltY: 0, condition: "Intact", activity: "Idle", equation: FIRE_DEFAULT_EQUATION, equationParsedFor: null, equationTree: null, fireOpen: false, fireIndex: 0 };

    // The wall sits in the middle. Each player owns one side of it.
    function getRooms() {
      const wallX = (canvas.width - WALL_WIDTH) / 2;
      return {
        wallX: wallX,
        left: { left: 0, right: wallX },
        right: { left: wallX + WALL_WIDTH, right: canvas.width }
      };
    }

    // Keep the palm square inside one room, including the screen edges.
    function clampHand(hand, room) {
      let minX = room.left + HAND_HITBOX_HALF;
      let maxX = room.right - HAND_HITBOX_HALF;
      let minY = HAND_HITBOX_HALF;
      let maxY = canvas.height - HAND_HITBOX_HALF;

      // A tiny window can be smaller than the hand. Sit in the middle then.
      if (minX > maxX) {
        hand.x = (room.left + room.right) / 2;
      } else {
        if (hand.x < minX) hand.x = minX;
        if (hand.x > maxX) hand.x = maxX;
      }
      if (minY > maxY) {
        hand.y = canvas.height / 2;
      } else {
        if (hand.y < minY) hand.y = minY;
        if (hand.y > maxY) hand.y = maxY;
      }
    }

    function centerHand(hand, room) {
      hand.x = (room.left + room.right) / 2;
      hand.y = canvas.height / 2;
      hand.placed = true;
      clampHand(hand, room);
    }

    // Match the canvas to the browser window, then keep the hands inside.
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const rooms = getRooms();
      if (!player1.placed) {
        centerHand(player1, rooms.left);
        centerHand(player2, rooms.right);
      } else {
        clampHand(player1, rooms.left);
        clampHand(player2, rooms.right);
      }
    }

    // Letters ignore Shift. Arrow names stay as "ArrowUp" and so on.
    function keyName(event) {
      if (event.key === INTERACT_KEY_P2 || event.key.indexOf("Arrow") === 0) return event.key;
      return event.key.toLowerCase();
    }

    window.addEventListener("keydown", function (event) {
      // This is not a movement key. Leave before we record it as a held key.
      if (event.shiftKey && event.code === SECRET_VIEW_KEY) {
        if (!event.repeat) window.open("battlefield.html", "_blank");
        return;
      }
      // Arrow keys scroll the page. Enter would activate a focused control.
      if (event.key.indexOf("Arrow") === 0 || event.key === INTERACT_KEY_P2) event.preventDefault();
      const name = keyName(event);
      const alreadyDown = keys[name] === true;
      keys[name] = true;
      // Key repeat would open and close the panel over and over, and would race the keypad cursor.
      if (alreadyDown) return;
      nudgeFireCursor(player1, name, "a", "d", "w", "s");
      nudgeFireCursor(player2, name, "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown");
      // Holding the start button uses the same keys, but it is not a station press.
      if (name === INTERACT_KEY_P1) tryInteract(player1, getRooms().left);
      if (name === INTERACT_KEY_P2) tryInteract(player2, getRooms().right);
    });

    window.addEventListener("keyup", function (event) {
      keys[keyName(event)] = false;
    });

    // Turn held keys into a direction. Diagonal moves stay at the same speed.
    function direction(up, down, left, right) {
      let dx = 0;
      let dy = 0;
      if (keys[left]) dx -= 1;
      if (keys[right]) dx += 1;
      if (keys[up]) dy -= 1;
      if (keys[down]) dy += 1;
      const length = Math.hypot(dx, dy);
      if (length === 0) return { x: 0, y: 0 };
      return { x: dx / length, y: dy / length };
    }

    function moveHand(hand, dir, dt, room) {
      hand.x += dir.x * HAND_SPEED * dt;
      hand.y += dir.y * HAND_SPEED * dt;
      // Stations don't block the hand; only the middle wall does.
      clampHand(hand, room);
    }

    // Screen up is negative. Battlefield up is positive, for both players.
    function battlefieldStick(player) {
      const screen = player === player1
        ? direction("w", "s", "a", "d")
        : direction("ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight");
      return { x: screen.x, y: -screen.y };
    }

    function clampNumber(value, min, max) {
      if (value < min) return min;
      if (value > max) return max;
      return value;
    }

    // Move the tilt toward a point at a steady speed. Magnitude stays inside the unit circle.
    function moveTiltToward(player, desiredX, desiredY, speed, dt) {
      const dx = desiredX - player.tiltX;
      const dy = desiredY - player.tiltY;
      const dist = Math.hypot(dx, dy);
      const step = speed * dt;
      if (dist <= step) {
        player.tiltX = desiredX;
        player.tiltY = desiredY;
      } else if (dist > 0) {
        player.tiltX += (dx / dist) * step;
        player.tiltY += (dy / dist) * step;
      }
      const mag = Math.hypot(player.tiltX, player.tiltY);
      if (mag > 1) {
        player.tiltX /= mag;
        player.tiltY /= mag;
      }
    }

    // Held keys lean the knob out. No keys: it springs back to the center.
    function updateStick(player, dt) {
      if (!player.gripping) return;
      const desired = battlefieldStick(player);
      const returning = desired.x === 0 && desired.y === 0;
      const speed = returning ? 1 / STICK_RETURN_SECONDS : 1 / STICK_FULL_SECONDS;
      moveTiltToward(player, desired.x, desired.y, speed, dt);
    }

    // Slide the velocity vector toward the target. Slowing uses the faster rate.
    function approachVelocity(vx, vy, targetX, targetY, dt) {
      const dx = targetX - vx;
      const dy = targetY - vy;
      const dist = Math.hypot(dx, dy);
      if (dist === 0) return { x: vx, y: vy };
      const currentSpeed = Math.hypot(vx, vy);
      const targetSpeed = Math.hypot(targetX, targetY);
      let slowing = targetSpeed < currentSpeed;
      if (vx * dx + vy * dy < 0) slowing = true;
      const rate = slowing ? DECELERATION : ACCELERATION;
      const step = rate * dt;
      if (dist <= step) return { x: targetX, y: targetY };
      return { x: vx + dx * (step / dist), y: vy + dy * (step / dist) };
    }

    // Two machines are squares of side PLAYER_SIZE. Overlap blocks; edges count as a touch.
    function playerSquaresOverlap(x, y, other) {
      return Math.abs(x - other.x) < PLAYER_SIZE && Math.abs(y - other.y) < PLAYER_SIZE;
    }

    function playersTouch(a, b) {
      return Math.abs(a.x - b.x) <= PLAYER_SIZE + CONTACT_EPSILON
        && Math.abs(a.y - b.y) <= PLAYER_SIZE + CONTACT_EPSILON;
    }

    // True when this point is clear of obstacles and the other machine.
    function positionClear(x, y, index) {
      const other = battlefield.players[1 - index];
      if (collidesWithObstacle(x, y, PLAYER_SIZE / 2)) return false;
      if (playerSquaresOverlap(x, y, other)) return false;
      return true;
    }

    // Walk toward the target on one axis. A block slides up to the surface and stops that axis.
    function slideTo(unit, index, x, y) {
      if (positionClear(x, y, index)) {
        const moved = x !== unit.x || y !== unit.y;
        unit.x = x;
        unit.y = y;
        return moved;
      }
      let lo = 0;
      let hi = 1;
      const x0 = unit.x;
      const y0 = unit.y;
      for (let i = 0; i < 14; i++) {
        const t = (lo + hi) / 2;
        if (positionClear(x0 + (x - x0) * t, y0 + (y - y0) * t, index)) lo = t;
        else hi = t;
      }
      unit.x = x0 + (x - x0) * lo;
      unit.y = y0 + (y - y0) * lo;
      return lo > 0;
    }

    // Move on x, then on y. A blocked axis loses its velocity so the other axis can still slide.
    // Obstacles and the other machine both stop that axis. The field edge does not count as a collision.
    function stepMachine(unit, index, dt) {
      const radius = PLAYER_SIZE / 2;
      let moved = false;
      const rawX = unit.x + unit.vx * dt;
      const tryX = clampNumber(rawX, -FIELD_X_MAX + radius, FIELD_X_MAX - radius);
      if (slideTo(unit, index, tryX, unit.y)) moved = true;
      if (unit.x !== tryX || tryX !== rawX) unit.vx = 0;
      const rawY = unit.y + unit.vy * dt;
      const tryY = clampNumber(rawY, -FIELD_Y_MAX + radius, FIELD_Y_MAX - radius);
      if (slideTo(unit, index, unit.x, tryY)) moved = true;
      if (unit.y !== tryY || tryY !== rawY) unit.vy = 0;
      return moved;
    }

    function clampFuel(fuel) {
      if (fuel < 0) return 0;
      if (fuel > MAX_FUEL) return MAX_FUEL;
      return fuel;
    }

    // One line whose text changes while the tank is filling. Removed when refueling stops.
    function setRefuelLine(player, active, percent) {
      const index = warningIndex(player, "refuel");
      if (!active) {
        if (index !== -1) player.messages.splice(index, 1);
        return;
      }
      const text = "> Refuel: In progress... " + percent + "%";
      if (index === -1) player.messages.push({ text: text, color: COLOR_MONITOR_TEXT, kind: "refuel" });
      else player.messages[index].text = text;
    }

    // The stick sets a target speed. The machine eases toward it, and coasts after the hand lets go.
    // An empty tank cannot speed up. Refueling locks the machine until the player cancels or the tank is full.
    // Nothing moves until H.O.W.L.E.R has started.
    function updateMachine(player, index, dt) {
      updateStick(player, dt);
      const unit = battlefield.players[index];
      const x0 = unit.x;
      const y0 = unit.y;
      let moved = false;
      if (machineStarted) {
        if (player.refueling) {
          unit.vx = 0;
          unit.vy = 0;
        } else {
          let targetX = 0;
          let targetY = 0;
          if (player.gripping && unit.fuel > 0) {
            targetX = player.tiltX * MAX_MOVE_SPEED;
            targetY = player.tiltY * MAX_MOVE_SPEED;
          }
          const next = approachVelocity(unit.vx, unit.vy, targetX, targetY, dt);
          unit.vx = next.x;
          unit.vy = next.y;
          moved = stepMachine(unit, index, dt);
        }
      }
      if (player.refueling && machineStarted) {
        unit.fuel = clampFuel(unit.fuel + dt * MAX_FUEL / REFUEL_SECONDS_FULL);
        if (unit.fuel >= MAX_FUEL) {
          unit.fuel = MAX_FUEL;
          player.refueling = false;
          setRefuelLine(player, false);
          addStatusMessage(player, "> Refuel: Complete. Tank 100%.");
        } else {
          setRefuelLine(player, true, Math.round(unit.fuel));
        }
        battlefieldDirty = true;
      } else {
        const distance = Math.hypot(unit.x - x0, unit.y - y0);
        if (distance > 0 && unit.fuel > 0) {
          unit.fuel = clampFuel(unit.fuel - distance * FUEL_DRAIN_PER_METER);
          battlefieldDirty = true;
        }
      }
      const speed = Math.hypot(unit.vx, unit.vy);
      if (player.refueling) setActivity(player, "Refueling");
      else if (speed > MOVE_STATUS_SPEED) setActivity(player, "Moving");
      else if (player.activity === "Moving" || player.activity === "Refueling") setActivity(player, "Idle");
      return moved;
    }

    // A gripped stick uses its tilt. The idle station still points up.
    function joystickTilt(player) {
      if (player.gripping) return { x: player.tiltX, y: player.tiltY };
      return { x: 0, y: JOYSTICK_REST_LEAN };
    }

    function joystickKnob(room, player) {
      const rect = getJoystickRect(room);
      const reach = rect.width * JOYSTICK_STICK_RATIO;
      const tilt = joystickTilt(player);
      return {
        x: rect.x + rect.width / 2 + tilt.x * reach,
        y: rect.y + rect.height / 2 - tilt.y * reach
      };
    }

    // The gripped hand sits on the knob, including while the knob leans.
    function placeHandOnKnob(player, room) {
      const knob = joystickKnob(room, player);
      player.x = knob.x;
      player.y = knob.y;
      clampHand(player, room);
    }

    function releaseLockedStations() {
      if (machineStarted) return;
      player1.panelOpen = false;
      player1.panelKind = "";
      player1.gripping = false;
      player1.refueling = false;
      player1.fireOpen = false;
      setRefuelLine(player1, false);
      player2.panelOpen = false;
      player2.panelKind = "";
      player2.gripping = false;
      player2.refueling = false;
      player2.fireOpen = false;
      setRefuelLine(player2, false);
    }

    function update(dt) {
      releaseLockedStations();
      const rooms = getRooms();
      // A zoom panel freezes that hand. A gripped joystick pins it to the knob.
      // Fire control pins it to that station while the keypad is open.
      if (!player1.panelOpen && !player1.gripping && !player1.fireOpen) moveHand(player1, direction("w", "s", "a", "d"), dt, rooms.left);
      if (!player2.panelOpen && !player2.gripping && !player2.fireOpen) moveHand(player2, direction("ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"), dt, rooms.right);

      const moved1 = updateMachine(player1, 0, dt);
      const moved2 = updateMachine(player2, 1, dt);
      if (player1.gripping) placeHandOnKnob(player1, rooms.left);
      if (player2.gripping) placeHandOnKnob(player2, rooms.right);
      if (player1.fireOpen) placeHandOnFire(player1, rooms.left);
      if (player2.fireOpen) placeHandOnFire(player2, rooms.right);
      if (moved1 || moved2) battlefieldDirty = true;
      // The last small step must be saved even if the throttle window has not ended.
      if ((player1WasMoving && !moved1) || (player2WasMoving && !moved2)) flushBattlefield(frameTime, true);
      player1WasMoving = moved1;
      player2WasMoving = moved2;
    }

    function drawHand(hand, color) {
      ctx.fillStyle = color;
      const holding = hand.panelOpen || hand.gripping || hand.holdingStart;
      const pull = holding ? HOLD_FINGER_PULL : 1;
      const sizeRatio = holding ? HOLD_FINGER_RADIUS_RATIO : 1;

      // Fingers are only drawn. They are not part of the hitbox.
      // The palm is drawn after them, so a held finger peeks past the edge.
      for (let i = 0; i < FINGER_SPOTS.length; i++) {
        const spot = FINGER_SPOTS[i];
        ctx.beginPath();
        ctx.arc(hand.x + spot.x * pull, hand.y + spot.y * pull, spot.r * sizeRatio, 0, Math.PI * 2);
        ctx.fill();
      }

      // Palm
      ctx.beginPath();
      ctx.arc(hand.x, hand.y, PALM_RADIUS, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawLabel(text, room) {
      ctx.fillStyle = COLOR_LABEL;
      ctx.font = "bold 20px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      const middle = (room.left + room.right) / 2;
      ctx.fillText(text, middle, 16);
    }

    function draw() {
      const rooms = getRooms();

      ctx.fillStyle = COLOR_ROOM_1;
      ctx.fillRect(rooms.left.left, 0, rooms.left.right - rooms.left.left, canvas.height);

      ctx.fillStyle = COLOR_ROOM_2;
      ctx.fillRect(rooms.right.left, 0, rooms.right.right - rooms.right.left, canvas.height);

      ctx.fillStyle = COLOR_WALL;
      ctx.fillRect(rooms.wallX, 0, WALL_WIDTH, canvas.height);

      drawLabel("Player 1 (WASD, E to interact)", rooms.left);
      drawLabel("Player 2 (Arrow keys, Enter to interact)", rooms.right);

      drawMonitor(rooms.left, player1);
      drawMonitor(rooms.right, player2);
      drawRadar(rooms.left, player1);
      drawRadar(rooms.right, player2);
      drawJoystick(rooms.left, player1);
      drawJoystick(rooms.right, player2);
      drawFuelGauge(rooms.left, player1);
      drawFuelGauge(rooms.right, player2);
      drawRefuelStation(rooms.left, player1);
      drawRefuelStation(rooms.right, player2);
      drawFireStation(rooms.left, player1);
      drawFireStation(rooms.right, player2);
      drawStartButton();

      // Drawn last so the hand appears on top of the stations.
      drawHand(player1, COLOR_P1);
      drawHand(player2, COLOR_P2);

      // Zoom panels sit above the room, one per player.
      drawZoomPanel(rooms.left, player1);
      drawZoomPanel(rooms.right, player2);
    }

    let lastTime = 0;
    let frameTime = 0;
    function frame(time) {
      frameTime = time;
      // time is in milliseconds. dt is seconds since the previous frame.
      let dt = lastTime === 0 ? 0 : (time - lastTime) / 1000;
      lastTime = time;
      // After a tab switch the gap can be huge. Cap it so the hands don't jump.
      if (dt > 0.05) dt = 0.05;

      update(dt);
      updateStartHold(dt, time);
      updateCountdown(time);
      updatePingWarnings();
      updateFuelWarnings();
      updateCollisionWarnings();
      flushBattlefield(time, false);
      draw();
      requestAnimationFrame(frame);
    }

    // Add a line to one player's status monitor. Later code can call this too.
    // text can be a string, or { text, color } when the line is not green.
    function addStatusMessage(player, text) {
      player.messages.push(text);
    }

    // Set the health condition. Unknown names are ignored.
    function setCondition(player, condition) {
      for (let i = 0; i < CONDITION_NAMES.length; i++) {
        if (CONDITION_NAMES[i] === condition) {
          player.condition = condition;
          return;
        }
      }
    }

    // Set what the machine is doing. Unknown names are ignored.
    function setActivity(player, activity) {
      for (let i = 0; i < ACTIVITY_NAMES.length; i++) {
        if (ACTIVITY_NAMES[i] === activity) {
          player.activity = activity;
          return;
        }
      }
    }

    function conditionColor(condition) {
      if (CONDITION_COLORS[condition]) return CONDITION_COLORS[condition];
      return CONDITION_COLORS.Intact;
    }

    function activityColor(activity) {
      if (ACTIVITY_COLORS[activity]) return ACTIVITY_COLORS[activity];
      return ACTIVITY_COLORS.Idle;
    }

    // Health is stored from 0 to MAX_HEALTH. The monitor shows that as a percent.
    function healthPercent(player) {
      const index = player === player1 ? 0 : 1;
      let health = battlefield.players[index].health;
      if (health < 0) health = 0;
      if (health > MAX_HEALTH) health = MAX_HEALTH;
      return Math.round((health / MAX_HEALTH) * 100);
    }

    // Monitor and radar in one horizontal band. Three equal gaps inside that band.
    function stationRow(leftEdge, rightEdge, radarSize, monitorHeight, gap) {
      const width = Math.max(1, rightEdge - leftEdge);
      let radar = radarSize;
      let rowGap = gap;
      let monitorWidth = width - radar - rowGap * 3;

      // A tiny band cannot fit a full-height square. Shrink the radar and keep the gaps equal.
      const minMonitor = Math.max(36, width * 0.38);
      if (monitorWidth < minMonitor) {
        monitorWidth = Math.min(minMonitor, width * 0.5);
        radar = Math.max(16, (width - monitorWidth) * 0.42);
        rowGap = (width - monitorWidth - radar) / 3;
        if (rowGap < 2) {
          rowGap = 2;
          const inner = Math.max(8, width - rowGap * 3);
          radar = Math.max(12, inner * 0.34);
          monitorWidth = inner - radar;
          rowGap = (width - monitorWidth - radar) / 3;
        }
      }

      const monitor = {
        x: leftEdge + rowGap,
        y: MONITOR_TOP,
        width: Math.max(1, monitorWidth),
        height: monitorHeight
      };
      return {
        monitor: monitor,
        radar: {
          x: monitor.x + monitor.width + rowGap,
          y: monitor.y,
          width: radar,
          height: radar
        }
      };
    }

    // Big plate on the left, centered top to bottom, in the open space under the stations.
    // The monitor and radar stay where they are. Only the joystick moves to fit.
    function joystickPlate(room, radarSize, margin, row) {
      const roomWidth = room.right - room.left;
      const rowBottom = row.monitor.y + Math.max(row.monitor.height, row.radar.height);
      const freeTop = rowBottom + margin;
      const bottomLimit = canvas.height - margin;
      let size = radarSize * JOYSTICK_SIZE_RATIO;
      const freeHeight = bottomLimit - freeTop;
      const maxWidth = roomWidth - margin * 2;
      if (freeHeight > 36 && size > freeHeight) size = freeHeight;
      if (size > maxWidth) size = maxWidth;
      if (size < 36) size = 36;

      let y = (canvas.height - size) / 2;
      if (y < freeTop) y = freeTop;
      if (y + size > bottomLimit) y = Math.max(margin, bottomLimit - size);

      return {
        x: room.left + margin,
        y: y,
        width: size,
        height: size
      };
    }

    // Three equal gaps across the whole room. The monitor and radar are not shifted.
    function getStationLayout(room) {
      const roomWidth = room.right - room.left;
      let height = canvas.height * MONITOR_HEIGHT_RATIO;
      const maxHeight = canvas.height - MONITOR_TOP - 24;
      if (height > maxHeight) height = maxHeight;
      if (height < 48 && maxHeight >= 48) height = 48;
      if (height < 1) height = 1;

      const radarSize = height;
      const gap = roomWidth * STATION_GAP_RATIO;
      const row = stationRow(room.left, room.right, radarSize, height, gap);
      return {
        monitor: row.monitor,
        radar: row.radar,
        joystick: joystickPlate(room, row.radar.width, gap, row)
      };
    }

    function getMonitorRect(room) {
      return getStationLayout(room).monitor;
    }

    function getRadarRect(room) {
      return getStationLayout(room).radar;
    }

    function getJoystickRect(room) {
      return getStationLayout(room).joystick;
    }

    // Gauge stacked on the refuel button. Together they match the joystick, on its inner side.
    function fuelColumnRect(room) {
      const joy = getJoystickRect(room);
      let width = FUEL_GAUGE_WIDTH;
      const maxRight = room.right - 8;
      if (joy.x + joy.width + width > maxRight) width = Math.max(28, maxRight - joy.x - joy.width);
      return {
        x: joy.x + joy.width,
        y: joy.y,
        width: width,
        height: joy.height
      };
    }

    function getRefuelRect(room) {
      const column = fuelColumnRect(room);
      let height = column.height * REFUEL_HEIGHT_RATIO;
      if (height < 1) height = 1;
      if (height > column.height - 1) height = column.height - 1;
      return {
        x: column.x,
        y: column.y + column.height - height,
        width: column.width,
        height: height
      };
    }

    function getFuelRect(room) {
      const column = fuelColumnRect(room);
      const button = getRefuelRect(room);
      return {
        x: column.x,
        y: column.y,
        width: column.width,
        height: column.height - button.height
      };
    }

    // Right side of the room, under the monitor row. The joystick and fuel column stay on the left.
    function getFireRect(room) {
      const roomWidth = room.right - room.left;
      const gap = roomWidth * STATION_GAP_RATIO;
      const layout = getStationLayout(room);
      const rowBottom = Math.max(
        layout.monitor.y + layout.monitor.height,
        layout.radar.y + layout.radar.height
      );
      const fuel = fuelColumnRect(room);
      const leftLimit = fuel.x + fuel.width + gap;
      const rightLimit = room.right - gap;
      const topLimit = rowBottom + gap;
      const bottomLimit = canvas.height - gap;
      let width = FIRE_STATION_WIDTH;
      let height = FIRE_STATION_HEIGHT;
      if (rightLimit - leftLimit < width) width = Math.max(80, rightLimit - leftLimit);
      if (bottomLimit - topLimit < height) height = Math.max(80, bottomLimit - topLimit);
      let x = rightLimit - width;
      if (x < leftLimit) x = leftLimit;
      return { x: x, y: topLimit, width: width, height: height };
    }

    // Square around the palm. Fingers are outside this box on purpose.
    function handBox(hand) {
      return {
        left: hand.x - HAND_HITBOX_HALF,
        right: hand.x + HAND_HITBOX_HALF,
        top: hand.y - HAND_HITBOX_HALF,
        bottom: hand.y + HAND_HITBOX_HALF
      };
    }

    // Distance from the hand's center to a station rectangle. 0 means the center is inside.
    function distanceFromHandCenter(hand, rect) {
      const nearestX = Math.max(rect.x, Math.min(hand.x, rect.x + rect.width));
      const nearestY = Math.max(rect.y, Math.min(hand.y, rect.y + rect.height));
      return Math.hypot(hand.x - nearestX, hand.y - nearestY);
    }

    // Gap between the hand's box and the monitor. 0 means they touch or overlap.
    function gapBetweenHandAndMonitor(hand, rect) {
      const box = handBox(hand);
      const gapX = Math.max(box.left - (rect.x + rect.width), rect.x - box.right, 0);
      const gapY = Math.max(box.top - (rect.y + rect.height), rect.y - box.bottom, 0);
      return Math.hypot(gapX, gapY);
    }

    // True when this room's hand is near or over its own monitor.
    function handIsNearMonitor(hand, rect) {
      return gapBetweenHandAndMonitor(hand, rect) <= MONITOR_GLOW_DISTANCE;
    }

    function drawMonitor(room, player) {
      const rect = getMonitorRect(room);
      const near = stationNearHand(player, room) === "monitor";
      const bezel = Math.min(MONITOR_BEZEL, rect.width / 4, rect.height / 4);
      drawConsoleFrame(rect, { label: "STATUS", powerOn: machineStarted });

      const screenX = rect.x + bezel;
      const screenY = rect.y + bezel;
      const screenW = rect.width - bezel * 2;
      const screenH = rect.height - bezel * 2;
      ctx.fillStyle = COLOR_MONITOR_SCREEN;
      ctx.fillRect(screenX, screenY, screenW, screenH);

      drawMessageList(player, screenX, screenY, screenW, screenH, 16, MONITOR_LINE_HEIGHT);
      if (near && machineStarted) drawInteractOutline(rect);
    }

    // Radar sits beside the monitor. Half of the square is RADAR_RANGE units.
    // The frame matches the monitor. Nearness is only the pulsing outline.
    // The screen stays black until H.O.W.L.E.R starts.
    // The small radar shows the sweep and the center dot only. Blips stay hidden here.
    // The hand passes over it; only the middle wall blocks movement.
    function drawRadar(room, player) {
      const rect = getRadarRect(room);
      const bezel = Math.min(MONITOR_BEZEL, rect.width / 4, rect.height / 4);
      const near = stationNearHand(player, room) === "radar";
      // The bottom-right screw is left off so the red ping keeps that corner.
      drawConsoleFrame(rect, {
        label: "RADAR",
        powerOn: machineStarted,
        skipCorners: ["br"],
        reserveRight: RED_PING_SIZE
      });

      const screenX = rect.x + bezel;
      const screenY = rect.y + bezel;
      const screenW = rect.width - bezel * 2;
      const screenH = rect.height - bezel * 2;
      const ownerIndex = player === player1 ? 0 : 1;
      drawRadarPicture(screenX, screenY, screenW, screenH, ownerIndex, false);
      drawRedPing(rect, ownerIndex);
      if (near && machineStarted) drawInteractOutline(rect);
    }

    // Metal plate. The light edge is the top and left; the dark edge is the bottom and right.
    function drawBeveledRect(rect) {
      const x = rect.x;
      const y = rect.y;
      const w = rect.width;
      const h = rect.height;
      const bevel = Math.max(3, Math.min(w, h) * 0.04);
      ctx.fillStyle = COLOR_JOYSTICK_EDGE_LIGHT;
      ctx.fillRect(x, y, w, h);
      ctx.fillStyle = COLOR_JOYSTICK_EDGE_DARK;
      ctx.beginPath();
      ctx.moveTo(x + w, y);
      ctx.lineTo(x + w, y + h);
      ctx.lineTo(x, y + h);
      ctx.lineTo(x + bevel, y + h - bevel);
      ctx.lineTo(x + w - bevel, y + h - bevel);
      ctx.lineTo(x + w - bevel, y + bevel);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = COLOR_JOYSTICK_PLATE;
      ctx.fillRect(x + bevel, y + bevel, w - bevel * 2, h - bevel * 2);
    }

    function drawBeveledPlate(rect) {
      drawBeveledRect(rect);
    }

    function drawFrameVents(rect, bezel) {
      const x = rect.x + bezel * 0.2;
      const w = bezel * 0.48;
      const top = rect.y + bezel * 1.8;
      const bottom = rect.y + rect.height - bezel * 1.8;
      if (bottom - top < 10 || w < 2) return;
      ctx.strokeStyle = COLOR_JOYSTICK_EDGE_DARK;
      ctx.lineWidth = 1;
      const count = 4;
      for (let i = 0; i < count; i++) {
        const y = top + (bottom - top) * (i + 0.5) / count;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + w, y);
        ctx.stroke();
      }
    }

    function drawFrameKnob(rect, bezel) {
      const r = Math.max(2, bezel * 0.26);
      const x = rect.x + rect.width - bezel * 0.5;
      const y = rect.y + rect.height * 0.42;
      ctx.fillStyle = COLOR_JOYSTICK_EDGE_DARK;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = COLOR_JOYSTICK_BOLT;
      ctx.beginPath();
      ctx.arc(x, y, r * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // Small name plate in the bottom bezel. Returns its box, or null if it will not fit.
    function drawFramePlate(rect, text, bezel, reserveRight) {
      const h = Math.min(10, bezel - 2);
      if (h < 7) return null;
      const fontSize = Math.max(8, Math.floor(h - 1));
      ctx.font = fontSize + "px sans-serif";
      const w = ctx.measureText(text).width + 10;
      const rightLimit = rect.x + rect.width - reserveRight - 4;
      const leftLimit = rect.x + bezel;
      const x = rect.x + (rect.width - reserveRight - w) / 2;
      if (x < leftLimit || x + w > rightLimit) return null;
      const y = rect.y + rect.height - bezel + (bezel - h) / 2;
      ctx.fillStyle = COLOR_JOYSTICK_LABEL;
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = COLOR_JOYSTICK_EDGE_LIGHT;
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
      ctx.fillStyle = COLOR_JOYSTICK_LABEL_TEXT;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, x + w / 2, y + h / 2);
      return { x: x, y: y, w: w, h: h };
    }

    function drawPowerLed(label, rect, reserveRight, powerOn) {
      const r = Math.max(2, label.h * 0.26);
      const x = label.x + label.w + r + 3;
      const y = label.y + label.h / 2;
      if (x + r > rect.x + rect.width - reserveRight - 2) return;
      ctx.fillStyle = powerOn ? COLOR_JOYSTICK_LED_ON : COLOR_JOYSTICK_LED_OFF;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }

    // Bezel details only. The screen is drawn later, at the same size as before.
    function drawConsoleFrame(rect, spec) {
      const bezel = Math.min(MONITOR_BEZEL, rect.width / 4, rect.height / 4);
      const skip = spec.skipCorners || [];
      const reserveRight = spec.reserveRight || 0;
      ctx.save();
      drawBeveledRect(rect);
      const boltR = Math.max(2, Math.min(3.5, bezel * 0.28));
      const inset = Math.max(boltR + 1, bezel * 0.48);
      const corners = [
        ["tl", rect.x + inset, rect.y + inset],
        ["tr", rect.x + rect.width - inset, rect.y + inset],
        ["bl", rect.x + inset, rect.y + rect.height - inset],
        ["br", rect.x + rect.width - inset, rect.y + rect.height - inset]
      ];
      for (let i = 0; i < corners.length; i++) {
        if (skip.indexOf(corners[i][0]) !== -1) continue;
        drawBolt(corners[i][1], corners[i][2], boltR);
      }
      drawFrameVents(rect, bezel);
      drawFrameKnob(rect, bezel);
      const label = drawFramePlate(rect, spec.label, bezel, reserveRight);
      if (label) drawPowerLed(label, rect, reserveRight, spec.powerOn);
      ctx.restore();
    }

    function drawBolt(x, y, r) {
      ctx.fillStyle = COLOR_JOYSTICK_EDGE_DARK;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = COLOR_JOYSTICK_BOLT;
      ctx.beginPath();
      ctx.arc(x, y, r * 0.7, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = COLOR_JOYSTICK_EDGE_DARK;
      ctx.lineWidth = Math.max(1, r * 0.28);
      ctx.beginPath();
      ctx.moveTo(x - r * 0.38, y);
      ctx.lineTo(x + r * 0.38, y);
      ctx.stroke();
    }

    // Four short arrows outside the well: up, right, down, left.
    function drawDirectionMarks(cx, cy, s) {
      const wellR = s * JOYSTICK_WELL_RATIO / 2;
      const radius = wellR + s * 0.05;
      const dirs = [
        { x: 0, y: -1 },
        { x: 1, y: 0 },
        { x: 0, y: 1 },
        { x: -1, y: 0 }
      ];
      ctx.fillStyle = COLOR_JOYSTICK_TICK;
      ctx.strokeStyle = COLOR_JOYSTICK_TICK;
      ctx.lineWidth = Math.max(1, s * 0.012);
      for (let i = 0; i < dirs.length; i++) {
        const d = dirs[i];
        const baseX = cx + d.x * radius;
        const baseY = cy + d.y * radius;
        ctx.beginPath();
        ctx.moveTo(baseX, baseY);
        ctx.lineTo(baseX + d.x * s * 0.03, baseY + d.y * s * 0.03);
        ctx.stroke();
        const tipX = baseX + d.x * s * 0.046;
        const tipY = baseY + d.y * s * 0.046;
        const wing = s * 0.016;
        ctx.beginPath();
        ctx.moveTo(tipX, tipY);
        ctx.lineTo(tipX - d.x * wing - d.y * wing, tipY - d.y * wing + d.x * wing);
        ctx.lineTo(tipX - d.x * wing + d.y * wing, tipY - d.y * wing - d.x * wing);
        ctx.closePath();
        ctx.fill();
      }
    }

    // Dark hole, then the rubber boot the stick comes out of.
    function drawJoystickWell(cx, cy, s) {
      const wellR = s * JOYSTICK_WELL_RATIO / 2;
      ctx.fillStyle = COLOR_JOYSTICK_EDGE_DARK;
      ctx.beginPath();
      ctx.arc(cx, cy, wellR, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#2a2a32";
      ctx.beginPath();
      ctx.arc(cx, cy, wellR * 0.9, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = COLOR_JOYSTICK_WELL;
      ctx.beginPath();
      ctx.arc(cx, cy, wellR * 0.76, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = COLOR_JOYSTICK_BOOT;
      ctx.lineWidth = Math.max(2, s * 0.028);
      ctx.beginPath();
      ctx.arc(cx, cy, wellR * 0.4, 0, Math.PI * 2);
      ctx.stroke();
      ctx.lineWidth = Math.max(1, s * 0.012);
      ctx.beginPath();
      ctx.arc(cx, cy, wellR * 0.52, 0, Math.PI * 2);
      ctx.stroke();
    }

    function drawDrivePlate(rect, gripping) {
      const s = rect.width;
      const w = s * 0.24;
      let h = s * 0.065;
      if (h > s * 0.12) h = s * 0.12;
      const x = rect.x + (s - w) / 2;
      const y = rect.y + s - h - Math.max(4, s * 0.04);
      ctx.fillStyle = COLOR_JOYSTICK_LABEL;
      ctx.fillRect(x, y, w, h);
      ctx.strokeStyle = COLOR_JOYSTICK_EDGE_LIGHT;
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
      ctx.fillStyle = COLOR_JOYSTICK_LABEL_TEXT;
      ctx.font = Math.max(9, Math.floor(s * 0.042)) + "px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("DRIVE", x + w / 2, y + h / 2);

      const ledR = Math.max(2.5, s * 0.016);
      const ledX = x + w + s * 0.04;
      const ledY = y + h / 2;
      ctx.fillStyle = gripping ? COLOR_JOYSTICK_LED_ON : COLOR_JOYSTICK_LED_OFF;
      ctx.beginPath();
      ctx.arc(ledX, ledY, ledR, 0, Math.PI * 2);
      ctx.fill();
    }

    // Plate, stick, and knob. tiltX is right. tiltY is battlefield up. Each is about -1 to 1.
    function drawStick(cx, cy, reach, knobR, tiltX, tiltY, stickWidth) {
      const knobX = cx + tiltX * reach;
      const knobY = cy - tiltY * reach;
      const dx = knobX - cx;
      const dy = knobY - cy;
      const length = Math.hypot(dx, dy);
      ctx.save();
      ctx.lineCap = "round";
      ctx.strokeStyle = COLOR_JOYSTICK_STICK;
      ctx.lineWidth = stickWidth;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(knobX, knobY);
      ctx.stroke();
      if (length > stickWidth) {
        const ux = dx / length;
        const uy = dy / length;
        const px = -uy;
        const py = ux;
        ctx.strokeStyle = COLOR_JOYSTICK_STICK_GROOVE;
        ctx.lineWidth = Math.max(1, stickWidth * 0.16);
        for (let i = 1; i <= 4; i++) {
          const t = 0.28 + (i / 5) * 0.42;
          const rx = cx + dx * t;
          const ry = cy + dy * t;
          const rib = stickWidth * 0.46;
          ctx.beginPath();
          ctx.moveTo(rx - px * rib, ry - py * rib);
          ctx.lineTo(rx + px * rib, ry + py * rib);
          ctx.stroke();
        }
      }
      ctx.fillStyle = COLOR_JOYSTICK_KNOB;
      ctx.beginPath();
      ctx.arc(knobX, knobY, knobR, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = COLOR_JOYSTICK_KNOB_CAP;
      ctx.beginPath();
      ctx.arc(knobX, knobY, knobR * 0.58, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // The pivot stays at the middle of the plate, so the hand still lands on the knob.
    function drawJoystickPlate(rect) {
      const s = rect.width;
      const cx = rect.x + s / 2;
      const cy = rect.y + s / 2;
      drawBeveledPlate(rect);
      const inset = s * 0.1;
      const boltR = Math.max(3, s * 0.026);
      drawBolt(rect.x + inset, rect.y + inset, boltR);
      drawBolt(rect.x + s - inset, rect.y + inset, boltR);
      drawBolt(rect.x + inset, rect.y + s - inset, boltR);
      drawBolt(rect.x + s - inset, rect.y + s - inset, boltR);
      drawDirectionMarks(cx, cy, s);
      drawJoystickWell(cx, cy, s);
      return { cx: cx, cy: cy };
    }

    // The stick stands in the room. While the hand grips it, the knob leans with the keys.
    function drawJoystick(room, player) {
      const rect = getJoystickRect(room);
      const near = stationNearHand(player, room) === "joystick";
      ctx.save();
      const spot = drawJoystickPlate(rect);
      drawDrivePlate(rect, player.gripping);
      const tilt = joystickTilt(player);
      drawStick(
        spot.cx,
        spot.cy,
        rect.width * JOYSTICK_STICK_RATIO,
        rect.width * JOYSTICK_KNOB_RATIO,
        tilt.x,
        tilt.y,
        Math.max(5, rect.width * 0.08)
      );
      ctx.restore();
      if (near && machineStarted) drawInteractOutline(rect);
    }

    function fuelOf(player) {
      const index = player === player1 ? 0 : 1;
      return clampFuel(battlefield.players[index].fuel);
    }

    // Empty tank, or a fill that is already running (so the player can cancel it).
    function refuelUsable(player) {
      if (player.refueling) return true;
      return fuelOf(player) <= 0;
    }

    function fuelFillColor(fuel) {
      if (fuel < LOW_FUEL_PERCENT) return COLOR_FUEL_LOW;
      if (fuel <= 50) return COLOR_FUEL_MID;
      return COLOR_FUEL_HIGH;
    }

    // Vertical tank. Green, yellow, or red shows how much is left.
    function drawFuelGauge(room, player) {
      const rect = getFuelRect(room);
      const fuel = fuelOf(player);
      ctx.save();
      drawBeveledRect(rect);
      const boltR = Math.max(2, Math.min(3, rect.width * 0.07));
      const inset = boltR + 3;
      drawBolt(rect.x + inset, rect.y + inset, boltR);
      drawBolt(rect.x + rect.width - inset, rect.y + inset, boltR);
      drawBolt(rect.x + inset, rect.y + rect.height - inset, boltR);
      drawBolt(rect.x + rect.width - inset, rect.y + rect.height - inset, boltR);

      ctx.fillStyle = COLOR_JOYSTICK_LABEL_TEXT;
      ctx.font = "bold 11px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("FUEL", rect.x + rect.width / 2, rect.y + 16);
      ctx.fillStyle = machineStarted ? COLOR_JOYSTICK_LED_ON : COLOR_JOYSTICK_LED_OFF;
      ctx.beginPath();
      ctx.arc(rect.x + rect.width / 2, rect.y + 30, 3.5, 0, Math.PI * 2);
      ctx.fill();

      const tankX = rect.x + 12;
      const tankY = rect.y + 42;
      const tankW = Math.max(8, rect.width - 24);
      const tankH = Math.max(8, rect.height - 76);
      ctx.fillStyle = COLOR_JOYSTICK_WELL;
      ctx.fillRect(tankX, tankY, tankW, tankH);
      const fillH = tankH * (fuel / MAX_FUEL);
      ctx.fillStyle = fuelFillColor(fuel);
      ctx.fillRect(tankX, tankY + tankH - fillH, tankW, fillH);

      ctx.strokeStyle = COLOR_JOYSTICK_TICK;
      ctx.lineWidth = 1;
      const marks = [0.25, 0.5, 0.75];
      for (let i = 0; i < marks.length; i++) {
        const y = tankY + tankH * (1 - marks[i]);
        ctx.beginPath();
        ctx.moveTo(tankX, y);
        ctx.lineTo(tankX + tankW, y);
        ctx.stroke();
      }

      ctx.fillStyle = COLOR_JOYSTICK_LABEL_TEXT;
      ctx.font = "bold 12px sans-serif";
      ctx.fillText(Math.round(fuel) + "%", rect.x + rect.width / 2, rect.y + rect.height - 16);
      ctx.restore();
    }

    function drawRefuelStation(room, player) {
      const rect = getRefuelRect(room);
      const usable = refuelUsable(player);
      const near = stationNearHand(player, room) === "refuel";
      ctx.save();
      drawBeveledRect(rect);
      const boltR = Math.max(2, Math.min(3, rect.width * 0.07));
      const inset = boltR + 2;
      if (rect.width > inset * 2 + 8 && rect.height > inset * 2 + 8) {
        drawBolt(rect.x + inset, rect.y + inset, boltR);
        drawBolt(rect.x + rect.width - inset, rect.y + inset, boltR);
        drawBolt(rect.x + inset, rect.y + rect.height - inset, boltR);
        drawBolt(rect.x + rect.width - inset, rect.y + rect.height - inset, boltR);
      }
      if (!usable) {
        ctx.fillStyle = "rgba(8, 8, 12, 0.45)";
        ctx.fillRect(rect.x, rect.y, rect.width, rect.height);
      }
      ctx.fillStyle = usable ? COLOR_JOYSTICK_LABEL_TEXT : COLOR_REFUEL_DISABLED;
      ctx.font = "bold 10px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("REFUEL", rect.x + rect.width / 2, rect.y + rect.height * 0.36);
      let led = COLOR_JOYSTICK_LED_OFF;
      if (player.refueling) {
        const step = Math.floor((frameTime / 1000) / REFUEL_BLINK_SECONDS);
        led = step % 2 === 0 ? COLOR_REFUEL_LED : "#5a3a10";
      } else if (machineStarted && fuelOf(player) <= 0) {
        led = COLOR_REFUEL_LED;
      }
      ctx.fillStyle = led;
      ctx.beginPath();
      ctx.arc(rect.x + rect.width / 2, rect.y + rect.height * 0.68, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      if (near && machineStarted && usable) drawInteractOutline(rect);
    }

    // Move the keypad highlight by one key. The cursor stops at the edges of the grid.
    function nudgeFireCursor(player, name, left, right, up, down) {
      if (!player.fireOpen || !machineStarted) return;
      let dx = 0;
      let dy = 0;
      if (name === left) dx = -1;
      if (name === right) dx = 1;
      if (name === up) dy = -1;
      if (name === down) dy = 1;
      if (dx === 0 && dy === 0) return;
      const cols = FIRE_KEY_COLS;
      const rows = Math.ceil(FIRE_KEYS.length / cols);
      let col = player.fireIndex % cols;
      let row = Math.floor(player.fireIndex / cols);
      col += dx;
      row += dy;
      if (col < 0) col = 0;
      if (col >= cols) col = cols - 1;
      if (row < 0) row = 0;
      if (row >= rows) row = rows - 1;
      const next = row * cols + col;
      if (next >= 0 && next < FIRE_KEYS.length) player.fireIndex = next;
    }

    // The hand grips the lower-left corner, outside the plate, so the label stays readable.
    function placeHandOnFire(player, room) {
      const rect = getFireRect(room);
      player.x = rect.x - 6;
      player.y = rect.y + rect.height - 8;
      clampHand(player, room);
    }

    function pressFireKey(player) {
      const key = FIRE_KEYS[player.fireIndex];
      if (key === "DONE") {
        player.fireOpen = false;
        player.panelOpen = false;
        player.panelKind = "";
        return;
      }
      if (key === "CLR") {
        player.equation = "";
        return;
      }
      if (key === "⌫") {
        if (player.equation.length > 0) player.equation = player.equation.slice(0, -1);
        return;
      }
      if (player.equation.length >= FIRE_EQUATION_MAX) return;
      player.equation += key;
    }

    // Break the equation into numbers, names, and symbols. Null means the text is not readable.
    function tokenizeEquation(input) {
      const tokens = [];
      let i = 0;
      while (i < input.length) {
        const c = input.charAt(i);
        if (c === " " || c === "\t") {
          i += 1;
          continue;
        }
        if ("+-*/^()".indexOf(c) >= 0) {
          tokens.push({ type: c });
          i += 1;
          continue;
        }
        if ((c >= "0" && c <= "9") || c === ".") {
          const start = i;
          let dots = 0;
          while (i < input.length) {
            const d = input.charAt(i);
            if (d >= "0" && d <= "9") {
              i += 1;
              continue;
            }
            if (d === ".") {
              dots += 1;
              i += 1;
              continue;
            }
            break;
          }
          const text = input.slice(start, i);
          if (dots > 1 || text === ".") return null;
          const value = Number(text);
          if (!isFinite(value)) return null;
          tokens.push({ type: "num", value: value });
          continue;
        }
        if ((c >= "a" && c <= "z") || (c >= "A" && c <= "Z")) {
          const start = i;
          while (i < input.length) {
            const d = input.charAt(i);
            if ((d >= "a" && d <= "z") || (d >= "A" && d <= "Z")) i += 1;
            else break;
          }
          const name = input.slice(start, i).toLowerCase();
          if (name !== "x" && name !== "sin" && name !== "cos" && name !== "sqrt") return null;
          tokens.push({ type: "name", value: name });
          continue;
        }
        return null;
      }
      return tokens;
    }

    // Recursive descent. ^ is tighter than * /, and * / is tighter than + -.
    // A minus in front of a value is a sign. 2x means 2 * x. No eval is used.
    function parseExpression(input) {
      const tokens = tokenizeEquation(input);
      if (!tokens || tokens.length === 0) return null;
      let pos = 0;

      function peek() {
        if (pos >= tokens.length) return null;
        return tokens[pos];
      }

      function startsValue(token) {
        if (!token) return false;
        return token.type === "num" || token.type === "name" || token.type === "(";
      }

      function parseExpr() {
        let left = parseTerm();
        if (!left) return null;
        while (peek() && (peek().type === "+" || peek().type === "-")) {
          const op = peek().type;
          pos += 1;
          const right = parseTerm();
          if (!right) return null;
          left = { op: op, left: left, right: right };
        }
        return left;
      }

      function parseTerm() {
        let left = parseUnary();
        if (!left) return null;
        while (peek()) {
          const token = peek();
          if (token.type === "*" || token.type === "/") {
            pos += 1;
            const right = parseUnary();
            if (!right) return null;
            left = { op: token.type, left: left, right: right };
            continue;
          }
          // 2x, 2sin(x), and 2(x+1) are products even without a * sign.
          if (startsValue(token)) {
            const right = parseUnary();
            if (!right) return null;
            left = { op: "*", left: left, right: right };
            continue;
          }
          break;
        }
        return left;
      }

      function parseUnary() {
        if (peek() && peek().type === "+") {
          pos += 1;
          return parseUnary();
        }
        if (peek() && peek().type === "-") {
          pos += 1;
          const value = parseUnary();
          if (!value) return null;
          return { op: "neg", value: value };
        }
        return parsePower();
      }

      function parsePower() {
        const base = parsePrimary();
        if (!base) return null;
        if (peek() && peek().type === "^") {
          pos += 1;
          const exp = parseUnary();
          if (!exp) return null;
          return { op: "^", left: base, right: exp };
        }
        return base;
      }

      function parsePrimary() {
        const token = peek();
        if (!token) return null;
        if (token.type === "num") {
          pos += 1;
          return { op: "num", value: token.value };
        }
        if (token.type === "name" && token.value === "x") {
          pos += 1;
          return { op: "x" };
        }
        if (token.type === "name") {
          pos += 1;
          if (peek() && peek().type === "(") {
            pos += 1;
          } else {
            return null;
          }
          const arg = parseExpr();
          if (!arg || !peek() || peek().type !== ")") return null;
          pos += 1;
          return { op: token.value, value: arg };
        }
        if (token.type === "(") {
          pos += 1;
          const inner = parseExpr();
          if (!inner || !peek() || peek().type !== ")") return null;
          pos += 1;
          return inner;
        }
        return null;
      }

      const tree = parseExpr();
      if (!tree || pos !== tokens.length) return null;
      return tree;
    }

    function evalExpr(node, x) {
      if (!node) return NaN;
      if (node.op === "num") return node.value;
      if (node.op === "x") return x;
      if (node.op === "neg") return -evalExpr(node.value, x);
      if (node.op === "sin") return Math.sin(evalExpr(node.value, x));
      if (node.op === "cos") return Math.cos(evalExpr(node.value, x));
      if (node.op === "sqrt") return Math.sqrt(evalExpr(node.value, x));
      const a = evalExpr(node.left, x);
      const b = evalExpr(node.right, x);
      if (node.op === "+") return a + b;
      if (node.op === "-") return a - b;
      if (node.op === "*") return a * b;
      if (node.op === "/") return a / b;
      if (node.op === "^") return Math.pow(a, b);
      return NaN;
    }

    function syncEquation(player) {
      if (player.equationParsedFor === player.equation) return;
      player.equationParsedFor = player.equation;
      player.equationTree = parseExpression(player.equation);
      player.flight = player.equationTree ? shellFlight(player.equationTree) : null;
    }

    // First return to the ground after takeoff. Time is the arc length divided by shell speed.
    function shellFlight(tree) {
      const step = SHELL_INTEGRATION_STEP;
      let prevX = 0;
      let prevY = evalExpr(tree, 0);
      if (!isFinite(prevY)) return null;
      let arc = 0;
      let peak = prevY;
      let peakX = 0;
      let leftGround = prevY > 0.02;
      const steps = Math.round(FIRE_GRAPH_X_MAX / step);
      for (let i = 1; i <= steps; i++) {
        const x = i * step;
        const y = evalExpr(tree, x);
        if (!isFinite(y)) return null;
        const seg = Math.hypot(x - prevX, y - prevY);
        if (y > peak) {
          peak = y;
          peakX = x;
        }
        if (y > 0.02) leftGround = true;
        if (leftGround && x > 0 && y <= 0) {
          const drop = prevY - y;
          const t = drop === 0 ? 1 : prevY / drop;
          const mix = t < 0 ? 0 : (t > 1 ? 1 : t);
          return {
            impact: true,
            distance: prevX + (x - prevX) * mix,
            peak: peak,
            peakX: peakX,
            time: (arc + seg * mix) / SHELL_SPEED
          };
        }
        arc += seg;
        prevX = x;
        prevY = y;
      }
      return { impact: false, peak: peak, peakX: peakX };
    }

    function impactLines(player) {
      if (!player.equationTree || !player.flight) return ["Syntax error"];
      if (!player.flight.impact) return ["No impact within range"];
      const flight = player.flight;
      return [
        "Impact distance: " + flight.distance.toFixed(1) + " m",
        "Peak height: " + flight.peak.toFixed(1) + " m",
        "Flight time: " + flight.time.toFixed(1) + " s"
      ];
    }

    // Samples from x = 0 until the shell comes back to the ground, or the axis ends.
    function shellPoints(tree) {
      const points = [];
      let leftGround = false;
      const steps = Math.round(FIRE_GRAPH_X_MAX / FIRE_SAMPLE_STEP);
      for (let i = 0; i <= steps; i++) {
        const x = i * FIRE_SAMPLE_STEP;
        const y = evalExpr(tree, x);
        if (!isFinite(y)) break;
        if (y > 0.02) leftGround = true;
        points.push({ x: x, y: y });
        if (leftGround && y <= 0) break;
      }
      return points;
    }

    function niceTickStep(span) {
      if (!(span > 0)) return 1;
      const raw = span / 4;
      const pow = Math.pow(10, Math.floor(Math.log10(raw)));
      const n = raw / pow;
      let step = 10;
      if (n < 1.5) step = 1;
      else if (n < 3.5) step = 2;
      else if (n < 7.5) step = 5;
      return step * pow;
    }

    function drawShellGraph(screen, tree, flight) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(screen.x, screen.y, screen.w, screen.h);
      ctx.clip();
      ctx.fillStyle = COLOR_RADAR_SCREEN;
      ctx.fillRect(screen.x, screen.y, screen.w, screen.h);

      const padL = 34;
      const padB = 16;
      const padT = 6;
      const padR = 6;
      const plotX = screen.x + padL;
      const plotY = screen.y + padT;
      const plotW = Math.max(8, screen.w - padL - padR);
      const plotH = Math.max(8, screen.h - padT - padB);
      const points = tree ? shellPoints(tree) : [];
      let yMin = 0;
      let yMax = 10;
      for (let i = 0; i < points.length; i++) {
        if (points[i].y < yMin) yMin = points[i].y;
        if (points[i].y > yMax) yMax = points[i].y;
      }
      if (flight && flight.peak > yMax) yMax = flight.peak;
      if (yMax - yMin < 1) yMax = yMin + 10;
      const pad = (yMax - yMin) * 0.08;
      yMin -= pad;
      yMax += pad;
      const ySpan = yMax - yMin;

      function px(x) {
        return plotX + (x / FIRE_GRAPH_X_MAX) * plotW;
      }
      function py(y) {
        return plotY + (1 - (y - yMin) / ySpan) * plotH;
      }

      ctx.strokeStyle = COLOR_RADAR_CROSS;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(px(0), py(yMin));
      ctx.lineTo(px(0), py(yMax));
      const groundY = py(0);
      ctx.moveTo(px(0), groundY);
      ctx.lineTo(px(FIRE_GRAPH_X_MAX), groundY);
      ctx.stroke();

      ctx.fillStyle = COLOR_RADAR_YOU;
      ctx.font = "10px monospace";
      ctx.textBaseline = "top";
      const xTicks = [0, 50, 100];
      for (let i = 0; i < xTicks.length; i++) {
        const tick = xTicks[i];
        ctx.textAlign = tick === 0 ? "left" : (tick === 100 ? "right" : "center");
        ctx.fillText(tick + " m", px(tick), groundY + 2);
      }
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      const yStep = niceTickStep(yMax - yMin);
      const first = Math.ceil(yMin / yStep) * yStep;
      for (let y = first; y <= yMax + yStep * 0.01; y += yStep) {
        if (Math.abs(y) < yStep * 0.01 && y !== 0) continue;
        const label = Math.abs(y) < yStep * 0.01 ? 0 : Math.round(y * 1000) / 1000;
        ctx.fillText(label + " m", plotX - 3, py(y));
      }

      if (points.length > 1) {
        ctx.strokeStyle = COLOR_MONITOR_TEXT;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(px(points[0].x), py(points[0].y));
        for (let i = 1; i < points.length; i++) {
          ctx.lineTo(px(points[i].x), py(points[i].y));
        }
        ctx.stroke();
      }
      if (flight && isFinite(flight.peak)) {
        ctx.fillStyle = COLOR_RADAR_YOU;
        ctx.beginPath();
        ctx.arc(px(flight.peakX), py(flight.peak), 3.5, 0, Math.PI * 2);
        ctx.fill();
      }
      if (flight && flight.impact) {
        const markX = px(flight.distance);
        const markY = py(0);
        const arm = 5;
        ctx.strokeStyle = "#ffb020";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(markX - arm, markY - arm);
        ctx.lineTo(markX + arm, markY + arm);
        ctx.moveTo(markX + arm, markY - arm);
        ctx.lineTo(markX - arm, markY + arm);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawFireStation(room, player) {
      const rect = getFireRect(room);
      const near = stationNearHand(player, room) === "fire";
      syncEquation(player);
      ctx.save();
      drawBeveledRect(rect);
      const boltR = Math.max(2, Math.min(3, rect.width * 0.045));
      const inset = boltR + 4;
      if (rect.width > inset * 2 + 8 && rect.height > inset * 2 + 8) {
        drawBolt(rect.x + inset, rect.y + inset, boltR);
        drawBolt(rect.x + rect.width - inset, rect.y + inset, boltR);
        drawBolt(rect.x + inset, rect.y + rect.height - inset, boltR);
        drawBolt(rect.x + rect.width - inset, rect.y + rect.height - inset, boltR);
      }

      const label = rect.width >= 160 ? "FIRE CONTROL" : "FIRE";
      ctx.fillStyle = COLOR_JOYSTICK_LABEL_TEXT;
      ctx.font = "bold 11px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(label, rect.x + rect.width / 2 - 8, rect.y + rect.height - 16);
      ctx.fillStyle = machineStarted ? COLOR_JOYSTICK_LED_ON : COLOR_JOYSTICK_LED_OFF;
      ctx.beginPath();
      ctx.arc(rect.x + rect.width - inset - 8, rect.y + rect.height - 16, 3.5, 0, Math.PI * 2);
      ctx.fill();

      const innerX = rect.x + 12;
      const innerY = rect.y + 12;
      const innerW = rect.width - 24;
      const eqH = Math.max(28, Math.min(36, rect.height * 0.16));
      const noteH = 16;
      const graphY = innerY + eqH + noteH + 8;
      const graphH = rect.y + rect.height - 30 - graphY;
      // Dark glass until H.O.W.L.E.R has finished booting. No equation and no graph yet.
      if (!machineStarted) {
        ctx.fillStyle = "#000000";
        ctx.fillRect(innerX, innerY, innerW, Math.max(8, rect.y + rect.height - 28 - innerY));
        ctx.restore();
        return;
      }
      ctx.fillStyle = "#000000";
      ctx.fillRect(innerX, innerY, innerW, eqH);
      ctx.save();
      ctx.beginPath();
      ctx.rect(innerX, innerY, innerW, eqH);
      ctx.clip();
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      if (player.equationTree) {
        ctx.font = "12px monospace";
        ctx.fillStyle = COLOR_MONITOR_TEXT;
        ctx.fillText("y = " + player.equation, innerX + 6, innerY + eqH / 2);
      } else {
        ctx.font = "12px monospace";
        ctx.fillStyle = COLOR_MONITOR_WARNING;
        ctx.fillText("Syntax error", innerX + 6, innerY + eqH / 2);
      }
      ctx.restore();
      const note = impactLines(player);
      ctx.font = "10px monospace";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillStyle = player.equationTree && player.flight && player.flight.impact ? COLOR_MONITOR_TEXT : COLOR_MONITOR_WARNING;
      const brief = note.length === 3
        ? note[0].replace("Impact distance: ", "") + " · " + note[1].replace("Peak height: ", "") + " · " + note[2].replace("Flight time: ", "")
        : note[0];
      ctx.fillText(brief, innerX + 4, innerY + eqH + noteH / 2 + 2);

      if (graphH > 20 && innerW > 20) {
        drawShellGraph(
          { x: innerX, y: graphY, w: innerW, h: graphH },
          player.equationTree,
          player.flight
        );
      }
      ctx.restore();
      if (near && machineStarted) drawInteractOutline(rect);
    }

    // The right half of the fire zoom window. Same keys as the old floor overlay.
    function drawFireKeys(rect, player) {
      ctx.save();
      ctx.fillStyle = COLOR_JOYSTICK_WELL;
      ctx.fillRect(rect.x, rect.y, rect.width, rect.height);
      ctx.fillStyle = COLOR_JOYSTICK_LABEL_TEXT;
      ctx.font = "bold 12px sans-serif";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText("KEYPAD", rect.x + 8, rect.y + 14);

      const cols = FIRE_KEY_COLS;
      const rows = Math.ceil(FIRE_KEYS.length / cols);
      const gridX = rect.x + 8;
      const gridY = rect.y + 28;
      const gridW = rect.width - 16;
      const gridH = rect.height - 38;
      const cellW = gridW / cols;
      const cellH = gridH / rows;
      for (let i = 0; i < FIRE_KEYS.length; i++) {
        const col = i % cols;
        const row = Math.floor(i / cols);
        const cx = gridX + col * cellW;
        const cy = gridY + row * cellH;
        const selected = i === player.fireIndex;
        ctx.fillStyle = selected ? "#1c3a28" : "#101014";
        ctx.fillRect(cx + 2, cy + 2, cellW - 4, cellH - 4);
        if (selected) {
          ctx.strokeStyle = COLOR_MONITOR_TEXT;
          ctx.lineWidth = 2;
          ctx.strokeRect(cx + 2, cy + 2, cellW - 4, cellH - 4);
        }
        ctx.fillStyle = COLOR_JOYSTICK_LABEL_TEXT;
        ctx.font = "bold 14px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(FIRE_KEYS[i], cx + cellW / 2, cy + cellH / 2);
      }
      ctx.restore();
    }

    // Left side is the shell graph. Right side is the keypad. Same frame as the monitor zoom.
    function drawFireZoom(player, screenX, screenY, screenW, screenH) {
      syncEquation(player);
      const gap = 10;
      const leftW = Math.floor((screenW - gap) * 0.62);
      const rightX = screenX + leftW + gap;
      const rightW = screenW - leftW - gap;
      const eqH = 34;
      const infoH = 78;
      ctx.fillStyle = "#000000";
      ctx.fillRect(screenX, screenY, leftW, eqH);
      ctx.save();
      ctx.beginPath();
      ctx.rect(screenX, screenY, leftW, eqH);
      ctx.clip();
      ctx.font = "16px monospace";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      if (player.equationTree) {
        ctx.fillStyle = COLOR_MONITOR_TEXT;
        ctx.fillText("y = " + player.equation, screenX + 8, screenY + eqH / 2);
      } else {
        ctx.fillStyle = COLOR_MONITOR_WARNING;
        ctx.fillText("Syntax error", screenX + 8, screenY + eqH / 2);
      }
      ctx.restore();

      const graphY = screenY + eqH + 8;
      const graphH = screenH - eqH - infoH - 16;
      if (graphH > 24) {
        drawShellGraph(
          { x: screenX, y: graphY, w: leftW, h: graphH },
          player.equationTree,
          player.flight
        );
      }

      const lines = impactLines(player);
      const infoY = screenY + screenH - infoH;
      ctx.font = "15px monospace";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillStyle = lines.length === 3 ? COLOR_MONITOR_TEXT : COLOR_MONITOR_WARNING;
      for (let i = 0; i < lines.length; i++) {
        ctx.fillText(lines[i], screenX + 4, infoY + i * 24);
      }
      drawFireKeys({ x: rightX, y: screenY, width: rightW, height: screenH }, player);
    }

    // Soft pulse around the station the hand can use. The station itself does not brighten.
    function drawInteractOutline(rect) {
      const turns = frameTime / 1000 / INTERACT_PULSE_SECONDS;
      const wave = 0.5 + 0.5 * Math.sin(turns * Math.PI * 2);
      const pulse = 0.62 + 0.38 * wave;
      const gap = INTERACT_OUTLINE_GAP;
      ctx.save();
      ctx.strokeStyle = "rgba(180, 255, 214, " + pulse.toFixed(3) + ")";
      ctx.lineWidth = INTERACT_OUTLINE_WIDTH;
      ctx.strokeRect(rect.x - gap, rect.y - gap, rect.width + gap * 2, rect.height + gap * 2);
      ctx.restore();
    }

    // Small square in the bottom-right bezel. Size follows the frame thickness.
    // Blinks red when the opponent is in radar range or near an obstacle.
    // Off until H.O.W.L.E.R starts.
    function drawRedPing(radarRect, ownerIndex) {
      const bezel = Math.min(MONITOR_BEZEL, radarRect.width / 4, radarRect.height / 4);
      const size = Math.min(RED_PING_SIZE, bezel);
      const x = radarRect.x + radarRect.width - size;
      const y = radarRect.y + radarRect.height - size;

      let lit = false;
      if (redPingActive(ownerIndex)) {
        const step = Math.floor((frameTime / 1000) / RED_PING_BLINK_SECONDS);
        lit = step % 2 === 0;
      }
      ctx.fillStyle = lit ? COLOR_RED_PING_ON : COLOR_RED_PING_OFF;
      ctx.fillRect(x, y, size, size);
    }

    function enemyInRadarRange(ownerIndex) {
      if (!machineStarted) return false;
      const you = battlefield.players[ownerIndex];
      const enemy = battlefield.players[1 - ownerIndex];
      return Math.hypot(enemy.x - you.x, enemy.y - you.y) <= RADAR_RANGE;
    }

    function enemyNearObstacle(ownerIndex) {
      if (!machineStarted) return false;
      const enemy = battlefield.players[1 - ownerIndex];
      return collidesWithObstacle(enemy.x, enemy.y, OBSTACLE_NEAR_DISTANCE);
    }

    // Meters from the machine's edge to the obstacle's edge. Negative when they overlap.
    function machineEdgeGap(obstacle, you) {
      const radius = PLAYER_SIZE / 2;
      if (obstacle.type === "tower") {
        return Math.hypot(obstacle.x - you.x, obstacle.y - you.y) - obstacle.r - radius;
      }
      const left = obstacle.x - obstacle.w / 2;
      const right = obstacle.x + obstacle.w / 2;
      const top = obstacle.y - obstacle.h / 2;
      const bottom = obstacle.y + obstacle.h / 2;
      const nearestX = Math.max(left, Math.min(you.x, right));
      const nearestY = Math.max(top, Math.min(you.y, bottom));
      const outside = Math.hypot(nearestX - you.x, nearestY - you.y);
      if (outside > 0) return outside - radius;
      const inside = Math.min(you.x - left, right - you.x, you.y - top, bottom - you.y);
      return -(inside + radius);
    }

    function selfTooCloseToObstacle(ownerIndex) {
      if (!machineStarted) return false;
      const you = battlefield.players[ownerIndex];
      const obstacles = battlefield.obstacles || [];
      for (let i = 0; i < obstacles.length; i++) {
        if (machineEdgeGap(obstacles[i], you) <= SELF_OBSTACLE_WARN_DISTANCE) return true;
      }
      return false;
    }

    // "" when the ping is off. "enemy" or "obstacle" says why it is on.
    function redPingReason(ownerIndex) {
      if (enemyInRadarRange(ownerIndex)) return "enemy";
      if (enemyNearObstacle(ownerIndex)) return "obstacle";
      return "";
    }

    function redPingActive(ownerIndex) {
      return redPingReason(ownerIndex) !== "";
    }

    // Find a warning line by its type, so it can be removed without touching other lines.
    function warningIndex(player, kind) {
      for (let i = 0; i < player.messages.length; i++) {
        const entry = player.messages[i];
        if (entry && entry.kind === kind) return i;
      }
      return -1;
    }

    // Add the line when the warning turns on. Remove that same line when it turns off.
    function setWarningLine(player, kind, text, active, color) {
      const index = warningIndex(player, kind);
      if (active) {
        if (index === -1) {
          player.messages.push({ text: text, color: color || COLOR_MONITOR_WARNING, kind: kind });
        }
        return;
      }
      if (index !== -1) player.messages.splice(index, 1);
    }

    // Low fuel goes away above 20%, and also when an empty tank replaces it.
    function updateFuelWarnings() {
      const players = [player1, player2];
      for (let i = 0; i < players.length; i++) {
        const fuel = machineStarted ? battlefield.players[i].fuel : MAX_FUEL;
        const empty = fuel <= 0;
        const low = fuel > 0 && fuel < LOW_FUEL_PERCENT;
        setWarningLine(players[i], "low-fuel", LOW_FUEL_TEXT, low, COLOR_FUEL_MID);
        setWarningLine(players[i], "out-of-fuel", OUT_OF_FUEL_TEXT, empty);
      }
    }

    // Contact is the position itself. The line drops the moment the machines separate.
    function machineInContact(index) {
      if (!machineStarted) return false;
      const unit = battlefield.players[index];
      const other = battlefield.players[1 - index];
      if (playersTouch(unit, other)) return true;
      return collidesWithObstacle(unit.x, unit.y, PLAYER_SIZE / 2 + CONTACT_EPSILON);
    }

    function updateCollisionWarnings() {
      const players = [player1, player2];
      for (let i = 0; i < players.length; i++) {
        setWarningLine(players[i], "collision", COLLISION_TEXT, machineInContact(i));
      }
    }

    // Each warning is its own line. It comes back later if the same thing happens again.
    function updatePingWarnings() {
      const players = [player1, player2];
      for (let i = 0; i < players.length; i++) {
        setWarningLine(players[i], "enemy", PING_WARNING_ENEMY, enemyInRadarRange(i));
        setWarningLine(players[i], "obstacle", PING_WARNING_OBSTACLE, enemyNearObstacle(i));
        setWarningLine(players[i], "self", PING_WARNING_SELF, selfTooCloseToObstacle(i));
      }
    }

    // How many turns the sweep has made since H.O.W.L.E.R started. 0 points along +x.
    function sweepTurns() {
      if (machineStartedAt < 0) return 0;
      return (frameTime - machineStartedAt) / 1000 / RADAR_SWEEP_SECONDS;
    }

    // 1 when the sweep reaches this angle, then fades to 0 over one full turn.
    function pingAlpha(dx, dy) {
      let angle = Math.atan2(dy, dx);
      if (angle < 0) angle += Math.PI * 2;
      const targetTurns = angle / (Math.PI * 2);
      const swept = sweepTurns();
