        if (selected) {
          ctx.strokeStyle = COLOR_MONITOR_TEXT;
          ctx.lineWidth = 1;
          ctx.strokeRect(cell.x + 1, cell.y + 1, cell.w - 2, cell.h - 2);
        }
        if (cell.index === player.pointPressIndex && pressAge >= 0 && pressAge < pressTotal) {
          const t = pressAge / pressTotal;
          ctx.fillStyle = "rgba(210, 255, 230, " + (0.4 * (1 - t)).toFixed(3) + ")";
          ctx.fillRect(cell.x + 1, cell.y + 1, cell.w - 2, cell.h - 2);
        }
        ctx.fillStyle = COLOR_JOYSTICK_LABEL_TEXT;
        ctx.font = "bold " + fontPx + "px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(FIRE_KEYS[cell.index].label, cell.cx, cell.cy);
      }
      ctx.restore();
    }

    // Two short rows under the equation. A 3-line error stays in one column so it can be read.
    function drawFireReadouts(rect, player) {
      const lines = impactLines(player);
      ctx.save();
      ctx.beginPath();
      ctx.rect(rect.x, rect.y, rect.width, rect.height);
      ctx.clip();
      const fontPx = rect.height < 40 ? 12 : 13;
      ctx.font = fontPx + "px monospace";
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillStyle = player.canFire ? COLOR_MONITOR_TEXT : COLOR_MONITOR_WARNING;
      const cols = lines.length === 3 ? 1 : 2;
      const rows = Math.ceil(lines.length / cols);
      const colW = rect.width / cols;
      const rowH = rect.height / rows;
      for (let i = 0; i < lines.length; i++) {
        const col = i % cols;
        const row = Math.floor(i / cols);
        ctx.fillText(lines[i], rect.x + col * colW + 2, rect.y + row * rowH + rowH / 2);
      }
      ctx.restore();
    }

    // Equation and readouts on top, the graph in the middle, keypad across the bottom.
    function drawFireZoom(player, view) {
      syncEquation(player);
      drawEquationField(view.equation, player, "16px monospace", true);
      drawFireReadouts(view.readouts, player);
      if (view.graph.h > 24 && view.graph.w > 24) {
        drawShellGraph(view.graph, player.equationTree, player.flight, true, player);
      }
      drawFireKeys(view.keypad, player);
    }

    // Big dial. The direction line sits above it. Drag and the arrows still aim the target.
    function drawTurretZoom(player, view) {
      const line = view.direction;
      ctx.save();
      ctx.beginPath();
      ctx.rect(line.x, line.y, line.width, line.height);
      ctx.clip();
      ctx.font = "16px monospace";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = COLOR_MONITOR_TEXT;
      ctx.fillText(directionLine(player), line.x + line.width / 2, line.y + line.height / 2);
      ctx.restore();
      if (view.dial.width > 24 && view.dial.height > 24) drawTurretDial(view.dial, player, true);
    }

    function drawMapZoom(player, view) {
      drawBattlefieldMap(view.map, true, player, true);
    }

    function interactOutlineStyle() {
      const turns = frameTime / 1000 / INTERACT_PULSE_SECONDS;
      const wave = 0.5 + 0.5 * Math.sin(turns * Math.PI * 2);
      const pulse = 0.62 + 0.38 * wave;
      ctx.strokeStyle = "rgba(180, 255, 214, " + pulse.toFixed(3) + ")";
      ctx.lineWidth = INTERACT_OUTLINE_WIDTH;
    }

    // Soft pulse around the station the hand can use. The station itself does not brighten.
    function drawInteractOutline(rect) {
      const gap = INTERACT_OUTLINE_GAP;
      ctx.save();
      interactOutlineStyle();
      ctx.strokeRect(rect.x - gap, rect.y - gap, rect.width + gap * 2, rect.height + gap * 2);
      ctx.restore();
    }

    // The joystick's highlight follows the round well, a few pixels outside it, not the square plate.
    function drawJoystickInteractOutline(rect) {
      const wellR = rect.width * JOYSTICK_WELL_RATIO / 2;
      ctx.save();
      interactOutlineStyle();
      ctx.beginPath();
      ctx.arc(rect.x + rect.width / 2, rect.y + rect.height / 2, wellR + INTERACT_OUTLINE_GAP, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // Opponent-nearby lamp. Same horizontal place as the lower-right glass dot,
    // dropped onto the metal under the glass. The corner screw stays.
    // Blinks red when the opponent is in radar range or near an obstacle.
    // Dark until that happens.
    function drawRedPing(radarRect, ownerIndex) {
      const bezel = Math.min(MONITOR_BEZEL, radarRect.width / 4, radarRect.height / 4);
      const screenX = radarRect.x + bezel;
      const screenW = radarRect.width - bezel * 2;
      const radius = Math.min(3, Math.max(2, bezel * 0.25));
      const x = screenX + screenW - 16;
      const y = radarRect.y + radarRect.height - bezel / 2;

      let lit = false;
      if (redPingActive(ownerIndex)) {
        const step = Math.floor((frameTime / 1000) / RED_PING_BLINK_SECONDS);
        lit = step % 2 === 0;
      }
      ctx.fillStyle = lit ? COLOR_RED_PING_ON : COLOR_RED_PING_OFF;
      ctx.beginPath();
      ctx.arc(x, y, Math.max(2, radius), 0, Math.PI * 2);
      ctx.fill();
    }

    function enemyInRadarRange(ownerIndex) {
      if (!machineStarted) return false;
      const you = battlefield.players[ownerIndex];
      const enemy = battlefield.players[1 - ownerIndex];
      return Math.hypot(enemy.x - you.x, enemy.y - you.y) <= RADAR_RANGE;
    }

    function enemyNearObstacle(ownerIndex) {
      if (!machineStarted) return false;
      const enemy = battlefield.players[1 - ownerIndex];
      return collidesWithObstacle(enemy.x, enemy.y, OBSTACLE_NEAR_DISTANCE);
    }

    // Meters from the machine's edge to the obstacle's edge. Negative when they overlap.
    function machineEdgeGap(obstacle, you) {
      const radius = PLAYER_SIZE / 2;
      const holes = obstacle.holes || [];
      for (let i = 0; i < holes.length; i++) {
        const hole = holes[i];
        const gap = Math.hypot(you.x - hole.x, you.y - hole.y);
        if (gap <= hole.r && pointInFootprint(you.x, you.y, obstacle)) return (hole.r - gap) - radius;
      }
      if (obstacle.type === "tower") {
        return Math.hypot(obstacle.x - you.x, obstacle.y - you.y) - obstacle.r - radius;
      }
      const left = obstacle.x - obstacle.w / 2;
      const right = obstacle.x + obstacle.w / 2;
      const top = obstacle.y - obstacle.h / 2;
      const bottom = obstacle.y + obstacle.h / 2;
      const nearestX = Math.max(left, Math.min(you.x, right));
      const nearestY = Math.max(top, Math.min(you.y, bottom));
      const outside = Math.hypot(nearestX - you.x, nearestY - you.y);
      if (outside > 0) return outside - radius;
      const inside = Math.min(you.x - left, right - you.x, you.y - top, bottom - you.y);
      return -(inside + radius);
    }

    function selfTooCloseToObstacle(ownerIndex) {
      if (!machineStarted) return false;
      const you = battlefield.players[ownerIndex];
      const obstacles = battlefield.obstacles || [];
      for (let i = 0; i < obstacles.length; i++) {
        if (machineEdgeGap(obstacles[i], you) <= SELF_OBSTACLE_WARN_DISTANCE) return true;
      }
      return false;
    }

    // "" when the ping is off. "enemy" or "obstacle" says why it is on.
    function redPingReason(ownerIndex) {
      if (enemyInRadarRange(ownerIndex)) return "enemy";
      if (enemyNearObstacle(ownerIndex)) return "obstacle";
      return "";
    }

    function redPingActive(ownerIndex) {
      return redPingReason(ownerIndex) !== "";
    }

    // Find a warning line by its type, so it can be removed without touching other lines.
    function warningIndex(player, kind) {
      for (let i = 0; i < player.messages.length; i++) {
        const entry = player.messages[i];
        if (entry && entry.kind === kind) return i;
      }
      return -1;
    }

    // Add the line when the warning turns on. Remove that same line when it turns off.
    function setWarningLine(player, kind, text, active, color) {
      const index = warningIndex(player, kind);
      if (active) {
        if (index === -1) {
          player.messages.push({ text: text, color: color || COLOR_MONITOR_WARNING, kind: kind });
        }
        return;
      }
      if (index !== -1) player.messages.splice(index, 1);
    }

    // Low fuel goes away above 20%, and also when an empty tank replaces it.
    function updateFuelWarnings() {
      const players = [player1, player2];
      for (let i = 0; i < players.length; i++) {
        const fuel = machineStarted ? battlefield.players[i].fuel : MAX_FUEL;
        const empty = fuel <= 0;
        const low = fuel > 0 && fuel < LOW_FUEL_PERCENT;
        setWarningLine(players[i], "low-fuel", LOW_FUEL_TEXT, low, COLOR_FUEL_MID);
        setWarningLine(players[i], "out-of-fuel", OUT_OF_FUEL_TEXT, empty);
      }
    }

    // Contact is the position itself. The line drops the moment the machines separate.
    function machineInContact(index) {
      if (!machineStarted) return false;
      const unit = battlefield.players[index];
      const other = battlefield.players[1 - index];
      if (playersTouch(unit, other)) return true;
      return collidesWithObstacle(unit.x, unit.y, PLAYER_SIZE / 2 + CONTACT_EPSILON);
    }

    function updateCollisionWarnings() {
      const players = [player1, player2];
      for (let i = 0; i < players.length; i++) {
        setWarningLine(players[i], "collision", COLLISION_TEXT, machineInContact(i));
      }
    }

    // Each warning is its own line. It comes back later if the same thing happens again.
    function updatePingWarnings() {
      const players = [player1, player2];
      for (let i = 0; i < players.length; i++) {
        setWarningLine(players[i], "enemy", PING_WARNING_ENEMY, enemyInRadarRange(i));
        setWarningLine(players[i], "obstacle", PING_WARNING_OBSTACLE, enemyNearObstacle(i));
        setWarningLine(players[i], "self", PING_WARNING_SELF, selfTooCloseToObstacle(i));
      }
    }

    // How many turns the sweep has made since H.O.W.L.E.R started. 0 points along +x.
    function sweepTurns() {
      if (machineStartedAt < 0) return 0;
      return (frameTime - machineStartedAt) / 1000 / RADAR_SWEEP_SECONDS;
    }

    // 1 when the sweep reaches this angle, then fades to 0 over one full turn.
    function pingAlpha(dx, dy) {
      let angle = Math.atan2(dy, dx);
      if (angle < 0) angle += Math.PI * 2;
      const targetTurns = angle / (Math.PI * 2);
      const swept = sweepTurns();
      if (swept < targetTurns) return 0;
      const age = (swept - targetTurns) % 1;
      return 1 - age;
    }

    function drawRadarSweep(centerX, centerY, radius) {
      // Canvas y grows downward, so a y-up angle is negated.
      const tip = -sweepTurns() * Math.PI * 2;
      for (let i = RADAR_TRAIL_STEPS; i >= 1; i--) {
        const from = tip + ((i - 1) / RADAR_TRAIL_STEPS) * RADAR_TRAIL_ANGLE;
        const to = tip + (i / RADAR_TRAIL_STEPS) * RADAR_TRAIL_ANGLE;
        const fade = 1 - i / RADAR_TRAIL_STEPS;
        ctx.fillStyle = "rgba(57, 255, 106, " + (0.16 * fade).toFixed(3) + ")";
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, from, to);
        ctx.closePath();
        ctx.fill();
      }
      ctx.strokeStyle = COLOR_RADAR_SWEEP;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.lineTo(centerX + Math.cos(tip) * radius, centerY + Math.sin(tip) * radius);
      ctx.stroke();
    }

    // Rings at 5, 10, 15, and 20 m. The outer ring is the radar's range circle.
    // Meter labels are only drawn on the zoomed radar. The small console radar keeps the rings.
    function drawRadarRangeRings(centerX, centerY, rangePx, showLabels) {
      const marks = [5, 10, 15, 20];
      const fontSize = rangePx > 90 ? 11 : 8;
      ctx.font = fontSize + "px monospace";
      ctx.textBaseline = "bottom";
      ctx.lineWidth = 1;
      for (let i = 0; i < marks.length; i++) {
        const meters = marks[i];
        const radius = rangePx * (meters / RADAR_RANGE);
        ctx.strokeStyle = meters === RADAR_RANGE ? COLOR_RADAR_CROSS : "rgba(57, 255, 106, 0.18)";
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        ctx.stroke();
        if (!showLabels) continue;
        ctx.fillStyle = COLOR_RADAR_YOU;
        ctx.textAlign = meters === RADAR_RANGE ? "right" : "center";
        const labelX = meters === RADAR_RANGE ? centerX + radius - 2 : centerX + radius;
        ctx.fillText(meters + " m", labelX, centerY - 1);
      }
    }

    function drawRadarCrosshair(screenX, screenY, screenW, screenH, centerX, centerY) {
      ctx.strokeStyle = COLOR_RADAR_CROSS;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(screenX, centerY);
      ctx.lineTo(screenX + screenW, centerY);
      ctx.moveTo(centerX, screenY);
      ctx.lineTo(centerX, screenY + screenH);
      ctx.stroke();
    }

    // True when any part of the obstacle is inside this player's radar range.
    function obstacleInRange(obstacle, you) {
      if (obstacle.type === "tower") {
        return Math.hypot(obstacle.x - you.x, obstacle.y - you.y) <= RADAR_RANGE + obstacle.r;
      }
      const nearestX = Math.max(obstacle.x - obstacle.w / 2, Math.min(you.x, obstacle.x + obstacle.w / 2));
      const nearestY = Math.max(obstacle.y - obstacle.h / 2, Math.min(you.y, obstacle.y + obstacle.h / 2));
      return Math.hypot(nearestX - you.x, nearestY - you.y) <= RADAR_RANGE;
    }

    function drawRadarBlips(centerX, centerY, rangePx, ownerIndex) {
      const you = battlefield.players[ownerIndex];
      const enemy = battlefield.players[1 - ownerIndex];
      const scale = rangePx / RADAR_RANGE;
      // The circle clip keeps only the part of each shape inside RADAR_RANGE.
      ctx.save();
      ctx.beginPath();
      ctx.arc(centerX, centerY, rangePx, 0, Math.PI * 2);
      ctx.clip();

      const obstacles = battlefield.obstacles || [];
      for (let i = 0; i < obstacles.length; i++) {
        const obstacle = obstacles[i];
        if (!obstacleInRange(obstacle, you)) continue;
        const dx = obstacle.x - you.x;
        const dy = obstacle.y - you.y;
        const alpha = pingAlpha(dx, dy);
        if (alpha <= 0) continue;
        const spotX = centerX + dx * scale;
        const spotY = centerY - dy * scale;
        ctx.save();
        ctx.beginPath();
        if (obstacle.type === "tower") {
          ctx.arc(spotX, spotY, obstacle.r * scale, 0, Math.PI * 2);
        } else {
          const w = obstacle.w * scale;
          const h = obstacle.h * scale;
          ctx.rect(spotX - w / 2, spotY - h / 2, w, h);
        }
        ctx.clip();
        ctx.fillStyle = "rgba(" + COLOR_RADAR_OBSTACLE + ", " + alpha.toFixed(3) + ")";
        ctx.fill();
        const holes = obstacle.holes || [];
        if (holes.length) {
          ctx.fillStyle = COLOR_RADAR_SCREEN;
          for (let h = 0; h < holes.length; h++) {
            const hole = holes[h];
            ctx.beginPath();
            ctx.arc(
              centerX + (hole.x - you.x) * scale,
              centerY - (hole.y - you.y) * scale,
              Math.max(0.5, hole.r * scale),
              0,
              Math.PI * 2
            );
            ctx.fill();
          }
        }
        ctx.restore();
      }

      const enemyDx = enemy.x - you.x;
      const enemyDy = enemy.y - you.y;
      if (Math.hypot(enemyDx, enemyDy) <= RADAR_RANGE) {
        const alpha = pingAlpha(enemyDx, enemyDy);
        if (alpha > 0) {
          ctx.fillStyle = "rgba(" + COLOR_RADAR_ENEMY + ", " + alpha.toFixed(3) + ")";
          ctx.beginPath();
          ctx.arc(
            centerX + enemyDx * scale,
            centerY - enemyDy * scale,
            Math.max(4, rangePx * RADAR_ENEMY_DOT_RATIO),
            0,
            Math.PI * 2
          );
          ctx.fill();
        }
      }
      ctx.restore();
    }

    // Both players read the battlefield the same way: x to the right, y up.
    // Player 2 is not flipped. Kept simple on purpose.
    function drawRadarPicture(screenX, screenY, screenW, screenH, ownerIndex, showBlips) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(screenX, screenY, screenW, screenH);
      ctx.clip();

      ctx.fillStyle = machineStarted ? COLOR_RADAR_SCREEN : COLOR_MONITOR_SCREEN;
      ctx.fillRect(screenX, screenY, screenW, screenH);
      if (!machineStarted) {
        ctx.restore();
        return;
      }

      // Rings, crosshair, sweep, contacts, and the player dot share the glass center.
      const centerX = screenX + screenW / 2;
      const centerY = screenY + screenH / 2;
      const rangePx = Math.min(screenW, screenH) / 2;
      if (!showBlips) drawRadarCrosshair(screenX, screenY, screenW, screenH, centerX, centerY);
      if (showBlips) drawRadarBlips(centerX, centerY, rangePx, ownerIndex);
      drawRadarSweep(centerX, centerY, rangePx);
      drawRadarRangeRings(centerX, centerY, rangePx, showBlips);

      // Zoomed radar only: the machine's square footprint, darker than the contacts.
      if (showBlips) {
        const side = PLAYER_SIZE * (rangePx / RADAR_RANGE);
        ctx.fillStyle = "#145c32";
        ctx.fillRect(centerX - side / 2, centerY - side / 2, side, side);
      }

      ctx.fillStyle = COLOR_RADAR_YOU;
      ctx.beginPath();
      ctx.arc(centerX, centerY, showBlips ? 5 : 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Distance from this machine's center to the closest point on an obstacle's edge.
    function distanceToObstacleEdge(obstacle, you) {
      const holes = obstacle.holes || [];
      for (let i = 0; i < holes.length; i++) {
        const hole = holes[i];
        const gap = Math.hypot(you.x - hole.x, you.y - hole.y);
        if (gap <= hole.r && pointInFootprint(you.x, you.y, obstacle)) return hole.r - gap;
      }
      if (obstacle.type === "tower") {
        const gap = Math.hypot(obstacle.x - you.x, obstacle.y - you.y) - obstacle.r;
        return gap < 0 ? 0 : gap;
      }
      const left = obstacle.x - obstacle.w / 2;
      const right = obstacle.x + obstacle.w / 2;
      const top = obstacle.y - obstacle.h / 2;
      const bottom = obstacle.y + obstacle.h / 2;
      const nearestX = Math.max(left, Math.min(you.x, right));
      const nearestY = Math.max(top, Math.min(you.y, bottom));
      const outside = Math.hypot(nearestX - you.x, nearestY - you.y);
      if (outside > 0) return outside;
      return Math.min(you.x - left, right - you.x, you.y - top, bottom - you.y);
    }

    // -1 when nothing is inside RADAR_RANGE. Otherwise the nearest edge distance.
    function nearestObstacleDistance(you) {
      const obstacles = battlefield.obstacles || [];
      let best = -1;
      for (let i = 0; i < obstacles.length; i++) {
        const obstacle = obstacles[i];
        if (!obstacleInRange(obstacle, you)) continue;
        const dist = distanceToObstacleEdge(obstacle, you);
        if (best < 0 || dist < best) best = dist;
      }
      return best;
    }

    function metersText(distance) {
      return distance.toFixed(1) + " m";
    }

    function radarInfoLines(ownerIndex) {
      const you = battlefield.players[ownerIndex];
      const enemy = battlefield.players[1 - ownerIndex];
      const enemyDist = Math.hypot(enemy.x - you.x, enemy.y - you.y);
      const lines = [];
      if (enemyDist <= RADAR_RANGE) {
        lines.push([{ text: "Enemy distance: " + metersText(enemyDist), color: COLOR_MONITOR_TEXT }]);
      } else {
        lines.push([{ text: "Enemy: no contact", color: COLOR_MONITOR_TEXT }]);
      }
      const obstacleDist = nearestObstacleDistance(you);
      if (obstacleDist >= 0) {
        const parts = [{ text: "Nearest obstacle: " + metersText(obstacleDist), color: COLOR_MONITOR_TEXT }];
        if (selfTooCloseToObstacle(ownerIndex)) {
          parts.push({ text: "  TOO CLOSE", color: COLOR_MONITOR_WARNING });
        }
        lines.push(parts);
      } else {
        lines.push([{ text: "Obstacles: none in range", color: COLOR_MONITOR_TEXT }]);
      }
      return lines;
    }

    function lineWidthOf(parts) {
      let width = 0;
      for (let i = 0; i < parts.length; i++) width += ctx.measureText(parts[i].text).width;
      return width;
    }

    function drawRadarReadout(ownerIndex, x, y, maxWidth) {
      const lines = radarInfoLines(ownerIndex);
      let fontSize = 22;
      ctx.font = fontSize + "px monospace";
      let widest = 0;
      for (let i = 0; i < lines.length; i++) widest = Math.max(widest, lineWidthOf(lines[i]));
      if (widest > maxWidth && maxWidth > 40) {
        fontSize = Math.max(14, Math.floor(fontSize * (maxWidth / widest)));
        ctx.font = fontSize + "px monospace";
      }
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      const lineHeight = fontSize + 10;
      for (let i = 0; i < lines.length; i++) {
        let cursor = x;
        const parts = lines[i];
        for (let p = 0; p < parts.length; p++) {
          ctx.fillStyle = parts[p].color;
          ctx.fillText(parts[p].text, cursor, y + i * lineHeight);
          cursor += ctx.measureText(parts[p].text).width;
        }
      }
    }

    // Big square at the top center. The readout sits underneath it.
    function drawBigRadar(player, screenX, screenY, screenW, screenH) {
      const gap = 16;
      const readoutBand = 80;
      let size = Math.min(screenW - 8, screenH - readoutBand - gap);
      if (size < 48) size = Math.min(screenW - 4, screenH - 4);
      const squareX = screenX + (screenW - size) / 2;
      const squareY = screenY;
      const ownerIndex = player === player1 ? 0 : 1;
      drawRadarPicture(squareX, squareY, size, size, ownerIndex, true);
      const textX = squareX;
      const textW = Math.max(40, screenX + screenW - textX - 4);
      drawRadarReadout(ownerIndex, textX, squareY + size + gap, textW);
    }

    function messageText(entry) {
      // A countdown line is an object so we can change its text without adding a new row.
      if (typeof entry === "string") return entry;
      return entry.text;
    }

    function messageColor(entry) {
      if (typeof entry === "string" || !entry.color) return COLOR_MONITOR_TEXT;
      return entry.color;
    }

    function drawLabeledLine(label, value, color, x, y, fontSize, maxWidth) {
      let size = fontSize;
      const full = label + value;
      ctx.font = size + "px monospace";
      while (size > 10 && ctx.measureText(full).width > maxWidth) {
        size -= 1;
        ctx.font = size + "px monospace";
      }
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillStyle = COLOR_MONITOR_TEXT;
      ctx.fillText(label, x, y);
      const labelW = ctx.measureText(label).width;
      ctx.fillStyle = color;
      ctx.fillText(value, x + labelW, y);
    }

    function statusStripHeight(lineHeight) {
      return lineHeight * 2 + 12;
    }

    // How far Clear must drop so it stays under the zoom's close control, inside the glass.
    function clearTopInset(panel, screenY) {
      const close = closeButtonRect(panel);
      return Math.max(0, close.y + close.height + 4 - (screenY + 6));
    }

    function monitorClearRect(screen, topInset) {
      const width = 46;
      const height = 16;
      const margin = 6;
      let x = screen.x + screen.width - width - margin;
      let y = screen.y + margin + (topInset || 0);
      const left = screen.x + 2;
      const top = screen.y + 2;
      const right = screen.x + screen.width - 2;
      const bottom = screen.y + screen.height - 2;
      if (x < left) x = left;
      if (y < top) y = top;
      if (x + width > right) x = right - width;
      if (y + height > bottom) y = bottom - height;
      return { x: x, y: y, width: width, height: height };
    }

    function clearMonitorLog(player) {
      player.messages = [];
    }

    function drawClearButton(rect) {
      ctx.fillStyle = "#142018";
      ctx.fillRect(rect.x, rect.y, rect.width, rect.height);
      ctx.strokeStyle = "#39ff6a";
      ctx.lineWidth = 1;
      ctx.strokeRect(rect.x + 0.5, rect.y + 0.5, rect.width - 1, rect.height - 1);
      ctx.fillStyle = "#39ff6a";
      ctx.font = "bold 11px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("Clear", rect.x + rect.width / 2, rect.y + rect.height / 2);
    }

    // A long log line continues underneath instead of running off the screen.
    function messageLines(text, maxWidth) {
      if (ctx.measureText(text).width <= maxWidth) return [text];
      const words = text.split(" ");
      const lines = [];
      let current = "";
      for (let i = 0; i < words.length; i++) {
        const next = current ? current + " " + words[i] : words[i];
        if (current && ctx.measureText(next).width > maxWidth) {
          lines.push(current);
          current = words[i];
        } else current = next;
      }
      if (current) lines.push(current);
      return lines.length ? lines : [text];
    }

    function drawMessageList(player, screenX, screenY, screenW, screenH, fontSize, lineHeight, showClear, topInset) {
      // Log on top, then a rule, then health and activity. Clear sits in the top-right of the log.
      const pad = 8;
      const screen = { x: screenX, y: screenY, width: screenW, height: screenH };
      const showStatus = machineStarted;
      const clear = showStatus && showClear !== false ? monitorClearRect(screen, topInset) : null;
      const statusH = showStatus ? lineHeight * 2 + 8 : 0;
      const logY = screenY + pad;
      const logBottom = screenY + screenH - (showStatus ? statusH + 4 : pad);
      const logH = Math.max(lineHeight, logBottom - logY);
      const textRight = clear ? clear.x - 8 : screenX + screenW - pad;
      const maxWidth = Math.max(8, textRight - (screenX + pad));

      ctx.save();
      ctx.beginPath();
      ctx.rect(screenX, screenY, screenW, screenH);
      ctx.clip();

      ctx.save();
      ctx.beginPath();
      ctx.rect(screenX, logY, screenW, logH);
      ctx.clip();
      ctx.font = fontSize + "px monospace";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      const maxLines = Math.max(1, Math.floor(logH / lineHeight));
      const wrapped = [];
      for (let i = 0; i < player.messages.length; i++) {
        const entry = player.messages[i];
        const parts = messageLines(messageText(entry), maxWidth);
        for (let p = 0; p < parts.length; p++) wrapped.push({ text: parts[p], color: messageColor(entry) });
      }
      const start = Math.max(0, wrapped.length - maxLines);
      for (let i = start; i < wrapped.length; i++) {
        ctx.fillStyle = wrapped[i].color;
        ctx.fillText(wrapped[i].text, screenX + pad, logY + (i - start) * lineHeight);
      }
      ctx.restore();

      if (showStatus) {
        const barY = screenY + screenH - statusH;
        ctx.strokeStyle = "rgba(242, 242, 247, 0.4)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(screenX + pad, barY);
        ctx.lineTo(screenX + screenW - pad, barY);
        ctx.stroke();
        const textW = Math.max(8, screenW - pad * 2);
        const health = healthStatusOf(healthPercent(player));
        const state = machineStateOf(player);
        drawLabeledLine("Status: ", health.name + " (" + health.percent + "%)", health.color, screenX + pad, barY + 6, fontSize, textW);
        drawLabeledLine("State: ", state.text, state.color, screenX + pad, barY + 6 + lineHeight, fontSize, textW);
        if (clear) drawClearButton(clear);
      }
      ctx.restore();
    }

    function getZoomRect(room) {
      const roomWidth = room.right - room.left;
      const width = roomWidth * ZOOM_WIDTH_RATIO;
      const height = canvas.height * ZOOM_HEIGHT_RATIO;
      return {
        x: room.left + (roomWidth - width) / 2,
        y: (canvas.height - height) / 2,
        width: width,
        height: height
      };
    }

    function closeButtonRect(panel) {
      return {
        x: panel.x + panel.width - CLOSE_BUTTON_SIZE - 8,
        y: panel.y + 8,
        width: CLOSE_BUTTON_SIZE,
        height: CLOSE_BUTTON_SIZE
      };
    }

    function pointInRect(x, y, rect) {
      return x >= rect.x && x < rect.x + rect.width && y >= rect.y && y < rect.y + rect.height;
    }

    // Only one station per player. If the hand is near more than one, the closer center wins.
    // The fire plate is three regions: the equation, the dial, and the map.
    function stationNearHand(player, room) {
      const plate = stationFireLayout(getFireRect(room));
      const stations = [
        { kind: "monitor", rect: getMonitorRect(room) },
        { kind: "radar", rect: getRadarRect(room) },
        { kind: "joystick", rect: getJoystickRect(room) },
        { kind: "refuel", rect: getRefuelRect(room) },
        { kind: "fire", rect: plate.fire },
        { kind: "turret", rect: plate.dial },
        { kind: "map", rect: plate.map },
        { kind: "storage", rect: getStorageRect(room) },
        { kind: "loader", rect: getLoaderRect(room) }
      ];
      let bestKind = "";
      let bestDist = 0;
      let bestInside = false;
      for (let i = 0; i < stations.length; i++) {
        const station = stations[i];
        const inside = pointInRect(player.x, player.y, station.rect);
        if (!inside && !handIsNearMonitor(player, station.rect)) continue;
        const dist = distanceFromHandCenter(player, station.rect);
        // A hand sitting on a plate belongs to that plate, even when a neighbor's center is closer.
        if (bestKind === "" || (inside && !bestInside) || (inside === bestInside && dist < bestDist)) {
          bestKind = station.kind;
          bestDist = dist;
          bestInside = inside;
        }
      }
      // A full tank keeps the button in the way, but the press does nothing.
      if (bestKind === "refuel" && !refuelUsable(player)) return "";
      return bestKind;
    }

    // Monitor and radar open a zoom panel. The joystick snaps the hand onto its knob.
    // Press the same key again to let go. The hand stays where the knob is.
    function tryInteract(player, room) {
      // Stations stay shut until H.O.W.L.E.R has finished starting.
      // The start button watches the held key itself, so this press is ignored.
      // A press on empty floor only closes the hand until the key comes up.
      player.idleGrab = false;
      if (!machineStarted) {
        player.idleGrab = true;
        return;
      }
      if (player.panelOpen) {
        interactWithZoom(player, room);
        return;
      }
      if (player.refueling) {
        player.refueling = false;
        setRefuelLine(player, false);
        return;
      }
      if (player.gripping) {
        player.gripping = false;
        player.tiltX = 0;
        player.tiltY = 0;
        return;
      }
      if (player.carryingShell) {
        const hole = loaderParts(getLoaderRect(room)).hole;
        const overHole = handOverLoaderHole(player, hole);
        if (!tryDepositShell(player, overHole ? "loader-port" : "")) dropCarriedShell(player);
        return;
      }
      if (player.panelOpen) {
        player.panelOpen = false;
        player.panelKind = "";
        return;
      }
      const kind = stationNearHand(player, room);
      if (!kind) {
        player.idleGrab = true;
        return;
      }
      if (kind === "joystick") {
        player.gripping = true;
        player.tiltX = 0;
        player.tiltY = 0;
        placeHandOnKnob(player, room);
        return;
      }
      if (kind === "refuel") {
        if (!refuelUsable(player)) return;
        player.refueling = true;
        return;
      }
      if (kind === "storage") {
        const well = storageWell(getStorageRect(room));
        takeShell(player, storageSlotUnderHand(player, well));
        return;
      }
      if (kind === "loader") {
        pressLoader(player, room);
        return;
      }
      if (kind === "fire" || kind === "turret" || kind === "map") {
        player.dialDrag = false;
        player.panelOpen = true;
        player.panelKind = kind;
        player.pointReady = false;
        if (kind === "fire") {
          player.fireOpen = true;
          player.fireIndex = -1;
        }
        return;
      }
      player.panelOpen = true;
      player.panelKind = kind;
      player.pointReady = false;
    }

    // The fingertip chooses the action. Outside the window, or on X, the window closes.
    function interactWithZoom(player, room) {
      const panel = getZoomRect(room);
      const tip = { x: player.pointX, y: player.pointY };
      const inside = pointInRect(tip.x, tip.y, panel);
      const onClose = pointInRect(tip.x, tip.y, closeButtonRect(panel));
      if (!inside || onClose) {
        closeZoom(player);
        return;
      }
      player.pointPressFrom = frameTime;
      if (player.panelKind !== "fire" && player.panelKind !== "radar" && player.panelKind !== "turret" && player.panelKind !== "map") {
        const view = zoomContent(room, player.panelKind);
        const screen = { x: view.screenX, y: view.screenY, width: view.screenW, height: view.screenH };
        const topInset = clearTopInset(getZoomRect(room), view.screenY);
        if (pointInRect(tip.x, tip.y, monitorClearRect(screen, topInset))) {
          clearMonitorLog(player);
          return;
        }
      }
      if (player.panelKind === "turret") {
        const dialHit = dialUnderPoint(player, room);
        player.pointPressIndex = -1;
        if (dialHit === "ccw" || dialHit === "cw") {
          player.dialDrag = false;
          nudgeTurret(player, dialHit === "ccw" ? -1 : 1);
          return;
        }
        if (dialHit.indexOf("mark:") === 0) {
          player.dialDrag = false;
          setTurretAngle(player, Number(dialHit.slice(5)));
          return;
        }
        if (dialHit === "face") {
          player.dialDrag = true;
          applyDialDrag(player, room);
        }
        return;
      }
      if (player.panelKind === "map") {
        player.pointPressIndex = -1;
        pressMapWindow(player, room);
        return;
      }
      if (player.panelKind !== "fire") {
        player.pointPressIndex = -1;
        return;
      }
      const keyIndex = keyUnderPoint(player, room);
      if (keyIndex >= 0) {
        player.pointPressIndex = keyIndex;
        player.fireIndex = keyIndex;
        player.dialDrag = false;
        pressFireKey(player);
        return;
      }
      player.pointPressIndex = -1;
      const equation = zoomContent(room, "fire").equation;
      if (pointInRect(tip.x, tip.y, equation)) player.caret = caretFromPoint(player, tip.x, equation);
    }

    // Read-only until attack marks exist. A press on a future mark is the hook.
    function pressMapWindow(player, room) {
      const box = zoomContent(room, "map").map;
      if (!box) return;
      const plot = battlefieldMapPlot(box, true);
      const index = attackMarkUnderPoint(plot, player, player.pointX, player.pointY);
      if (index < 0) return;
    }

    // Screen area inside a zoom frame. Fire, turret, and map each fill that same frame.
    function zoomContent(room, kind) {
      const panel = getZoomRect(room);
      const bezel = Math.min(MONITOR_BEZEL, panel.width / 6, panel.height / 6);
      const screenX = panel.x + bezel;
      const screenY = panel.y + bezel + 8;
      const screenW = panel.width - bezel * 2;
      const screenH = panel.height - bezel * 2 - 8;
      const gap = 8;
      const inset = 8;
      const innerX = screenX + inset;
      const innerY = screenY + inset;
      const innerW = Math.max(40, screenW - inset * 2);
      const innerH = Math.max(40, screenH - inset * 2);
      const frame = {
        panel: panel,
        screenX: screenX,
        screenY: screenY,
        screenW: screenW,
        screenH: screenH
      };
      if (kind === "turret") {
        const dirH = 32;
        const availH = Math.max(40, innerH - dirH - gap);
        const size = Math.min(innerW * 0.86, availH);
        return {
          panel: frame.panel,
          screenX: frame.screenX,
          screenY: frame.screenY,
          screenW: frame.screenW,
          screenH: frame.screenH,
          direction: { x: innerX, y: innerY, width: innerW, height: dirH },
          dial: {
            x: innerX + (innerW - size) / 2,
            y: innerY + dirH + gap,
            width: size,
            height: availH
          }
        };
      }
      if (kind === "map") {
        return {
          panel: frame.panel,
          screenX: frame.screenX,
          screenY: frame.screenY,
          screenW: frame.screenW,
          screenH: frame.screenH,
          map: { x: innerX, y: innerY, width: innerW, height: innerH }
        };
      }
      const eqH = Math.max(26, Math.min(32, innerH * 0.07));
      const infoH = Math.max(36, Math.min(46, innerH * 0.1));
      const keyRows = fireKeyPlacements().rows;
      let padH = Math.min(innerH * 0.32, 40 * keyRows + 8);
      let midH = innerH - eqH - 4 - infoH - gap - padH - gap;
      if (midH < 72) {
        padH = Math.max(68, innerH - eqH - 4 - infoH - gap * 2 - 72);
        midH = innerH - eqH - 4 - infoH - gap - padH - gap;
      }
      const infoY = innerY + eqH + 4;
      const midY = infoY + infoH + gap;
      return {
        panel: frame.panel,
        screenX: frame.screenX,
        screenY: frame.screenY,
        screenW: frame.screenW,
        screenH: frame.screenH,
        equation: { x: innerX, y: innerY, width: innerW, height: eqH },
        readouts: { x: innerX, y: infoY, width: innerW, height: infoH },
        graph: { x: innerX, y: midY, w: innerW, h: Math.max(20, midH) },
        keypad: {
          x: innerX,
          y: midY + Math.max(20, midH) + gap,
          width: innerW,
          height: Math.max(40, padH)
        }
      };
    }

    function drawZoomPanel(room, player) {
      if (!machineStarted || !player.panelOpen) return;

      ctx.fillStyle = COLOR_ROOM_DIM;
      ctx.fillRect(room.left, 0, room.right - room.left, canvas.height);

      const view = zoomContent(room, player.panelKind);
      const panel = view.panel;
      // The close button owns the top-right corner, so that screw is left off.
      let frameLabel = "STATUS";
      if (player.panelKind === "radar") frameLabel = "RADAR";
      if (player.panelKind === "fire") frameLabel = "FIRE";
      if (player.panelKind === "turret") frameLabel = "TURRET";
      if (player.panelKind === "map") frameLabel = "MAP";
      drawConsoleFrame(panel, {
        label: frameLabel,
        powerOn: machineStarted,
        skipCorners: ["tr"]
      });

      const screenX = view.screenX;
      const screenY = view.screenY;
      const screenW = view.screenW;
      const screenH = view.screenH;
      ctx.fillStyle = COLOR_MONITOR_SCREEN;
      ctx.fillRect(screenX, screenY, screenW, screenH);
      if (player.panelKind === "radar") {
        drawBigRadar(player, screenX, screenY, screenW, screenH);
      } else if (player.panelKind === "fire") {
        drawFireZoom(player, view);
      } else if (player.panelKind === "turret") {
        drawTurretZoom(player, view);
      } else if (player.panelKind === "map") {
        drawMapZoom(player, view);
      } else {
        drawMessageList(player, screenX, screenY, screenW, screenH, MONITOR_FONT_SIZE, MONITOR_LINE_HEIGHT, true, clearTopInset(panel, screenY));
      }

      const button = closeButtonRect(panel);
      ctx.fillStyle = "#222228";
      ctx.fillRect(button.x, button.y, button.width, button.height);
      ctx.strokeStyle = COLOR_LABEL;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(button.x + 7, button.y + 7);
      ctx.lineTo(button.x + button.width - 7, button.y + button.height - 7);
      ctx.moveTo(button.x + button.width - 7, button.y + 7);
      ctx.lineTo(button.x + 7, button.y + button.height - 7);
      ctx.stroke();
    }

    // CSS can scale the canvas, so a click is converted into canvas pixels.
    function canvasPointFromClick(event) {
      const bounds = canvas.getBoundingClientRect();
      const scaleX = canvas.width / bounds.width;
      const scaleY = canvas.height / bounds.height;
      return {
        x: (event.clientX - bounds.left) * scaleX,
        y: (event.clientY - bounds.top) * scaleY
      };
    }

    function handleClick(x, y) {
      const rooms = getRooms();
      let player = null;
      let room = null;
      if (x >= rooms.left.left && x < rooms.left.right) {
        player = player1;
        room = rooms.left;
      } else if (x >= rooms.right.left && x < rooms.right.right) {
        player = player2;
        room = rooms.right;
      }
      // A click in the other half, or on the wall, leaves this panel alone.
      if (!player || !player.panelOpen) return;

      const panel = getZoomRect(room);
      const onClose = pointInRect(x, y, closeButtonRect(panel));
      const insidePanel = pointInRect(x, y, panel);
      if (onClose || !insidePanel) closeZoom(player);
    }

    canvas.addEventListener("click", function (event) {
      const point = canvasPointFromClick(event);
      handleClick(point.x, point.y);
    });

    setCondition(player1, "Intact");
    setCondition(player2, "Intact");
    setActivity(player1, "Idle");
    setActivity(player2, "Idle");

    // One shared countdown, but each monitor keeps its own line so we can edit it in place.
    function countdownText(secondsLeft) {
      if (secondsLeft <= 0) return "> Boot complete. All units nominal.";
      return "> Boot sequence: " + MACHINE_NAME + " online in " + secondsLeft + "s";
    }

    const openingLine = ENABLE_HOLD_TO_START ? WAITING_TEXT : countdownText(COUNTDOWN_SECONDS);
    const countdownLines = [
      { text: openingLine },
      { text: openingLine }
    ];
    player1.messages.push(countdownLines[0]);
    player2.messages.push(countdownLines[1]);

    let countdownStartTime = -1;
    let countdownSecondsLeft = COUNTDOWN_SECONDS;
    let machineStarted = false;
    let machineStartedAt = -1;
    let startupBegun = !ENABLE_HOLD_TO_START;
    let startProgress = 0;
    let startFade = 1;

    // Circle centered on the wall. Each half sticks into one player's room.
    function getStartButton() {
      const rooms = getRooms();
      return {
        cx: rooms.wallX + WALL_WIDTH / 2,
        cy: canvas.height / 2,
        r: START_BUTTON_RADIUS
      };
    }

    // The palm box has to meet that player's half of the circle.
    function handTouchesOwnStartHalf(player) {
      const button = getStartButton();
      const box = handBox(player);
      const nearestX = Math.max(box.left, Math.min(button.cx, box.right));
      const nearestY = Math.max(box.top, Math.min(button.cy, box.bottom));
      if (Math.hypot(button.cx - nearestX, button.cy - nearestY) > button.r) return false;
      if (player === player1) return nearestX <= button.cx;
      return nearestX >= button.cx;
    }

    function isHoldingStart(player) {
      if (!ENABLE_HOLD_TO_START) return false;
      if (startupBegun) return false;
      const key = player === player1 ? INTERACT_KEY_P1 : INTERACT_KEY_P2;
      if (!keys[key]) return false;
      return handTouchesOwnStartHalf(player);
    }

    function beginStartup(time) {
      startupBegun = true;
      countdownStartTime = time;
      const text = countdownText(COUNTDOWN_SECONDS);
      countdownLines[0].text = text;
      countdownLines[1].text = text;
      player1.holdingStart = false;
      player2.holdingStart = false;
    }

    // Both hands and both interact keys have to stay down together.
    function updateStartHold(dt, time) {
      if (!ENABLE_HOLD_TO_START) return;
      if (startupBegun) {
        player1.holdingStart = false;
        player2.holdingStart = false;
        if (startFade > 0) {
          startFade -= dt / START_FADE_SECONDS;
          if (startFade < 0) startFade = 0;
        }
        return;
      }
      const hold1 = isHoldingStart(player1);
      const hold2 = isHoldingStart(player2);
      player1.holdingStart = hold1;
      player2.holdingStart = hold2;
      if (hold1 && hold2) {
        startProgress += dt / HOLD_TO_START_SECONDS;
        if (startProgress >= 1) {
          startProgress = 1;
          beginStartup(time);
        }
      } else if (startProgress > 0) {
        startProgress -= dt / START_DRAIN_SECONDS;
        if (startProgress < 0) startProgress = 0;
      }
    }

    function drawStartHalf(cx, cy, radius, fromWest) {
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      if (fromWest) ctx.arc(cx, cy, radius, -Math.PI / 2, Math.PI / 2, true);
      else ctx.arc(cx, cy, radius, -Math.PI / 2, Math.PI / 2, false);
      ctx.closePath();
      ctx.fill();
    }

    function drawStartButton() {
      if (!ENABLE_HOLD_TO_START) return;
      if (startupBegun && startFade <= 0) return;
      const button = getStartButton();
      const inner = button.r - START_RING_WIDTH;
      ctx.save();
      ctx.globalAlpha = startupBegun ? Math.max(0, startFade) : 1;
      if (startupBegun) {
        const sink = 0.82 + 0.18 * startFade;
        ctx.translate(button.cx, button.cy);
        ctx.scale(sink, sink);
        ctx.translate(-button.cx, -button.cy);
      }

      ctx.fillStyle = COLOR_JOYSTICK_EDGE_LIGHT;
      ctx.beginPath();
      ctx.arc(button.cx, button.cy, button.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = COLOR_JOYSTICK_EDGE_DARK;
      ctx.beginPath();
      ctx.arc(button.cx, button.cy, button.r - 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = player1.holdingStart ? COLOR_JOYSTICK_LED_ON : COLOR_JOYSTICK_KNOB_CAP;
      drawStartHalf(button.cx, button.cy, inner, true);
      ctx.fillStyle = player2.holdingStart ? COLOR_JOYSTICK_LED_ON : COLOR_JOYSTICK_KNOB_CAP;
      drawStartHalf(button.cx, button.cy, inner, false);

      ctx.strokeStyle = COLOR_JOYSTICK_EDGE_DARK;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(button.cx, button.cy - inner);
      ctx.lineTo(button.cx, button.cy + inner);
      ctx.stroke();

      if (startProgress > 0) {
        // Drawn on the metal ring so it does not cover the joystick beside the wall.
        ctx.strokeStyle = COLOR_RADAR_SWEEP;
        ctx.lineWidth = 5;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.arc(
          button.cx,
          button.cy,
          button.r - 4,
          -Math.PI / 2,
          -Math.PI / 2 + Math.PI * 2 * startProgress
        );
        ctx.stroke();
      }

      // Two short lines so the plate stays in the gap beside player 2's joystick.
      const labelLines = ["HOLD TO", "START"];
      ctx.font = "bold 12px sans-serif";
      let plateW = 0;
      for (let i = 0; i < labelLines.length; i++) {
        plateW = Math.max(plateW, ctx.measureText(labelLines[i]).width);
      }
      plateW += 14;
      const rooms = getRooms();
      const roomGap = (rooms.left.right - rooms.left.left) * STATION_GAP_RATIO;
      const maxPlate = WALL_WIDTH + roomGap * 2 - 10;
      if (plateW > maxPlate) plateW = maxPlate;
      const plateH = 28;
      const plateX = button.cx - plateW / 2;
      let plateY = button.cy + button.r + 10;
      if (plateY + plateH > canvas.height - 4) plateY = canvas.height - plateH - 4;
      ctx.fillStyle = COLOR_JOYSTICK_LABEL;
      ctx.fillRect(plateX, plateY, plateW, plateH);
      ctx.strokeStyle = COLOR_JOYSTICK_EDGE_LIGHT;
      ctx.lineWidth = 1;
      ctx.strokeRect(plateX + 0.5, plateY + 0.5, plateW - 1, plateH - 1);
      ctx.fillStyle = COLOR_JOYSTICK_LABEL_TEXT;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(labelLines[0], button.cx, plateY + 9);
      ctx.fillText(labelLines[1], button.cx, plateY + 20);
      ctx.restore();
    }

    // Uses the animation timestamp so the ticks stay one second apart.
    // With the hold button off, the countdown starts on the first frame.
    function updateCountdown(time) {
      if (!startupBegun) return;
      if (countdownSecondsLeft === 0) return;
      if (countdownStartTime < 0) countdownStartTime = time;
      const elapsed = (time - countdownStartTime) / 1000;
      let secondsLeft = COUNTDOWN_SECONDS - Math.floor(elapsed);
      if (secondsLeft < 0) secondsLeft = 0;
      if (secondsLeft === countdownSecondsLeft) return;
      countdownSecondsLeft = secondsLeft;
      if (secondsLeft === 0) {
        machineStarted = true;
        machineStartedAt = time;
      }
      const text = countdownText(secondsLeft);
      for (let i = 0; i < countdownLines.length; i++) {
        countdownLines[i].text = text;
      }
    }

    function randomRange(min, max) {
      return min + Math.random() * (max - min);
    }

    // How far the shape sticks out from its center. Used to keep obstacles apart.
    function obstacleReach(obstacle) {
      if (obstacle.type === "tower") return obstacle.r;
      return Math.hypot(obstacle.w / 2, obstacle.h / 2);
    }

    // Huts, blocks, halls, low walls, and towers. Radar and collision only need these two types.
    function randomObstacle() {
      const roll = Math.random();
      if (roll < 0.16) {
        const long = randomRange(18, 34);
        const thick = randomRange(3, 6);
        if (Math.random() < 0.5) return { type: "building", x: 0, y: 0, w: long, h: thick };
        return { type: "building", x: 0, y: 0, w: thick, h: long };
      }
      if (roll < 0.34) {
        const long = randomRange(14, 26);
        const short = randomRange(6, 12);
        if (Math.random() < 0.5) return { type: "building", x: 0, y: 0, w: long, h: short };
        return { type: "building", x: 0, y: 0, w: short, h: long };
      }
      if (roll < 0.56) {
        const side = randomRange(8, 16);
        return { type: "building", x: 0, y: 0, w: side, h: randomRange(side * 0.65, side * 1.15) };
      }
      if (roll < 0.72) {
        const side = randomRange(4, 8);
        return { type: "building", x: 0, y: 0, w: side, h: side };
      }
      if (roll < 0.84) return { type: "tower", x: 0, y: 0, r: randomRange(2, 3.5) };
      if (roll < 0.94) return { type: "tower", x: 0, y: 0, r: randomRange(3.5, 6.5) };
      return { type: "tower", x: 0, y: 0, r: randomRange(6.5, 10) };
    }

    function obstacleHitsPlayers(obstacle, players) {
      const reach = obstacleReach(obstacle);
      for (let i = 0; i < players.length; i++) {
        const distance = Math.hypot(obstacle.x - players[i].x, obstacle.y - players[i].y);
        if (distance < OBSTACLE_CLEARANCE + reach) return true;
      }
      return false;
    }

    function obstacleHitsAnother(obstacle, others) {
      const reach = obstacleReach(obstacle);
      for (let i = 0; i < others.length; i++) {
        const distance = Math.hypot(obstacle.x - others[i].x, obstacle.y - others[i].y);
        if (distance < reach + obstacleReach(others[i])) return true;
      }
      return false;
    }

    // True when the whole obstacle sits outside the field. A shape that crosses the border still counts as inside.
    function obstacleOutsideField(obstacle) {
      let left;
      let right;
      let top;
      let bottom;
      if (obstacle.type === "tower") {
        const r = obstacle.r || 2;
        left = obstacle.x - r;
        right = obstacle.x + r;
        top = obstacle.y - r;
        bottom = obstacle.y + r;
      } else {
        const halfW = (obstacle.w || 6) / 2;
        const halfH = (obstacle.h || 6) / 2;
        left = obstacle.x - halfW;
        right = obstacle.x + halfW;
        top = obstacle.y - halfH;
        bottom = obstacle.y + halfH;
      }
      return right < -FIELD_X_MAX || left > FIELD_X_MAX || bottom < -FIELD_Y_MAX || top > FIELD_Y_MAX;
    }

    function makeObstacles(players) {
      const span = OBSTACLE_COUNT_MAX - OBSTACLE_COUNT_MIN + 1;
      const count = OBSTACLE_COUNT_MIN + Math.floor(Math.random() * span);
      const obstacles = [];
      for (let n = 0; n < count; n++) {
        let placed = null;
        for (let attempt = 0; attempt < OBSTACLE_PLACE_TRIES; attempt++) {
          const obstacle = randomObstacle();
          const reach = obstacleReach(obstacle);
          const xMin = -FIELD_X_MAX + reach;
          const xMax = FIELD_X_MAX - reach;
          const yMin = -FIELD_Y_MAX + reach;
          const yMax = FIELD_Y_MAX - reach;
          if (xMax <= xMin || yMax <= yMin) continue;
          obstacle.x = randomRange(xMin, xMax);
          obstacle.y = randomRange(yMin, yMax);
          if (obstacleHitsPlayers(obstacle, players)) continue;
          if (obstacleHitsAnother(obstacle, obstacles)) continue;
          placed = obstacle;
          break;
        }
        if (placed) obstacles.push(placed);
      }
      return obstacles;
    }

    // Degrees from battlefield +x, counter-clockwise from above, toward the field center.
    function angleTowardCenter(x, y) {
      let deg = Math.atan2(-y, -x) * 180 / Math.PI;
      if (!isFinite(deg)) deg = 0;
      if (deg < 0) deg += 360;
      return deg;
    }

    function aimFromDegrees(degrees) {
      const rad = (((degrees % 360) + 360) % 360) * Math.PI / 180;
      return { x: Math.cos(rad), y: Math.sin(rad) };
    }

    // The viewer reads the fire-station equation and the turret direction off each machine.
    // Driving the joystick does not move the turret.
    function publishFireState(player, unit) {
      syncEquation(player);
      if (unit.equation !== player.equation) {
        unit.equation = player.equation;
        battlefieldDirty = true;
      }
      if (unit.canFire !== player.canFire) {
        unit.canFire = player.canFire;
        battlefieldDirty = true;
      }
      const aim = aimFromDegrees(player.actualAngle);
      if (Math.hypot(aim.x - unit.aimX, aim.y - unit.aimY) > 0.0004) {
        unit.aimX = aim.x;
        unit.aimY = aim.y;
        unit.aimSet = true;
        battlefieldDirty = true;
      }
    }

    // Axis origin is the top-left corner. Axis x runs across the width, axis y down the length.
    // Game x is centered. Game y is centered and points up, opposite the axis y direction.
    function gameFromAxis(axisX, axisY) {
      return {
        x: axisX - FIELD_X_MAX,
        y: FIELD_Y_MAX - axisY
      };
    }

    // Hidden map. It is not drawn in the rooms. The viewer tab reads this object.
    function makeBattlefield() {
      const width = FIELD_X_MAX * 2;
      const height = FIELD_Y_MAX * 2;
      const spots = [
        gameFromAxis(width / 4, height / 4),
        gameFromAxis(width - width / 4, height - height / 4)
      ];
      const owners = [player1, player2];
      const players = [];
      for (let i = 0; i < spots.length; i++) {
        const angle = angleTowardCenter(spots[i].x, spots[i].y);
        const aim = aimFromDegrees(angle);
        if (owners[i]) {
          owners[i].targetAngle = angle;
          owners[i].actualAngle = angle;
          owners[i].turretBusy = false;
        }
        const unit = {
          x: spots[i].x,
          y: spots[i].y,
          health: MAX_HEALTH,
          vx: 0,
          vy: 0,
          fuel: MAX_FUEL,
          equation: FIRE_DEFAULT_EQUATION,
          canFire: true,
          aimX: aim.x,
          aimY: aim.y,
          aimSet: true,
          heading: angle,
          angle: angle,
          targetAngle: angle,
          turretBusy: false,
          loaderLocked: false,
          status: "Idle"
        };
        players.push(unit);
      }
      return {
        width: width,
        height: height,
        players: players,
        obstacles: makeObstacles(players),
        shells: []
      };
    }

    // Hitbox for future shots: the circle itself, radius PLAYER_SIZE / 2.
    function isPointInPlayer(player, x, y) {
      const radius = PLAYER_SIZE / 2;
      const distance = Math.hypot(x - player.x, y - player.y);
      return distance <= radius;
    }

    function pointInFootprint(x, y, obstacle) {
      if (obstacle.type === "tower") {
        return Math.hypot(x - obstacle.x, y - obstacle.y) <= (obstacle.r || 0);
      }
      return Math.abs(x - obstacle.x) <= (obstacle.w || 0) / 2 && Math.abs(y - obstacle.y) <= (obstacle.h || 0) / 2;
    }

    function pointInHole(x, y, obstacle) {
      const holes = obstacle.holes || [];
      for (let i = 0; i < holes.length; i++) {
        const hole = holes[i];
        if (Math.hypot(x - hole.x, y - hole.y) <= hole.r) return true;
      }
      return false;
    }

    // Solid footprint. A blast hole is empty, so a later shell and a machine can pass through it.
    function pointInObstacle(x, y, obstacle) {
      return pointInFootprint(x, y, obstacle) && !pointInHole(x, y, obstacle);
    }

    function closestFootprintPoint(x, y, obstacle) {
      if (obstacle.type === "tower") {
        const dx = x - obstacle.x;
        const dy = y - obstacle.y;
        const dist = Math.hypot(dx, dy);
        const reach = obstacle.r || 0;
        if (dist <= reach || dist < 1e-8) return { x: x, y: y };
        const scale = reach / dist;
        return { x: obstacle.x + dx * scale, y: obstacle.y + dy * scale };
      }
      const halfW = (obstacle.w || 0) / 2;
      const halfH = (obstacle.h || 0) / 2;
      return {
        x: Math.max(obstacle.x - halfW, Math.min(x, obstacle.x + halfW)),
        y: Math.max(obstacle.y - halfH, Math.min(y, obstacle.y + halfH))
      };
    }

    function circleOverlapsFootprint(x, y, radius, obstacle) {
      const near = closestFootprintPoint(x, y, obstacle);
      if (obstacle.type === "tower") {
        return Math.hypot(x - obstacle.x, y - obstacle.y) <= radius + (obstacle.r || 0);
      }
      return Math.hypot(x - near.x, y - near.y) <= radius;
    }

    function circleOverlapsSolid(x, y, radius, obstacle) {
      if (!circleOverlapsFootprint(x, y, radius, obstacle)) return false;
      if (!obstacle.holes || !obstacle.holes.length) return true;
      if (pointInObstacle(x, y, obstacle)) return true;
      const near = closestFootprintPoint(x, y, obstacle);
      if (Math.hypot(near.x - x, near.y - y) <= radius + 1e-4 && pointInObstacle(near.x, near.y, obstacle)) return true;
      const steps = radius < 0.25 ? 8 : 16;
      for (let ring = 0; ring < 2; ring++) {
        const rr = radius * (ring === 0 ? 1 : 0.5);
        if (rr < 1e-4) continue;
        for (let s = 0; s < steps; s++) {
          const angle = (s / steps) * Math.PI * 2;
          if (pointInObstacle(x + Math.cos(angle) * rr, y + Math.sin(angle) * rr, obstacle)) return true;
        }
      }
      return false;
    }

    function circleOverlapsMachine(x, y, radius, unit) {
      const half = PLAYER_SIZE / 2;
      const nearestX = Math.max(unit.x - half, Math.min(x, unit.x + half));
      const nearestY = Math.max(unit.y - half, Math.min(y, unit.y + half));
      return Math.hypot(x - nearestX, y - nearestY) <= radius;
    }

    // Circle vs rectangle (building) and circle vs circle (tower), minus blast holes.
    // Joystick movement uses this so a player cannot walk through solid obstacle.
    function collidesWithObstacle(x, y, radius) {
      const obstacles = battlefield.obstacles || [];
      for (let i = 0; i < obstacles.length; i++) {
        if (circleOverlapsSolid(x, y, radius, obstacles[i])) return true;
      }
      return false;
    }

    const battlefield = makeBattlefield();
    const battlefieldChannel = new BroadcastChannel(BATTLEFIELD_CHANNEL_NAME);
    let battlefieldDirty = false;
    let lastBattlefieldPublish = 0;
    let lastBattlefieldStore = 0;
    let player1WasMoving = false;
    let player2WasMoving = false;

    function travelHeading(vx, vy) {
      let deg = Math.atan2(vy, vx) * 180 / Math.PI;
      if (!isFinite(deg)) deg = 0;
      if (deg < 0) deg += 360;
      return deg;
    }

    // Copy the live machine onto the shared map. The room itself is not drawn from these fields.
    function stampViewerFields() {
      const owners = [player1, player2];
      for (let i = 0; i < owners.length; i++) {
        const player = owners[i];
        const unit = battlefield.players[i];
        if (!unit || !player) continue;
        const speed = Math.hypot(unit.vx, unit.vy);
        if (speed > MOVE_STATUS_SPEED) unit.heading = travelHeading(unit.vx, unit.vy);
        else if (typeof unit.heading !== "number") unit.heading = player.actualAngle;
        unit.angle = player.actualAngle;
        unit.targetAngle = player.targetAngle;
        unit.turretBusy = !!player.turretBusy;
        unit.loaderLocked = !!player.loaderLocked;
        unit.status = machineStateOf(player).text;
      }
      shellSnapshot();
    }

    // Save the map and tell any open viewer tab. The channel carries every tick.
    // Storage is the copy a tab can read the moment it opens.
    function publishBattlefield(persist) {
      stampViewerFields();
      if (persist !== false) {
        try {
          localStorage.setItem(BATTLEFIELD_STORAGE_KEY, JSON.stringify(battlefield));
        } catch (error) {
          // The room still works if the browser blocks storage.
        }
      }
      battlefieldChannel.postMessage({ type: "state", battlefield: battlefield });
    }

    // Stream the full map at a steady rate, and immediately when a move just stopped.
    function flushBattlefield(time, force) {
      const due = force || time - lastBattlefieldPublish >= STATE_PUBLISH_SECONDS * 1000;
      if (!due) return;
      const persist = force || time - lastBattlefieldStore >= 250;
      publishBattlefield(persist);
      if (persist) lastBattlefieldStore = time;
      battlefieldDirty = false;
      lastBattlefieldPublish = time;
    }

    battlefieldChannel.onmessage = function (event) {
      if (event.data && event.data.type === "request-state") publishBattlefield();
    };

    publishBattlefield();

    window.addEventListener("resize", resize);
    resize();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
