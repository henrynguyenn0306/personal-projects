<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Graph Howitzer</title>
  <style>
    /* Fill the window with no scrollbars, same idea as the grid game */
    body { margin: 0; overflow: hidden; background: #14141e; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="room"></canvas>

  <script>
    // Sizes and colors live here so they are easy to change later
    const WALL_WIDTH = 20;
    const HAND_SPEED = 250; // pixels per second
    const COUNTDOWN_SECONDS = 10;
    const MACHINE_NAME = "H.O.M.D";
    // Drawn hand. The hitbox is a square around the palm. Fingers may stick out.
    const PALM_RADIUS = 18;
    const HAND_HITBOX_HALF = PALM_RADIUS;
    const FINGER_RADIUS = 7;
    const FINGER_SPOTS = [
      { x: -12, y: -16 },
      { x: 0, y: -18 },
      { x: 12, y: -16 }
    ];
    const INTERACT_KEY_P1 = "e";
    const INTERACT_KEY_P2 = "Enter";
    // Shift+B opens the hidden battlefield viewer. Nothing in the room mentions it.
    const SECRET_VIEW_KEY = "KeyB";
    const FIELD_X_MAX = 120; // x runs from -120 to 120
    const FIELD_Y_MAX = 100; // y runs from -100 to 100, and up is positive
    const PLAYER_SIZE = 6; // diameter 6 units, so the radius is 3
    const BATTLEFIELD_STORAGE_KEY = "graphHowitzerBattlefield";
    const BATTLEFIELD_CHANNEL_NAME = "graph-howitzer";
    const ZOOM_WIDTH_RATIO = 0.85;
    const ZOOM_HEIGHT_RATIO = 0.7;
    const ZOOM_FONT_SIZE = 28;
    const ZOOM_LINE_HEIGHT = 36;
    const CLOSE_BUTTON_SIZE = 28;
    const COLOR_ROOM_DIM = "rgba(0, 0, 0, 0.55)";
    const COLOR_ROOM_1 = "#1a2230";
    const COLOR_ROOM_2 = "#2a1c24";
    const COLOR_WALL = "#8d8d99";
    const COLOR_P1 = "#3d8bfd";
    const COLOR_P2 = "#ff8a3d";
    const COLOR_LABEL = "#f2f2f7";
    // Monitor sits on the left of its room. Narrower so the radar square fits beside it.
    const MONITOR_WIDTH_RATIO = 0.55;
    const MONITOR_HEIGHT_RATIO = 0.16;
    const MONITOR_TOP = 56; // sits below the player name
    const MONITOR_MARGIN = 16; // base inset from each side of the room
    const STATION_EXTRA_MARGIN_RATIO = 0.04; // shift both stations right by 4% of the room
    const STATION_GAP = MONITOR_MARGIN * 2; // space between the monitor and the radar
    const MONITOR_BEZEL = 12;
    const MONITOR_GLOW_DISTANCE = 40; // how close a hand must be to light the frame
    const MONITOR_LINE_HEIGHT = 20;
    const COLOR_MONITOR_FRAME = "#3a3a42";
    const COLOR_MONITOR_GLOW = "#f2f2f8";
    const COLOR_MONITOR_SCREEN = "#000000";
    const COLOR_MONITOR_TEXT = "#39ff6a";
    // Battlefield units. The square shows everything within 20 units around this player.
    // The square's half-size maps to 20 units.
    const RADAR_RANGE = 20;
    const COLOR_RADAR_SCREEN = "#04140a";
    const COLOR_RADAR_CROSS = "rgba(57, 255, 106, 0.28)";
    const COLOR_RADAR_YOU = "#d8ffe4";

    const canvas = document.getElementById("room");
    const ctx = canvas.getContext("2d");

    // Which keys are held down right now. Both players can hold keys at once.
    const keys = {};

    // Hands start at 0. The first resize places them in the middle of each room.
    const player1 = { x: 0, y: 0, placed: false, messages: [], panelOpen: false };
    const player2 = { x: 0, y: 0, placed: false, messages: [], panelOpen: false };

    // The wall sits in the middle. Each player owns one side of it.
    function getRooms() {
      const wallX = (canvas.width - WALL_WIDTH) / 2;
      return {
        wallX: wallX,
        left: { left: 0, right: wallX },
        right: { left: wallX + WALL_WIDTH, right: canvas.width }
      };
    }

    // Keep the palm square inside one room, including the screen edges.
    function clampHand(hand, room) {
      let minX = room.left + HAND_HITBOX_HALF;
      let maxX = room.right - HAND_HITBOX_HALF;
      let minY = HAND_HITBOX_HALF;
      let maxY = canvas.height - HAND_HITBOX_HALF;

      // A tiny window can be smaller than the hand. Sit in the middle then.
      if (minX > maxX) {
        hand.x = (room.left + room.right) / 2;
      } else {
        if (hand.x < minX) hand.x = minX;
        if (hand.x > maxX) hand.x = maxX;
      }
      if (minY > maxY) {
        hand.y = canvas.height / 2;
      } else {
        if (hand.y < minY) hand.y = minY;
        if (hand.y > maxY) hand.y = maxY;
      }
    }

    function centerHand(hand, room) {
      hand.x = (room.left + room.right) / 2;
      hand.y = canvas.height / 2;
      hand.placed = true;
      clampHand(hand, room);
    }

    // Match the canvas to the browser window, then keep the hands inside.
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const rooms = getRooms();
      if (!player1.placed) {
        centerHand(player1, rooms.left);
        centerHand(player2, rooms.right);
      } else {
        clampHand(player1, rooms.left);
        clampHand(player2, rooms.right);
      }
    }

    // Letters ignore Shift. Arrow names stay as "ArrowUp" and so on.
    function keyName(event) {
      if (event.key === INTERACT_KEY_P2 || event.key.indexOf("Arrow") === 0) return event.key;
      return event.key.toLowerCase();
    }

    window.addEventListener("keydown", function (event) {
      // This is not a movement key. Leave before we record it as a held key.
      if (event.shiftKey && event.code === SECRET_VIEW_KEY) {
        if (!event.repeat) window.open("battlefield.html", "_blank");
        return;
      }
      // Arrow keys scroll the page. Enter would activate a focused control.
      if (event.key.indexOf("Arrow") === 0 || event.key === INTERACT_KEY_P2) event.preventDefault();
      const name = keyName(event);
      const alreadyDown = keys[name] === true;
      keys[name] = true;
      // Key repeat would open and close the panel over and over.
      if (alreadyDown) return;
      if (name === INTERACT_KEY_P1) tryInteract(player1, getRooms().left);
      if (name === INTERACT_KEY_P2) tryInteract(player2, getRooms().right);
    });

    window.addEventListener("keyup", function (event) {
      keys[keyName(event)] = false;
    });

    // Turn held keys into a direction. Diagonal moves stay at the same speed.
    function direction(up, down, left, right) {
      let dx = 0;
      let dy = 0;
      if (keys[left]) dx -= 1;
      if (keys[right]) dx += 1;
      if (keys[up]) dy -= 1;
      if (keys[down]) dy += 1;
      const length = Math.hypot(dx, dy);
      if (length === 0) return { x: 0, y: 0 };
      return { x: dx / length, y: dy / length };
    }

    function moveHand(hand, dir, dt, room) {
      hand.x += dir.x * HAND_SPEED * dt;
      hand.y += dir.y * HAND_SPEED * dt;
      // Stations don't block the hand; only the middle wall does.
      clampHand(hand, room);
    }

    function update(dt) {
      const rooms = getRooms();
      // An open zoom panel freezes that hand. The other player keeps moving.
      if (!player1.panelOpen) moveHand(player1, direction("w", "s", "a", "d"), dt, rooms.left);
      if (!player2.panelOpen) moveHand(player2, direction("ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"), dt, rooms.right);
    }

    function drawHand(hand, color) {
      ctx.fillStyle = color;

      // Fingers are only drawn. They are not part of the hitbox.
      for (let i = 0; i < FINGER_SPOTS.length; i++) {
        ctx.beginPath();
        ctx.arc(hand.x + FINGER_SPOTS[i].x, hand.y + FINGER_SPOTS[i].y, FINGER_RADIUS, 0, Math.PI * 2);
        ctx.fill();
      }

      // Palm
      ctx.beginPath();
      ctx.arc(hand.x, hand.y, PALM_RADIUS, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawLabel(text, room) {
      ctx.fillStyle = COLOR_LABEL;
      ctx.font = "bold 20px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      const middle = (room.left + room.right) / 2;
      ctx.fillText(text, middle, 16);
    }

    function draw() {
      const rooms = getRooms();

      ctx.fillStyle = COLOR_ROOM_1;
      ctx.fillRect(rooms.left.left, 0, rooms.left.right - rooms.left.left, canvas.height);

      ctx.fillStyle = COLOR_ROOM_2;
      ctx.fillRect(rooms.right.left, 0, rooms.right.right - rooms.right.left, canvas.height);

      ctx.fillStyle = COLOR_WALL;
      ctx.fillRect(rooms.wallX, 0, WALL_WIDTH, canvas.height);

      drawLabel("Player 1 (WASD, E to interact)", rooms.left);
      drawLabel("Player 2 (Arrow keys, Enter to interact)", rooms.right);

      drawMonitor(rooms.left, player1);
      drawMonitor(rooms.right, player2);
      drawRadar(rooms.left);
      drawRadar(rooms.right);

      // Drawn last so the hand appears on top of the stations.
      drawHand(player1, COLOR_P1);
      drawHand(player2, COLOR_P2);

      // Zoom panels sit above the room, one per player.
      drawZoomPanel(rooms.left, player1);
      drawZoomPanel(rooms.right, player2);
    }

    let lastTime = 0;
    function frame(time) {
      // time is in milliseconds. dt is seconds since the previous frame.
      let dt = lastTime === 0 ? 0 : (time - lastTime) / 1000;
      lastTime = time;
      // After a tab switch the gap can be huge. Cap it so the hands don't jump.
      if (dt > 0.05) dt = 0.05;

      update(dt);
      updateCountdown(time);
      draw();
      requestAnimationFrame(frame);
    }

    // Add a line to one player's status monitor. Later code can call this too.
    function addStatusMessage(player, text) {
      player.messages.push(text);
    }

    // Monitor on the left, radar square on its right. Same top, under the player label.
    function getStationLayout(room) {
      const roomWidth = room.right - room.left;
      let height = canvas.height * MONITOR_HEIGHT_RATIO;
      const maxHeight = canvas.height - MONITOR_TOP - 24;
      if (height > maxHeight) height = maxHeight;
      if (height < 48 && maxHeight >= 48) height = 48;
      if (height < 1) height = 1;

      const leftMargin = MONITOR_MARGIN + roomWidth * STATION_EXTRA_MARGIN_RATIO;
      let gap = STATION_GAP;
      let monitorWidth = roomWidth * MONITOR_WIDTH_RATIO;
      let radarSize = height;
      let maxRow = roomWidth - leftMargin - MONITOR_MARGIN;
      if (maxRow < 2) maxRow = Math.max(2, roomWidth - 2);
      if (monitorWidth + gap + radarSize > maxRow) {
        gap = Math.min(gap, Math.max(1, maxRow * 0.12));
        radarSize = Math.min(radarSize, Math.max(1, (maxRow - gap) * 0.45));
        monitorWidth = Math.max(1, maxRow - gap - radarSize);
      }

      const monitor = {
        x: room.left + Math.min(leftMargin, roomWidth - maxRow),
        y: MONITOR_TOP,
        width: monitorWidth,
        height: height
      };
      return {
        monitor: monitor,
        radar: {
          x: monitor.x + monitor.width + gap,
          y: monitor.y,
          width: radarSize,
          height: radarSize
        }
      };
    }

    function getMonitorRect(room) {
      return getStationLayout(room).monitor;
    }

    function getRadarRect(room) {
      return getStationLayout(room).radar;
    }

    // Square around the palm. Fingers are outside this box on purpose.
    function handBox(hand) {
      return {
        left: hand.x - HAND_HITBOX_HALF,
        right: hand.x + HAND_HITBOX_HALF,
        top: hand.y - HAND_HITBOX_HALF,
        bottom: hand.y + HAND_HITBOX_HALF
      };
    }

    // Gap between the hand's box and the monitor. 0 means they touch or overlap.
    function gapBetweenHandAndMonitor(hand, rect) {
      const box = handBox(hand);
      const gapX = Math.max(box.left - (rect.x + rect.width), rect.x - box.right, 0);
      const gapY = Math.max(box.top - (rect.y + rect.height), rect.y - box.bottom, 0);
      return Math.hypot(gapX, gapY);
    }

    // True when this room's hand is near or over its own monitor.
    function handIsNearMonitor(hand, rect) {
      return gapBetweenHandAndMonitor(hand, rect) <= MONITOR_GLOW_DISTANCE;
    }

    function drawMonitor(room, player) {
      const rect = getMonitorRect(room);
      const near = handIsNearMonitor(player, rect);
      const bezel = Math.min(MONITOR_BEZEL, rect.width / 4, rect.height / 4);

      ctx.fillStyle = near ? COLOR_MONITOR_GLOW : COLOR_MONITOR_FRAME;
      ctx.fillRect(rect.x, rect.y, rect.width, rect.height);

      const screenX = rect.x + bezel;
      const screenY = rect.y + bezel;
      const screenW = rect.width - bezel * 2;
      const screenH = rect.height - bezel * 2;
      ctx.fillStyle = COLOR_MONITOR_SCREEN;
      ctx.fillRect(screenX, screenY, screenW, screenH);

      drawMessageList(player, screenX, screenY, screenW, screenH, 16, MONITOR_LINE_HEIGHT);
    }

    // Radar sits beside the monitor. Half of the square is RADAR_RANGE units.
    // The frame matches the monitor. The screen stays black until H.O.M.D starts.
    // After that, the center dot is this player ("you").
    // The hand passes over it; only the middle wall blocks movement.
    function drawRadar(room) {
      const rect = getRadarRect(room);
      const bezel = Math.min(MONITOR_BEZEL, rect.width / 4, rect.height / 4);

      ctx.fillStyle = COLOR_MONITOR_FRAME;
      ctx.fillRect(rect.x, rect.y, rect.width, rect.height);

      const screenX = rect.x + bezel;
      const screenY = rect.y + bezel;
      const screenW = rect.width - bezel * 2;
      const screenH = rect.height - bezel * 2;

      if (!machineStarted) {
        ctx.fillStyle = COLOR_MONITOR_SCREEN;
        ctx.fillRect(screenX, screenY, screenW, screenH);
        return;
      }

      ctx.fillStyle = COLOR_RADAR_SCREEN;
      ctx.fillRect(screenX, screenY, screenW, screenH);

      const centerX = screenX + screenW / 2;
      const centerY = screenY + screenH / 2;
      ctx.strokeStyle = COLOR_RADAR_CROSS;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(screenX, centerY);
      ctx.lineTo(screenX + screenW, centerY);
      ctx.moveTo(centerX, screenY);
      ctx.lineTo(centerX, screenY + screenH);
      ctx.stroke();

      ctx.fillStyle = COLOR_RADAR_YOU;
      ctx.beginPath();
      ctx.arc(centerX, centerY, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    function messageText(entry) {
      // A countdown line is an object so we can change its text without adding a new row.
      if (typeof entry === "string") return entry;
      return entry.text;
    }

    function drawMessageList(player, screenX, screenY, screenW, screenH, fontSize, lineHeight) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(screenX, screenY, screenW, screenH);
      ctx.clip();
      ctx.fillStyle = COLOR_MONITOR_TEXT;
      ctx.font = fontSize + "px monospace";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      const maxLines = Math.max(1, Math.floor((screenH - 8) / lineHeight));
      const start = Math.max(0, player.messages.length - maxLines);
      for (let i = start; i < player.messages.length; i++) {
        const line = i - start;
        ctx.fillText(messageText(player.messages[i]), screenX + 8, screenY + 6 + line * lineHeight);
      }
      ctx.restore();
    }

    function getZoomRect(room) {
      const roomWidth = room.right - room.left;
      const width = roomWidth * ZOOM_WIDTH_RATIO;
      const height = canvas.height * ZOOM_HEIGHT_RATIO;
      return {
        x: room.left + (roomWidth - width) / 2,
        y: (canvas.height - height) / 2,
        width: width,
        height: height
      };
    }

    function closeButtonRect(panel) {
      return {
        x: panel.x + panel.width - CLOSE_BUTTON_SIZE - 8,
        y: panel.y + 8,
        width: CLOSE_BUTTON_SIZE,
        height: CLOSE_BUTTON_SIZE
      };
    }

    function pointInRect(x, y, rect) {
      return x >= rect.x && x < rect.x + rect.width && y >= rect.y && y < rect.y + rect.height;
    }

    // Open with the interact key while close to the monitor. Press it again to close.
    function tryInteract(player, room) {
      if (player.panelOpen) {
        player.panelOpen = false;
        return;
      }
      if (handIsNearMonitor(player, getMonitorRect(room))) {
        player.panelOpen = true;
      }
    }

    function drawZoomPanel(room, player) {
      if (!player.panelOpen) return;

      ctx.fillStyle = COLOR_ROOM_DIM;
      ctx.fillRect(room.left, 0, room.right - room.left, canvas.height);

      const panel = getZoomRect(room);
      const bezel = Math.min(MONITOR_BEZEL, panel.width / 6, panel.height / 6);
      ctx.fillStyle = COLOR_MONITOR_FRAME;
      ctx.fillRect(panel.x, panel.y, panel.width, panel.height);

      const screenX = panel.x + bezel;
      const screenY = panel.y + bezel + 8;
      const screenW = panel.width - bezel * 2;
      const screenH = panel.height - bezel * 2 - 8;
      ctx.fillStyle = COLOR_MONITOR_SCREEN;
      ctx.fillRect(screenX, screenY, screenW, screenH);
      drawMessageList(player, screenX, screenY, screenW, screenH, ZOOM_FONT_SIZE, ZOOM_LINE_HEIGHT);

      const button = closeButtonRect(panel);
      ctx.fillStyle = "#222228";
      ctx.fillRect(button.x, button.y, button.width, button.height);
      ctx.strokeStyle = COLOR_LABEL;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(button.x + 7, button.y + 7);
      ctx.lineTo(button.x + button.width - 7, button.y + button.height - 7);
      ctx.moveTo(button.x + button.width - 7, button.y + 7);
      ctx.lineTo(button.x + 7, button.y + button.height - 7);
      ctx.stroke();
    }

    // CSS can scale the canvas, so a click is converted into canvas pixels.
    function canvasPointFromClick(event) {
      const bounds = canvas.getBoundingClientRect();
      const scaleX = canvas.width / bounds.width;
      const scaleY = canvas.height / bounds.height;
      return {
        x: (event.clientX - bounds.left) * scaleX,
        y: (event.clientY - bounds.top) * scaleY
      };
    }

    function handleClick(x, y) {
      const rooms = getRooms();
      let player = null;
      let room = null;
      if (x >= rooms.left.left && x < rooms.left.right) {
        player = player1;
        room = rooms.left;
      } else if (x >= rooms.right.left && x < rooms.right.right) {
        player = player2;
        room = rooms.right;
      }
      // A click in the other half, or on the wall, leaves this panel alone.
      if (!player || !player.panelOpen) return;

      const panel = getZoomRect(room);
      const onClose = pointInRect(x, y, closeButtonRect(panel));
      const insidePanel = pointInRect(x, y, panel);
      if (onClose || !insidePanel) player.panelOpen = false;
    }

    canvas.addEventListener("click", function (event) {
      const point = canvasPointFromClick(event);
      handleClick(point.x, point.y);
    });

    addStatusMessage(player1, "> All systems ready.");
    addStatusMessage(player2, "> All systems ready.");

    // One shared countdown, but each monitor keeps its own line so we can edit it in place.
    function countdownText(secondsLeft) {
      if (secondsLeft <= 0) return "> " + MACHINE_NAME + " started.";
      return "> Starting " + MACHINE_NAME + " in " + secondsLeft + "s";
    }

    const countdownLines = [
      { text: countdownText(COUNTDOWN_SECONDS) },
      { text: countdownText(COUNTDOWN_SECONDS) }
    ];
    player1.messages.push(countdownLines[0]);
    player2.messages.push(countdownLines[1]);

    let countdownStartTime = -1;
    let countdownSecondsLeft = COUNTDOWN_SECONDS;
    let machineStarted = false;

    // Uses the animation timestamp so the ticks stay one second apart.
    function updateCountdown(time) {
      if (countdownSecondsLeft === 0) return;
      if (countdownStartTime < 0) countdownStartTime = time;
      const elapsed = (time - countdownStartTime) / 1000;
      let secondsLeft = COUNTDOWN_SECONDS - Math.floor(elapsed);
      if (secondsLeft < 0) secondsLeft = 0;
      if (secondsLeft === countdownSecondsLeft) return;
      countdownSecondsLeft = secondsLeft;
      if (secondsLeft === 0) machineStarted = true;
      const text = countdownText(secondsLeft);
      for (let i = 0; i < countdownLines.length; i++) {
        countdownLines[i].text = text;
      }
    }

    // Hidden map. It is not drawn in the rooms. The viewer tab reads this object.
    function makeBattlefield() {
      return {
        width: FIELD_X_MAX * 2,
        height: FIELD_Y_MAX * 2,
        players: [
          { x: -60, y: 0 },
          { x: 60, y: 0 }
        ]
      };
    }

    // Hitbox for future shots: the circle itself, radius PLAYER_SIZE / 2.
    function isPointInPlayer(player, x, y) {
      const radius = PLAYER_SIZE / 2;
      const distance = Math.hypot(x - player.x, y - player.y);
      return distance <= radius;
    }

    const battlefield = makeBattlefield();
    const battlefieldChannel = new BroadcastChannel(BATTLEFIELD_CHANNEL_NAME);

    // Save the map and tell any open viewer tab. Call this again if the map changes.
    function publishBattlefield() {
      try {
        localStorage.setItem(BATTLEFIELD_STORAGE_KEY, JSON.stringify(battlefield));
      } catch (error) {
        // The room still works if the browser blocks storage.
      }
      battlefieldChannel.postMessage({ type: "state", battlefield: battlefield });
    }

    battlefieldChannel.onmessage = function (event) {
      if (event.data && event.data.type === "request-state") publishBattlefield();
    };

    publishBattlefield();

    window.addEventListener("resize", resize);
    resize();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
