        if (destroyed) doomed.push(obstacle);
      }
      if (doomed.length) {
        battlefield.obstacles = obstacles.filter(function (obstacle) {
          return doomed.indexOf(obstacle) < 0;
        });
      }
      return outcome;
    }

    function explodeShell(shell, reason) {
      shell.alive = false;
      shell.damage = Math.max(1, Math.round(shell.speed * SHELL_DAMAGE_PER_MPS));
      if (reason === "ground") shell.height = 0;
      let world = shellWorld(shell);
      if (reason === "ground") world = { x: world.x, y: world.y, z: 0 };
      if (reason === "border" || world.x < -FIELD_X_MAX || world.x > FIELD_X_MAX || world.y < -FIELD_Y_MAX || world.y > FIELD_Y_MAX) {
        world = {
          x: Math.max(-FIELD_X_MAX, Math.min(FIELD_X_MAX, world.x)),
          y: Math.max(-FIELD_Y_MAX, Math.min(FIELD_Y_MAX, world.y)),
          z: Math.max(0, world.z)
        };
      }
      shell.blast = {
        x: world.x,
        y: world.y,
        z: world.z,
        age: 0,
        reason: reason,
        speed: shell.speed,
        distance: shell.distance,
        height: shell.height,
        radius: SHELL_BLAST_RADIUS
      };
      const outcome = applyBlast(shell);
      const player = shell.owner === 0 ? player1 : player2;
      addStatusMessage(player, shellImpactLine(reason, shell, outcome));
    }

    function pathPoint(shell, seg, t) {
      const a = shell.path[seg];
      const b = shell.path[seg + 1];
      const distance = a.x + (b.x - a.x) * t;
      const height = a.y + (b.y - a.y) * t;
      return {
        distance: distance,
        height: height,
        x: shell.originX + shell.aimX * distance,
        y: shell.originY + shell.aimY * distance,
        z: height
      };
    }

    // Portion of a segment that overlaps an axis-aligned rectangle. u is 0 at the start.
    function segmentRectSpan(x0, y0, x1, y1, left, right, bottom, top) {
      let t0 = 0;
      let t1 = 1;
      const dx = x1 - x0;
      const dy = y1 - y0;
      function clip(p, q) {
        if (Math.abs(p) < 1e-12) return q >= -1e-8;
        const r = q / p;
        if (p < 0) {
          if (r > t1) return false;
          if (r > t0) t0 = r;
        } else {
          if (r < t0) return false;
          if (r < t1) t1 = r;
        }
        return true;
      }
      if (!clip(-dx, x0 - left)) return null;
      if (!clip(dx, right - x0)) return null;
      if (!clip(-dy, y0 - bottom)) return null;
      if (!clip(dy, top - y0)) return null;
      if (t1 < t0) return null;
      return { enter: t0, exit: t1 };
    }

    function circleSpan(x0, y0, x1, y1, cx, cy, radius) {
      const dx = x1 - x0;
      const dy = y1 - y0;
      const fx = x0 - cx;
      const fy = y0 - cy;
      const a = dx * dx + dy * dy;
      const b = 2 * (fx * dx + fy * dy);
      const c = fx * fx + fy * fy - radius * radius;
      if (a < 1e-12) return c <= 0 ? { enter: 0, exit: 1 } : null;
      const disc = b * b - 4 * a * c;
      if (disc < 0) return null;
      const root = Math.sqrt(disc);
      let lo = (-b - root) / (2 * a);
      let hi = (-b + root) / (2 * a);
      if (lo > hi) {
        const swap = lo;
        lo = hi;
        hi = swap;
      }
      lo = Math.max(0, lo);
      hi = Math.min(1, hi);
      if (hi < lo) return null;
      return { enter: lo, exit: hi };
    }

    function overlapSpan(aLo, aHi, bLo, bHi) {
      const lo = Math.max(aLo, bLo);
      const hi = Math.min(aHi, bHi);
      if (hi < lo + 1e-8) return null;
      return { lo: lo, hi: hi };
    }

    // u along the segment where height is above the ground and at most zMax.
    function heightUSpan(z0, z1, zMax) {
      const zMin = 1e-3;
      if (Math.abs(z1 - z0) < 1e-12) {
        return z0 > zMin && z0 <= zMax ? { lo: 0, hi: 1 } : null;
      }
      const uMin = (zMin - z0) / (z1 - z0);
      const uMax = (zMax - z0) / (z1 - z0);
      const rising = z1 > z0;
      let lo = rising ? uMin : uMax;
      let hi = rising ? uMax : uMin;
      lo = Math.max(0, lo);
      hi = Math.min(1, hi);
      if (hi < lo + 1e-8) return null;
      return { lo: lo, hi: hi };
    }

    // In the air the shell is its own small dot against the footprint. The blast is
    // placed where the path is closest to the opponent's center, so a shot aimed
    // through the center is not stopped on the near face.
    function opponentU(x0, y0, z0, x1, y1, z1, enemy) {
      const half = PLAYER_SIZE / 2 + SHELL_BODY_RADIUS;
      const span = segmentRectSpan(
        x0, y0, x1, y1,
        enemy.x - half, enemy.x + half, enemy.y - half, enemy.y + half
      );
      if (!span) return null;
      const heights = heightUSpan(z0, z1, PLAYER_SIZE);
      if (!heights) return null;
      const band = overlapSpan(span.enter, span.exit, heights.lo, heights.hi);
      if (!band) return null;
      const dx = x1 - x0;
      const dy = y1 - y0;
      const len2 = dx * dx + dy * dy;
      let uRaw = band.lo;
      if (len2 > 1e-12) uRaw = ((enemy.x - x0) * dx + (enemy.y - y0) * dy) / len2;
      if (uRaw > 1 + 1e-4 && band.hi >= 1 - 1e-4) return null;
      if (uRaw < band.lo) return band.lo;
      if (uRaw > band.hi) return band.hi;
      return uRaw;
    }

    function obstacleOuterSpan(x0, y0, x1, y1, obstacle) {
      const pad = SHELL_BODY_RADIUS;
      if (obstacle.type === "tower") {
        return circleSpan(x0, y0, x1, y1, obstacle.x, obstacle.y, (obstacle.r || 0) + pad);
      }
      const halfW = (obstacle.w || 0) / 2 + pad;
      const halfH = (obstacle.h || 0) / 2 + pad;
      return segmentRectSpan(
        x0, y0, x1, y1,
        obstacle.x - halfW, obstacle.x + halfW, obstacle.y - halfH, obstacle.y + halfH
      );
    }

    // First point where the small shell meets solid obstacle, skipping blast holes.
    function firstObstacleU(x0, y0, z0, x1, y1, z1, obstacle) {
      const heights = heightUSpan(z0, z1, SHELL_OBSTACLE_HEIGHT);
      if (!heights) return null;
      const outer = obstacleOuterSpan(x0, y0, x1, y1, obstacle);
      if (!outer) return null;
      let u = Math.max(outer.enter, heights.lo);
      const limit = Math.min(outer.exit, heights.hi);
      if (u > limit + 1e-6) return null;
      const holes = obstacle.holes || [];
      for (let n = 0; n < holes.length + 2; n++) {
        const x = x0 + (x1 - x0) * u;
        const y = y0 + (y1 - y0) * u;
        let hole = null;
        for (let h = 0; h < holes.length; h++) {
          if (Math.hypot(x - holes[h].x, y - holes[h].y) < holes[h].r - 1e-4) {
            hole = holes[h];
            break;
          }
        }
        if (!hole) return u;
        const span = circleSpan(x0, y0, x1, y1, hole.x, hole.y, hole.r);
        if (!span || span.exit <= u + 1e-5) return null;
        u = span.exit + 1e-4;
        if (u > limit) return null;
      }
      return null;
    }

    function outsideField(x, y) {
      return x < -FIELD_X_MAX || x > FIELD_X_MAX || y < -FIELD_Y_MAX || y > FIELD_Y_MAX;
    }

    function borderU(x0, y0, z0, x1, y1, z1) {
      const startedInside = !outsideField(x0, y0);
      const endedInside = !outsideField(x1, y1);
      if (startedInside && endedInside) return null;
      const span = segmentRectSpan(x0, y0, x1, y1, -FIELD_X_MAX, FIELD_X_MAX, -FIELD_Y_MAX, FIELD_Y_MAX);
      let u = 0;
      if (startedInside && span) u = span.exit;
      else if (!startedInside && span && span.enter > 0) u = span.enter;
      const z = z0 + (z1 - z0) * u;
      if (z <= 1e-3) return null;
      return Math.max(0, Math.min(1, u));
    }

    // Earliest in-air contact on this slice of the curve. u is relative to the slice.
    function earliestAerial(shell, seg, tA, tB) {
      if (tB <= tA + 1e-8) return null;
      const from = pathPoint(shell, seg, tA);
      const to = pathPoint(shell, seg, tB);
      let bestU = 2;
      let reason = "";
      const enemy = battlefield.players[1 - shell.owner];
      if (enemy) {
        const u = opponentU(from.x, from.y, from.z, to.x, to.y, to.z, enemy);
        if (u !== null && u < bestU) {
          bestU = u;
          reason = "opponent";
        }
      }
      const obstacles = battlefield.obstacles || [];
      for (let i = 0; i < obstacles.length; i++) {
        const u = firstObstacleU(from.x, from.y, from.z, to.x, to.y, to.z, obstacles[i]);
        if (u !== null && u < bestU) {
          bestU = u;
          reason = "obstacle";
        }
      }
      const edge = borderU(from.x, from.y, from.z, to.x, to.y, to.z);
      if (edge !== null && edge < bestU) {
        bestU = edge;
        reason = "border";
      }
      if (!reason) return null;
      return { t: tA + (tB - tA) * bestU, reason: reason };
    }

    function arriveShell(shell, seg, t, yFrom, timeLeft) {
      const a = shell.path[seg];
      const b = shell.path[seg + 1];
      const segLen = Math.hypot(b.x - a.x, b.y - a.y);
      const point = pathPoint(shell, seg, t);
      const step = Math.max(0, t * segLen - shell.into);
      shell.into = t * segLen;
      shell.distance = point.distance;
      shell.height = point.height;
      shell.speed = adjustShellSpeed(shell.speed, yFrom, point.height);
      shell.damage = Math.max(1, Math.round(shell.speed * SHELL_DAMAGE_PER_MPS));
      return timeLeft - step / Math.max(shell.speed, SHELL_MIN_SPEED);
    }

    // Follow the curve, including under the ground. In the air the shell's own dot
    // finds the contact. Height 0 uses the exact crossing, then the blast circle.
    function advanceShell(shell, dt) {
      let timeLeft = dt;
      const path = shell.path;
      while (timeLeft > 1e-4 && shell.alive) {
        if (shell.seg >= path.length - 1) {
          explodeShell(shell, "end of path");
          return;
        }
        const a = path[shell.seg];
        const b = path[shell.seg + 1];
        const segLen = Math.hypot(b.x - a.x, b.y - a.y);
        if (segLen < 1e-6) {
          shell.seg += 1;
          shell.into = 0;
          continue;
        }
        const t0 = shell.into / segLen;
        const remain = segLen - shell.into;
        const step = Math.min(remain, Math.max(1e-4, shell.speed * timeLeft));
        const t1 = t0 + step / segLen;
        const y0 = a.y + (b.y - a.y) * t0;
        const y1 = a.y + (b.y - a.y) * t1;
        const crosses = (y0 > 1e-4 && y1 <= 1e-4) || (y0 < -1e-4 && y1 >= -1e-4);
        let tGround = null;
        if (crosses) {
          const denom = y1 - y0;
          const u = denom === 0 ? 1 : (0 - y0) / denom;
          tGround = t0 + (t1 - t0) * Math.max(0, Math.min(1, u));
        }
        const tLimit = tGround === null ? t1 : tGround;
        if (y0 > 1e-3) {
          const hit = earliestAerial(shell, shell.seg, t0, tLimit);
          if (hit && hit.t <= tLimit + 1e-6) {
            timeLeft = arriveShell(shell, shell.seg, hit.t, y0, timeLeft);
            explodeShell(shell, hit.reason);
            return;
          }
        }
        timeLeft = arriveShell(shell, shell.seg, tLimit, y0, timeLeft);
        if (tGround !== null && groundContact(shell)) {
          explodeShell(shell, "ground");
          return;
        }
        if (shell.into >= segLen - 1e-4) {
          shell.seg += 1;
          shell.into = 0;
        }
      }
    }

    function updateLiveShells(dt) {
      for (let i = liveShells.length - 1; i >= 0; i--) {
        const shell = liveShells[i];
        if (shell.alive) advanceShell(shell, dt);
        if (shell.blast) {
          shell.blast.age += dt;
          if (shell.blast.age >= SHELL_EXPLOSION_SECONDS) liveShells.splice(i, 1);
        }
      }
    }

    function shellSnapshot() {
      const list = [];
      for (let i = 0; i < liveShells.length; i++) {
        const shell = liveShells[i];
        const world = shellWorld(shell);
        const item = {
          owner: shell.owner,
          x: world.x,
          y: world.y,
          z: world.z,
          alive: shell.alive,
          distance: shell.distance,
          height: shell.height,
          speed: shell.speed,
          damage: shell.damage
        };
        if (shell.blast) {
          item.blast = {
            x: shell.blast.x,
            y: shell.blast.y,
            z: shell.blast.z,
            radius: shell.blast.radius,
            age: shell.blast.age,
            reason: shell.blast.reason,
            speed: shell.blast.speed,
            distance: shell.blast.distance,
            height: shell.blast.height
          };
        }
        list.push(item);
      }
      battlefield.shells = list;
    }

    function loaderRecovering(player) {
      return frameTime < player.loaderRecoverUntil;
    }

    // Red while the breech is locked and the gun is not recovering from a shot.
    function loaderFireLit(player) {
      return machineStarted && player.loaderLocked && !loaderRecovering(player);
    }

    function compactLoaderSlots(player) {
      const packed = [];
      for (let i = 0; i < player.loaderSlots.length; i++) {
        if (player.loaderSlots[i]) packed.push(player.loaderSlots[i]);
      }
      for (let i = 0; i < LOADER_SLOT_COUNT; i++) {
        player.loaderSlots[i] = i < packed.length ? packed[i] : null;
      }
    }

    function pressLoaderFire(player) {
      if (loaderRecovering(player)) {
        addStatusMessage(player, "> Loader: Recovering.");
        return;
      }
      if (!player.loaderLocked) return;
      if (loaderReadySlot(player) < 0) return;
      const reason = fireBlockReason(player);
      if (reason) {
        player.statusNotice = reason;
        addStatusMessage(player, "> Loader: " + reason + ".");
        return;
      }
      const index = loaderReadySlot(player);
      player.loaderSlots[index] = null;
      compactLoaderSlots(player);
      player.statusNotice = "";
      player.loaderRecoverUntil = frameTime + LOADER_RECOVER_SECONDS * 1000;
      player.shootingUntil = frameTime + 450;
      addStatusMessage(player, "> Loader: FIRE! Shell away.");
      fireShell(player);
      if (loaderCount(player) === 0) {
        player.loaderLocked = false;
        addStatusMessage(player, "> Loader: Unlocked.");
      }
    }

    // FIRE sits on the lock. The bore is shifted up to leave room for the ammo bar.
    function loaderParts(rect) {
      const pad = 8;
      const titleH = 16;
      const contentX = rect.x + pad;
      const contentY = rect.y + pad + titleH;
      const contentW = Math.max(40, rect.width - pad * 2);
      const contentH = Math.max(40, rect.height - pad - titleH - pad);
      const columnW = Math.round(Math.min(100, Math.max(72, contentW * 0.34)));
      const stackGap = 6;
      const lane = Math.min(52, contentW * 0.2);
      const rightPad = 6;
      const boreRight = contentX + contentW - rightPad;
      const boreLeft = contentX + columnW + stackGap + lane;
      const barH = 10;
      const barGap = 8;
      const diameter = Math.max(36, Math.min(boreRight - boreLeft, contentH - barH - barGap - 12));
      const slack = Math.max(0, contentH - diameter - barH - barGap);
      const lift = Math.min(18, slack / 2);
      const topMargin = Math.max(4, slack / 2 - lift);
      const hole = {
        cx: boreRight - diameter / 2,
        cy: contentY + topMargin + diameter / 2,
        r: diameter / 2,
        laneX: contentX + columnW
      };
      const beside = 12;
      const between = 8;
      const controlsW = Math.max(48, hole.cx - hole.r - beside - contentX);
      const fireH = Math.round((contentH - between) * 0.4);
      const lockH = contentH - between - fireH;
      return {
        fire: { x: contentX, y: contentY, width: controlsW, height: fireH },
        lock: { x: contentX, y: contentY + fireH + between, width: controlsW, height: lockH },
        hole: hole,
        bar: { x: hole.cx - hole.r, y: hole.cy + hole.r + barGap, width: diameter, height: barH }
      };
    }

    function handOverLoaderHole(player, hole) {
      const dx = player.x - hole.cx;
      const dy = player.y - hole.cy;
      return dx * dx + dy * dy <= hole.r * hole.r;
    }

    // Same center and radius as the drawn bore, a few pixels outside the rim.
    function drawHoleHighlight(hole) {
      ctx.save();
      interactOutlineStyle();
      ctx.beginPath();
      ctx.arc(hole.cx, hole.cy, hole.r + 3, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    function mixBoreColor(from, to, t) {
      const r = Math.round(from[0] + (to[0] - from[0]) * t);
      const g = Math.round(from[1] + (to[1] - from[1]) * t);
      const b = Math.round(from[2] + (to[2] - from[2]) * t);
      return "rgb(" + r + "," + g + "," + b + ")";
    }

    // Base of the shell, seen straight into the bore. It starts filling the hole, then recedes.
    function drawShellBaseInBore(hole, t) {
      const eased = t * t * (3 - 2 * t);
      const radius = hole.r * (0.93 - 0.28 * eased);
      const black = [5, 6, 5];
      ctx.save();
      ctx.globalAlpha = 1 - eased;
      ctx.beginPath();
      ctx.arc(hole.cx, hole.cy, radius, 0, Math.PI * 2);
      ctx.fillStyle = mixBoreColor([196, 154, 78], black, eased);
      ctx.fill();
      ctx.lineWidth = Math.max(1.5, radius * 0.07);
      ctx.strokeStyle = mixBoreColor([110, 78, 40], black, eased);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(hole.cx, hole.cy, radius * 0.22, 0, Math.PI * 2);
      ctx.fillStyle = mixBoreColor([74, 52, 28], black, eased);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(hole.cx, hole.cy, radius * 0.08, 0, Math.PI * 2);
      ctx.fillStyle = mixBoreColor([36, 24, 14], black, eased);
      ctx.fill();
      ctx.restore();
    }

    function drawLoaderHole(hole, player) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(hole.cx, hole.cy, hole.r, 0, Math.PI * 2);
      ctx.clip();
      const shade = ctx.createRadialGradient(hole.cx - hole.r * 0.2, hole.cy - hole.r * 0.25, hole.r * 0.15, hole.cx, hole.cy, hole.r);
      shade.addColorStop(0, "#1a1e1c");
      shade.addColorStop(1, "#050605");
      ctx.fillStyle = shade;
      ctx.fillRect(hole.cx - hole.r - 2, hole.cy - hole.r - 2, hole.r * 2 + 4, hole.r * 2 + 4);
      ctx.restore();
      ctx.beginPath();
      ctx.arc(hole.cx, hole.cy, hole.r, 0, Math.PI * 2);
      ctx.strokeStyle = "#1a1a1e";
      ctx.lineWidth = 6;
      ctx.stroke();
      ctx.strokeStyle = "#c4c4cc";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(hole.cx, hole.cy, hole.r * 0.9, 0, Math.PI * 2);
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 2;
      ctx.stroke();
      if (!machineStarted) return;
      ctx.save();
      ctx.beginPath();
      ctx.arc(hole.cx, hole.cy, hole.r * 0.96, 0, Math.PI * 2);
      ctx.clip();
      for (let i = 0; i < player.loaderSlots.length; i++) {
        const slot = player.loaderSlots[i];
        if (!slot || slot.ready) continue;
        const t = Math.max(0, Math.min(1, slot.t));
        if (t >= 0.995) continue;
        drawShellBaseInBore(hole, t);
      }
      ctx.restore();
      drawBoreShutter(hole, player.loaderCover || 0);
    }

    // One door slides in from the left. amount 0 is open, 1 is shut.
    function drawBoreShutter(hole, amount) {
      if (amount <= 0.001) return;
      const span = hole.r * 2;
      const doorW = span * amount;
      const top = hole.cy - hole.r;
      const x = hole.cx - hole.r;
      ctx.save();
      ctx.beginPath();
      ctx.arc(hole.cx, hole.cy, hole.r - 1, 0, Math.PI * 2);
      ctx.clip();
      ctx.fillStyle = "#4e4e58";
      ctx.fillRect(x, top, doorW, span);
      ctx.fillStyle = COLOR_JOYSTICK_EDGE_LIGHT;
      ctx.fillRect(x, top, doorW, 2);
      ctx.fillStyle = COLOR_JOYSTICK_EDGE_DARK;
      ctx.fillRect(x, top + span - 2, doorW, 2);
      ctx.fillStyle = "#121216";
      ctx.fillRect(x + doorW - 2, top + 2, 2, span - 4);
      ctx.restore();
    }

    function drawLockRod(x, top, width, bottom) {
      const radius = width / 2;
      const y2 = Math.max(top + width, bottom);
      const shade = ctx.createLinearGradient(x, 0, x + width, 0);
      shade.addColorStop(0, "#3a3a3a");
      shade.addColorStop(0.4, "#141414");
      shade.addColorStop(1, "#050505");
      ctx.fillStyle = shade;
      ctx.beginPath();
      ctx.arc(x + radius, top + radius, radius, Math.PI, 0);
      ctx.lineTo(x + width, y2 - radius);
      ctx.arc(x + radius, y2 - radius, radius, 0, Math.PI);
      ctx.closePath();
      ctx.fill();
    }

    // 0 points up (unlocked). 1 points down (locked). The base is the pivot.
    function drawLockLever(rect, pose) {
      const amount = pose * pose * (3 - 2 * pose);
      const baseW = rect.width * 0.7;
      const baseH = Math.max(20, Math.min(24, rect.height * 0.16));
      const baseX = rect.x + (rect.width - baseW) / 2;
      const baseY = rect.y + (rect.height - baseH) / 2;
      const handleH = Math.max(11, Math.min(15, rect.height * 0.09));
      const handleW = baseW * 0.78;
      const handleX = rect.x + (rect.width - handleW) / 2;
      const upY = rect.y + 1;
      const downY = rect.y + rect.height - handleH - 1;
      const handleY = upY + (downY - upY) * amount;
      const baseShade = ctx.createLinearGradient(baseX, baseY, baseX, baseY + baseH);
      baseShade.addColorStop(0, "#c2c2ca");
      baseShade.addColorStop(0.2, "#8e8e96");
      baseShade.addColorStop(1, "#5c5c64");
      ctx.fillStyle = baseShade;
      ctx.fillRect(baseX, baseY, baseW, baseH);
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 2;
      ctx.strokeRect(baseX + 1, baseY + 1, baseW - 2, baseH - 2);
      ctx.fillStyle = "rgba(255, 255, 255, 0.38)";
      ctx.fillRect(baseX + 2, baseY + 2, baseW - 4, 3);
      const pointingDown = handleY + handleH / 2 > baseY + baseH / 2;
      const rodTop = pointingDown ? baseY + baseH : handleY + handleH;
      const rodBottom = pointingDown ? handleY : baseY;
      const rodW = Math.max(8, rect.width * 0.11);
      if (rodBottom - rodTop > 4) {
        drawLockRod(handleX + handleW * 0.24, rodTop, rodW, rodBottom);
        drawLockRod(handleX + handleW * 0.76 - rodW, rodTop, rodW, rodBottom);
      }
      const handleShade = ctx.createLinearGradient(handleX, handleY, handleX, handleY + handleH);
      handleShade.addColorStop(0, "#d8d8de");
      handleShade.addColorStop(0.5, "#9a9aa3");
      handleShade.addColorStop(1, "#6a6a72");
      ctx.fillStyle = handleShade;
      ctx.fillRect(handleX, handleY, handleW, handleH);
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 2;
      ctx.strokeRect(handleX + 1, handleY + 1, handleW - 2, handleH - 2);
      ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
      ctx.fillRect(handleX + 3, handleY + 2, handleW - 6, 2);
    }

    function loaderFireCircle(rect) {
      return {
        cx: rect.x + rect.width / 2,
        cy: rect.y + rect.height / 2,
        r: Math.max(8, Math.min(rect.width, rect.height) / 2 - 2)
      };
    }

    function handOverFireButton(player, rect) {
      const button = loaderFireCircle(rect);
      const dx = player.x - button.cx;
      const dy = player.y - button.cy;
      return dx * dx + dy * dy <= button.r * button.r;
    }

    function drawLoaderFireButton(rect, state) {
      const button = loaderFireCircle(rect);
      const lit = state === "lit";
      const recover = state === "recover";
      const fill = ctx.createRadialGradient(button.cx - button.r * 0.3, button.cy - button.r * 0.35, button.r * 0.1, button.cx, button.cy, button.r);
      if (lit) {
        fill.addColorStop(0, "#ff6a5a");
        fill.addColorStop(1, "#9e1818");
      } else if (recover) {
        fill.addColorStop(0, "#6a3a3c");
        fill.addColorStop(1, "#3a2224");
      } else {
        fill.addColorStop(0, "#3a2a2c");
        fill.addColorStop(1, "#140e10");
      }
      ctx.beginPath();
      ctx.arc(button.cx, button.cy, button.r, 0, Math.PI * 2);
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = lit ? "#ffd0d0" : "#3a2a2c";
      ctx.stroke();
      ctx.fillStyle = lit ? "#fff4f4" : "#6e6062";
      ctx.font = "bold " + Math.max(12, Math.min(18, Math.floor(button.r * 0.42))) + "px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("FIRE", button.cx, button.cy + 1);
    }

    function loaderReadyCount(player) {
      let count = 0;
      for (let i = 0; i < player.loaderSlots.length; i++) {
        const slot = player.loaderSlots[i];
        if (slot && slot.ready) count += 1;
      }
      return count;
    }

    // Three segments under the bore. A segment fills when that shell is ready.
    function drawLoaderAmmoBar(bar, readyCount) {
      ctx.fillStyle = "#0c0e0c";
      ctx.fillRect(bar.x, bar.y, bar.width, bar.height);
      ctx.strokeStyle = "#3a3e3c";
      ctx.lineWidth = 1;
      ctx.strokeRect(bar.x + 0.5, bar.y + 0.5, Math.max(0, bar.width - 1), Math.max(0, bar.height - 1));
      const gap = 3;
      const segW = (bar.width - gap * 4) / 3;
      if (segW <= 1) return;
      for (let i = 0; i < 3; i++) {
        ctx.fillStyle = i < readyCount ? "#d2b56a" : "#1a1e1c";
        ctx.fillRect(bar.x + gap + i * (segW + gap), bar.y + 2, segW, Math.max(1, bar.height - 4));
      }
    }

    function drawLoaderDressing(rect, parts) {
      const hole = parts.hole;
      ctx.save();
      ctx.beginPath();
      ctx.rect(rect.x + 5, rect.y + 5, rect.width - 10, rect.height - 10);
      ctx.clip();
      const shade = ctx.createLinearGradient(rect.x, rect.y, rect.x, rect.y + rect.height);
      shade.addColorStop(0, "rgba(255, 255, 255, 0.07)");
      shade.addColorStop(0.4, "rgba(0, 0, 0, 0)");
      shade.addColorStop(1, "rgba(0, 0, 0, 0.2)");
      ctx.fillStyle = shade;
      ctx.fillRect(rect.x, rect.y, rect.width, rect.height);
      ctx.restore();
      ctx.strokeStyle = "rgba(0, 0, 0, 0.4)";
      ctx.lineWidth = 1;
      ctx.strokeRect(rect.x + 6.5, rect.y + 6.5, rect.width - 13, rect.height - 13);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.14)";
      ctx.strokeRect(rect.x + 8.5, rect.y + 8.5, rect.width - 17, rect.height - 17);
      const stripeH = 7;
      const stripeY = rect.y + rect.height - 9 - stripeH;
      if (stripeY > hole.cy + hole.r + 18) drawCautionStripes(rect.x + 14, stripeY, rect.width - 28, stripeH);
      ctx.fillStyle = COLOR_JOYSTICK_EDGE_DARK;
      const vents = [
        { x: hole.cx - hole.r - 9, y: hole.cy - 12, w: 5, h: 16 },
        { x: hole.cx + hole.r + 4, y: hole.cy - 12, w: 5, h: 16 },
        { x: hole.cx - 16, y: hole.cy - hole.r - 8, w: 14, h: 4 },
        { x: hole.cx + 2, y: hole.cy - hole.r - 8, w: 14, h: 4 }
      ];
      for (let i = 0; i < vents.length; i++) {
        const vent = vents[i];
        if (vent.x < rect.x + 8 || vent.y < rect.y + 20) continue;
        if (vent.x + vent.w > rect.x + rect.width - 8) continue;
        if (vent.y + vent.h > rect.y + rect.height - 8) continue;
        ctx.fillRect(vent.x, vent.y, vent.w, vent.h);
      }
    }

    function drawLoader(room, player) {
      const rect = getLoaderRect(room);
      const parts = loaderParts(rect);
      ctx.save();
      drawBeveledRect(rect);
      drawLoaderDressing(rect, parts);
      const boltR = Math.max(2, Math.min(3, rect.width * 0.03));
      const inset = boltR + 3;
      if (rect.width > inset * 2 + 8 && rect.height > inset * 2 + 8) {
        drawBolt(rect.x + inset, rect.y + inset, boltR);
        drawBolt(rect.x + rect.width - inset, rect.y + inset, boltR);
        drawBolt(rect.x + inset, rect.y + rect.height - inset, boltR);
        drawBolt(rect.x + rect.width - inset, rect.y + rect.height - inset, boltR);
      }
      drawLoaderHole(parts.hole, player);
      drawLoaderAmmoBar(parts.bar, loaderReadyCount(player));
      drawLockLever(parts.lock, player.loaderLever || 0);
      let fireState = "dark";
      if (loaderFireLit(player)) fireState = "lit";
      else if (loaderRecovering(player) && player.loaderLocked) fireState = "recover";
      drawLoaderFireButton(parts.fire, fireState);
      ctx.restore();
      if (machineStarted && handOverLoaderHole(player, parts.hole)) drawHoleHighlight(parts.hole);
    }

    function pressLoader(player, room) {
      const parts = loaderParts(getLoaderRect(room));
      if (handOverFireButton(player, parts.fire)) {
        pressLoaderFire(player);
        return;
      }
      if (pointInRect(player.x, player.y, parts.lock)) toggleLoaderLock(player);
    }

    function closeZoom(player) {
      player.panelOpen = false;
      player.panelKind = "";
      player.fireOpen = false;
      player.fireIndex = -1;
      player.dialDrag = false;
      player.dialHover = "";
      player.dialAim = null;
    }

    // Keypad cell under the fingertip, or -1 when the tip is somewhere else.
    function keyUnderPoint(player, room) {
      if (player.panelKind !== "fire") return -1;
      const pad = zoomContent(room, "fire").keypad;
      const padRect = { x: pad.x, y: pad.y, width: pad.width, height: pad.height };
      if (!pointInRect(player.pointX, player.pointY, padRect)) return -1;
      const cells = fireKeyCells(pad);
      for (let i = 0; i < cells.length; i++) {
        const cell = cells[i];
        const rect = { x: cell.x, y: cell.y, width: cell.w, height: cell.h };
        if (pointInRect(player.pointX, player.pointY, rect)) return cell.index;
      }
      return -1;
    }

    // Function calls stay in one piece. Everything else is a single character.
    function equationAtoms(text) {
      const atoms = [];
      let i = 0;
      while (i < text.length) {
        let token = "";
        for (let t = 0; t < FIRE_CARET_ATOMS.length; t++) {
          const name = FIRE_CARET_ATOMS[t];
          if (text.indexOf(name, i) === i) {
            token = name;
            break;
          }
        }
        if (token) {
          atoms.push({ start: i, end: i + token.length });
          i += token.length;
        } else {
          atoms.push({ start: i, end: i + 1 });
          i += 1;
        }
      }
      return atoms;
    }

    function caretSnap(text, index) {
      if (index <= 0) return 0;
      if (index >= text.length) return text.length;
      const atoms = equationAtoms(text);
      for (let i = 0; i < atoms.length; i++) {
        const atom = atoms[i];
        if (index > atom.start && index < atom.end) {
          return (index - atom.start) <= (atom.end - index) ? atom.start : atom.end;
        }
      }
      return index;
    }

    function playerCaret(player) {
      const text = player.equation || "";
      if (typeof player.caret !== "number") return text.length;
      return caretSnap(text, player.caret);
    }

    function caretMove(text, index, dir) {
      const atoms = equationAtoms(text);
      index = caretSnap(text, index);
      if (dir < 0) {
        for (let i = atoms.length - 1; i >= 0; i--) {
          if (atoms[i].end <= index) return atoms[i].start;
        }
        return 0;
      }
      for (let i = 0; i < atoms.length; i++) {
        if (atoms[i].start >= index) return atoms[i].end;
      }
      return text.length;
    }

    function caretDelete(text, index) {
      index = caretSnap(text, index);
      const atoms = equationAtoms(text);
      for (let i = atoms.length - 1; i >= 0; i--) {
        if (atoms[i].end <= index) {
          return {
            text: text.slice(0, atoms[i].start) + text.slice(atoms[i].end),
            caret: atoms[i].start
          };
        }
      }
      return { text: text, caret: 0 };
    }

    function caretInsert(player, chunk) {
      const text = player.equation || "";
      const caret = playerCaret(player);
      if (text.length + chunk.length > FIRE_EQUATION_MAX) return;
      player.equation = text.slice(0, caret) + chunk + text.slice(caret);
      player.caret = caret + chunk.length;
    }

    function pressFireKey(player) {
      // The touch plays out on screen. The key still takes effect immediately.
      player.pointPressFrom = frameTime;
      player.pointPressIndex = player.fireIndex;
      const key = FIRE_KEYS[player.fireIndex];
      if (!key) return;
      if (key.done) {
        closeZoom(player);
        return;
      }
      if (key.clear) {
        player.equation = "";
        player.caret = 0;
        player.eqScroll = 0;
        return;
      }
      if (key.backspace) {
        const next = caretDelete(player.equation || "", playerCaret(player));
        player.equation = next.text;
        player.caret = next.caret;
        return;
      }
      if (key.move) {
        player.caret = caretMove(player.equation || "", playerCaret(player), key.move);
        return;
      }
      if (key.insert) caretInsert(player, key.insert);
    }

    // Break the equation into numbers, names, and symbols. An error names the first bad spot.
    function tokenizeEquation(input) {
      const tokens = [];
      const text = String(input || "");
      let i = 0;
      while (i < text.length) {
        const c = text.charAt(i);
        if (c === " " || c === "\t") {
          i += 1;
          continue;
        }
        if ("+-*/^()".indexOf(c) >= 0) {
          tokens.push({ type: c, at: i });
          i += 1;
          continue;
        }
        if (c === "π") {
          tokens.push({ type: "name", value: "pi", at: i });
          i += 1;
          continue;
        }
        if (c === "√") {
          tokens.push({ type: "name", value: "sqrt", at: i });
          i += 1;
          continue;
        }
        if ((c >= "0" && c <= "9") || c === ".") {
          const start = i;
          let dots = 0;
          while (i < text.length) {
            const d = text.charAt(i);
            if (d >= "0" && d <= "9") {
              i += 1;
              continue;
            }
            if (d === ".") {
              dots += 1;
              i += 1;
              continue;
            }
            break;
          }
          const numberText = text.slice(start, i);
          if (dots > 1 || numberText === ".") return { error: "bad number", errorAt: start };
          const value = Number(numberText);
          if (!isFinite(value)) return { error: "bad number", errorAt: start };
          tokens.push({ type: "num", value: value, at: start });
          continue;
        }
        if ((c >= "a" && c <= "z") || (c >= "A" && c <= "Z")) {
          const start = i;
          while (i < text.length) {
            const d = text.charAt(i);
            if ((d >= "a" && d <= "z") || (d >= "A" && d <= "Z")) i += 1;
            else break;
          }
          const name = text.slice(start, i).toLowerCase();
          if (!FIRE_FUNCTIONS[name] && name !== "x" && name !== "e" && name !== "pi") {
            return { error: "unknown name", errorAt: start };
          }
          tokens.push({ type: "name", value: name, at: start });
          continue;
        }
        return { error: "unknown symbol", errorAt: i };
      }
      return { tokens: tokens };
    }

    // Recursive descent. ^ is tighter than * /, and * / is tighter than + -.
    // A minus in front of a value is a sign. 2x means 2 * x. No eval is used.
    function parseExpression(input) {
      const text = String(input || "");
      if (!text.trim()) return { tree: null, error: "empty equation", errorAt: 0 };
      const scanned = tokenizeEquation(text);
      if (scanned.error) return { tree: null, error: scanned.error, errorAt: scanned.errorAt || 0 };
      const tokens = scanned.tokens;
      if (!tokens.length) return { tree: null, error: "empty equation", errorAt: 0 };
      let pos = 0;
      let problem = "incomplete";
      let problemAt = text.length;

      function peek() {
        if (pos >= tokens.length) return null;
        return tokens[pos];
      }

      function mark(token, message) {
        problem = message;
        problemAt = token && typeof token.at === "number" ? token.at : text.length;
      }

      function startsValue(token) {
        if (!token) return false;
        if (token.type === "num" || token.type === "(") return true;
        if (token.type !== "name") return false;
        return token.value === "x" || token.value === "e" || token.value === "pi" || !!FIRE_FUNCTIONS[token.value];
      }

      function parseExpr() {
        let left = parseTerm();
        if (!left) return null;
        while (peek() && (peek().type === "+" || peek().type === "-")) {
          const op = peek().type;
          pos += 1;
          const right = parseTerm();
          if (!right) return null;
          left = { op: op, left: left, right: right };
        }
        return left;
      }

      function parseTerm() {
        let left = parseUnary();
        if (!left) return null;
        while (peek()) {
          const token = peek();
          if (token.type === "*" || token.type === "/") {
            pos += 1;
            const right = parseUnary();
            if (!right) return null;
            left = { op: token.type, left: left, right: right };
            continue;
          }
          // 2x, 2sin(x), and 2(x+1) are products even without a * sign.
          if (startsValue(token)) {
            const right = parseUnary();
            if (!right) return null;
            left = { op: "*", left: left, right: right };
            continue;
          }
          break;
        }
        return left;
      }

      function parseUnary() {
        if (peek() && peek().type === "+") {
          pos += 1;
          return parseUnary();
        }
        if (peek() && peek().type === "-") {
          pos += 1;
          const value = parseUnary();
          if (!value) return null;
          return { op: "neg", value: value };
        }
        return parsePower();
      }

      function parsePower() {
        const base = parsePrimary();
        if (!base) return null;
        if (peek() && peek().type === "^") {
          pos += 1;
          const exp = parseUnary();
          if (!exp) return null;
          return { op: "^", left: base, right: exp };
        }
        return base;
      }

      function parsePrimary() {
        const token = peek();
        if (!token) {
          mark(null, "incomplete");
          return null;
        }
        if (token.type === "num") {
          pos += 1;
          return { op: "num", value: token.value };
        }
        if (token.type === "name" && token.value === "x") {
          pos += 1;
          return { op: "x" };
        }
        if (token.type === "name" && (token.value === "e" || token.value === "pi")) {
          pos += 1;
          return { op: "num", value: token.value === "e" ? Math.E : Math.PI };
        }
        if (token.type === "name" && FIRE_FUNCTIONS[token.value]) {
          pos += 1;
          if (!peek() || peek().type !== "(") {
            mark(peek() || token, "missing (");
            return null;
          }
          pos += 1;
          const arg = parseExpr();
          if (!arg) return null;
          if (!peek() || peek().type !== ")") {
            mark(peek(), "missing )");
            return null;
          }
          pos += 1;
          return { op: token.value, value: arg };
        }
        if (token.type === "(") {
          pos += 1;
          const inner = parseExpr();
          if (!inner) return null;
          if (!peek() || peek().type !== ")") {
            mark(peek(), "missing )");
            return null;
          }
          pos += 1;
          return inner;
        }
        mark(token, "unexpected symbol");
        return null;
      }

      const tree = parseExpr();
      if (!tree) return { tree: null, error: problem, errorAt: problemAt };
      if (pos !== tokens.length) return { tree: null, error: "extra input", errorAt: tokens[pos].at };
      return { tree: tree, error: "", errorAt: -1 };
    }

    function evalExpr(node, x) {
      if (!node) return NaN;
      if (node.op === "num") return node.value;
      if (node.op === "x") return x;
      if (node.op === "neg") return -evalExpr(node.value, x);
      if (node.op === "sin") return Math.sin(evalExpr(node.value, x));
      if (node.op === "cos") return Math.cos(evalExpr(node.value, x));
      if (node.op === "tan") return Math.tan(evalExpr(node.value, x));
      if (node.op === "sqrt") return Math.sqrt(evalExpr(node.value, x));
      if (node.op === "log") return Math.log(evalExpr(node.value, x)) / Math.LN10;
      if (node.op === "ln") return Math.log(evalExpr(node.value, x));
      if (node.op === "abs") return Math.abs(evalExpr(node.value, x));
      const a = evalExpr(node.left, x);
      const b = evalExpr(node.right, x);
      if (node.op === "+") return a + b;
      if (node.op === "-") return a - b;
      if (node.op === "*") return a * b;
      if (node.op === "/") return a / b;
      if (node.op === "^") return Math.pow(a, b);
      return NaN;
    }

    function syncEquation(player) {
      if (player.equationParsedFor === player.equation) return;
      player.equationParsedFor = player.equation;
      const parsed = parseExpression(player.equation);
      player.equationTree = parsed.tree;
      player.equationError = parsed.error || "";
      player.equationErrorAt = typeof parsed.errorAt === "number" ? parsed.errorAt : -1;
      player.flight = parsed.tree ? traceEquation(parsed.tree) : null;
      const drawn = player.flight && player.flight.points && player.flight.points.length > 0;
      player.canFire = !!(parsed.tree && drawn);
    }

    // Shared with the battlefield viewer. drawPoints stops a final underground run.
    function traceEquation(tree) {
      return GraphHowitzerFire.traceShell(function (x) {
        return evalExpr(tree, x);
      }, { shellSpeed: SHELL_SPEED });
    }

    function directionLine(player) {
      const actual = angleText(player.actualAngle);
      const target = angleText(player.targetAngle);
      if (player.turretBusy && actual !== target) return "Direction: " + actual + " → " + target;
      return "Direction: " + actual;
    }

    function impactLines(player) {
      const direction = directionLine(player);
      if (!player.equationTree) {
        const reason = player.equationError ? player.equationError : "syntax error";
        return ["Syntax error: " + reason, "Cannot fire: syntax error", direction];
      }
      if (!player.flight || !player.flight.points || !player.flight.points.length) {
        return ["Cannot fire: no curve", direction];
      }
      const flight = player.flight;
      const peak = "Peak height: " + flight.peak.toFixed(1) + " m";
      const time = "Flight time: " + flight.time.toFixed(1) + " s";
      if (!flight.impact) return ["Impact: none in range", peak, time, direction];
      return ["Impact distance: " + flight.distance.toFixed(1) + " m", peak, time, direction];
    }

    // Keep the caret inside the black bar when the formula is wider than the field.
    function equationScroll(rect, player, font) {
      ctx.font = font;
      const caret = playerCaret(player);
      const caretX = ctx.measureText(EQUATION_PREFIX + player.equation.slice(0, caret)).width;
      const view = Math.max(8, rect.width - 16);
      let scroll = player.eqScroll || 0;
      if (caretX - scroll > view - 2) scroll = caretX - view + 2;
      if (caretX - scroll < 0) scroll = caretX;
      if (scroll < 0) scroll = 0;
      player.eqScroll = scroll;
      return scroll;
    }

    function caretFromPoint(player, x, rect) {
      const font = "16px monospace";
      ctx.font = font;
      const text = player.equation || "";
      const scroll = player.eqScroll || 0;
      const origin = rect.x + 8 - scroll;
      const atoms = equationAtoms(text);
      const stops = [0];
      for (let i = 0; i < atoms.length; i++) stops.push(atoms[i].end);
      let best = 0;
      let bestDist = Infinity;
      for (let i = 0; i < stops.length; i++) {
        const width = ctx.measureText(EQUATION_PREFIX + text.slice(0, stops[i])).width;
        const dist = Math.abs(x - (origin + width));
        if (dist < bestDist) {
          bestDist = dist;
          best = stops[i];
        }
      }
      return best;
    }

    // One line for the plate. Cut the formula, not the "y = " prefix, when the bar is short.
    function plateEquationLine(text, maxWidth) {
      const full = EQUATION_PREFIX + text;
      if (ctx.measureText(full).width <= maxWidth) return full;
      const dots = "...";
      if (ctx.measureText(dots).width > maxWidth) return "";
      let end = text.length;
      while (end > 0 && ctx.measureText(EQUATION_PREFIX + text.slice(0, end) + dots).width > maxWidth) end -= 1;
      if (end === 0 && ctx.measureText(EQUATION_PREFIX + dots).width > maxWidth) return dots;
      return EQUATION_PREFIX + text.slice(0, end) + dots;
    }

    // The formula always stays on screen. A syntax error tints it and underlines the bad spot.
    function drawEquationField(rect, player, font, showCaret) {
      ctx.fillStyle = "#000000";
      ctx.fillRect(rect.x, rect.y, rect.width, rect.height);
      ctx.save();
      ctx.beginPath();
      ctx.rect(rect.x, rect.y, rect.width, rect.height);
      ctx.clip();
      ctx.font = font;
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      const text = player.equation || "";
      const bad = !player.equationTree;
      const scroll = showCaret ? equationScroll(rect, player, font) : 0;
      const origin = rect.x + 8 - scroll;
      const baseline = rect.y + rect.height / 2;
      const maxWidth = Math.max(8, rect.width - 16);
      const line = showCaret ? EQUATION_PREFIX + text : plateEquationLine(text, maxWidth);
      const truncated = line !== EQUATION_PREFIX + text;
      ctx.fillStyle = bad ? COLOR_MONITOR_WARNING : COLOR_MONITOR_TEXT;
      ctx.fillText(line, origin, baseline);
      if (!truncated && bad && typeof player.equationErrorAt === "number" && player.equationErrorAt >= 0 && player.equationErrorAt <= text.length) {
        const before = EQUATION_PREFIX + text.slice(0, player.equationErrorAt);
        const mark = text.charAt(player.equationErrorAt) || " ";
        const x0 = origin + ctx.measureText(before).width;
        const markW = Math.max(6, ctx.measureText(mark).width);
        ctx.strokeStyle = COLOR_MONITOR_WARNING;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x0, rect.y + rect.height - 5);
        ctx.lineTo(x0 + markW, rect.y + rect.height - 5);
        ctx.stroke();
      }
      if (showCaret && Math.floor(frameTime / 530) % 2 === 0) {
        const caret = playerCaret(player);
        const caretX = origin + ctx.measureText(EQUATION_PREFIX + text.slice(0, caret)).width;
        ctx.fillStyle = bad ? COLOR_MONITOR_WARNING : COLOR_MONITOR_TEXT;
        ctx.fillRect(caretX, rect.y + 6, 2, rect.height - 12);
      }
      ctx.restore();
    }

    function strokeGraphRuns(runs, px, py) {
      for (let r = 0; r < runs.length; r++) {
        const run = runs[r];
        if (run.length < 2) continue;
        ctx.beginPath();
        ctx.moveTo(px(run[0].x), py(run[0].y));
        for (let i = 1; i < run.length; i++) ctx.lineTo(px(run[i].x), py(run[i].y));
        ctx.stroke();
      }
    }

    function graphPoints(flight) {
      if (!flight) return [];
      if (flight.drawPoints) return flight.drawPoints;
      if (flight.points) return flight.points;
      return [];
    }

    function fillAxisArrow(x, y, angle, size) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-size, size * 0.42);
      ctx.lineTo(-size, -size * 0.42);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // Curve and impact marker, clipped to the plot. The trace itself is not shortened.
    function strokeShellCurve(plot, px, py, points, tree, flight, arm, player) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(plot.x, plot.y, plot.w, plot.h);
      ctx.clip();
      if (points.length > 1 && tree) {
        const runs = GraphHowitzerFire.splitGround(points);
        ctx.lineWidth = 2;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.strokeStyle = COLOR_MONITOR_TEXT;
        ctx.setLineDash([]);
        strokeGraphRuns(runs.above, px, py);
        ctx.strokeStyle = "rgba(57, 255, 106, 0.62)";
        ctx.setLineDash([5, 4]);
        strokeGraphRuns(runs.below, px, py);
        ctx.setLineDash([]);
      }
      if (flight && flight.impact && isFinite(flight.distance)) {
        const markX = px(flight.distance);
        const markY = py(0);
        ctx.strokeStyle = "#ffb020";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(markX, markY, arm + 3, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(markX - arm, markY - arm);
        ctx.lineTo(markX + arm, markY + arm);
        ctx.moveTo(markX + arm, markY - arm);
        ctx.lineTo(markX - arm, markY + arm);
        ctx.stroke();
      }
      drawGraphShells(px, py, player, arm);
      ctx.restore();
    }

    // The moving dot, and a blast the same size as the X target circle.
    function drawGraphShells(px, py, player, arm) {
      if (!player) return;
      const index = player === player1 ? 0 : 1;
      for (let i = 0; i < liveShells.length; i++) {
        const shell = liveShells[i];
        if (shell.owner !== index) continue;
        if (shell.blast) {
          const life = 1 - shell.blast.age / SHELL_EXPLOSION_SECONDS;
          if (life > 0) {
            ctx.save();
            ctx.globalAlpha = Math.max(0.25, life);
            ctx.fillStyle = "#ff5a1a";
            ctx.beginPath();
            ctx.arc(px(shell.blast.distance), py(shell.blast.height), arm + 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        }
        if (!shell.alive) continue;
        ctx.fillStyle = "#ffe14a";
        ctx.beginPath();
        ctx.arc(px(shell.distance), py(shell.height), Math.max(5, arm), 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fff6d0";
        ctx.beginPath();
        ctx.arc(px(shell.distance), py(shell.height), Math.max(2, arm * 0.45), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Zoom graph. x and height are both 0 to 100 m, with a short strip under the ground.
    function drawFixedShellGraph(screen, tree, flight, player) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(screen.x, screen.y, screen.w, screen.h);
      ctx.clip();
      ctx.fillStyle = COLOR_RADAR_SCREEN;
      ctx.fillRect(screen.x, screen.y, screen.w, screen.h);

      const fontPx = screen.h < 160 || screen.w < 180 ? 11 : 13;
      ctx.font = fontPx + "px monospace";
      const padL = Math.min(screen.w * 0.28, Math.max(28, ctx.measureText("100").width + 10));
      const padB = fontPx + 8;
      const padT = 8;
      const padR = 14;
      const plotX = screen.x + padL;
      const plotY = screen.y + padT;
      const plotW = Math.max(8, screen.w - padL - padR);
      const plotH = Math.max(8, screen.h - padT - padB);
      const xMax = FIRE_GRAPH_X_MAX;
      const yMax = FIRE_GRAPH_Y_MAX;
      const ySpan = yMax + FIRE_GRAPH_BELOW;

      function px(x) {
        return plotX + (x / xMax) * plotW;
      }
      function py(y) {
        return plotY + ((yMax - y) / ySpan) * plotH;
      }

      const originY = py(0);
      const axis = "rgba(216, 255, 228, 0.9)";
      ctx.strokeStyle = axis;
      ctx.fillStyle = axis;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(plotX, originY);
      ctx.lineTo(plotX, plotY);
      ctx.moveTo(plotX, originY);
      ctx.lineTo(plotX + plotW, originY);
      ctx.stroke();
      const arrow = Math.max(7, Math.min(11, fontPx));
      fillAxisArrow(plotX + plotW, originY, 0, arrow);
      fillAxisArrow(plotX, plotY, -Math.PI / 2, arrow);

      ctx.strokeStyle = "rgba(216, 255, 228, 0.55)";
      ctx.lineWidth = 1;
      for (let value = 20; value < xMax - 0.01; value += 20) {
        const at = px(value);
        ctx.beginPath();
        ctx.moveTo(at, originY);
        ctx.lineTo(at, originY + 4);
        ctx.stroke();
      }
      for (let value = 20; value < yMax - 0.01; value += 20) {
        const at = py(value);
        ctx.beginPath();
        ctx.moveTo(plotX - 4, at);
        ctx.lineTo(plotX, at);
        ctx.stroke();
      }

      strokeShellCurve(
        { x: plotX, y: plotY, w: plotW, h: plotH },
        px,
        py,
        graphPoints(flight),
        tree,
        flight,
        screen.h < 170 ? 4 : 6,
        player
      );

      ctx.fillStyle = COLOR_RADAR_YOU;
      ctx.font = fontPx + "px monospace";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText("y", plotX + 8, plotY + 3);
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText("x", plotX + plotW + 3, originY);
      ctx.textBaseline = "top";
      for (let value = 0; value <= xMax + 0.01; value += 20) {
        const at = px(value);
        ctx.textAlign = value <= 0.01 ? "left" : (value >= xMax - 0.01 ? "right" : "center");
        ctx.fillText(String(value), at, originY + 6);
      }
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      for (let value = 20; value <= yMax + 0.01; value += 20) {
        ctx.fillText(String(value), plotX - 6, py(value));
      }
      ctx.restore();
    }

    // Plate graph. Axes with arrowheads and the curve only. No tick numbers.
    function drawShellGraph(screen, tree, flight, fixedRange, player) {
      if (fixedRange) {
        drawFixedShellGraph(screen, tree, flight, player);
        return;
      }
      ctx.save();
      ctx.beginPath();
      ctx.rect(screen.x, screen.y, screen.w, screen.h);
      ctx.clip();
      ctx.fillStyle = COLOR_RADAR_SCREEN;
      ctx.fillRect(screen.x, screen.y, screen.w, screen.h);

      const points = graphPoints(flight);
      let yMin = 0;
      let yMax = 0;
      let xMax = 0;
      for (let i = 0; i < points.length; i++) {
        if (points[i].y < yMin) yMin = points[i].y;
        if (points[i].y > yMax) yMax = points[i].y;
        if (points[i].x > xMax) xMax = points[i].x;
      }
      if (flight && flight.peak > yMax) yMax = flight.peak;
      if (yMin > 0) yMin = 0;
      if (yMax < 0) yMax = 0;
      if (xMax < 1) xMax = 10;
      if (yMax - yMin < 1) {
        yMax += 5;
        yMin -= 5;
      }
      const pad = (yMax - yMin) * 0.08;
      yMin -= pad;
      yMax += pad;
      xMax *= 1.06;
      const ySpan = yMax - yMin;

      const padL = 8;
      const padR = 14;
      const padT = 8;
      const padB = 8;
      const plotX = screen.x + padL;
      const plotY = screen.y + padT;
      const plotW = Math.max(8, screen.w - padL - padR);
      const plotH = Math.max(8, screen.h - padT - padB);

      function px(x) {
        return plotX + (x / xMax) * plotW;
      }
      function py(y) {
        return plotY + (1 - (y - yMin) / ySpan) * plotH;
      }

      const originY = py(0);
      const axis = "rgba(216, 255, 228, 0.9)";
      ctx.strokeStyle = axis;
      ctx.fillStyle = axis;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(plotX, plotY + plotH);
      ctx.lineTo(plotX, plotY);
      ctx.moveTo(px(0), originY);
      ctx.lineTo(plotX + plotW, originY);
      ctx.stroke();
      const arrow = Math.max(6, Math.min(9, screen.h * 0.08));
      fillAxisArrow(plotX + plotW, originY, 0, arrow);
      fillAxisArrow(plotX, plotY, -Math.PI / 2, arrow);

      strokeShellCurve(
        { x: plotX, y: plotY, w: plotW, h: plotH },
        px,
        py,
        points,
        tree,
        flight,
        screen.h < 170 ? 4 : 6,
        player
      );

      ctx.fillStyle = COLOR_RADAR_YOU;
      ctx.font = "11px monospace";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText("y", plotX + 6, plotY + 2);
      ctx.textAlign = "left";
      ctx.textBaseline = "middle";
      ctx.fillText("x", plotX + plotW + 2, originY);
      ctx.restore();
    }

    // 0° is battlefield +x. The angle grows counter-clockwise when seen from above.
    function wrapAngle(degrees) {
      const raw = Number(degrees) || 0;
      return ((raw % 360) + 360) % 360;
    }

    // Signed turn, -180 to 180. A tie of exactly 180 goes counter-clockwise.
    function shortestTurn(from, to) {
      let delta = wrapAngle(to) - wrapAngle(from);
      if (delta > 180) delta -= 360;
      if (delta < -180) delta += 360;
      return delta;
    }

    function angleText(degrees) {
      return (Math.round(wrapAngle(degrees)) % 360) + "°";
    }

    function turretLabel(player) {
      const actual = angleText(player.actualAngle);
      const target = angleText(player.targetAngle);
      if (player.turretBusy && actual !== target) return actual + " → " + target;
      return actual;
    }

    // One rotating line for the whole slew, including a drag. The lock is a new line.
    function noteTurretTurning(player, label) {
      const text = "> Turret: Rotating to " + label + "...";
      const line = player.turretLogLine;
      if (!line || player.messages.indexOf(line) === -1) {
        player.turretLogLine = { text: text, color: COLOR_MONITOR_TEXT, kind: "turret-turn" };
        player.messages.push(player.turretLogLine);
        return;
      }
      if (line.text !== text) line.text = text;
    }

    function noteTurretLocked(player, label) {
      player.turretLogLine = null;
      addStatusMessage(player, "> Turret: Locked at " + label + ".");
    }

    // The dial sets the target. The barrel catches up in updateTurret.
    function setTurretAngle(player, degrees) {
      const next = wrapAngle(degrees);
      player.targetAngle = next;
      if (!machineStarted) return;
      if (Math.abs(shortestTurn(player.actualAngle, next)) <= 0.05) return;
      noteTurretTurning(player, angleText(next));
    }

    function updateTurret(player, dt) {
      const target = wrapAngle(player.targetAngle);
      player.targetAngle = target;
      const actual = wrapAngle(player.actualAngle);
      const delta = shortestTurn(actual, target);
      const step = TURRET_TURN_SPEED * Math.max(0, dt);
      if (Math.abs(delta) <= step) player.actualAngle = target;
      else player.actualAngle = wrapAngle(actual + Math.sign(delta) * step);
      const busy = Math.abs(shortestTurn(player.actualAngle, target)) > 0.001;
      player.turretBusy = busy;
      if (!machineStarted) return;
      if (!busy && player.turretLogLine) noteTurretLocked(player, angleText(target));
    }

    function angleFromPointer(cx, cy, x, y) {
      let deg = Math.atan2(-(y - cy), x - cx) * 180 / Math.PI;
      if (deg < 0) deg += 360;
      return deg;
    }

    function nudgeTurret(player, delta) {
      setTurretAngle(player, player.targetAngle + delta);
    }

    // Circle, degree line, and optional ±1° buttons. The widget is centered in the box.
    function turretDialParts(box, withButtons) {
      const buttonH = withButtons ? Math.max(24, Math.min(32, box.height * 0.18)) : Math.max(13, Math.min(18, box.height * 0.2));
      const gap = 4;
      const r = Math.max(8, Math.min(box.width, box.height - buttonH - gap) / 2 - 2);
      const widgetH = r * 2 + gap + buttonH;
      const top = box.y + Math.max(0, (box.height - widgetH) / 2);
      const cx = box.x + box.width / 2;
      const cy = top + r + 1;
      const rowY = cy + r + gap;
      const rowH = buttonH;
      let ccw = null;
      let cw = null;
      let label = { x: box.x, y: rowY, width: box.width, height: rowH };
      if (withButtons) {
        const bw = Math.min(34, Math.max(22, box.width * 0.24));
        ccw = { x: box.x, y: rowY, width: bw, height: rowH };
        cw = { x: box.x + box.width - bw, y: rowY, width: bw, height: rowH };
        label = { x: box.x + bw, y: rowY, width: Math.max(8, box.width - bw * 2), height: rowH };
      }
      return { box: box, cx: cx, cy: cy, r: r, ccw: ccw, cw: cw, label: label };
    }

    // Light top-left edge and dark bottom-right edge, the same bevel the other plates use.
    function drawPanelOutline(rect) {
      ctx.save();
      ctx.lineWidth = 2;
      ctx.lineJoin = "miter";
      ctx.strokeStyle = COLOR_JOYSTICK_EDGE_LIGHT;
      ctx.beginPath();
      ctx.moveTo(rect.x + rect.width - 1.5, rect.y + 1);
      ctx.lineTo(rect.x + 1, rect.y + 1);
      ctx.lineTo(rect.x + 1, rect.y + rect.height - 1.5);
      ctx.stroke();
      ctx.strokeStyle = COLOR_JOYSTICK_EDGE_DARK;
      ctx.beginPath();
      ctx.moveTo(rect.x + rect.width - 1, rect.y + 1.5);
      ctx.lineTo(rect.x + rect.width - 1, rect.y + rect.height - 1);
      ctx.lineTo(rect.x + 1.5, rect.y + rect.height - 1);
      ctx.stroke();
      ctx.restore();
    }

    function dialPoint(parts, degrees, radius) {
      const rad = wrapAngle(degrees) * Math.PI / 180;
      return {
        x: parts.cx + Math.cos(rad) * radius,
        y: parts.cy - Math.sin(rad) * radius
      };
    }

    // Dots every 45°. The big dial names them; the plate dial only decorates.
    function drawDialMarks(parts, labeled, hover) {
      const dotR = Math.max(2, Math.min(3.4, parts.r * 0.035));
      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = Math.max(9, Math.min(12, Math.floor(parts.r * 0.075))) + "px monospace";
      for (let deg = 0; deg < 360; deg += 45) {
        const spot = dialPoint(parts, deg, parts.r * 0.9);
        const hot = labeled && hover === "mark:" + deg;
        ctx.beginPath();
        ctx.arc(spot.x, spot.y, hot ? dotR * 1.45 : dotR, 0, Math.PI * 2);
        ctx.fillStyle = hot ? COLOR_MONITOR_TEXT : "#d8ffe4";
        ctx.fill();
        if (!labeled) continue;
        const labelAt = dialPoint(parts, deg, parts.r * 0.68);
        ctx.fillStyle = COLOR_RADAR_YOU;
        ctx.fillText(String(deg), labelAt.x, labelAt.y);
      }
      ctx.restore();
    }

    function dialMarkHit(parts, x, y) {
      const reach = Math.max(9, Math.min(13, parts.r * 0.09));
      let best = -1;
      let bestDist = reach;
      for (let deg = 0; deg < 360; deg += 45) {
        const spot = dialPoint(parts, deg, parts.r * 0.9);
        const dist = Math.hypot(x - spot.x, y - spot.y);
        if (dist <= bestDist) {
          bestDist = dist;
          best = deg;
        }
      }
      return best;
    }

    function drawDialHover(parts, player) {
      if (typeof player.dialAim !== "number") return;
      const rad = wrapAngle(player.dialAim) * Math.PI / 180;
      const nx = Math.cos(rad);
      const ny = -Math.sin(rad);
      ctx.save();
      ctx.globalAlpha = 0.4;
      ctx.strokeStyle = COLOR_MONITOR_TEXT;
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(parts.cx, parts.cy);
      ctx.lineTo(parts.cx + nx * parts.r * 0.92, parts.cy + ny * parts.r * 0.92);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = COLOR_MONITOR_TEXT;
      ctx.font = "12px monospace";
      ctx.textAlign = "left";
      ctx.textBaseline = "bottom";
      const label = angleText(player.dialAim);
      const textW = ctx.measureText(label).width;
      let lx = player.pointX + 10;
      let ly = player.pointY - 8;
      const right = parts.box.x + parts.box.width - 4;
      const left = parts.box.x + 4;
      const top = parts.box.y + 14;
      const bottom = parts.box.y + parts.box.height - 4;
      if (lx + textW > right) lx = player.pointX - textW - 10;
      if (lx < left) lx = left;
      if (ly < top) ly = player.pointY + 16;
      if (ly > bottom) ly = bottom;
      ctx.fillText(label, lx, ly);
      ctx.restore();
    }

    function drawTurretDial(box, player, withButtons) {
      const parts = turretDialParts(box, withButtons);
      ctx.save();
      drawPanelOutline(box);
      ctx.beginPath();
      ctx.arc(parts.cx, parts.cy, parts.r, 0, Math.PI * 2);
      ctx.fillStyle = "#06140c";
      ctx.fill();
      ctx.lineWidth = Math.max(2, parts.r * 0.06);
      ctx.strokeStyle = player.dialDrag ? COLOR_MONITOR_TEXT : "#2f6a45";
      ctx.stroke();

      ctx.strokeStyle = "rgba(57, 255, 106, 0.45)";
      ctx.lineWidth = 1;
      for (let step = 0; step < 8; step++) {
        const rad = step * Math.PI / 4;
        const outer = parts.r * (step % 2 === 0 ? 0.92 : 0.84);
        const inner = parts.r * 0.72;
        ctx.beginPath();
        ctx.moveTo(parts.cx + Math.cos(rad) * inner, parts.cy - Math.sin(rad) * inner);
        ctx.lineTo(parts.cx + Math.cos(rad) * outer, parts.cy - Math.sin(rad) * outer);
        ctx.stroke();
      }
      drawDialMarks(parts, withButtons, player.dialHover);

      const color = player === player1 ? COLOR_P1 : COLOR_P2;
      if (player.turretBusy) drawTurretNeedle(parts, player.targetAngle, color, 0.32, 0.5, 0.8);
      drawTurretNeedle(parts, player.actualAngle, color, 1, 1, 0.74);
      ctx.beginPath();
      ctx.arc(parts.cx, parts.cy, Math.max(2.5, parts.r * 0.09), 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      if (withButtons) drawDialHover(parts, player);

      const readout = turretLabel(player);
      let fontPx = Math.max(10, Math.min(16, Math.floor(parts.label.height * 0.7)));
      ctx.fillStyle = COLOR_MONITOR_TEXT;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = "bold " + fontPx + "px monospace";
      while (fontPx > 8 && ctx.measureText(readout).width > parts.label.width - 2) {
        fontPx -= 1;
        ctx.font = "bold " + fontPx + "px monospace";
      }
      ctx.fillText(readout, parts.label.x + parts.label.width / 2, parts.label.y + parts.label.height / 2);

      if (parts.ccw && parts.cw) {
        drawDialNudge(parts.ccw, "◀", player.dialHover === "ccw");
        drawDialNudge(parts.cw, "▶", player.dialHover === "cw");
      }
      ctx.restore();
      return parts;
    }

    function drawTurretNeedle(parts, degrees, color, alpha, widthScale, reach) {
      const rad = wrapAngle(degrees) * Math.PI / 180;
      const nx = Math.cos(rad);
      const ny = -Math.sin(rad);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(1.5, parts.r * 0.09 * widthScale);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(parts.cx - nx * parts.r * 0.16, parts.cy - ny * parts.r * 0.16);
      ctx.lineTo(parts.cx + nx * parts.r * reach, parts.cy + ny * parts.r * reach);
      ctx.stroke();
      ctx.restore();
    }

    function drawDialNudge(rect, label, hot) {
      ctx.fillStyle = hot ? "#1c3a28" : "#101014";
      ctx.fillRect(rect.x, rect.y, rect.width, rect.height);
      if (hot) {
        ctx.strokeStyle = COLOR_MONITOR_TEXT;
        ctx.lineWidth = 1;
        ctx.strokeRect(rect.x + 0.5, rect.y + 0.5, rect.width - 1, rect.height - 1);
      }
      ctx.fillStyle = COLOR_JOYSTICK_LABEL_TEXT;
      ctx.font = "bold " + Math.max(11, Math.min(15, Math.floor(rect.height * 0.55))) + "px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(label, rect.x + rect.width / 2, rect.y + rect.height / 2);
    }

    function dialUnderPoint(player, room) {
      if (player.panelKind !== "turret") return "";
      const dial = zoomContent(room, "turret").dial;
      if (!dial) return "";
      const parts = turretDialParts(dial, true);
      const tipX = player.pointX;
      const tipY = player.pointY;
      if (parts.ccw && pointInRect(tipX, tipY, parts.ccw)) return "ccw";
      if (parts.cw && pointInRect(tipX, tipY, parts.cw)) return "cw";
      const mark = dialMarkHit(parts, tipX, tipY);
      if (mark >= 0) return "mark:" + mark;
      if (Math.hypot(tipX - parts.cx, tipY - parts.cy) <= parts.r + 4) return "face";
      return "";
    }

    function applyDialDrag(player, room) {
      const dial = zoomContent(room, "turret").dial;
      if (!dial) return;
      const parts = turretDialParts(dial, true);
      setTurretAngle(player, angleFromPointer(parts.cx, parts.cy, player.pointX, player.pointY));
    }

    // Axis meters. x runs across from the top-left corner. y runs down.
    function axisFromGame(gameX, gameY) {
      return {
        x: gameX + FIELD_X_MAX,
        y: FIELD_Y_MAX - gameY
      };
    }

    function mapPoint(plot, axisX, axisY) {
      const spanX = FIELD_X_MAX * 2;
      const spanY = FIELD_Y_MAX * 2;
      return {
        x: plot.x + (axisX / spanX) * plot.w,
        y: plot.y + (axisY / spanY) * plot.h
      };
    }

    // Fit the 240 by 200 field inside the box. Labels need a margin on the big map.
    function battlefieldMapPlot(box, withLabels) {
      const padL = withLabels ? 32 : 3;
      const padR = withLabels ? 10 : 3;
      const padT = withLabels ? 8 : 3;
      const padB = withLabels ? 20 : 3;
      const availW = Math.max(8, box.width - padL - padR);
      const availH = Math.max(8, box.height - padT - padB);
      const aspect = (FIELD_X_MAX * 2) / (FIELD_Y_MAX * 2);
      let w = availW;
      let h = w / aspect;
      if (h > availH) {
        h = availH;
        w = h * aspect;
      }
      return {
        x: box.x + padL + (availW - w) / 2,
        y: box.y + padT + (availH - h) / 2,
        w: w,
        h: h
      };
    }

    // Future attack marks. Each one will be { x, y } in axis meters.
    // A press on a mark shows its distance, and a delete button removes it.
    // The list stays empty until that is built.
    function attackMarksOf(player) {
      if (!player || !player.attackMarks) return [];
      return player.attackMarks;
    }

    function drawAttackMarks(plot, player) {
      const marks = attackMarksOf(player);
      for (let i = 0; i < marks.length; i++) {
        const spot = mapPoint(plot, marks[i].x, marks[i].y);
        ctx.fillStyle = "#ffb020";
        ctx.beginPath();
        ctx.arc(spot.x, spot.y, Math.max(3, plot.w * 0.012), 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function attackMarkUnderPoint(plot, player, x, y) {
      const marks = attackMarksOf(player);
      const reach = Math.max(8, plot.w * 0.02);
      for (let i = marks.length - 1; i >= 0; i--) {
        const spot = mapPoint(plot, marks[i].x, marks[i].y);
        if (Math.hypot(x - spot.x, y - spot.y) <= reach) return i;
      }
      return -1;
    }

    // Footprint with blast holes punched out, clipped so a hole cannot paint past the shape.
    function drawMapObstacle(plot, obstacle, spanX, spanY) {
      const center = axisFromGame(obstacle.x, obstacle.y);
      ctx.save();
      ctx.beginPath();
      if (obstacle.type === "tower") {
        const spot = mapPoint(plot, center.x, center.y);
        const radius = Math.max(1, (obstacle.r || 2) / spanX * plot.w);
        ctx.arc(spot.x, spot.y, radius, 0, Math.PI * 2);
      } else {
        const wide = obstacle.w || 6;
        const deep = obstacle.h || 6;
        const corner = mapPoint(plot, center.x - wide / 2, center.y - deep / 2);
        ctx.rect(corner.x, corner.y, wide / spanX * plot.w, deep / spanY * plot.h);
      }
      ctx.clip();
      ctx.fillStyle = obstacle.type === "tower" ? "#c8c8d2" : "#8a8a96";
      ctx.fill();
      const holes = obstacle.holes || [];
      ctx.fillStyle = "#071c10";
      for (let h = 0; h < holes.length; h++) {
        const hole = holes[h];
        const at = axisFromGame(hole.x, hole.y);
        const spot = mapPoint(plot, at.x, at.y);
        const radius = Math.max(0.5, (hole.r || 0) / spanX * plot.w);
        ctx.beginPath();
        ctx.arc(spot.x, spot.y, radius, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // Top-down field. No machines and no firing arcs.
    function drawBattlefieldMap(box, withLabels, player, showObstacles) {
      const plot = battlefieldMapPlot(box, withLabels);
      const spanX = FIELD_X_MAX * 2;
      const spanY = FIELD_Y_MAX * 2;
      ctx.save();
      ctx.beginPath();
      ctx.rect(box.x, box.y, box.width, box.height);
      ctx.clip();
      ctx.fillStyle = "#04140a";
      ctx.fillRect(box.x, box.y, box.width, box.height);
      ctx.fillStyle = "#071c10";
      ctx.fillRect(plot.x, plot.y, plot.w, plot.h);

      ctx.strokeStyle = "rgba(180, 220, 196, 0.28)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let meters = 20; meters < spanX - 0.01; meters += 20) {
        const top = mapPoint(plot, meters, 0);
        const bottom = mapPoint(plot, meters, spanY);
        ctx.moveTo(top.x, top.y);
        ctx.lineTo(bottom.x, bottom.y);
      }
      for (let meters = 20; meters < spanY - 0.01; meters += 20) {
        const left = mapPoint(plot, 0, meters);
        const right = mapPoint(plot, spanX, meters);
        ctx.moveTo(left.x, left.y);
        ctx.lineTo(right.x, right.y);
      }
      ctx.stroke();

      // The room map is the grid only. Obstacles are drawn on the opened map window.
      if (showObstacles) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(plot.x, plot.y, plot.w, plot.h);
        ctx.clip();
        const obstacles = battlefield.obstacles || [];
        for (let i = 0; i < obstacles.length; i++) {
          const obstacle = obstacles[i];
          if (obstacleOutsideField(obstacle)) continue;
          drawMapObstacle(plot, obstacle, spanX, spanY);
        }
        ctx.restore();
      }

      ctx.strokeStyle = "rgba(216, 255, 228, 0.9)";
      ctx.lineWidth = withLabels ? 1.5 : 1;
      ctx.strokeRect(plot.x + 0.5, plot.y + 0.5, Math.max(1, plot.w - 1), Math.max(1, plot.h - 1));

      const origin = mapPoint(plot, 0, 0);
      const arm = Math.max(3, Math.min(8, plot.w * 0.035));
      ctx.strokeStyle = "#ff5555";
      ctx.lineWidth = withLabels ? 2 : 1.5;
      ctx.beginPath();
      ctx.moveTo(origin.x, origin.y);
      ctx.lineTo(origin.x + arm, origin.y);
      ctx.moveTo(origin.x, origin.y);
      ctx.lineTo(origin.x, origin.y + arm);
      ctx.stroke();

      if (withLabels) {
        const fontPx = plot.w > 320 ? 12 : 10;
        ctx.font = fontPx + "px monospace";
        ctx.fillStyle = COLOR_RADAR_YOU;
        ctx.textBaseline = "top";
        for (let meters = 0; meters <= spanX + 0.01; meters += 20) {
          const at = mapPoint(plot, meters, spanY);
          ctx.textAlign = meters <= 0.01 ? "left" : (meters >= spanX - 0.01 ? "right" : "center");
          ctx.fillText(String(meters), at.x, plot.y + plot.h + 3);
        }
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        for (let meters = 0; meters <= spanY + 0.01; meters += 20) {
          const at = mapPoint(plot, 0, meters);
          ctx.fillText(String(meters), plot.x - 4, at.y);
        }
        drawAttackMarks(plot, player);
      }
      ctx.restore();
      return plot;
    }

    // Equation and graph on the left. Dial above the map on the right.
    function stationFireLayout(rect) {
      const innerX = rect.x + 10;
      const innerY = rect.y + 10;
      const innerW = Math.max(20, rect.width - 20);
      const innerBottom = rect.y + rect.height - 26;
      const innerH = Math.max(20, innerBottom - innerY);
      const gap = 6;
      let sideW = Math.round(Math.min(innerH * 0.46, Math.max(64, innerW * 0.36)));
      if (innerW - sideW - gap < 88) sideW = Math.max(52, innerW - gap - 88);
      const leftW = Math.max(40, innerW - sideW - gap);
      const eqH = Math.max(20, Math.min(28, innerH * 0.15));
      const graphY = innerY + eqH + 4;
      const graphH = Math.max(16, innerY + innerH - graphY);
      const stackGap = 5;
      let dialH = Math.min(sideW + 8, Math.max(44, (innerH - stackGap) * 0.52));
      let mapH = innerH - dialH - stackGap;
      if (mapH < 36) {
        dialH = Math.max(40, innerH - stackGap - 36);
        mapH = innerH - dialH - stackGap;
      }
      const sideX = innerX + leftW + gap;
      return {
        innerX: innerX,
        innerY: innerY,
        innerW: innerW,
        innerBottom: innerBottom,
        eqH: eqH,
        fire: { x: innerX, y: innerY, width: leftW, height: innerH },
        graph: { x: innerX, y: graphY, w: leftW, h: graphH },
        dial: { x: sideX, y: innerY, width: sideW, height: dialH },
        map: { x: sideX, y: innerY + dialH + stackGap, width: sideW, height: Math.max(16, mapH) }
      };
    }

    function drawFireStation(room, player) {
      const rect = getFireRect(room);
      syncEquation(player);
      ctx.save();
      drawBeveledRect(rect);
      const boltR = Math.max(2, Math.min(3, rect.width * 0.045));
      const inset = boltR + 4;
      if (rect.width > inset * 2 + 8 && rect.height > inset * 2 + 8) {
        drawBolt(rect.x + inset, rect.y + inset, boltR);
        drawBolt(rect.x + rect.width - inset, rect.y + inset, boltR);
        drawBolt(rect.x + inset, rect.y + rect.height - inset, boltR);
        drawBolt(rect.x + rect.width - inset, rect.y + rect.height - inset, boltR);
      }

      const body = stationFireLayout(rect);
      // Dark glass until H.O.W.L.E.R has finished booting. No equation, graph, dial, or map yet.
      if (!machineStarted) {
        ctx.fillStyle = "#000000";
        ctx.fillRect(body.innerX, body.innerY, body.innerW, Math.max(8, body.innerBottom - body.innerY));
        ctx.restore();
        return;
      }
      drawEquationField({ x: body.fire.x, y: body.innerY, width: body.fire.width, height: body.eqH }, player, "12px monospace", false);

      if (body.graph.h > 20 && body.graph.w > 20) {
        drawShellGraph(body.graph, player.equationTree, player.flight, false, player);
      }
      if (body.dial.width > 24 && body.dial.height > 24) drawTurretDial(body.dial, player, false);
      if (body.map.width > 16 && body.map.height > 16) drawBattlefieldMap(body.map, false, null, false);
      ctx.restore();
      if (!machineStarted) return;
      const hot = stationNearHand(player, room);
      if (hot === "fire") drawInteractOutline(body.fire);
      else if (hot === "turret") drawInteractOutline(body.dial);
      else if (hot === "map") drawInteractOutline(body.map);
    }

    function fireKeyPlacements() {
      const cols = FIRE_KEY_COLS;
      const placed = [];
      let col = 0;
      let row = 0;
      for (let i = 0; i < FIRE_KEYS.length; i++) {
        const span = FIRE_KEYS[i].span || 1;
        if (col + span > cols) {
          col = 0;
          row += 1;
        }
        placed.push({ index: i, col: col, row: row, span: span });
        col += span;
        if (col >= cols) {
          col = 0;
          row += 1;
        }
      }
      return { cols: cols, rows: col === 0 ? row : row + 1, placed: placed };
    }

    function fireKeyCells(rect) {
      const layout = fireKeyPlacements();
      const inset = 3;
      const cellW = (rect.width - inset * 2) / layout.cols;
      const cellH = (rect.height - inset * 2) / layout.rows;
      const cells = [];
      for (let i = 0; i < layout.placed.length; i++) {
        const item = layout.placed[i];
        const x = rect.x + inset + item.col * cellW;
        const y = rect.y + inset + item.row * cellH;
        const w = cellW * item.span;
        cells.push({ index: item.index, x: x, y: y, w: w, h: cellH, cx: x + w / 2, cy: y + cellH / 2 });
      }
      return cells;
    }

    // Wide keypad along the bottom of the fire zoom window.
    function drawFireKeys(rect, player) {
      ctx.save();
      ctx.fillStyle = COLOR_JOYSTICK_WELL;
      ctx.fillRect(rect.x, rect.y, rect.width, rect.height);
      const cells = fireKeyCells(rect);
      const pressAge = (typeof player.pointPressFrom === "number" && player.pointPressFrom >= 0)
        ? (frameTime - player.pointPressFrom) / 1000
        : -1;
      const pressTotal = POINT_PRESS_DOWN_SECONDS + POINT_PRESS_UP_SECONDS;
      const fontPx = cells.length ? Math.max(11, Math.min(15, Math.floor(cells[0].h * 0.32))) : 12;
      for (let i = 0; i < cells.length; i++) {
        const cell = cells[i];
        const selected = cell.index === player.fireIndex;
        ctx.fillStyle = selected ? "#1c3a28" : "#101014";
        ctx.fillRect(cell.x + 1, cell.y + 1, cell.w - 2, cell.h - 2);
