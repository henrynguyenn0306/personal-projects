<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grid Game</title>
  <style>
    body { margin: 0; background: #14141e; display: flex; justify-content: center; align-items: center; height: 100vh; }
    canvas { background: #22222e; image-rendering: pixelated; }
  </style>
</head>
<body>
  <canvas id="board"></canvas>

  <script>
    // Board size in squares (x = across, y = down)
    const GRID_X = 200;
    const GRID_Y = 100;
    const TILE = 6; // size of one square in pixels

    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    canvas.width = GRID_X * TILE;
    canvas.height = GRID_Y * TILE;

    // Draw every square in the grid
    for (let x = 0; x < GRID_X; x++) {
      for (let y = 0; y < GRID_Y; y++) {
        ctx.fillStyle = "#3a3a4a";
        ctx.fillRect(x * TILE, y * TILE, TILE - 1, TILE - 1); // -1 leaves a gap so you can see the lines
      }
    }
  </script>
</body>
</html>
