<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grid Game</title>
  <style>
    /* Fit the 2:1 board in the window with no scrollbars */
    body { margin: 0; background: #14141e; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    canvas { background: #22222e; image-rendering: pixelated; max-width: 100vw; max-height: 100vh; width: auto; height: auto; }
  </style>
</head>
<body>
  <canvas id="board"></canvas>

  <script>
    // Board size in squares (x = across, y = down)
    const GRID_X = 120;
    const GRID_Y = 90;
    const TILE = 12; // size of one square in pixels
    const UNIT = TILE; // one number step = one square

    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    canvas.width = GRID_X * TILE;
    canvas.height = GRID_Y * TILE;

    // Fill the whole board with one color (no gaps between squares)
    ctx.fillStyle = "#3a3a4a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Vertical center line: 2 pixels wide, full height
    const centerX = GRID_X / 2 * TILE;
    ctx.fillStyle = "#ff5555";
    ctx.fillRect(centerX, 0, 2, canvas.height);

    // Horizontal center line: 2 pixels wide, full width
    const centerY = GRID_Y / 2 * TILE;
    ctx.fillRect(0, centerY, canvas.width, 2);

    // Label the crossing point "0" at the bottom-left so the lines don't cover it
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 20px sans-serif";
    ctx.textAlign = "right";
    ctx.textBaseline = "top";
    ctx.fillText("0", centerX - 4, centerY + 4);

    // Name the horizontal axis "x" at the left end, just above the line
    ctx.textAlign = "left";
    ctx.textBaseline = "bottom";
    ctx.fillText("x", 4, centerY - 4);

    // Name the vertical axis "y" at the top end, just to the right of the line
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillText("y", centerX + 6, 4);

    // X labels: start at half the width (the edge), then half that, then half again
    const xSteps = [];
    let xStep = GRID_X / 2;
    for (let i = 0; i < 3; i++) {
      xSteps.push(xStep);
      xStep = xStep / 2;
    }
    // Left side first (far to near), then the right side (near to far)
    const xNumbers = [];
    for (let i = 0; i < xSteps.length; i++) {
      xNumbers.push(-xSteps[i]);
    }
    for (let i = xSteps.length - 1; i >= 0; i--) {
      xNumbers.push(xSteps[i]);
    }

    // Numbers on the x line, counted from the center, drawn just below the line
    for (let i = 0; i < xNumbers.length; i++) {
      const value = xNumbers[i];
      const onLineX = centerX + value * UNIT;

      // End numbers use the screen edge so they are not cut off
      let textX = onLineX;
      ctx.textAlign = "center";
      if (value === -GRID_X / 2) {
        ctx.textAlign = "left";
        textX = 4;
      }
      if (value === GRID_X / 2) {
        ctx.textAlign = "right";
        textX = canvas.width - 4;
      }
      ctx.textBaseline = "top";
      ctx.fillStyle = "#ffffff";
      ctx.fillText(String(value), textX, centerY + 4);

      // Small red tick on the line at this number
      let tickX = onLineX;
      if (tickX > canvas.width - 2) {
        tickX = canvas.width - 2;
      }
      ctx.fillStyle = "#ff5555";
      ctx.fillRect(tickX, centerY - 2, 2, 4);
    }

    // Y labels: start at half the height (the edge), then half that, then half again
    const ySteps = [];
    let yStep = GRID_Y / 2;
    for (let i = 0; i < 3; i++) {
      ySteps.push(yStep);
      yStep = yStep / 2;
    }
    // Up is positive: top side first (far to near), then the bottom side
    const yNumbers = [];
    for (let i = 0; i < ySteps.length; i++) {
      yNumbers.push(ySteps[i]);
    }
    for (let i = ySteps.length - 1; i >= 0; i--) {
      yNumbers.push(-ySteps[i]);
    }

    // Numbers on the y line. Up is positive, like a math graph. Drawn just left of the line.
    for (let i = 0; i < yNumbers.length; i++) {
      const value = yNumbers[i];
      const onLineY = centerY - value * UNIT;

      // End numbers use the screen edge so they are not cut off
      let textY = onLineY;
      ctx.textBaseline = "middle";
      if (value === GRID_Y / 2) {
        ctx.textBaseline = "top";
        textY = 4;
      }
      if (value === -GRID_Y / 2) {
        ctx.textBaseline = "bottom";
        textY = canvas.height - 4;
      }
      ctx.textAlign = "right";
      ctx.fillStyle = "#ffffff";
      ctx.fillText(String(value), centerX - 4, textY);

      // Small red tick on the line at this number
      let tickY = onLineY;
      if (tickY > canvas.height - 2) {
        tickY = canvas.height - 2;
      }
      ctx.fillStyle = "#ff5555";
      ctx.fillRect(centerX - 2, tickY, 6, 2);
    }
  </script>
</body>
</html>
