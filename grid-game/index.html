<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Grid Game</title>
  <style>
    /* Fit the 2:1 board in the window with no scrollbars */
    body { margin: 0; background: #14141e; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
    canvas { background: #22222e; image-rendering: pixelated; max-width: 100vw; max-height: 100vh; width: auto; height: auto; }
  </style>
</head>
<body>
  <canvas id="board"></canvas>

  <script>
    // Board size in squares (x = across, y = down)
    const GRID_X = 200;
    const GRID_Y = 100;
    const TILE = 6; // size of one square in pixels

    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    canvas.width = GRID_X * TILE;
    canvas.height = GRID_Y * TILE;

    // Fill the whole board with one color (no gaps between squares)
    ctx.fillStyle = "#3a3a4a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Vertical center line: 2 pixels wide, full height
    const centerX = GRID_X / 2 * TILE;
    ctx.fillStyle = "#ff5555";
    ctx.fillRect(centerX, 0, 2, canvas.height);

    // Horizontal center line: 2 pixels wide, full width
    const centerY = GRID_Y / 2 * TILE;
    ctx.fillRect(0, centerY, canvas.width, 2);

    // Label the crossing point "0" at the bottom-left so the lines don't cover it
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 16px sans-serif";
    ctx.textAlign = "right";
    ctx.textBaseline = "top";
    ctx.fillText("0", centerX - 4, centerY + 4);

    // Name the horizontal axis "x" at the left end, just above the line
    ctx.textAlign = "left";
    ctx.textBaseline = "bottom";
    ctx.fillText("x", 4, centerY - 4);

    // Name the vertical axis "y" at the top end, just to the right of the line
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    ctx.fillText("y", centerX + 6, 4);
  </script>
</body>
</html>
